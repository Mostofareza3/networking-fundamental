      r:'Traceroute কোনো নতুন জিনিস আবিষ্কার করেনি — সে শুধু TTL-এর স্বাভাবিক নিয়মটাকে কাজে লাগায়। TTL=1 দিয়ে পাঠালে প্রথম Router নালিশ করে, TTL=2 দিয়ে পাঠালে দ্বিতীয় — এভাবেই পুরো পথ বেরিয়ে আসে।' }
  ],

  controls: [
    { key:'mode', type:'choice', label:'কী চালাবেন', def:'normal',
      options:[ ['normal','সাধারণ Packet — TTL 64'],
                ['low','TTL 2 দিয়ে পাঠান — মাঝপথে মরবে'],
                ['trace','Traceroute — পুরো পথ আবিষ্কার'] ],
      help:'Traceroute দেখলে বোঝা যাবে TTL কীভাবে একটি tool-এ পরিণত হয়।' }
  ],

  build: function(){
    var devs = [ N.pc('client', { name:'Client', x:8, y:50, mac:'AA:AA:AA:AA:AA:AA',
                                  ip:'192.168.1.10', gw:'192.168.1.1' }) ];
    for(var i = 0; i < HOPS.length; i++){
      var h = HOPS[i];
      devs.push(N.router(h.id, { name:h.name, x:26 + i * 22, y:50,
        ifaces:[{ name:'eth0', ip:h.ip, mac:h.mac, mask:'255.255.255.0' }] }));
    }
    devs.push(N.server('srv', { name:'Server', x:92, y:50, mac:'SS:SS:SS:SS:SS:SS',
                                ip:'93.184.216.34' }));
    return {
      devices: devs,
      links: [ N.link('client','r1'), N.link('r1','r2'),
               N.link('r2','r3'), N.link('r3','srv') ],
      hub: null, wire: null, banner: null, hops: []
    };
  },

  script: function(s0, cfg){
    P.resetIds();
    var steps = [], t = 0;
    function at(){ return ++t; }
    var SRC = '192.168.1.10', DST = '93.184.216.34';

    function pkt(ttl, label, from, to){
      return P.make([
        P.ethernet('AA:AA:AA:AA:AA:AA', '11:11:11:11:11:11', 'ip'),
        P.ip(SRC, DST, ttl, 'icmp', 60)
      ], { label:label, kind:'data', from:from, to:to });
    }
    function icmp(fromIp, label, from){
      return P.make([
        P.ethernet('11:11:11:11:11:11', 'AA:AA:AA:AA:AA:AA', 'ip'),
        P.ip(fromIp, SRC, 64, 'icmp', 56)
      ], { label:label, kind:'ack', from:from, to:'client' });
    }

    /* ── Traceroute: একই কৌশল বারবার, প্রতিবার TTL এক বাড়িয়ে ── */
    if(cfg.mode === 'trace'){
      steps.push({
        t:at(), actor:'client', layer:'L3', kind:'info',
        title:'Traceroute শুরু',
        what:'Client পুরো পথটা জানতে চায় — কোন কোন Router পার হয়ে Packet গন্তব্যে যায়।',
        why :'কিন্তু Packet-এর ভেতরে তো পথ লেখা থাকে না, আর কোনো Router-ও নিজে থেকে পরিচয় দেয় না।\n\nTraceroute একটি চতুর কৌশল ব্যবহার করে — ইচ্ছা করে TTL কম দিয়ে Packet পাঠায়, যাতে Router বাধ্য হয়ে নালিশ করে। সেই নালিশ থেকেই Router-এর পরিচয় পাওয়া যায়।',
        apply: function(st){ st.banner = 'Traceroute শুরু'; st.hops = []; }
      });

      for(var i = 0; i < HOPS.length; i++){
        (function(n, h){
          var p = pkt(n, 'TTL=' + n, 'client', h.id);
          steps.push({
            t:at(), actor:'client', layer:'L3', kind:'info',
            title:'TTL=' + n + ' দিয়ে পাঠানো হলো', packet:p,
            what:'এবার Packet পাঠানো হলো TTL=**' + n + '** দিয়ে।',
            why : n === 1
              ? 'TTL=1 মানে প্রথম Router-ই একে ০ করে ফেলবে, তাই সে-ই নালিশ করবে। এভাবে প্রথম hop-এর পরিচয় জানা যাবে।'
              : 'TTL=' + n + ' মানে Packet-টি ' + n + ' নম্বর Router পর্যন্ত পৌঁছে তারপর মরবে। তাই এবার ' + n + ' নম্বর hop নিজের পরিচয় দেবে।',
            apply: function(st){ st.wire = { pkt:p, from:'client', to:h.id }; st.banner = 'TTL=' + n; }
          });

          var rep = icmp(h.ip, 'Time Exceeded', h.id);
          steps.push({
            t:at(), actor:h.id, layer:'L3', kind:'warn',
            title:'Hop ' + n + ' নিজের পরিচয় দিল', packet:rep,
            what:'`' + h.name + '` TTL ০ পেয়ে Packet ফেলে দিল এবং Client-কে একটি **ICMP Time Exceeded** বার্তা পাঠাল। সেই বার্তার source IP `' + h.ip + '` — এটিই hop ' + n + '-এর পরিচয়।',
            why :'Router যখন TTL শূন্য করে Packet ফেলে, তখন সে চুপ করে থাকে না — প্রেরককে জানায়। আর সেই বার্তাটি পাঠাতে গিয়ে সে নিজের IP Address ব্যবহার করে।\n\nএটাই traceroute-এর পুরো রহস্য — Router নিজের অজান্তেই নিজের পরিচয় দিয়ে দেয়।',
            apply: function(st){
              st.wire = { pkt:rep, from:h.id, to:'client' };
              st.hops = st.hops.concat([{ n:n, ip:h.ip, name:h.name }]);
              st.banner = 'hop ' + n + ' = ' + h.ip;
            }
          });
        })(i + 1, HOPS[i]);
      }

      var last = pkt(64, 'TTL=64', 'client', 'srv');
      steps.push({
        t:at(), actor:'srv', layer:'L3', kind:'ok',
        title:'গন্তব্যে পৌঁছে গেল — Traceroute শেষ', packet:last,
        what:'যথেষ্ট TTL দিয়ে পাঠানোয় Packet এবার Server পর্যন্ত পৌঁছাল। Server নিজে উত্তর দিল, তাই বোঝা গেল পথের শেষ এসেছে।',
        why :'পুরো পথটি এখন জানা:\n\n`1. 192.168.1.1`\n`2. 10.0.0.1`\n`3. 172.16.0.1`\n`4. 93.184.216.34` (গন্তব্য)\n\nএকটি সাধারণ কাউন্টারকে বারবার ব্যবহার করে পুরো পথ আবিষ্কার হয়ে গেল। TTL-এর নকশা যখন করা হয়েছিল, তখন কেউ এই ব্যবহারের কথা ভাবেনি।',
        apply: function(st){ st.wire = null; st.banner = 'Traceroute সম্পন্ন — 3 hop'; }
      });
      return steps;
    }

    /* ── সাধারণ Packet, অথবা TTL কম দিয়ে ── */
    var startTtl = cfg.mode === 'low' ? 2 : 64;
    var p0 = pkt(startTtl, 'TTL=' + startTtl, 'client', 'r1');

    steps.push({
      t:at(), actor:'client', layer:'L3', kind:'info',
      title:'Packet পাঠানো হলো — TTL ' + startTtl, packet:p0,
      what:'Packet-টি TTL=**' + startTtl + '** নিয়ে যাত্রা শুরু করল।',
      why : cfg.mode === 'low'
        ? 'TTL মাত্র ২ — অর্থাৎ এই Packet সর্বোচ্চ ২টি Router পার হতে পারবে। কিন্তু গন্তব্যে পৌঁছাতে ৩টি Router লাগে। দেখা যাক কী হয়।'
        : 'সাধারণত OS ৬৪ (কখনো ১২৮ বা ২৫৫) দিয়ে শুরু করে। Internet-এ বেশিরভাগ গন্তব্য ৩০ hop-এর মধ্যেই, তাই ৬৪ যথেষ্ট বেশি।',
      apply: function(st){ st.wire = { pkt:p0, from:'client', to:'r1' }; st.banner = 'TTL ' + startTtl; }
    });

    var ttl = startTtl;
    for(var k = 0; k < HOPS.length; k++){
      var h = HOPS[k];
      ttl--;
      var dead = ttl === 0;
      var nextId = k < HOPS.length - 1 ? HOPS[k + 1].id : 'srv';

      (function(h, ttlNow, dead, nextId, idx){
        if(dead){
          var rep = icmp(h.ip, 'Time Exceeded', h.id);
          steps.push({
            t:at(), actor:h.id, layer:'L3', kind:'error',
            title:'TTL শূন্য — Packet drop', packet:rep,
            what:'`' + h.name + '` TTL ১ কমিয়ে **০** পেল। তাই সে Packet-টি আর এগিয়ে দিল না, ফেলে দিল।',
            why :'এটাই TTL-এর মূল উদ্দেশ্য। যদি কোনো কারণে routing table ভুল হয়ে Packet একই কয়েকটি Router-এর মধ্যে ঘুরতে থাকত, TTL ছাড়া সেটি **চিরকাল ঘুরত** এবং ধীরে ধীরে পুরো network-এর bandwidth খেয়ে ফেলত।\n\nTTL নিশ্চিত করে প্রতিটি Packet-এর একটি নির্দিষ্ট আয়ু আছে। তারপর সে মরবেই।\n\nRouter প্রেরককে একটি **ICMP Time Exceeded** পাঠাল — এটিই traceroute-এর ভিত্তি।',
            apply: function(st){ st.wire = { pkt:rep, from:h.id, to:'client' }; st.banner = 'TTL 0 — drop'; }
          });
        } else {
          var fp = pkt(ttlNow, 'TTL=' + ttlNow, h.id, nextId);
          steps.push({
            t:at(), actor:h.id, layer:'L3', kind:'ok',
            title:h.name + ': TTL ' + (ttlNow + 1) + ' → ' + ttlNow, packet:fp,
            what:'`' + h.name + '` Packet-টি পেয়ে TTL ১ কমিয়ে **' + ttlNow + '** করল, তারপর পরের দিকে পাঠিয়ে দিল।',
            why :'প্রতিটি Router এই কাজটি বাধ্যতামূলকভাবে করে — এটি IP-র নিয়ম। TTL কমানো ছাড়া কোনো Router Packet forward করতে পারে না।\n\nএখনো ' + ttlNow + ' বাকি, তাই Packet বেঁচে আছে।',
            apply: function(st){ st.wire = { pkt:fp, from:h.id, to:nextId }; st.banner = 'TTL ' + ttlNow; }
          });
        }
      })(h, ttl, dead, nextId, k);

      if(dead){
        steps.push({
          t:at(), actor:'client', layer:'L3', kind:'warn',
          title:'Client নালিশটি পেল',
          what:'Client একটি ICMP Time Exceeded বার্তা পেল `' + h.ip + '` থেকে। সে বুঝল Packet গন্তব্যে পৌঁছায়নি।',
          why :'এখানে একটা গুরুত্বপূর্ণ কথা — Client জানতে পারল **কোথায়** Packet মরেছে, কারণ নালিশকারী Router নিজের IP দিয়ে বার্তা পাঠিয়েছে।\n\nএই তথ্যটুকুই traceroute-কে সম্ভব করে তোলে। Control mode-এ `Traceroute` বেছে দেখুন কীভাবে।',
          apply: function(st){ st.wire = null; st.banner = 'Time Exceeded from ' + h.ip; }
        });
        return steps;
      }
    }

    steps.push({
      t:at(), actor:'srv', layer:'L3', kind:'ok',
      title:'গন্তব্যে পৌঁছাল — TTL ' + ttl + ' বাকি',
      what:'৩টি Router পার হয়ে Packet Server-এ পৌঁছাল। TTL ' + startTtl + ' থেকে কমে ' + ttl + ' হয়েছে।',
      why :'TTL-এর এই কমে যাওয়া থেকেই একটা কাজের তথ্য পাওয়া যায় — `ping`-এর উত্তরে TTL দেখে অনুমান করা যায় গন্তব্য কত hop দূরে।\n\nযেমন উত্তরে TTL=৫৬ দেখলে বোঝা যায় শুরু হয়েছিল ৬৪ দিয়ে, তাই প্রায় ৮টি hop পার হয়েছে।',
      apply: function(st){ st.wire = null; st.banner = 'পৌঁছাল · TTL ' + ttl; }
    });

    return steps;
  }
};

})(window.NetLab);

/* ═══════════════════════════════════════════════════════════════════
   LAB · Router Hop — IP একই থাকে, MAC প্রতি hop-এ বদলায়

(function(NS){
"use strict";
var N = NS.net, P = NS.pkt;

var SRC = '192.168.1.10', DST = '8.8.8.8';

NS.labs.hop = {

  learn: [
    'কেন destination IP পুরো পথে একই থাকে',
    'কেন destination MAC প্রতিটি link-এ বদলে যায়',
    'একটি Router আসলে ঠিক কী কী বদলায় আর কী কী রেখে দেয়',
    'Layer 2 আর Layer 3-এর "পরিধি" কেন আলাদা'
  ],

  mistakes: [
    { m:'Packet-এর সাথে প্রেরকের MAC Address পুরো পথে যায়, তাই Server জানে কার NIC থেকে এসেছে।',
      r:'Server কখনোই আপনার MAC Address দেখে না। প্রথম Router-েই আপনার MAC মুছে গিয়ে তার নিজের MAC বসে যায়। Server শুধু শেষ Router-এর MAC দেখে — আর IP Header থেকে আপনার IP।' },
    { m:'MAC Address আর IP Address আসলে একই কাজ করে, শুধু লেখার ধরন আলাদা।',
      r:'দুটোর পরিধি সম্পূর্ণ আলাদা। MAC-এর পরিধি একটি local link — এক hop। IP-এর পরিধি পুরো যাত্রা — শুরু থেকে শেষ। এজন্যই MAC বারবার বদলায় আর IP বদলায় না।' }
  ],

  controls: [
    { key:'show', type:'choice', label:'কী হাইলাইট করব', def:'both',
      options:[ ['both','দুটোই — MAC ও IP'],
                ['mac','শুধু MAC — কীভাবে বদলায়'],
                ['ip','শুধু IP — কীভাবে অপরিবর্তিত থাকে'] ],
      help:'আলাদা করে দেখলে পার্থক্যটা আরও পরিষ্কার হয়।' }
  ],

  build: function(){
    return {
      devices: [
        N.pc('client', { name:'Client', x:9, y:50, mac:'AA:AA:AA:AA:AA:AA',
                         ip:SRC, gw:'192.168.1.1' }),
        N.router('r1', { name:'Router 1', x:36, y:50,
          ifaces:[{ name:'eth0', ip:'192.168.1.1', mac:'R1:LA:N0:00:00:01', mask:'255.255.255.0' },
                  { name:'eth1', ip:'10.0.0.1',    mac:'R1:WA:N0:00:00:02', mask:'255.255.255.0' }] }),
        N.router('r2', { name:'Router 2', x:64, y:50,
          ifaces:[{ name:'eth0', ip:'10.0.0.2',    mac:'R2:LA:N0:00:00:01', mask:'255.255.255.0' },
                  { name:'eth1', ip:'203.0.113.1', mac:'R2:WA:N0:00:00:02', mask:'255.255.255.0' }] }),
        N.server('srv', { name:'8.8.8.8', x:91, y:50, mac:'SS:SS:SS:SS:SS:SS', ip:DST,
                          listening:[{ port:53, service:'DNS', open:true }] })
      ],
      links: [ N.link('client','r1'), N.link('r1','r2'), N.link('r2','srv') ],
      hub: null, wire: null, banner: null
    };
  },

  script: function(s0, cfg){
    P.resetIds();
    var steps = [], t = 0;
    function at(){ return ++t; }
    var show = cfg.show || 'both';

    /* তিনটি link, প্রতিটিতে আলাদা MAC জোড়া — কিন্তু IP এক */
    var LINKS = [
      { from:'client', to:'r1',  sm:'AA:AA:AA:AA:AA:AA', dm:'R1:LA:N0:00:00:01',
        ttl:64, name:'Link 1 · Client → Router 1', net:'192.168.1.0/24' },
      { from:'r1', to:'r2',  sm:'R1:WA:N0:00:00:02', dm:'R2:LA:N0:00:00:01',
        ttl:63, name:'Link 2 · Router 1 → Router 2', net:'10.0.0.0/24' },
      { from:'r2', to:'srv', sm:'R2:WA:N0:00:00:02', dm:'SS:SS:SS:SS:SS:SS',
        ttl:62, name:'Link 3 · Router 2 → Server', net:'203.0.113.0/24' }
    ];

    function frame(L){
      return P.make([
        P.ethernet(L.sm, L.dm, 'ip'),
        P.ip(SRC, DST, L.ttl, 'udp', 60)
      ], { label:'Frame', kind:'data', from:L.from, to:L.to });
    }

    for(var i = 0; i < LINKS.length; i++){
      (function(L, n){
        var isFirst = n === 0;
        var what, why;

        if(show === 'ip'){
          what = 'এই link-এ Packet-টির IP Header: `' + SRC + '` → `' + DST + '`।' +
                 (isFirst ? '' : ' আগের link-এ ঠিক এটাই ছিল।');
          why  = isFirst
            ? 'IP Header-এর কাজ পুরো যাত্রার গন্তব্য মনে রাখা। এটি এখন থেকে শেষ পর্যন্ত এক থাকবে — শুধু TTL কমবে।'
            : 'লক্ষ্য করুন — source আর destination IP এক চুলও বদলায়নি। শুধু TTL ' + (L.ttl + 1) + ' থেকে ' + L.ttl + ' হয়েছে।\n\nএজন্যই গন্তব্যের Server জানতে পারে Packet-টি মূলত কার কাছ থেকে এসেছে।';
        } else if(show === 'mac'){
          what = 'এই link-এ Frame-এর MAC জোড়া: `' + L.sm + '` → `' + L.dm + '`।';
          why  = isFirst
            ? 'এটি প্রথম link-এর MAC জোড়া। পরের link-এ এই দুটোই সম্পূর্ণ বদলে যাবে।'
            : 'আগের link-এর MAC দুটো **সম্পূর্ণ মুছে গেছে**। Router পুরোনো Ethernet Header ফেলে দিয়ে একদম নতুন একটি বানিয়েছে।\n\nকারণ MAC Address শুধু একটি local link-এর ভেতরে অর্থবহ। নতুন link মানে নতুন ঠিকানা।';
        } else {
          what = '**' + L.name + '** (`' + L.net + '`)\n\n' +
                 'MAC: `' + L.sm + '` → `' + L.dm + '`\n' +
                 'IP: `' + SRC + '` → `' + DST + '`  (TTL ' + L.ttl + ')';
          why  = isFirst
            ? 'শুরুতে দুটোই "স্বাভাবিক" মনে হচ্ছে। কিন্তু পরের ধাপে খেয়াল করুন কোনটা বদলায় আর কোনটা বদলায় না।'
            : 'এই link-এ **MAC জোড়া সম্পূর্ণ নতুন**, অথচ **IP জোড়া হুবহু আগের মতোই**।\n\n' +
              'কারণ দুটোর দায়িত্ব আলাদা:\n\n' +
              '`MAC` — "এই তারের ওপাশে কে?" — পরিধি এক hop\n' +
              '`IP` — "শেষ পর্যন্ত কোথায় যাবে?" — পরিধি পুরো যাত্রা';
        }

        steps.push({
          t:at(), actor: isFirst ? 'client' : L.from, layer:'L2', kind: isFirst ? 'info' : 'ok',
          title: L.name, packet: frame(L),
          what: what, why: why,
          apply: function(st){
            st.wire = { pkt: frame(L), from:L.from, to:L.to };
            st.banner = show === 'ip' ? 'IP অপরিবর্তিত · TTL ' + L.ttl
                      : show === 'mac' ? 'নতুন MAC জোড়া'
                      : 'hop ' + (n + 1) + ' · TTL ' + L.ttl;
          }
        });
      })(LINKS[i], i);
    }

    steps.push({
      t:at(), actor:'srv', layer:'L3', kind:'ok',
      title:'গন্তব্যে — সব মিলিয়ে কী বদলাল',
      what:'Packet পৌঁছে গেল। পুরো যাত্রায়:\n\n' +
           '`MAC জোড়া` — ৩ বার সম্পূর্ণ বদলেছে\n' +
           '`Source IP` — একবারও বদলায়নি\n' +
           '`Destination IP` — একবারও বদলায়নি\n' +
           '`TTL` — ৬৪ থেকে ৬২ হয়েছে',
      why :'Server এখন IP Header দেখে জানতে পারছে Packet-টি `' + SRC + '` থেকে এসেছে।\n\nকিন্তু সে Client-এর MAC Address `AA:AA:AA:AA:AA:AA` কখনোই দেখেনি — সেটি প্রথম Router-েই মুছে গিয়েছিল। Server শুধু শেষ Router-এর MAC দেখেছে।\n\n**এটাই মূল কথা:** MAC এক ধাপের ঠিকানা, IP পুরো যাত্রার ঠিকানা। দুটো আলাদা স্তরে কাজ করে বলেই একই IP নিয়ে পৃথিবীর যেকোনো প্রান্তে যাওয়া যায়, অথচ প্রতিটি local network নিজের মতো করে delivery সামলাতে পারে।',
      apply: function(st){ st.wire = null; st.banner = 'MAC বদলাল ৩ বার · IP বদলাল ০ বার'; }
    });

    return steps;
  }
};

})(window.NetLab);

/* ═══════════════════════════════════════════════════════════════════
   LAB · TCP Three-Way Handshake — কথা বলার আগে হাত মেলানো
   ═══════════════════════════════════════════════════════════════════ */
(function(NS){
"use strict";
var N = NS.net, P = NS.pkt;

var CLI_IP = '192.168.1.10', SRV_IP = '93.184.216.34';
var CLI_MAC = 'AA:AA:AA:AA:AA:AA', SRV_MAC = 'SS:SS:SS:SS:SS:SS';

/* Client ও Server দুজনেই নিজের ISN নিজে বাছে — এখানে স্থির রাখা হয়েছে
   যাতে প্রতিবার একই সংখ্যা দেখে শেখা সহজ হয়। */
var CSEQ = 1000, SSEQ = 5000;

function seg(sp, dp, seq, ack, flags, win, label, from, to, kind){
  return P.make([
    P.ethernet(from === 'client' ? CLI_MAC : SRV_MAC,
               from === 'client' ? SRV_MAC : CLI_MAC, 'ip'),
    P.ip(from === 'client' ? CLI_IP : SRV_IP,
         from === 'client' ? SRV_IP : CLI_IP, 64, 'tcp', 40),
    P.tcp(sp, dp, seq, ack, flags, win)
  ], { label:label, kind:kind || 'data', from:from, to:to });
}

NS.labs.handshake = {
  id: 'handshake',
  title: 'TCP Three-Way Handshake',
  group: 'Phase 3 · Layer 4',
  chapter: 'ch18',
  blurb: 'কোনো data পাঠানোর আগেই তিনটি Packet যায়-আসে। কেন তিনটি — দুটিতে হয় না কেন?',

  learn: [
    'SYN, SYN-ACK, ACK — প্রতিটি Packet ঠিক কী কাজ করে',
    'তিনটি কেন লাগে — দুটিতে কী অসম্পূর্ণ থেকে যায়',
    'Sequence Number কোথা থেকে আসে এবং ACK Number কীভাবে হিসাব হয়',
    'Server-এর port বন্ধ থাকলে RST কেন আসে, আর ফেলে দিলে কেন শুধু নীরবতা'
  ],

  mistakes: [
    { m:'Handshake-এর মধ্যেই আসল data চলে যায়।',
      r:'সাধারণ TCP handshake-এ কোনো application data থাকে না — তিনটি Packet-ই শুধু **নিয়ন্ত্রণের** জন্য। আসল data যায় চতুর্থ Packet থেকে। এজন্যই নতুন connection-এ অন্তত এক RTT সময় নষ্ট হয়।' },
    { m:'SYN মানে "connection তৈরি হলো"।',
      r:'SYN মানে শুধু "আমি শুরু করতে চাই, আমার Sequence Number এই"। Connection তৈরি হয় তখনই যখন **দুই পক্ষই** একে অপরের Sequence Number স্বীকার করে নেয় — সেটিই তৃতীয় Packet-এর কাজ।' },
    { m:'Three-Way Handshake নিরাপত্তা দেয়, তাই TCP নিরাপদ।',
      r:'Handshake শুধু নিশ্চিত করে দুই পক্ষ পরস্পরকে **শুনতে পাচ্ছে** এবং Sequence Number-এ একমত। এতে কোনো encryption নেই, কোনো পরিচয় যাচাই নেই। Encryption আসে TLS থেকে, TCP-র উপরে আলাদা একটি স্তর হিসেবে।' }
  ],

  controls: [
    { key:'mode', type:'choice', label:'Server-এর অবস্থা', def:'open',
      options:[ ['open','Port খোলা — স্বাভাবিক handshake'],
                ['closed','Port বন্ধ — RST আসবে'],
                ['drop','Firewall চুপচাপ ফেলে দিচ্ছে'] ],
      help:'তিনটি অবস্থার পার্থক্যটাই debugging-এ সবচেয়ে কাজে লাগে।' }
  ],

  build: function(){
    return {
      devices: [
        N.pc('client', { name:'Client', x:18, y:50, mac:CLI_MAC, ip:CLI_IP,
                         gw:'192.168.1.1', note:'CLOSED' }),
        N.server('server', { name:'Web Server', x:82, y:50, mac:SRV_MAC, ip:SRV_IP,
                             listening:[{ port:80, service:'HTTP', open:true }],
                             note:'LISTEN' })
      ],
      links: [ N.link('client','server') ],
      hub:null, wire:null, banner:null, stack:null,
      cstate:'CLOSED', sstate:'LISTEN'
    };
  },

  script: function(s0, cfg){
    P.resetIds();
    var steps = [], t = 0;
    function at(){ return ++t; }
    var SP = 49152, DP = 80;

    /* device-এর গায়ে TCP state দেখানো — connection কোন পর্যায়ে আছে বোঝা যায় */
    function setState(st, c, s){
      for(var i = 0; i < st.devices.length; i++){
        if(st.devices[i].id === 'client' && c){ st.devices[i].note = c; st.cstate = c; }
        if(st.devices[i].id === 'server' && s){ st.devices[i].note = s; st.sstate = s; }
      }
    }

    /* ── ধাপ ১: SYN ── */
    var syn = seg(SP, DP, CSEQ, 0, 'SYN', 64240, 'SYN seq=' + CSEQ, 'client', 'server');
    steps.push({
      t:at(), actor:'client', layer:'L4', kind:'info',
      title:'১ম Packet — SYN পাঠানো হলো', packet:syn,
      what:'Client একটি **SYN** segment পাঠাল। এতে কোনো data নেই — শুধু `seq=' + CSEQ + '` আর SYN flag।\n\nClient এখন `SYN_SENT` অবস্থায় অপেক্ষা করছে।',
      why :'TCP একটি byte-stream protocol — প্রতিটি byte-এর একটি ক্রমিক নম্বর থাকে। কিন্তু গণনা শুরু হবে কোন সংখ্যা থেকে?\n\nClient নিজেই একটি শুরুর সংখ্যা (Initial Sequence Number) বেছে নেয় এবং SYN-এর মাধ্যমে Server-কে জানায়: "আমার গণনা ' + CSEQ + ' থেকে শুরু হচ্ছে।"\n\nসংখ্যাটি সবসময় ০ থেকে শুরু হয় না — এলোমেলো বাছা হয়, যাতে পুরনো connection-এর ভেসে থাকা Packet নতুন connection-এ ভুল করে ঢুকে না পড়ে।',
      apply: function(st){
        st.wire = { pkt:syn, from:'client', to:'server' };
        setState(st, 'SYN_SENT', null);
        st.banner = 'SYN → seq=' + CSEQ;
      }
    });

    /* ── Port বন্ধ: RST ── */
    if(cfg.mode === 'closed'){
      var rst = seg(DP, SP, 0, CSEQ + 1, 'RST, ACK', 0, 'RST', 'server', 'client', 'ack');
      steps.push({
        t:at(), actor:'server', layer:'L4', kind:'error',
        title:'Port বন্ধ — Server RST পাঠাল', packet:rst,
        what:'Server-এর ৮০ নম্বর port-এ কোনো application listen করছে না। তাই সে সঙ্গে সঙ্গে একটি **RST** (Reset) পাঠিয়ে দিল।',
        why :'RST মানে সাফ কথা — "এখানে কেউ নেই, চেষ্টা কোরো না।"\n\nএটি আসলে ভালো ব্যবহার। Client সঙ্গে সঙ্গে জানতে পারল, অপেক্ষা করতে হলো না।\n\nএই কারণেই বন্ধ port-এ `curl` চালালে **সঙ্গে সঙ্গে** `Connection refused` আসে — কোনো দেরি হয় না।',
        apply: function(st){
          st.wire = { pkt:rst, from:'server', to:'client' };
          setState(st, 'CLOSED', 'LISTEN');
          st.banner = 'RST — Connection refused';
        }
      });
      steps.push({
        t:at(), actor:'client', layer:'L4', kind:'error',
        title:'Connection refused',
        what:'Client RST পেয়ে চেষ্টা ছেড়ে দিল। Application একটি `Connection refused` error পেল।',
        why :'লক্ষ্য করুন — Packet কিন্তু গন্তব্যে **পৌঁছেছিল**। Network ঠিক ছিল, route ঠিক ছিল, Server চালু ছিল। শুধু ওই port-এ কোনো service ছিল না।\n\nতাই `Connection refused` দেখলে network নিয়ে চিন্তা না করে বরং দেখা উচিত — service টি কি আদৌ চালু আছে? ঠিক port-এ আছে তো?\n\nএর সাথে `Connection timed out`-এর পার্থক্যটা `drop` mode-এ দেখুন।',
        apply: function(st){ st.wire = null; st.banner = 'Connection refused'; }
      });
      return steps;
    }

    /* ── Firewall চুপচাপ ফেলে দিচ্ছে ── */
    if(cfg.mode === 'drop'){
      for(var r = 1; r <= 3; r++){
        (function(n){
          var re = seg(SP, DP, CSEQ, 0, 'SYN', 64240, 'SYN (retry ' + n + ')', 'client', 'server');
          steps.push({
            t:at(), actor:'client', layer:'L4', kind:'warn',
            title:'কোনো উত্তর নেই — SYN আবার পাঠানো হলো (' + n + ')', packet:re,
            what:'কোনো উত্তর আসেনি। Client আবার SYN পাঠাল।\n\nপ্রতিবার অপেক্ষার সময় **দ্বিগুণ** হচ্ছে — ১ সেকেন্ড, ২ সেকেন্ড, ৪ সেকেন্ড…',
            why :'Firewall Packet-টি ফেলে দিয়েছে কিন্তু কিছুই জানায়নি। Client-এর কাছে "ফেলে দেওয়া হয়েছে" আর "এখনো পথে আছে" — এই দুটো অবস্থা দেখতে **একদম একরকম**। নীরবতা।\n\nতাই সে ধরে নেয় Packet হারিয়ে গেছে এবং আবার পাঠায়। বারবার অপেক্ষার সময় দ্বিগুণ করাকে বলে exponential backoff — এতে সত্যিই যদি network ব্যস্ত থাকে, তাহলে বারবার চেষ্টা করে সেটিকে আরও ব্যস্ত করা হয় না।',
            apply: function(st){
              st.wire = { pkt:re, from:'client', to:'server' };
              setState(st, 'SYN_SENT', null);
              st.banner = 'retry ' + n + ' — কোনো উত্তর নেই';
            }
          });
        })(r);
      }
      steps.push({
        t:at(), actor:'client', layer:'L4', kind:'error',
        title:'Connection timed out',
        what:'কয়েকবার চেষ্টার পর Client হাল ছেড়ে দিল। Application পেল `Connection timed out`।',
        why :'এখানেই `Connection refused`-এর সাথে আসল পার্থক্য:\n\n`Connection refused` = **সঙ্গে সঙ্গে** — কেউ একজন RST দিয়ে উত্তর দিয়েছে। Packet পৌঁছেছে।\n\n`Connection timed out` = **দীর্ঘ অপেক্ষার পর** — কেউ কিছুই বলেনি। সাধারণত Firewall চুপচাপ ফেলে দিয়েছে, অথবা Packet পথই খুঁজে পায়নি।\n\nDebugging-এ এই পার্থক্যটাই প্রথম সূত্র। কতক্ষণে error এলো — সেটাই বলে দেয় সমস্যা কোথায়।',
        apply: function(st){ st.wire = null; setState(st, 'CLOSED', null); st.banner = 'timed out'; }
      });
      return steps;
    }

    /* ── ধাপ ২: SYN-ACK ── */
    var synack = seg(DP, SP, SSEQ, CSEQ + 1, 'SYN, ACK', 65535,
                     'SYN-ACK seq=' + SSEQ + ' ack=' + (CSEQ + 1), 'server', 'client', 'ack');
    steps.push({
      t:at(), actor:'server', layer:'L4', kind:'ok',
      title:'২য় Packet — SYN-ACK', packet:synack,
      what:'Server একটি Packet-এ **দুটি কাজ** একসাথে করল:\n\n• **ACK** `ack=' + (CSEQ + 1) + '` — "তোমার SYN পেয়েছি"\n• **SYN** `seq=' + SSEQ + '` — "আমারও একটা শুরুর সংখ্যা আছে, এই নাও"',
      why :'গুরুত্বপূর্ণ কথা — TCP connection **দ্বিমুখী**। Data দুই দিকেই যাবে। তাই দুই দিকের জন্য দুটি আলাদা Sequence Number দরকার।\n\nএজন্য Server-কেও নিজের SYN পাঠাতে হয়। কিন্তু সে সেটি আলাদা Packet-এ না পাঠিয়ে ACK-এর সাথেই জুড়ে দেয় — একটি Packet বাঁচল।\n\n**ack=' + (CSEQ + 1) + ' কেন, ' + CSEQ + ' নয়?** ACK Number মানে "এর আগ পর্যন্ত সব পেয়েছি, **এখন এটি আশা করছি**"। SYN নিজেই একটি ক্রমিক নম্বর দখল করে, তাই পরের প্রত্যাশিত byte হলো ' + (CSEQ + 1) + '।',
      apply: function(st){
        st.wire = { pkt:synack, from:'server', to:'client' };
        setState(st, null, 'SYN_RCVD');
        st.banner = 'SYN-ACK → seq=' + SSEQ + ' ack=' + (CSEQ + 1);
      }
    });

    /* ── ধাপ ৩: ACK ── */
    var ack = seg(SP, DP, CSEQ + 1, SSEQ + 1, 'ACK', 64240,
                  'ACK ack=' + (SSEQ + 1), 'client', 'server', 'ack');
    steps.push({
      t:at(), actor:'client', layer:'L4', kind:'ok',
      title:'৩য় Packet — ACK, connection তৈরি', packet:ack,
      what:'Client উত্তর দিল `ack=' + (SSEQ + 1) + '` — "তোমার SYN-ও পেয়েছি।"\n\nConnection এখন **ESTABLISHED**। এবার data যেতে পারে।',
      why :'**এখানেই তিনটি Packet কেন লাগে তার উত্তর।**\n\nদুটি Packet-এর পর কে কী জানত?\n\n• Client জানত — তার কথা Server শুনেছে (SYN-ACK এসেছে, তার মানে SYN পৌঁছেছিল)\n• Server জানত না — তার SYN-ACK আদৌ পৌঁছেছে কিনা\n\nএই তৃতীয় ACK Server-কে সেই নিশ্চয়তা দেয়। এখন **দুই পক্ষই জানে যে দুই দিকের পথ কাজ করছে**।\n\nএর কমে হয় না। আর বেশিও লাগে না — তিনটিই যথেষ্ট।',
      apply: function(st){
        st.wire = { pkt:ack, from:'client', to:'server' };
        setState(st, 'ESTABLISHED', 'ESTABLISHED');
        st.banner = 'ESTABLISHED — এবার data যেতে পারে';
      }
    });

    /* ── ধাপ ৪: প্রথম আসল data ── */
    var req = P.make([
      P.ethernet(CLI_MAC, SRV_MAC, 'ip'),
      P.ip(CLI_IP, SRV_IP, 64, 'tcp', 100),
      P.tcp(SP, DP, CSEQ + 1, SSEQ + 1, 'PSH, ACK', 64240),
      P.data('GET / HTTP/1.1')
    ], { label:'GET /', kind:'data', from:'client', to:'server' });

    steps.push({
      t:at(), actor:'client', layer:'L7', kind:'ok',
      title:'৪র্থ Packet — এবার আসল data', packet:req,
      what:'এতক্ষণে প্রথম আসল data গেল — `GET / HTTP/1.1`।\n\nলক্ষ্য করুন `seq=' + (CSEQ + 1) + '` — যেখানে SYN শেষ করেছিল ঠিক সেখান থেকেই data শুরু।',
      why :'এই চতুর্থ Packet-টিই বুঝিয়ে দেয় handshake-এর আসল দাম।\n\nআপনার browser যখন নতুন কোনো site-এ যায়, তখন **একটি byte HTML আসার আগেই** এক RTT সময় চলে যায় শুধু হাত মেলাতে। Server ২০০ms দূরে হলে ২০০ms নষ্ট, তারপর data শুরু।\n\nএই কারণেই connection **পুনর্ব্যবহার** করা এত গুরুত্বপূর্ণ (HTTP Keep-Alive), আর এই কারণেই QUIC handshake-কে TLS-এর সাথে মিশিয়ে ফেলার চেষ্টা করেছে।',
      apply: function(st){ st.wire = { pkt:req, from:'client', to:'server' }; st.banner = 'data চলছে'; }
    });

    return steps;
  }
};

})(window.NetLab);

(function(NS){
"use strict";
var N = NS.net, P = NS.pkt;

var CLI_IP = '192.168.1.10', SRV_IP = '93.184.216.34';
var CLI_MAC = 'AA:AA:AA:AA:AA:AA', SRV_MAC = 'SS:SS:SS:SS:SS:SS';
var MSS = 100;      /* এক segment-এ কত byte — হিসাব সহজ রাখতে ১০০ */
var BASE = 1;       /* relative sequence number, tcpdump-এর মতো */

function dseg(seq, n, label, kind){
  return P.make([
    P.ethernet(CLI_MAC, SRV_MAC, 'ip'),
    P.ip(CLI_IP, SRV_IP, 64, 'tcp', 40 + n),
    P.tcp(49152, 80, seq, 1, 'PSH, ACK', 64240),
    P.data('data[' + seq + '..' + (seq + n - 1) + ']')
  ], { label:label, kind:kind || 'data', from:'client', to:'server' });
}
function ackseg(ackNo, label, kind){
  return P.make([
    P.ethernet(SRV_MAC, CLI_MAC, 'ip'),
    P.ip(SRV_IP, CLI_IP, 64, 'tcp', 40),
    P.tcp(80, 49152, 1, ackNo, 'ACK', 65535)
  ], { label:label, kind:kind || 'ack', from:'server', to:'client' });
}

NS.labs.reliable = {
  id: 'reliable',
  title: 'TCP Reliability — হারানো Packet',
  group: 'Phase 3 · Layer 4',
  chapter: 'ch19',
  blurb: 'Network Packet হারায়। TCP সেটা ঠেকাতে পারে না — শুধু টের পেয়ে আবার পাঠায়।',

  learn: [
    'TCP কীভাবে বুঝতে পারে একটি segment হারিয়ে গেছে',
    'ACK Number আসলে কী বলে — "পেয়েছি" নয়, "এখন এটি চাই"',
    'Duplicate ACK কী, আর তিনটি duplicate ACK কেন গুরুত্বপূর্ণ',
    'Timeout আর Fast Retransmit — দুটি ভিন্ন উপায়ে হারানো ধরা'
  ],

  mistakes: [
    { m:'TCP ব্যবহার করলে Packet হারায় না।',
      r:'TCP Packet হারানো **ঠেকাতে পারে না** — সেটি network-এর ব্যাপার। TCP শুধু হারানো **টের পায়** এবং **আবার পাঠায়**। তাই application-এর কাছে data অক্ষত পৌঁছায়, কিন্তু নিচে cable-এ Packet ঠিকই হারিয়েছিল।' },
    { m:'প্রতিটি Packet-এর জন্য আলাদা একটি ACK আসে।',
      r:'TCP-র ACK **cumulative** — `ack=301` মানে "৩০১-এর আগের সবকিছু পেয়েছি"। একটি ACK একসাথে অনেকগুলো segment-এর স্বীকৃতি দিতে পারে। Receiver প্রায়ই কয়েকটি segment জমিয়ে একটি ACK পাঠায়।' },
    { m:'Packet হারালে TCP শুধু ওই একটিই আবার পাঠায়, সাথে সাথেই।',
      r:'"সাথে সাথে" বলতে কিছু নেই — sender তো জানেই না কখন হারিয়েছে। তাকে হয় **timeout** পর্যন্ত অপেক্ষা করতে হয়, নয়তো **তিনটি duplicate ACK** দেখে অনুমান করতে হয়। প্রথমটিতে অনেক সময় নষ্ট হয়, তাই দ্বিতীয়টি আবিষ্কার হয়েছিল।' }
  ],

  controls: [
    { key:'mode', type:'choice', label:'কী ঘটবে', def:'fast',
      options:[ ['none','সব ঠিকঠাক পৌঁছাচ্ছে'],
                ['fast','২য় segment হারাল — Fast Retransmit'],
                ['timeout','শেষ segment হারাল — Timeout লাগবে'] ],
      help:'Fast Retransmit আর Timeout-এর সময়ের পার্থক্যটাই আসল শিক্ষা।' }
  ],

  build: function(){
    return {
      devices: [
        N.pc('client', { name:'Client', x:18, y:50, mac:CLI_MAC, ip:CLI_IP,
                         note:'sending' }),
        N.server('server', { name:'Server', x:82, y:50, mac:SRV_MAC, ip:SRV_IP,
                             listening:[{ port:80, service:'HTTP', open:true }],
                             note:'recv' })
      ],
      links: [ N.link('client','server') ],
      hub:null, wire:null, banner:null,
      sent: [], got: [], lost: [], ackNo: BASE
    };
  },

  script: function(s0, cfg){
    P.resetIds();
    var steps = [], t = 0;
    function at(){ return ++t; }

    /* চারটি segment: seq 1, 101, 201, 301 — প্রতিটি ১০০ byte */
    var segs = [];
    for(var i = 0; i < 4; i++) segs.push({ n:i + 1, seq:BASE + i * MSS, len:MSS });

    var lostIdx = cfg.mode === 'fast' ? 1 : cfg.mode === 'timeout' ? 3 : -1;

    /* ── সব segment পাঠানো ── */
    for(var k = 0; k < segs.length; k++){
      (function(sg, isLost){
        var p = dseg(sg.seq, sg.len, 'seq=' + sg.seq, isLost ? 'data' : 'data');
        steps.push({
          t:at(), actor:'client', layer:'L4', kind:isLost ? 'warn' : 'info',
          title:'Segment ' + sg.n + ' পাঠানো হলো — seq=' + sg.seq, packet:p,
          what:'Client segment ' + sg.n + ' পাঠাল — byte `' + sg.seq + '` থেকে `' +
               (sg.seq + sg.len - 1) + '` পর্যন্ত, মোট ' + sg.len + ' byte।' +
               (isLost ? '\n\n**এই segment-টি পথে হারিয়ে যাবে।** কোনো Router-এর queue ভরে গেছে, তাই সে এটি ফেলে দিল।' : ''),
          why : isLost
            ? 'গুরুত্বপূর্ণ কথা — Client **জানেই না** যে এটি হারিয়েছে। সে দিব্যি পরেরটা পাঠাতে থাকবে।\n\nহারানোর খবর কারো কাছেই নেই। Router নালিশ করে না, Server তো জানেই না কিছু আসার কথা ছিল। TCP-কে নিজেই এটি **অনুমান** করে বের করতে হবে।'
            : 'Client অপেক্ষা করছে না — একটার পর একটা পাঠিয়ে যাচ্ছে। প্রতিটির জন্য ACK-এর অপেক্ষা করলে গতি ভয়াবহ কমে যেত।\n\nএকসাথে কতগুলো পাঠাতে পারবে তা ঠিক করে দেয় **window** — Flow Control lab-এ সেটি দেখা যাবে।',
          apply: function(st){
            st.wire = { pkt:p, from:'client', to:'server' };
            st.sent = st.sent.concat([sg.seq]);
            if(isLost) st.lost = st.lost.concat([sg.seq]);
            st.banner = 'seq=' + sg.seq + (isLost ? ' — হারিয়ে গেল' : '');
          }
        });

        if(isLost) return;

        /* Server পেল — কিন্তু ACK কী হবে তা নির্ভর করে ফাঁক আছে কিনা */
        steps.push({ __ackFor: sg });
      })(segs[k], k === lostIdx);
    }

    /* উপরে শুধু চিহ্ন রাখা হয়েছিল; এখন প্রকৃত ACK হিসাব করে বসানো হচ্ছে,
       কারণ ACK Number নির্ভর করে ততক্ষণে কী কী পৌঁছেছে তার উপর। */
    var out = [], got = [], dupCount = 0;
    for(var q = 0; q < steps.length; q++){
      var s = steps[q];
      if(!s.__ackFor){ out.push(s); continue; }
      var sg = s.__ackFor;
      got.push(sg.seq);

      /* cumulative ACK: শুরু থেকে ফাঁকহীন কতদূর পৌঁছেছে */
      var expect = BASE;
      while(got.indexOf(expect) !== -1) expect += MSS;

      var isDup = expect === BASE + lostIdx * MSS && lostIdx >= 0 && sg.seq > BASE + lostIdx * MSS;
      if(isDup) dupCount++;

      (function(sg, expect, isDup, dupN){
        var a = ackseg(expect, 'ACK ' + expect + (isDup ? ' (dup ' + dupN + ')' : ''),
                       isDup ? 'ack' : 'ack');
        out.push({
          t:at(), actor:'server', layer:'L4', kind:isDup ? 'warn' : 'ok',
          title: isDup ? 'আবার সেই একই ACK ' + expect + ' (duplicate ' + dupN + ')'
                       : 'ACK ' + expect + ' — এর আগ পর্যন্ত সব পেয়েছি',
          packet:a,
          what: isDup
            ? 'Server segment `' + sg.seq + '` পেয়েছে ঠিকই — কিন্তু আবারও পাঠাল `ack=' + expect + '`, আগেরটার মতোই একই সংখ্যা।'
            : 'Server `ack=' + expect + '` পাঠাল — "byte ' + expect + '-এর আগ পর্যন্ত সব পেয়েছি, এখন ' + expect + ' চাই।"',
          why : isDup
            ? 'এখানেই ACK Number-এর আসল অর্থ বোঝা যায়। ACK মানে **"এই byte-টি এখন চাই"** — "শেষ যেটা পেয়েছি সেটা" নয়।\n\nSegment `' + sg.seq + '` পৌঁছেছে বটে, কিন্তু `' + expect + '` থেকে একটা **ফাঁক** রয়ে গেছে। ফাঁক পেরিয়ে Server এগোতে পারে না, কারণ cumulative ACK ফাঁকের ওপারের কথা বলতেই পারে না।\n\nতাই সে বাধ্য হয়ে একই সংখ্যা আবার পাঠায়। Client-এর কাছে এই পুনরাবৃত্তিই একটি **সংকেত**: "কিছু একটা হারিয়েছে।"'
            : 'ACK **cumulative** — একটি সংখ্যাই বলে দেয় শুরু থেকে কতদূর নিখুঁতভাবে পৌঁছেছে।\n\nএর একটা সুন্দর দিক আছে: কোনো ACK পথে হারিয়ে গেলেও ক্ষতি নেই, পরের ACK-টিই আগেরটার কাজ সেরে দেবে।',
          apply: function(st){
            st.wire = { pkt:a, from:'server', to:'client' };
            st.got = st.got.concat([sg.seq]);
            st.ackNo = expect;
            st.banner = 'ACK ' + expect + (isDup ? ' · duplicate ' + dupN : '');
          }
        });
      })(sg, expect, isDup, dupCount);
    }
    steps = out;

    /* উপরে send-step আগে বানিয়ে পরে ACK-step মাঝখানে বসানো হয়েছে, তাই
       ঘড়ির সংখ্যাগুলো এলোমেলো হয়ে গেছে। Timeline-এ সময় সবসময় সামনে
       এগোনো উচিত, তাই এখানে ক্রম অনুযায়ী আবার নম্বর দেওয়া হচ্ছে।
       এর পরে যোগ হওয়া step গুলোও যেন ধারা মেনে চলে, সেজন্য t-ও নামানো হলো। */
    for(var z = 0; z < steps.length; z++) steps[z].t = z + 1;
    t = steps.length;

    /* ── কিছুই হারায়নি ── */
    if(lostIdx < 0){
      steps.push({
        t:at(), actor:'client', layer:'L4', kind:'ok',
        title:'চারটি segment-ই পৌঁছেছে',
        what:'৪০০ byte নিখুঁতভাবে পৌঁছে গেল। শেষ ACK `' + (BASE + 4 * MSS) + '` — অর্থাৎ তার আগের সব byte Server-এর কাছে আছে।',
        why :'এটাই স্বাভাবিক অবস্থা এবং বেশিরভাগ সময় এমনই হয়।\n\nকিন্তু TCP-র আসল জটিলতা তৈরি হয় ব্যতিক্রমের জন্য। Control-এ অন্য mode বেছে দেখুন — একটি Packet হারালে পুরো ব্যবস্থাটা কীভাবে সামলায়।',
        apply: function(st){ st.wire = null; st.banner = 'সব পৌঁছেছে · 400 bytes'; }
      });
      return steps;
    }

    var lostSeq = BASE + lostIdx * MSS;

    /* ── Fast Retransmit: তিনটি duplicate ACK ── */
    if(cfg.mode === 'fast'){
      steps.push({
        t:at(), actor:'client', layer:'L4', kind:'warn',
        title:'তিনটি duplicate ACK — Client বুঝে ফেলল',
        what:'Client পরপর **তিনটি** একই `ack=' + lostSeq + '` পেল। সে সিদ্ধান্তে এলো — segment `' + lostSeq + '` হারিয়েছে।',
        why :'কেন ঠিক তিনটি, একটি বা দুটি নয়?\n\nএকটি duplicate ACK দেখেই আতঙ্কিত হওয়া যায় না। Packet মাঝে মাঝে **উল্টো ক্রমে** পৌঁছায় — তখনও এক-দুটি duplicate ACK আসতে পারে, অথচ কিছুই হারায়নি।\n\nকিন্তু পরপর তিনটি? তার মানে ফাঁকের পরে অন্তত তিনটি segment ঠিকঠাক পৌঁছেছে, আর ফাঁকটা এখনো ভরেনি। এটি নিছক ক্রম উল্টানো হওয়ার সম্ভাবনা কম।\n\nতিন সংখ্যাটি অভিজ্ঞতা থেকে বাছা — যথেষ্ট নিশ্চিত হওয়া যায়, অথচ বেশি দেরিও হয় না।',
        apply: function(st){ st.wire = null; st.banner = '3 duplicate ACK — হারানো ধরা পড়ল'; }
      });

      var rp = dseg(lostSeq, MSS, 'seq=' + lostSeq + ' (আবার)');
      steps.push({
        t:at(), actor:'client', layer:'L4', kind:'ok',
        title:'Fast Retransmit — শুধু হারানোটাই আবার পাঠানো হলো', packet:rp,
        what:'Client শুধুমাত্র segment `' + lostSeq + '` আবার পাঠাল। বাকি তিনটি আবার পাঠাল না — সেগুলো তো পৌঁছেছেই।',
        why :'একে বলে **Fast Retransmit** — timeout-এর অপেক্ষা না করে duplicate ACK দেখেই আবার পাঠানো।\n\nএর দাম বিশাল। Timeout সাধারণত RTT-র কয়েক গুণ (কখনো এক সেকেন্ডের বেশি)। কিন্তু duplicate ACK তিনটি আসতে লাগে মাত্র প্রায় **এক RTT**।\n\nএটি TCP-র নকশার একটি সুন্দর দিক — receiver বাড়তি কিছু করছে না, সে তার স্বাভাবিক নিয়মেই ACK পাঠাচ্ছে। sender সেই স্বাভাবিক আচরণ থেকেই তথ্য বের করে নিচ্ছে।',
        apply: function(st){
          st.wire = { pkt:rp, from:'client', to:'server' };
          st.banner = 'Fast Retransmit seq=' + lostSeq;
        }
      });
    } else {
      /* ── Timeout: শেষ segment হারালে duplicate ACK আসার সুযোগই নেই ── */
      steps.push({
        t:at(), actor:'client', layer:'L4', kind:'warn',
        title:'নীরবতা — কোনো duplicate ACK আসছে না',
        what:'শেষ segment `' + lostSeq + '` হারিয়েছে। কিন্তু এবার কোনো duplicate ACK আসছে না — Client শুধু অপেক্ষা করছে।',
        why :'কারণটা লক্ষ্য করার মতো। Duplicate ACK তৈরি হয় তখনই যখন হারানো segment-এর **পরে** আরও segment পৌঁছায়।\n\nকিন্তু এটি ছিল শেষ segment। এর পরে আর কিছু পাঠানোই হয়নি। তাই Server-এর কাছে ACK পাঠানোর কোনো কারণই নেই — সে চুপ করে আছে।\n\nFast Retransmit-এর সূত্র এখানে কাজ করে না। Client-কে পুরনো উপায়ে যেতে হবে — **অপেক্ষা**।',
        apply: function(st){ st.wire = null; st.banner = 'অপেক্ষা… কোনো ACK নেই'; }
      });

      steps.push({
        t:at(), actor:'client', layer:'L4', kind:'error',
        title:'RTO শেষ — Timeout হলো',
        what:'Retransmission Timeout (RTO) শেষ হয়ে গেল। এটি Fast Retransmit-এর চেয়ে **অনেক** বেশি সময়।',
        why :'RTO ঠিক হয় মাপা RTT থেকে — TCP প্রতিটি ACK-এর সময় মেপে গড় ও ওঠানামা হিসাব করে রাখে, তারপর তার চেয়ে যথেষ্ট বড় একটি সময় বেছে নেয়।\n\nবেশি বড় হলে হারানো ধরতে দেরি হয়। বেশি ছোট হলে ঠিকঠাক Packet-ও "হারিয়েছে" ভেবে আবার পাঠানো হয় — network অকারণে ভরে যায়।\n\nএজন্যই **শেষ Packet হারানো সবচেয়ে ব্যয়বহুল**। মাঝেরটা হারালে এক RTT-তেই ধরা পড়ত, শেষেরটার জন্য পুরো RTO অপেক্ষা করতে হলো।',
        apply: function(st){ st.wire = null; st.banner = 'RTO expired'; }
      });

      var rp2 = dseg(lostSeq, MSS, 'seq=' + lostSeq + ' (আবার)');
      steps.push({
        t:at(), actor:'client', layer:'L4', kind:'ok',
        title:'Timeout Retransmit', packet:rp2,
        what:'অবশেষে Client segment `' + lostSeq + '` আবার পাঠাল।',
        why :'একই সাথে সে **ধীরেও** হয়ে যায়। Timeout-কে TCP গুরুতর সংকেত হিসেবে দেখে — network সম্ভবত ভীষণ ভিড়ে ঠাসা। তাই sending rate অনেকখানি কমিয়ে দেয়।\n\nFast Retransmit-এ এতটা কমায় না, কারণ সেখানে প্রমাণ আছে যে পরের segment গুলো তো পৌঁছাচ্ছেই — মানে পথ পুরোপুরি বন্ধ নয়।',
        apply: function(st){
          st.wire = { pkt:rp2, from:'client', to:'server' };
          st.banner = 'Timeout retransmit seq=' + lostSeq;
        }
      });
    }

    var fin = ackseg(BASE + 4 * MSS, 'ACK ' + (BASE + 4 * MSS));
    steps.push({
      t:at(), actor:'server', layer:'L4', kind:'ok',
      title:'ফাঁক ভরে গেল — ACK ' + (BASE + 4 * MSS), packet:fin,
      what:'হারানো segment পৌঁছাতেই ফাঁকটি ভরে গেল। Server এবার লাফিয়ে `ack=' + (BASE + 4 * MSS) + '` পাঠাল — চারটি segment-ই স্বীকৃত।',
      why :'একটি ACK একলাফে সব বাকি segment-এর স্বীকৃতি দিয়ে দিল। এটিই cumulative ACK-এর সুবিধা।\n\nএবার সবচেয়ে গুরুত্বপূর্ণ কথাটি — **Application কিছুই টের পায়নি**। সে যেই ক্রমে, যেই নিখুঁত অবস্থায় byte গুলো চেয়েছিল, ঠিক তাই পেয়েছে।\n\nএকটি Packet হারিয়েছিল, আবার পাঠাতে হয়েছিল, দেরি হয়েছিল — এসব TCP নিজের ভেতরেই সামলে নিয়েছে। উপরের application-এর কাছে data-র ধারাটি নিখুঁত ছিল।\n\nএটাই "reliability" শব্দের আসল মানে — হারায় না তা নয়, বরং **হারালেও উপরের স্তর টের পায় না**।',
      apply: function(st){
        st.wire = { pkt:fin, from:'server', to:'client' };
        st.lost = []; st.ackNo = BASE + 4 * MSS;
        st.banner = 'সব পৌঁছেছে · application কিছু টেরই পায়নি';
      }
    });

    return steps;
  }
};

})(window.NetLab);

(function(NS){
"use strict";
var N = NS.net, P = NS.pkt;

var CLI_IP = '192.168.1.10', SRV_IP = '93.184.216.34';
var CLI_MAC = 'AA:AA:AA:AA:AA:AA', SRV_MAC = 'SS:SS:SS:SS:SS:SS';
var MSS = 100, BASE = 1;

/* পাঠানোর ক্রম বনাম পৌঁছানোর ক্রম — এই lab-এর পুরো বিষয়টাই এই দুটির পার্থক্য */
var WORD = { 1:'"নেট"', 101:'"ওয়ার্কিং"', 201:'" শেখা"', 301:'" সহজ"' };

function dseg(seq){
  return P.make([
    P.ethernet(CLI_MAC, SRV_MAC, 'ip'),
    P.ip(CLI_IP, SRV_IP, 64, 'tcp', 40 + MSS),
    P.tcp(49152, 80, seq, 1, 'PSH, ACK', 64240),
    P.data(WORD[seq] || ('data ' + seq))
  ], { label:'seq=' + seq, kind:'data', from:'client', to:'server' });
}
function ackseg(ackNo, dup){
  return P.make([
    P.ethernet(SRV_MAC, CLI_MAC, 'ip'),
    P.ip(SRV_IP, CLI_IP, 64, 'tcp', 40),
    P.tcp(80, 49152, 1, ackNo, 'ACK', 65535)
  ], { label:'ACK ' + ackNo + (dup ? ' (dup)' : ''), kind:'ack',
       from:'server', to:'client' });
}

NS.labs.ordering = {
  id: 'ordering',
  title: 'TCP Ordering — ক্রম ঠিক রাখা',

  learn: [

    'ক্রম ভাঙলেও কেন cumulative ACK এগোতে পারে না',
    'Head-of-Line Blocking — একটি Packet কীভাবে বাকি সবাইকে আটকে রাখে'
  ],

  mistakes: [
    { m:'Packet যেই ক্রমে পাঠানো হয়, সেই ক্রমেই পৌঁছায়।',
      r:'IP কোনো ক্রমের প্রতিশ্রুতি দেয় না। দুটি Packet ভিন্ন পথে গেলে (load balancing, route পরিবর্তন) পরেরটা আগে পৌঁছাতেই পারে। ক্রম ঠিক রাখার দায়িত্ব **TCP-র**, IP-র নয়।' },
    { m:'উল্টো ক্রমে এলে TCP সেগুলো ফেলে দিয়ে আবার চায়।',
      r:'একদমই না — ফেলে দিলে তো অপচয় হতো। TCP সেগুলো **Receive Buffer-এ জমা রাখে** এবং ফাঁকটি ভরার অপেক্ষা করে। ফাঁক ভরলেই একসাথে সবটা application-কে দিয়ে দেয়।' },
    { m:'Buffer-এ data থাকা মানেই application সেটি পড়তে পারে।',
      r:'না। TCP **ক্রম না মেলা পর্যন্ত** কিছুই উপরে দেয় না, কারণ তার প্রতিশ্রুতি হলো ধারাবাহিক byte-stream। এজন্যই একটি হারানো Packet তার পরের সব data-কে আটকে রাখে — একে বলে **Head-of-Line Blocking**।' }
  ],

  controls: [
    { key:'mode', type:'choice', label:'পৌঁছানোর ক্রম', def:'reorder',
      options:[ ['inorder','ঠিক ক্রমেই পৌঁছাচ্ছে'],
                ['reorder','২য় segment দেরিতে পৌঁছাচ্ছে'] ],
      help:'দুটি চালিয়ে buffer-এর আচরণের পার্থক্য দেখুন।' }
  ],

  build: function(){
    return {
      devices: [
        N.pc('client', { name:'Client', x:18, y:50, mac:CLI_MAC, ip:CLI_IP }),
        N.server('server', { name:'Server', x:82, y:50, mac:SRV_MAC, ip:SRV_IP,
                             listening:[{ port:80, service:'HTTP', open:true }],
                             note:'buffer খালি' })
      ],
      links: [ N.link('client','server') ],
      hub:null, wire:null, banner:null,
      buf: [], delivered: '', ackNo: BASE
    };
  },

  script: function(s0, cfg){
    P.resetIds();
    var steps = [], t = 0;
    function at(){ return ++t; }

    /* পাঠানোর ক্রম সবসময় একই; শুধু পৌঁছানোর ক্রম বদলায় */
    var order = cfg.mode === 'inorder' ? [1, 101, 201, 301] : [1, 201, 301, 101];

    steps.push({
      t:at(), actor:'client', layer:'L4', kind:'info',
      title:'চারটি segment পাঠানো হলো — ক্রমে',
      what:'Client ৪০০ byte চারটি segment-এ ভাগ করে **ক্রমানুসারে** পাঠাল: `1`, `101`, `201`, `301`।\n\nএকসাথে লিখলে বার্তাটি হয়: ' + WORD[1] + ' + ' + WORD[101] + ' + ' + WORD[201] + ' + ' + WORD[301] + '।',
      why : cfg.mode === 'inorder'
        ? 'Client-এর কাজ এখানেই শেষ — সে ঠিক ক্রমেই পাঠিয়েছে। এবার দেখা যাক network কী করে।'
        : 'Client ঠিক ক্রমেই পাঠিয়েছে। কিন্তু এই চারটি Packet এখন IP-র হাতে, আর **IP কোনো ক্রমের প্রতিশ্রুতি দেয় না**।\n\nবড় network-এ একাধিক পথ থাকে। Router load ভাগ করতে ভিন্ন Packet ভিন্ন পথে পাঠাতে পারে, অথবা মাঝপথে route বদলে যেতে পারে। এক পথ অন্যটির চেয়ে ধীর হলে পরের Packet আগে পৌঁছে যায়।',
      apply: function(st){ st.banner = 'পাঠানো হলো: 1, 101, 201, 301'; }
    });

    var buf = [], expect = BASE, delivered = '';

    for(var i = 0; i < order.length; i++){
      (function(seq, idx){
        var p = dseg(seq);
        var wasExpected = (seq === expect);

        /* buffer-এ যোগ করে দেখি কতদূর ধারাবাহিক হলো */
        buf.push(seq);
        buf.sort(function(a, b){ return a - b; });
        var newExpect = expect, given = [];
        while(buf.indexOf(newExpect) !== -1){
          given.push(newExpect);
          newExpect += MSS;
        }
        var beforeExpect = expect;
        expect = newExpect;
        var deliverNow = given.map(function(s){ return WORD[s]; }).join(' + ');
        if(given.length) delivered += given.map(function(s){ return WORD[s]; }).join('');

        var isDup = !given.length;
        var a = ackseg(expect, isDup);

        steps.push({
          t:at(), actor:'server', layer:'L4', kind: wasExpected ? 'ok' : 'warn',
          title:'seq=' + seq + ' পৌঁছাল' + (wasExpected ? '' : ' — কিন্তু ক্রম ভেঙেছে'),
          packet:p,
          what: wasExpected
            ? 'Segment `' + seq + '` পৌঁছাল — ঠিক যেটি আশা করা হচ্ছিল।' +
              (given.length > 1
                ? '\n\nআর সঙ্গে সঙ্গে buffer-এ আটকে থাকা segment গুলোও মুক্তি পেল! একসাথে application-এ গেল: ' + deliverNow
                : '\n\nসরাসরি application-এ চলে গেল: ' + deliverNow)
            : 'Segment `' + seq + '` পৌঁছাল, কিন্তু আশা করা হচ্ছিল `' + beforeExpect + '`।\n\nতাই এটি **Receive Buffer-এ জমা রাখা হলো** — application-কে দেওয়া হলো না।',
          why : wasExpected
            ? (given.length > 1
                ? 'এই মুহূর্তটিই দেখার মতো। ফাঁকটি ভরার সাথে সাথে buffer-এ জমে থাকা সব segment এক ধাক্কায় ধারাবাহিক হয়ে গেল, আর TCP সবটা একসাথে application-এ পাঠিয়ে দিল।\n\nApplication-এর দৃষ্টিতে data এলো নিখুঁত ক্রমে। সে জানতেই পারল না যে কয়েকটি টুকরো কিছুক্ষণ buffer-এ বসে অপেক্ষা করছিল।'
                : 'ক্রম মিলে গেছে, তাই আটকানোর কিছু নেই। TCP সরাসরি উপরে দিয়ে দিল আর ACK এগিয়ে গেল।')
            : 'Data-টি ফেলে দেওয়া হলো না — সেটি হতো অপচয়, কারণ Packet তো ঠিকঠাকই আছে।\n\nকিন্তু application-কেও দেওয়া গেল না। TCP-র প্রতিশ্রুতি হলো একটি **ধারাবাহিক byte-stream**। ' + beforeExpect + ' নম্বর byte না দিয়ে ' + seq + ' দিয়ে দিলে সেই প্রতিশ্রুতি ভাঙা হতো — application ভুল ক্রমে data পড়ত।\n\nতাই সে অপেক্ষা করে। একেই বলে **Head-of-Line Blocking** — একটি অনুপস্থিত টুকরো তার পরের সব টুকরোকে আটকে রাখে, যদিও সেগুলো নিরাপদে পৌঁছে গেছে।',
          apply: function(st){
            st.wire = { pkt:p, from:'client', to:'server' };
            st.buf = buf.slice();
            st.ackNo = expect;
            st.delivered = delivered;
            for(var d = 0; d < st.devices.length; d++)
              if(st.devices[d].id === 'server')
                st.devices[d].note = 'buffer: ' + (buf.length - given.length > 0
                  ? (buf.length - given.length) + ' আটকে' : 'খালি');
            st.banner = 'seq=' + seq + (wasExpected ? ' · ঠিক ক্রমে' : ' · buffer-এ জমা');
          }
        });

        steps.push({
          t:at(), actor:'server', layer:'L4', kind: isDup ? 'warn' : 'ok',
          title:'ACK ' + expect + (isDup ? ' — একই সংখ্যা আবার' : ''),
          packet:a,
          what: isDup
            ? 'Server আবারও `ack=' + expect + '` পাঠাল — আগেরটার মতোই। যদিও সে মাত্র নতুন একটি segment পেয়েছে।'
            : 'Server `ack=' + expect + '` পাঠাল — "এর আগ পর্যন্ত সব ধারাবাহিকভাবে পেয়েছি।"',
          why : isDup
            ? 'এটাই cumulative ACK-এর সীমাবদ্ধতা। ACK একটিমাত্র সংখ্যা — সে শুধু বলতে পারে "এই বিন্দু পর্যন্ত সব ঠিক"।\n\nSegment `' + seq + '` যে buffer-এ নিরাপদে আছে, সেই খবরটি এই একটি সংখ্যা দিয়ে বলার **কোনো উপায় নেই**। ফাঁকের ওপারের কথা cumulative ACK বলতেই পারে না।\n\nএই সীমাবদ্ধতা কাটাতেই পরে **SACK** (Selective ACK) নামের একটি TCP option যোগ হয়েছে — সেখানে receiver আলাদা করে জানাতে পারে "এই টুকরোগুলোও আমার কাছে আছে"। তখন sender অকারণে সেগুলো আবার পাঠায় না।'
            : 'ACK এগিয়ে গেল, কারণ ধারাবাহিক অংশটিও এগিয়েছে। Client এবার জানল ' + expect + '-এর আগের সব byte নিরাপদ।',
          apply: function(st){
            st.wire = { pkt:a, from:'server', to:'client' };
            st.ackNo = expect;
            st.banner = 'ACK ' + expect + (isDup ? ' (duplicate)' : '');
          }
        });
      })(order[i], i);
    }

    steps.push({
      t:at(), actor:'server', layer:'L7', kind:'ok',
      title:'Application পেল — নিখুঁত ক্রমে',
      what:'Application-এর কাছে পুরো বার্তাটি পৌঁছাল ঠিক যেই ক্রমে পাঠানো হয়েছিল।' +
           (cfg.mode === 'reorder'
             ? '\n\nঅথচ Packet গুলো পৌঁছেছিল এই ক্রমে: `1 → 201 → 301 → 101`।'
             : ''),
      why : cfg.mode === 'reorder'
        ? 'এটাই TCP-র সবচেয়ে বড় অবদান — **বিশৃঙ্খলাকে সে নিজের ভেতরে লুকিয়ে ফেলে**।\n\nনিচে IP স্তরে Packet গুলো এলোমেলো ক্রমে এসেছে, কিছু segment কিছুক্ষণ buffer-এ বসে ছিল, ACK একই সংখ্যা বারবার গেছে। এসবের কিছুই application দেখেনি।\n\nসে শুধু একটি socket থেকে পড়েছে এবং ঠিক ক্রমে byte পেয়েছে।\n\nএর একটি দামও আছে — এই অপেক্ষা। HTTP/2-তে একটি TCP connection দিয়ে অনেকগুলো request চলে, তাই একটি Packet হারালে **সব request আটকে যায়**। এই সমস্যা সমাধানের জন্যই QUIC তৈরি হয়েছে — সে TCP ছেড়ে UDP-র উপর নিজের ক্রম-ব্যবস্থা বানিয়েছে, যেখানে প্রতিটি stream আলাদাভাবে এগোতে পারে।'
        : 'ক্রম ঠিক থাকলে কাজটি সহজ — TCP প্রতিটি segment পাওয়া মাত্রই উপরে দিয়ে দেয়, কোনো অপেক্ষা নেই।\n\nএবার `reorder` mode-এ চালিয়ে দেখুন — ক্রম ভাঙলে কী কী বাড়তি কাজ করতে হয়।',
      apply: function(st){
        st.wire = null;
        st.banner = 'Application পেল · ক্রম নিখুঁত';
        for(var d = 0; d < st.devices.length; d++)
          if(st.devices[d].id === 'server') st.devices[d].note = 'buffer খালি';
      }
    });

    return steps;
  }
};

})(window.NetLab);

(function(NS){
"use strict";
var N = NS.net, P = NS.pkt;

var CLI_IP = '192.168.1.10', SRV_IP = '93.184.216.34';
var CLI_MAC = 'AA:AA:AA:AA:AA:AA', SRV_MAC = 'SS:SS:SS:SS:SS:SS';
var MSS = 500;          /* এক segment = ৫০০ byte */
var CAP = 2000;         /* Receiver-এর buffer মোট ২০০০ byte */

function dseg(seq, win){
  return P.make([
    P.ethernet(CLI_MAC, SRV_MAC, 'ip'),
    P.ip(CLI_IP, SRV_IP, 64, 'tcp', 40 + MSS),
    P.tcp(49152, 80, seq, 1, 'PSH, ACK', win),
    P.data(MSS + ' bytes')
  ], { label:'seq=' + seq, kind:'data', from:'client', to:'server' });
}
function ackseg(ackNo, win, label){
  return P.make([
    P.ethernet(SRV_MAC, CLI_MAC, 'ip'),
    P.ip(SRV_IP, CLI_IP, 64, 'tcp', 40),
    P.tcp(80, 49152, 1, ackNo, 'ACK', win)
  ], { label:label, kind:'ack', from:'server', to:'client' });
}

NS.labs.flow = {
  id: 'flow',
  title: 'Flow Control — Window',
  group: 'Phase 3 · Layer 4',
  chapter: 'ch20',
  blurb: 'দ্রুত sender আর ধীর receiver। Receiver নিজেই বলে দেয় "আর কত পাঠাতে পারো"।',

  learn: [
    'Receive Window কী এবং সেটি কে ঠিক করে',
    'Buffer ভরে গেলে window কীভাবে শূন্য হয়ে যায়',
    'Zero Window হলে sender কী করে — এবং deadlock কীভাবে এড়ায়',
    'Flow Control আর Congestion Control — দুটি সম্পূর্ণ ভিন্ন সমস্যা'
  ],

  mistakes: [
    { m:'Flow Control আর Congestion Control একই জিনিস।',
      r:'দুটি ভিন্ন সমস্যার সমাধান। **Flow Control** receiver-কে বাঁচায় — "তুমি আমার চেয়ে দ্রুত পাঠাচ্ছ, আমার buffer উপচে পড়বে"। **Congestion Control** network-কে বাঁচায় — "মাঝের Router গুলোর queue ভরে যাচ্ছে"। Sender আসলে দুটির মধ্যে যেটি ছোট সেটিই মেনে চলে।' },
    { m:'Window শূন্য হওয়া মানে connection নষ্ট হয়ে গেছে।',
      r:'একদমই না। Zero Window সম্পূর্ণ স্বাভাবিক — এর মানে receiver বলছে "একটু থামো, আমি এখনো আগেরগুলো পড়িনি"। Application buffer থেকে data পড়ে নিলেই window আবার খুলে যায় এবং connection যেখানে ছিল সেখান থেকেই চলতে থাকে।' },
    { m:'Window Size মানে network কত দ্রুত।',
      r:'Window Size পুরোপুরি **receiver-এর buffer-এর খালি জায়গা** — network-এর গতির সাথে এর কোনো সম্পর্ক নেই। ১ Gbps সংযোগেও receiver-এর window ছোট হলে গতি কম হবে।' }
  ],

  controls: [
    { key:'slow', type:'toggle', label:'Application ধীরে পড়ছে', def:true,
      help:'বন্ধ করলে receiver সঙ্গে সঙ্গে পড়ে নেয়, তাই window কখনো ভরে না।' }
  ],

  build: function(){
    return {
      devices: [
        N.pc('client', { name:'Client (fast)', x:18, y:50, mac:CLI_MAC, ip:CLI_IP,
                         note:'পাঠাচ্ছে' }),
        N.server('server', { name:'Server (slow)', x:82, y:50, mac:SRV_MAC, ip:SRV_IP,
                             listening:[{ port:80, service:'upload', open:true }],
                             note:'buffer 0/' + CAP })
      ],
      links: [ N.link('client','server') ],
      hub:null, wire:null, banner:null,
      used: 0, cap: CAP, win: CAP
    };
  },

  script: function(s0, cfg){
    P.resetIds();
    var steps = [], t = 0;
    function at(){ return ++t; }

    var used = 0, seq = 1;
    function win(){ return CAP - used; }
    function note(st, w){
      for(var i = 0; i < st.devices.length; i++)
        if(st.devices[i].id === 'server')
          st.devices[i].note = 'buffer ' + (CAP - w) + '/' + CAP;
    }

    steps.push({
      t:at(), actor:'server', layer:'L4', kind:'info',
      title:'Server জানাল — window ' + CAP + ' byte',
      what:'Handshake-এর সময়েই Server তার **Receive Window** জানিয়ে দিয়েছে: `window=' + CAP + '`।\n\nঅর্থাৎ "তুমি সর্বোচ্চ ' + CAP + ' byte পাঠাতে পারো ACK-এর অপেক্ষা না করে।"',
      why :'এই সংখ্যাটি Server-এর **buffer-এ কত জায়গা খালি** তা-ই বলে। এর সাথে network-এর গতির কোনো সম্পর্ক নেই।\n\nWindow ছাড়া কী হতো? Client যতটা দ্রুত পারে পাঠাত। Server-এর buffer ভরে গেলে বাকি data ফেলে দিতে হতো, তারপর সেগুলো আবার পাঠাতে হতো — অকারণে network-এর অপচয়।\n\nWindow থাকায় সমস্যাটা আগেই ঠেকানো যায় — Client প্রয়োজনের বেশি পাঠায়ই না।',
      apply: function(st){ st.win = CAP; st.used = 0; st.banner = 'window ' + CAP; }
    });

    /* ── window ভরে যাওয়া পর্যন্ত segment পাঠানো ── */
    var n = CAP / MSS;
    for(var i = 0; i < n; i++){
      (function(idx){
        var thisSeq = seq;
        seq += MSS;
        var p = dseg(thisSeq, 64240);
        var remainBefore = win();
        used += MSS;
        var remainAfter = win();

        steps.push({
          t:at(), actor:'client', layer:'L4', kind: remainAfter === 0 ? 'warn' : 'info',
          title:'Segment পাঠানো — seq=' + thisSeq + ' (window বাকি ' + remainAfter + ')',
          packet:p,
          what:'Client ' + MSS + ' byte পাঠাল। Window-এ জায়গা ছিল ' + remainBefore +
               ', এখন বাকি **' + remainAfter + '**।',
          why : cfg.slow
            ? 'Server-এর application এখনো এই data পড়েনি — সেগুলো buffer-এই জমে থাকছে। তাই খালি জায়গা কমছে।\n\nClient প্রতিটি segment পাঠানোর পর নিজের হিসাব রাখে: "আর কত byte পাঠাতে পারি?" এই হিসাবটাই flow control।'
            : 'Server-এর application দ্রুত পড়ে নিচ্ছে, তাই buffer আসলে বেশি ভরছে না। তবু Client পাঠানোর সময় ধরে নেয় জায়গা কমছে — নিশ্চিত হওয়ার জন্য পরের ACK-এর window দেখতে হবে।',
          apply: function(st){
            st.wire = { pkt:p, from:'client', to:'server' };
            st.used = CAP - remainAfter;
            st.win = remainAfter;
            note(st, remainAfter);
            st.banner = 'পাঠানো ' + MSS + 'B · window বাকি ' + remainAfter;
          }
        });

        /* Application দ্রুত পড়লে buffer খালি হয়ে যাচ্ছে */
        if(!cfg.slow){
          used -= MSS;
          var w = win();
          var a = ackseg(thisSeq + MSS, w, 'ACK win=' + w);
          steps.push({
            t:at(), actor:'server', layer:'L4', kind:'ok',
            title:'ACK — window আবার পুরো ' + w, packet:a,
            what:'Application সঙ্গে সঙ্গে data পড়ে নিল, তাই buffer আবার খালি। Server জানাল `window=' + w + '`।',
            why :'Receiver যখন sender-এর সমান বা বেশি দ্রুত, তখন flow control কার্যত অদৃশ্য থাকে — window কখনো ছোট হয় না, sender কখনো থামে না।\n\nএই ব্যবস্থাটি তখনই দৃশ্যমান হয় যখন দুই পাশের গতিতে অমিল তৈরি হয়। `Application ধীরে পড়ছে` চালু করে দেখুন।',
            apply: function(st){
              st.wire = { pkt:a, from:'server', to:'client' };
              st.used = 0; st.win = w; note(st, w);
              st.banner = 'ACK · window ' + w;
            }
          });
        }
      })(i);
    }

    if(!cfg.slow){
      steps.push({
        t:at(), actor:'client', layer:'L4', kind:'ok',
        title:'পুরো ' + CAP + ' byte নির্বিঘ্নে গেল',
        what:'Receiver তাল মিলিয়ে পড়তে পারায় window কখনো ছোট হয়নি। Client কখনো থামেনি।',
        why :'এটাই কাম্য অবস্থা। Flow control একটি **নিরাপত্তা ব্যবস্থা** — সাধারণ সময়ে সে চুপচাপ থাকে, বিপদ হলে হস্তক্ষেপ করে।\n\nএখন `Application ধীরে পড়ছে` চালু করে দেখুন — receiver পিছিয়ে পড়লে সে কীভাবে sender-কে থামায়।',
        apply: function(st){ st.wire = null; st.banner = 'সম্পন্ন · window কখনো ভরেনি'; }
      });
      return steps;
    }

    /* ── Zero Window ── */
    var z = ackseg(seq, 0, 'ACK win=0');
    steps.push({
      t:at(), actor:'server', layer:'L4', kind:'error',
      title:'Zero Window — "আর পাঠিও না"', packet:z,
      what:'Buffer পুরো ভরে গেছে (' + CAP + '/' + CAP + ')। Server ACK পাঠাল ঠিকই, কিন্তু তাতে লেখা `window=0`।\n\nএর মানে সাফ — **এখন আর একটি byte-ও পাঠিও না**।',
      why :'লক্ষ্য করুন Server কিন্তু কোনো data ফেলে দেয়নি। সে সব পেয়েছে, ACK-ও দিয়েছে। শুধু বলছে "এখন থামো"।\n\nএটাই flow control-এর সৌন্দর্য — সমস্যা **ঘটার আগেই** ঠেকানো। Packet ফেলে দিয়ে তারপর আবার পাঠানোর চেয়ে আগেই থামিয়ে দেওয়া অনেক সস্তা।\n\nএখানে আসল অপরাধী network নয়, Server-এর **application**। সে socket থেকে যথেষ্ট দ্রুত পড়ছে না। হয়তো ব্যস্ত, হয়তো disk-এ লিখছে, হয়তো ধীর।',
      apply: function(st){
        st.wire = { pkt:z, from:'server', to:'client' };
        st.win = 0; st.used = CAP; note(st, 0);
        st.banner = 'window = 0 — sender থেমে গেল';
      }
    });

    steps.push({
      t:at(), actor:'client', layer:'L4', kind:'warn',
      title:'Client থেমে গেল',
      what:'Client পাঠানো বন্ধ করে দিল। তার কাছে আরও data আছে, কিন্তু পাঠাতে পারছে না।',
      why :'এখানে একটি সূক্ষ্ম বিপদ লুকিয়ে আছে।\n\nClient অপেক্ষা করছে Server-এর নতুন window খোলার খবরের জন্য। কিন্তু সেই খবরটি আসবে একটি ACK-এর মাধ্যমে। আর Server ACK পাঠায় সাধারণত **data পেলে**। Client তো data পাঠাচ্ছে না।\n\nদুজনেই অপেক্ষা করছে অন্যজনের জন্য — এটিই **deadlock**। পরের ধাপে দেখুন TCP কীভাবে এটি এড়ায়।',
      apply: function(st){ st.wire = null; st.banner = 'sender অপেক্ষায়'; }
    });

    var probe = P.make([
      P.ethernet(CLI_MAC, SRV_MAC, 'ip'),
      P.ip(CLI_IP, SRV_IP, 64, 'tcp', 41),
      P.tcp(49152, 80, seq, 1, 'ACK', 64240),
      P.data('1 byte probe')
    ], { label:'Window Probe', kind:'data', from:'client', to:'server' });

    steps.push({
      t:at(), actor:'client', layer:'L4', kind:'info',
      title:'Window Probe — মাঝে মাঝে টোকা দেওয়া', packet:probe,
      what:'Client একটি খুব ছোট Packet পাঠাল — মাত্র **১ byte**। একে বলে **Window Probe**।',
      why :'এভাবেই deadlock ভাঙা হয়। Client পুরোপুরি চুপ করে বসে থাকে না — সে মাঝে মাঝে ছোট্ট একটি Packet পাঠিয়ে জিজ্ঞেস করে "এখন জায়গা হয়েছে?"\n\nSever বাধ্য হয়ে উত্তর দেয়, আর সেই উত্তরে বর্তমান window থাকে।\n\nকেন এই ব্যবস্থা দরকার? কারণ window খোলার খবর যে ACK-টিতে ছিল সেটি নিজেই যদি পথে হারিয়ে যেত, তাহলে Client চিরকাল অপেক্ষা করত। Probe সেই ঝুঁকিটাই দূর করে দেয়।\n\nবারবার probe পাঠালে অপচয় হতো, তাই এর মাঝেও সময় বাড়ানো হয়।',
      apply: function(st){
        st.wire = { pkt:probe, from:'client', to:'server' };
        st.banner = 'Window Probe';
      }
    });

    steps.push({
      t:at(), actor:'server', layer:'L7', kind:'info',
      title:'Application অবশেষে data পড়ল',
      what:'Server-এর application buffer থেকে ' + (CAP / 2) + ' byte পড়ে নিল। এখন buffer-এ জায়গা হলো।',
      why :'এটি নিছক application-এর কাজ — TCP-র নয়। TCP শুধু হিসাব রাখে কতটুকু খালি হলো।\n\nএখান থেকেই একটি বাস্তব শিক্ষা: connection ধীর মানেই network ধীর নয়। প্রায়ই আসল কারণ থাকে receiving application-এর ধীরগতি — সে socket থেকে পড়তে দেরি করছে।\n\n`ss -tn` চালিয়ে `Recv-Q` বড় দেখলে ঠিক এই অবস্থাটাই ধরা পড়ে — data এসে গেছে, কিন্তু application তুলছে না।',
      apply: function(st){
        st.used = CAP / 2; st.win = CAP / 2; note(st, CAP / 2);
        st.banner = 'application পড়ল · ' + (CAP / 2) + 'B খালি হলো';
      }
    });

    var open = ackseg(seq + 1, CAP / 2, 'ACK win=' + (CAP / 2));
    steps.push({
      t:at(), actor:'server', layer:'L4', kind:'ok',
      title:'Window Update — window খুলল ' + (CAP / 2), packet:open,
      what:'Server একটি ACK পাঠাল `window=' + (CAP / 2) + '` নিয়ে — "আবার পাঠাতে পারো, ' + (CAP / 2) + ' byte পর্যন্ত।"',
      why :'Connection কখনো ভাঙেনি, কোনো data হারায়নি, কোনো error হয়নি। শুধু কিছুক্ষণের জন্য থেমে ছিল।\n\nএটাই TCP-র **self-clocking** স্বভাব — sender-এর গতি receiver-এর গতির সাথে নিজে থেকেই মিলে যায়। কেউ আগে থেকে হিসাব করে গতি ঠিক করে দেয়নি; ব্যবস্থাটি নিজেই ভারসাম্য খুঁজে নেয়।\n\nআর মনে রাখুন — এটি **শুধু receiver-কে** বাঁচানোর ব্যবস্থা। মাঝের Router গুলোর queue ভরে গেলে এই window কিছুই টের পায় না। সেটি সামলায় Congestion Control, একটি সম্পূর্ণ আলাদা ব্যবস্থা। Sender আসলে দুটির মধ্যে **যেটি ছোট** সেই সীমাই মেনে চলে।',
      apply: function(st){
        st.wire = { pkt:open, from:'server', to:'client' };
        st.win = CAP / 2;
        st.banner = 'window খুলল ' + (CAP / 2) + ' — আবার চলছে';
      }
    });

    return steps;
  }
};

})(window.NetLab);

   LAB · Connection Close — FIN, FIN-ACK এবং TIME_WAIT
   ═══════════════════════════════════════════════════════════════════ */
(function(NS){
"use strict";
var N = NS.net, P = NS.pkt;

var CLI_IP = '192.168.1.10', SRV_IP = '93.184.216.34';
var CLI_MAC = 'AA:AA:AA:AA:AA:AA', SRV_MAC = 'SS:SS:SS:SS:SS:SS';

function seg(from, seq, ack, flags, label, kind){
  return P.make([
    P.ethernet(from === 'client' ? CLI_MAC : SRV_MAC,
               from === 'client' ? SRV_MAC : CLI_MAC, 'ip'),
    P.ip(from === 'client' ? CLI_IP : SRV_IP,
         from === 'client' ? SRV_IP : CLI_IP, 64, 'tcp', 40),
    P.tcp(from === 'client' ? 49152 : 80, from === 'client' ? 80 : 49152,
          seq, ack, flags, 64240)
  ], { label:label, kind:kind || 'ack', from:from,
       to: from === 'client' ? 'server' : 'client' });
}

NS.labs.close = {
  id: 'close',
  title: 'Connection Close & TIME_WAIT',
  group: 'Phase 3 · Layer 4',
  chapter: 'ch22',
  blurb: 'শুরু হয় তিনটি Packet-এ, শেষ হয় চারটিতে। আর শেষ হওয়ার পরেও connection কিছুক্ষণ বেঁচে থাকে।',

  learn: [
    'কেন close-এ চারটি Packet লাগে, handshake-এ যেখানে তিনটি',
    'Half-close কী — এক দিক বন্ধ হলেও অন্য দিক খোলা থাকতে পারে',
    'TIME_WAIT কী এবং কেন সেটি ২ MSL সময় ধরে থাকে',
    'হাজার হাজার TIME_WAIT socket দেখলে সেটি সমস্যা কিনা'
  ],

  mistakes: [
    { m:'TIME_WAIT একটি সমস্যা, একে বন্ধ করে দেওয়া উচিত।',
      r:'TIME_WAIT একটি **নিরাপত্তা ব্যবস্থা**, bug নয়। এটি নিশ্চিত করে পুরনো connection-এর দেরিতে আসা Packet নতুন connection-এ ঢুকে data নষ্ট না করে। জোর করে বন্ধ করলে বিরল কিন্তু ভয়াবহ data corruption হতে পারে।' },
    { m:'FIN পাঠানো মানে connection সঙ্গে সঙ্গে বন্ধ।',
      r:'FIN মানে শুধু **"আমার আর পাঠানোর কিছু নেই"**। অন্য পাশ তখনও data পাঠাতে পারে, এবং TCP সেটি ঠিকঠাক গ্রহণ করে। একে বলে **half-close** — এজন্যই দুই দিক আলাদাভাবে বন্ধ করতে হয়, তাই চারটি Packet।' },
    { m:'RST দিয়ে connection বন্ধ করা FIN-এর চেয়ে দ্রুত, তাই ভালো।',
      r:'দ্রুত ঠিকই, কিন্তু **নিরাপদ নয়**। RST সঙ্গে সঙ্গে সব ফেলে দেয় — buffer-এ যে data এখনো পাঠানো হয়নি সেটিও। FIN নিশ্চিত করে সব data পৌঁছেছে, তারপর বন্ধ হয়। RST অস্বাভাবিক পরিস্থিতির জন্য।' }
  ],

  controls: [
    { key:'mode', type:'choice', label:'কীভাবে বন্ধ হবে', def:'graceful',
      options:[ ['graceful','স্বাভাবিক — চারটি Packet (FIN)'],
                ['halfclose','Half-close — Server তখনও data পাঠাচ্ছে'],
                ['rst','RST — হঠাৎ ছিঁড়ে ফেলা'] ] }
  ],

  build: function(){
    return {
      devices: [
        N.pc('client', { name:'Client', x:18, y:50, mac:CLI_MAC, ip:CLI_IP,
                         note:'ESTABLISHED' }),
        N.server('server', { name:'Server', x:82, y:50, mac:SRV_MAC, ip:SRV_IP,
                             listening:[{ port:80, service:'HTTP', open:true }],
                             note:'ESTABLISHED' })
      ],
      links: [ N.link('client','server') ],
      hub:null, wire:null, banner:null,
      cstate:'ESTABLISHED', sstate:'ESTABLISHED'
    };
  },

  script: function(s0, cfg){
    P.resetIds();
    var steps = [], t = 0;
    function at(){ return ++t; }
    function setState(st, c, s){
      for(var i = 0; i < st.devices.length; i++){
        if(st.devices[i].id === 'client' && c){ st.devices[i].note = c; st.cstate = c; }
        if(st.devices[i].id === 'server' && s){ st.devices[i].note = s; st.sstate = s; }
      }
    }

    /* ── RST — হঠাৎ ── */
    if(cfg.mode === 'rst'){
      var rst = seg('client', 5000, 8000, 'RST', 'RST', 'ack');
      steps.push({
        t:at(), actor:'client', layer:'L4', kind:'error',
        title:'RST — এক Packet-এই সব শেষ', packet:rst,
        what:'Client একটি **RST** পাঠাল। কোনো আলোচনা নেই, কোনো অপেক্ষা নেই — connection সঙ্গে সঙ্গে শেষ।',
        why :'RST মানে "এই connection আর নেই, ভুলে যাও"।\n\nসাধারণত এটি ঘটে অস্বাভাবিক পরিস্থিতিতে — process হঠাৎ মারা গেছে, অথবা এমন connection-এ Packet এসেছে যার কোনো অস্তিত্ব নেই।\n\nএর একটা বড় বিপদ আছে: send buffer-এ যদি কোনো data এখনো পাঠানো বাকি থাকত, সেটি **হারিয়ে যাবে**। RST অপেক্ষা করে না।',
        apply: function(st){
          st.wire = { pkt:rst, from:'client', to:'server' };
          setState(st, 'CLOSED', 'CLOSED');
          st.banner = 'RST — connection ছিঁড়ে গেল';
        }
      });
      steps.push({
        t:at(), actor:'server', layer:'L4', kind:'error',
        title:'Server-ও সঙ্গে সঙ্গে মুছে ফেলল',
        what:'Server RST পেয়ে connection-এর সব তথ্য মুছে ফেলল। কোনো TIME_WAIT নেই, কোনো অপেক্ষা নেই।',
        why :'এখানে ভালো দিকটি হলো — কোনো TIME_WAIT পড়ে থাকল না, resource সঙ্গে সঙ্গে মুক্ত।\n\nকিন্তু দামটাও বড়। কোনো নিশ্চয়তা নেই যে সব data পৌঁছেছে। Application যদি ঠিক আগেই কিছু লিখে থাকে, সেটি নীরবে হারিয়ে যেতে পারে।\n\nএজন্যই "TIME_WAIT এড়াতে RST ব্যবহার করি" — এই পরামর্শটি বিপজ্জনক। স্বাভাবিক close-এর জন্য FIN-ই সঠিক।',
        apply: function(st){ st.wire = null; st.banner = 'দুই পাশেই CLOSED'; }
      });
      return steps;
    }

    /* ── ধাপ ১: Client-এর FIN ── */
    var fin1 = seg('client', 5000, 8000, 'FIN, ACK', 'FIN seq=5000');
    steps.push({
      t:at(), actor:'client', layer:'L4', kind:'info',
      title:'১ম — Client FIN পাঠাল', packet:fin1,
      what:'Client-এর application `close()` ডাকল। TCP একটি **FIN** পাঠাল।\n\nClient এখন `FIN_WAIT_1` অবস্থায়।',
      why :'FIN-এর অর্থ সাবধানে বোঝা দরকার — এটি "connection বন্ধ করো" নয়।\n\nএর মানে **"আমার আর পাঠানোর কিছু নেই"**। শুধু নিজের দিকটার কথা বলছে।\n\nTCP connection দ্বিমুখী, আর প্রতিটি দিক **স্বাধীনভাবে** বন্ধ হয়। Client-এর কথা শেষ মানে এই নয় যে Server-এরও শেষ।\n\nএই স্বাধীনতাই handshake আর close-এর পার্থক্য গড়ে দেয়। SYN-ACK-এ দুটি কাজ একসাথে করা গিয়েছিল, কারণ Server তখনই দুটোতেই রাজি। কিন্তু FIN-এর সময় Server হয়তো তখনো কথা শেষ করেনি।',
      apply: function(st){
        st.wire = { pkt:fin1, from:'client', to:'server' };
        setState(st, 'FIN_WAIT_1', 'ESTABLISHED');
        st.banner = 'FIN → Client-এর কথা শেষ';
      }
    });

    /* ── ধাপ ২: Server-এর ACK ── */
    var ack1 = seg('server', 8000, 5001, 'ACK', 'ACK 5001');
    steps.push({
      t:at(), actor:'server', layer:'L4', kind:'ok',
      title:'২য় — Server ACK দিল (কিন্তু FIN দিল না)', packet:ack1,
      what:'Server FIN-টি স্বীকার করল `ack=5001`। কিন্তু নিজে এখনো FIN পাঠায়নি।\n\nServer এখন `CLOSE_WAIT` — Client `FIN_WAIT_2`।',
      why :'**এই ধাপটিই বুঝিয়ে দেয় কেন চারটি Packet লাগে।**\n\nServer বলছে "তোমার কথা শেষ, বুঝলাম।" কিন্তু সে নিজে এখনো প্রস্তুত নয় — হয়তো তার application-এর আরও কিছু পাঠানোর আছে।\n\nহাত মেলানোর সময় SYN আর ACK একসাথে যেতে পেরেছিল, কারণ Server তখনই দুটোতেই রাজি ছিল। এখানে সেই সুবিধা নেই — তাই ACK আর FIN আলাদা হয়ে যায়, আর মোট চারটি Packet লাগে।\n\n`CLOSE_WAIT` অবস্থাটি debugging-এ খুব কাজের। বহু `CLOSE_WAIT` জমে থাকা মানে **application `close()` ডাকতে ভুলে গেছে** — TCP অপেক্ষা করছে কিন্তু কোড থেকে নির্দেশ আসছে না। এটি প্রায় সবসময়ই একটি bug।',
      apply: function(st){
        st.wire = { pkt:ack1, from:'server', to:'client' };
        setState(st, 'FIN_WAIT_2', 'CLOSE_WAIT');
        st.banner = 'ACK · Server এখনো CLOSE_WAIT-এ';
      }
    });

    /* ── Half-close: Server তখনও data পাঠাচ্ছে ── */
    if(cfg.mode === 'halfclose'){
      var late = P.make([
        P.ethernet(SRV_MAC, CLI_MAC, 'ip'),
        P.ip(SRV_IP, CLI_IP, 64, 'tcp', 140),
        P.tcp(80, 49152, 8000, 5001, 'PSH, ACK', 64240),
        P.data('বাকি 100 byte response')
      ], { label:'data', kind:'data', from:'server', to:'client' });

      steps.push({
        t:at(), actor:'server', layer:'L7', kind:'ok',
        title:'Server তখনও data পাঠাচ্ছে', packet:late,
        what:'Client FIN পাঠানোর **পরেও** Server ১০০ byte data পাঠাল। আর Client সেটি স্বাভাবিকভাবেই গ্রহণ করল।',
        why :'এটাই **half-close**। Client শুধু বলেছিল "আমার পাঠানো শেষ" — "আমি আর শুনব না" বলেনি।\n\nClient→Server দিকটি বন্ধ, কিন্তু Server→Client দিকটি সম্পূর্ণ খোলা।\n\nএর একটি চমৎকার বাস্তব ব্যবহার আছে। ভাবুন একটি কাজ যেখানে আপনি একটি বড় file পাঠাবেন, তারপর ফলাফল শুনবেন। File পাঠানো শেষ হলেই আপনি নিজের দিক বন্ধ করে দিতে পারেন — এতে অন্য পাশ **নিশ্চিতভাবে** জানে যে আর কিছু আসছে না, তাই সে কাজ শুরু করতে পারে। অথচ আপনি তখনও উত্তরের অপেক্ষায় শুনতে থাকেন।\n\nUnix-এ `shutdown(sock, SHUT_WR)` ঠিক এই কাজটিই করে।',
        apply: function(st){
          st.wire = { pkt:late, from:'server', to:'client' };
          st.banner = 'half-close — এক দিক খোলা';
        }
      });
    }

    /* ── ধাপ ৩: Server-এর FIN ── */
    var fin2 = seg('server', cfg.mode === 'halfclose' ? 8100 : 8000, 5001,
                   'FIN, ACK', 'FIN');
    var sseq = cfg.mode === 'halfclose' ? 8101 : 8001;
    steps.push({
      t:at(), actor:'server', layer:'L4', kind:'info',
      title:'৩য় — এবার Server-এর FIN', packet:fin2,
      what:'Server-এর application-ও `close()` ডাকল। সে এবার নিজের **FIN** পাঠাল।\n\nServer এখন `LAST_ACK` — শেষ স্বীকৃতির অপেক্ষায়।',
      why :'এখন দুই দিকই বন্ধ হওয়ার পথে। প্রতিটি দিকের জন্য একটি FIN আর একটি ACK — মোট চারটি।\n\nএখানে একটি সৌন্দর্য আছে: এই একই চারটি Packet-এর ব্যবস্থা **যে কোনো ক্রমে** কাজ করে। দুই পাশ একসাথে FIN পাঠালেও (simultaneous close) TCP সেটি সামলাতে পারে।',
      apply: function(st){
        st.wire = { pkt:fin2, from:'server', to:'client' };
        setState(st, null, 'LAST_ACK');
        st.banner = 'Server-এর FIN';
      }
    });

    /* ── ধাপ ৪: Client-এর শেষ ACK ── */
    var ack2 = seg('client', 5001, sseq, 'ACK', 'ACK ' + sseq);
    steps.push({
      t:at(), actor:'client', layer:'L4', kind:'ok',
      title:'৪র্থ — শেষ ACK, আর তারপর TIME_WAIT', packet:ack2,
      what:'Client শেষ ACK পাঠাল। Server এটি পেয়েই connection মুছে ফেলবে — তার কাজ শেষ।\n\nকিন্তু Client নিজে সঙ্গে সঙ্গে মুক্ত হয় না। সে যায় **TIME_WAIT** অবস্থায়।',
      why :'কেন এই বাড়তি অপেক্ষা? দুটি কারণ, দুটিই গুরুত্বপূর্ণ।\n\n**এক — শেষ ACK যদি হারিয়ে যায়।** তাহলে Server ভাববে তার FIN পৌঁছায়নি, আর আবার FIN পাঠাবে। Client যদি ততক্ষণে সব মুছে ফেলে থাকে, সে সেই FIN-এর উত্তরে RST পাঠাবে — Server-এর কাছে যা একটি error বলে মনে হবে। TIME_WAIT-এ থাকলে সে ACK-টি আবার পাঠাতে পারে।\n\n**দুই — পুরনো Packet-এর ভূত।** এই connection-এর কোনো Packet হয়তো এখনো network-এ ঘুরছে (Router-এর queue-তে আটকে ছিল)। যদি সঙ্গে সঙ্গে একই port দিয়ে নতুন connection খোলা হয়, সেই দেরিতে আসা Packet নতুন connection-এ ঢুকে **data নষ্ট করে দিতে পারে**।',
      apply: function(st){
        st.wire = { pkt:ack2, from:'client', to:'server' };
        setState(st, 'TIME_WAIT', 'CLOSED');
        st.banner = 'শেষ ACK · Client TIME_WAIT-এ';
      }
    });

    steps.push({
      t:at(), actor:'client', layer:'L4', kind:'warn',
      title:'TIME_WAIT — ২ MSL অপেক্ষা',
      what:'Client প্রায় **৬০ সেকেন্ড** (2 × MSL) এই অবস্থায় থাকবে। এই সময়ে ওই port অন্য কেউ ব্যবহার করতে পারবে না।',
      why :'MSL মানে Maximum Segment Lifetime — একটি Packet network-এ সর্বোচ্চ কতক্ষণ বাঁচতে পারে।\n\nদ্বিগুণ কেন? এক MSL যাওয়ার পথের ভেসে থাকা Packet-এর জন্য, আরেক MSL তার উত্তরের জন্য। এই সময় পার হলে নিশ্চিতভাবে বলা যায় — এই connection-এর কোনো Packet আর কোথাও বেঁচে নেই।\n\n**যে দিক আগে close করে, TIME_WAIT তার ঘাড়েই পড়ে।** এই কথাটির একটি ব্যবহারিক ফল আছে: ব্যস্ত Server-এ যদি Server নিজে আগে close করে, তাহলে হাজার হাজার TIME_WAIT socket জমে যায়। HTTP Keep-Alive এই সমস্যা অনেকটাই কমায়, কারণ তখন connection বারবার খোলা-বন্ধই হয় না।\n\n`ss -tan | grep TIME-WAIT` দিয়ে অনেক দেখলে আতঙ্কিত হওয়ার কিছু নেই — এটি স্বাভাবিক ও সাময়িক। কিন্তু সংখ্যাটি যদি ক্রমাগত বাড়তে থাকে, তাহলে বুঝতে হবে connection পুনর্ব্যবহার হচ্ছে না।',
      apply: function(st){ st.wire = null; st.banner = 'TIME_WAIT · ~60s'; }
    });

    steps.push({
      t:at(), actor:'client', layer:'L4', kind:'ok',
      title:'সময় শেষ — এবার সত্যিই CLOSED',
      what:'২ MSL পার হলো। Client-ও এখন `CLOSED`। Port আবার ব্যবহারযোগ্য।',
      why :'পুরো ব্যবস্থাটি একবার মিলিয়ে দেখুন:\n\n`ESTABLISHED → FIN_WAIT_1 → FIN_WAIT_2 → TIME_WAIT → CLOSED`\n\nএতগুলো অবস্থা কেবল **বিদায় নেওয়ার** জন্য! কিন্তু প্রতিটি অবস্থার পেছনে একটি নির্দিষ্ট প্রশ্ন আছে: "যদি এই Packet-টি হারিয়ে যায়, তখন কী হবে?"\n\nTCP-র পুরো নকশাটাই এই এক প্রশ্নের চারপাশে গড়া। অবিশ্বস্ত একটি network-এর উপরে বিশ্বাসযোগ্যতা তৈরি করতে হলে প্রতিটি সম্ভাব্য ব্যর্থতার উত্তর আগে থেকে ভেবে রাখতে হয়।',
      apply: function(st){
        setState(st, 'CLOSED', 'CLOSED');
        st.banner = 'দুই পাশেই CLOSED';
      }
    });

    return steps;
  }
};

})(window.NetLab);
