(function(NS){
"use strict";
var N = NS.net, P = NS.pkt;

var CLI_IP = '192.168.1.10', SRV_IP = '10.0.0.50';
var CLI_MAC = 'AA:AA:AA:AA:AA:AA', SRV_MAC = 'SS:SS:SS:SS:SS:SS';

/* UDP header মাত্র ৮ byte — TCP-র ২০-এর বিপরীতে */
function udpHdr(sp, dp, len){
  return {
    name:'UDP Header', layer:'L4', size:8,
    fields:[ ['srcPort', String(sp)], ['dstPort', String(dp)],
             ['ipLen', String(len + 8) + ' bytes'],
             ['fcs', 'checksum — নষ্ট হয়েছে কিনা তা ধরে, কিন্তু ঠিক করে না'] ]
  };
}
function dgram(n, sp, dp, text, lost){
  return P.make([
    P.ethernet(CLI_MAC, SRV_MAC, 'ip'),
    P.ip(CLI_IP, SRV_IP, 64, 'udp', 28 + text.length),
    udpHdr(sp, dp, text.length),
    P.data(text)
  ], { label:'#' + n + (lost ? ' ✗' : ''), kind:'data', from:'client', to:'server' });
}

NS.labs.udp = {
  id: 'udp',
  title: 'UDP — Fire and Forget',
  group: 'Phase 3 · Layer 4',
  chapter: 'ch23',
  blurb: 'কোনো handshake নেই, কোনো ACK নেই, কোনো ক্রম নেই। এবং সেটাই অনেক সময় ঠিক সিদ্ধান্ত।',

  learn: [
    'UDP ঠিক কী দেয় — এবং কী দেয় না',
    'Datagram আর byte-stream-এর পার্থক্য কোথায়',
    'Packet হারালে UDP কী করে (উত্তর: কিছুই না) এবং কেন সেটি কখনো কখনো ভালো',
    'কোন কাজে UDP আসলেই TCP-র চেয়ে ভালো'
  ],

  mistakes: [
    { m:'UDP মানে "অবিশ্বস্ত", তাই এটি নিম্নমানের বা অসম্পূর্ণ protocol।',
      r:'"Unreliable" এখানে গালি নয়, একটি **নকশার সিদ্ধান্ত**। UDP প্রতিশ্রুতি দেয় না, তাই সে কখনো আপনাকে অপেক্ষা করায় না। যেখানে দেরির চেয়ে হারানো কম ক্ষতিকর — voice call, live video, game — সেখানে এটিই সঠিক বাছাই।' },
    { m:'UDP-তে কোনো error detection নেই।',
      r:'UDP-তে **checksum আছে** — নষ্ট হয়ে যাওয়া datagram ধরা পড়ে এবং ফেলে দেওয়া হয়। যা নেই তা হলো **recovery** — সে ফেলে দেয়, কিন্তু আবার চায় না। "ধরতে পারা" আর "ঠিক করা" এক জিনিস নয়।' },
    { m:'UDP সবসময় TCP-র চেয়ে দ্রুত।',
      r:'একটি datagram একটি segment-এর চেয়ে দ্রুত ভ্রমণ করে না — একই network, একই গতি। UDP দ্রুত মনে হয় কারণ সে **অপেক্ষা করে না** — handshake নেই, হারানো Packet-এর জন্য থামে না, ক্রম মেলাতে buffer-এ বসে থাকে না।' }
  ],

  controls: [
    { key:'loss', type:'toggle', label:'একটি datagram হারিয়ে যাক', def:true,
      help:'হারালে UDP কী করে — এই প্রশ্নের উত্তরই এই lab-এর মূল কথা।' },
    { key:'app', type:'choice', label:'কোন application', def:'voice',
      options:[ ['voice','Voice Call — এক টুকরো শব্দ'],
                ['dns','DNS Query — একটি ছোট প্রশ্ন'] ] }
  ],

  build: function(cfg){
    var isDns = cfg && cfg.app === 'dns';
    return {
      devices: [
        N.pc('client', { name:'Client', x:18, y:50, mac:CLI_MAC, ip:CLI_IP }),
        N.server('server', { name: isDns ? 'DNS Server' : 'Voice Server',
                             x:82, y:50, mac:SRV_MAC, ip:SRV_IP,
                             listening:[{ port: isDns ? 53 : 5004,
                                          service: isDns ? 'DNS' : 'RTP', open:true }] })
      ],
      links: [ N.link('client','server') ],
      hub:null, wire:null, banner:null,
      sent:0, got:0, dropped:0
    };
  },

  script: function(s0, cfg){
    P.resetIds();
    var steps = [], t = 0;
    function at(){ return ++t; }
    var isDns = cfg.app === 'dns';
    var DP = isDns ? 53 : 5004, SP = 49152;

    steps.push({
      t:at(), actor:'client', layer:'L4', kind:'info',
      title:'কোনো handshake নেই — সরাসরি পাঠানো',
      what:'TCP হলে এখানে তিনটি Packet খরচ করে handshake করতে হতো। UDP-তে সেটির প্রয়োজনই নেই — প্রথম datagram-ই আসল data নিয়ে যাবে।',
      why : isDns
        ? 'একটি DNS query মাত্র কয়েক ডজন byte, উত্তরও তাই। এর জন্য তিনটি handshake Packet খরচ করা মানে **কাজের চেয়ে আনুষ্ঠানিকতা বেশি**।\n\nআর DNS-এর নিজস্ব একটি সহজ ব্যবস্থা আছে — উত্তর না এলে সে আবার জিজ্ঞেস করে। এইটুকুর জন্য TCP-র পুরো ব্যবস্থার দরকার নেই।'
        : 'Voice call-এ প্রতিটি মিলিসেকেন্ড দামি। Handshake-এর এক RTT মানে কথা শুরু হতে দেরি।\n\nআরও বড় কথা — TCP-র reliability এখানে **উল্টো ক্ষতি** করত। কেন, সেটি একটু পরেই দেখা যাবে।',
      apply: function(st){ st.banner = 'handshake ছাড়াই শুরু'; }
    });

    /* চারটি datagram; loss চালু থাকলে দ্বিতীয়টি হারাবে */
    var texts = isDns
      ? ['Q: example.com A?', 'Q: example.com A? (retry)', 'A: 93.184.216.34', 'done']
      : ['audio 0-20ms', 'audio 20-40ms', 'audio 40-60ms', 'audio 60-80ms'];
    var lostIdx = cfg.loss ? 1 : -1;

    for(var i = 0; i < 4; i++){
      (function(idx){
        var lost = idx === lostIdx;
        var p = dgram(idx + 1, SP, DP, texts[idx], lost);
        steps.push({
          t:at(), actor:'client', layer:'L4', kind: lost ? 'warn' : 'info',
          title:'Datagram #' + (idx + 1) + ' পাঠানো হলো' + (lost ? ' — হারিয়ে গেল' : ''),
          packet:p,
          what:'`' + texts[idx] + '` পাঠানো হলো।' +
               (lost ? '\n\n**পথে হারিয়ে গেল।** কোনো Router-এর queue ভরে গিয়েছিল।' : ''),
          why : lost
            ? 'এবার মূল প্রশ্ন — Client কি টের পেল?\n\n**না।** সে কোনো ACK আশা করছিল না, কোনো timer বসায়নি, কোনো হিসাব রাখেনি। তার কাছে এই datagram-টি পাঠানোর পরেই স্মৃতি থেকে মুছে গেছে।\n\nএটাই "fire and forget" — পাঠাও এবং ভুলে যাও।'
            : 'UDP header মাত্র **৮ byte** — source port, destination port, length, checksum। ব্যস।\n\nTCP-র ২০ byte-এ থাকে sequence number, ACK number, window, flag — এসব লাগে হিসাব রাখার জন্য। UDP হিসাব রাখে না, তাই জায়গাও লাগে না।\n\nHeader-এর এই ছোট আকারটাই আসলে পুরো দর্শনটির প্রতীক।',
          apply: function(st){
            st.wire = { pkt:p, from:'client', to:'server' };
            st.sent = st.sent + 1;
            if(lost) st.dropped = st.dropped + 1; else st.got = st.got + 1;
            st.banner = '#' + (idx + 1) + (lost ? ' হারাল' : ' পৌঁছাল');
          }
        });
      })(i);
    }

    steps.push({
      t:at(), actor:'client', layer:'L4', kind: cfg.loss ? 'warn' : 'ok',
      title: cfg.loss ? 'কোনো retransmission নেই' : 'চারটিই পৌঁছেছে',
      what: cfg.loss
        ? 'Client পরেরগুলো পাঠিয়েই গেছে। হারানো #২ নিয়ে সে কিছুই করেনি — কোনো duplicate ACK নেই, কোনো timeout নেই, কোনো retransmit নেই।'
        : 'কোনো ACK ছাড়াই চারটি datagram পৌঁছে গেল। কোনো অপেক্ষা হয়নি।',
      why : cfg.loss
        ? 'TCP হলে এখানে থেমে যেত — হারানো segment আবার পাঠাত, আর সেটি না পৌঁছানো পর্যন্ত পরের data application-কে দিত না (Head-of-Line Blocking)।\n\nUDP তার কিছুই করেনি। ভালো না খারাপ, সেটি নির্ভর করে application কী চায় তার উপর।'
        : 'হারানো না ঘটলে UDP-র সরলতা সম্পূর্ণ লাভ। কোনো অপচয় নেই।\n\nএবার `একটি datagram হারিয়ে যাক` চালু করে দেখুন — হারালে কী হয়, আর সেটি কার জন্য সমস্যা।',
      apply: function(st){ st.wire = null; st.banner = cfg.loss ? '#2 চিরতরে হারাল' : 'সব পৌঁছেছে'; }
    });

    if(cfg.loss){
      steps.push({
        t:at(), actor:'server', layer:'L7', kind: isDns ? 'ok' : 'warn',
        title: isDns ? 'DNS নিজেই আবার জিজ্ঞেস করল' : 'Voice — ২০ মিলিসেকেন্ড শব্দ হারাল',
        what: isDns
          ? 'উত্তর না পেয়ে DNS client কিছুক্ষণ পর **নিজেই** আবার query পাঠাল। এটি UDP করেনি — করেছে DNS নিজে।'
          : 'শ্রোতা ২০ মিলিসেকেন্ডের একটি ছোট্ট ফাঁক শুনল — সামান্য একটু খচখচ শব্দ, ব্যস।',
        why : isDns
          ? 'এখানে একটি গুরুত্বপূর্ণ কথা: reliability একেবারে অদৃশ্য হয়ে যায় না — সে শুধু **অন্য স্তরে সরে যায়**।\n\nDNS নিজের প্রয়োজন মতো একটি সহজ retry বসিয়ে নিয়েছে: উত্তর না এলে আবার জিজ্ঞেস করো। এটুকুই তার দরকার।\n\nTCP ব্যবহার করলে সে পেত sequence number, window, congestion control — যার একটিও একটি প্রশ্ন-উত্তরের জন্য দরকার ছিল না।\n\nএজন্যই বলা হয় UDP আসলে একটি **ভিত্তি** — যার উপর application নিজের প্রয়োজন মতো ঠিক ততটুকু ব্যবস্থা গড়ে নেয়, তার বেশি নয়।'
          : '**এখানেই UDP বাছার আসল কারণ।**\n\nভাবুন TCP ব্যবহার করলে কী হতো। সে হারানো টুকরোটি আবার চাইত, আর সেটি না আসা পর্যন্ত পরের সব শব্দ **আটকে রাখত**।\n\nফলে ২০ms-এর ফাঁকের বদলে শ্রোতা পেত কয়েকশো মিলিসেকেন্ডের একটি নীরবতা, তারপর হঠাৎ সব শব্দ একসাথে — কথোপকথন অসম্ভব হয়ে যেত।\n\nআর সবচেয়ে বড় কথা: **ওই ২০ms শব্দ ততক্ষণে অপ্রাসঙ্গিক**। যে মুহূর্তে সেটি বাজার কথা ছিল সেটি পেরিয়ে গেছে। দেরিতে আসা শব্দ আর কোনো কাজেই লাগে না।\n\nতাই এখানে হারানোই ভালো। "না পাঠানো" এখানে একটি সঠিক সিদ্ধান্ত।',
        apply: function(st){
          st.banner = isDns ? 'DNS নিজে retry করল' : '20ms ফাঁক — কথা চলতেই থাকল';
        }
      });
    }

    steps.push({
      t:at(), actor:'server', layer:'L4', kind:'ok',
      title:'Datagram-এর সীমানা অক্ষত থাকে',
      what:'Server ঠিক যতগুলো datagram পৌঁছেছে, ততগুলো আলাদা টুকরো হিসেবেই পেল। একটি ' + (isDns ? 'query' : 'audio টুকরো') + ' পাঠালে সে ঠিক একটিই পড়ে।',
      why :'এটি TCP-র সাথে একটি সূক্ষ্ম কিন্তু বড় পার্থক্য।\n\nTCP একটি **byte-stream** — সীমানা বলে কিছু নেই। আপনি তিনবার `write()` করলে receiver একবারেই সবটুকু পড়তে পারে, অথবা এক `write()`-এর অংশ দুবারে পেতে পারে। তাই TCP-তে আপনাকে নিজেই বার্তার সীমানা ঠিক করতে হয় — দৈর্ঘ্য লিখে দিয়ে, বা বিশেষ চিহ্ন দিয়ে।\n\nUDP একটি **datagram** protocol — এক `send()` মানে ঠিক এক `recv()`। সীমানা নিজেই রক্ষিত।\n\nএই সুবিধাটির কথা প্রায়ই ভুলে যাওয়া হয়। যেসব বার্তার নিজস্ব সীমানা আছে (একটি DNS query, একটি log line, একটি metric), তাদের জন্য এটি খুব স্বাভাবিক একটি মিল।',
      apply: function(st){ st.wire = null; st.banner = 'datagram সীমানা অক্ষত'; }
    });

    return steps;
  }
};

})(window.NetLab);

(function(NS){
"use strict";
var N = NS.net, P = NS.pkt;

var CLI_IP = '192.168.1.10', SRV_IP = '10.0.0.50';
var CLI_MAC = 'AA:AA:AA:AA:AA:AA', SRV_MAC = 'SS:SS:SS:SS:SS:SS';

function udpHdr(sp, dp, len){
  return { name:'UDP Header', layer:'L4', size:8,
    fields:[ ['srcPort', String(sp)], ['dstPort', String(dp)],
             ['ipLen', String(len + 8) + ' bytes'],
             ['fcs', 'checksum — নষ্ট ধরা পড়ে, ঠিক হয় না'] ] };
}

NS.labs.tcpudp = {
  id: 'tcpudp',
  title: 'TCP vs UDP — পাশাপাশি',
  group: 'Phase 3 · Layer 4',
  chapter: 'ch24',
  blurb: 'একই ৩টি টুকরো data, একটি হারায়। TCP আর UDP দুজনে কী করে — মিলিয়ে দেখুন।',

  learn: [
    'একই ঘটনায় TCP আর UDP-র আচরণ ঠিক কোথায় আলাদা হয়',
    'Reliability-র দাম কী — সময়ে ও জটিলতায়',
    'কোন প্রশ্নটি জিজ্ঞেস করলে সঠিক protocol বাছা যায়',
    'কোনটি "ভালো" নয় — কোনটি কোন কাজের জন্য'
  ],

  mistakes: [
    { m:'গুরুত্বপূর্ণ data-র জন্য TCP, কম গুরুত্বপূর্ণের জন্য UDP।',
      r:'গুরুত্বের সাথে সম্পর্ক নেই — সম্পর্ক **সময়ের** সাথে। DNS query খুবই গুরুত্বপূর্ণ, তবু UDP-তে যায়। প্রশ্নটি হলো: "দেরিতে আসা data-টি কি এখনো কাজে লাগবে?" লাগলে TCP, না লাগলে UDP।' },
    { m:'UDP ব্যবহার করলে reliability পাওয়াই যায় না।',
      r:'পাওয়া যায় — কিন্তু আপনাকে **নিজে বানাতে হয়**, ঠিক যতটুকু দরকার ততটুকু। QUIC এটিই করেছে: UDP-র উপরে বসে নিজের retransmission ও ordering বানিয়েছে, কিন্তু TCP-র Head-of-Line Blocking ছাড়া।' },
    { m:'TCP ধীর, তাই performance দরকার হলে UDP।',
      r:'ভালো network-এ TCP-র overhead নগণ্য। TCP ধীর হয় তখনই যখন **Packet হারায়** — কারণ তখন সে অপেক্ষা করে। সমস্যাটি "TCP ধীর" নয়, সমস্যাটি "TCP অপেক্ষা করে"। যেখানে অপেক্ষা ক্ষতিকর সেখানেই কেবল UDP।' }
  ],

  controls: [
    { key:'proto', type:'choice', label:'কোন protocol', def:'tcp',
      options:[ ['tcp','TCP — হারালে আবার পাঠায়'],
                ['udp','UDP — হারালে ভুলে যায়'] ],
      help:'দুটিই চালিয়ে ধাপের সংখ্যা আর শেষ ফলাফল মিলিয়ে দেখুন।' }
  ],

  build: function(cfg){
    var isTcp = !cfg || cfg.proto !== 'udp';
    return {
      devices: [
        N.pc('client', { name:'Client', x:18, y:50, mac:CLI_MAC, ip:CLI_IP,
                         note: isTcp ? 'TCP' : 'UDP' }),
        N.server('server', { name:'Server', x:82, y:50, mac:SRV_MAC, ip:SRV_IP,
                             listening:[{ port: isTcp ? 80 : 5004,
                                          service: isTcp ? 'TCP' : 'UDP', open:true }],
                             note: isTcp ? 'TCP' : 'UDP' })
      ],
      links: [ N.link('client','server') ],
      hub:null, wire:null, banner:null,
      got:[], steps:0
    };
  },

  script: function(s0, cfg){
    P.resetIds();
    var steps = [], t = 0;
    function at(){ return ++t; }
    var isTcp = cfg.proto !== 'udp';
    var SP = 49152, DP = isTcp ? 80 : 5004;

    function mk(n, seq, label, kind){
      var layers = [
        P.ethernet(CLI_MAC, SRV_MAC, 'ip'),
        P.ip(CLI_IP, SRV_IP, 64, isTcp ? 'tcp' : 'udp', (isTcp ? 60 : 48))
      ];
      layers.push(isTcp ? P.tcp(SP, DP, seq, 1, 'PSH, ACK', 64240) : udpHdr(SP, DP, 20));
      layers.push(P.data('টুকরো ' + n));
      return P.make(layers, { label:label, kind:kind || 'data', from:'client', to:'server' });
    }
    function ackOf(no, dup){
      return P.make([
        P.ethernet(SRV_MAC, CLI_MAC, 'ip'),
        P.ip(SRV_IP, CLI_IP, 64, 'tcp', 40),
        P.tcp(DP, SP, 1, no, 'ACK', 65535)
      ], { label:'ACK ' + no + (dup ? ' dup' : ''), kind:'ack',
           from:'server', to:'client' });
    }

    /* TCP হলে আগে handshake — এটাই প্রথম পার্থক্য */
    if(isTcp){
      var syn = P.make([
        P.ethernet(CLI_MAC, SRV_MAC, 'ip'),
        P.ip(CLI_IP, SRV_IP, 64, 'tcp', 40),
        P.tcp(SP, DP, 0, 0, 'SYN', 64240)
      ], { label:'SYN', kind:'ack', from:'client', to:'server' });
      steps.push({
        t:at(), actor:'client', layer:'L4', kind:'info',
        title:'TCP: আগে handshake (৩টি Packet)', packet:syn,
        what:'কোনো data পাঠানোর আগেই SYN → SYN-ACK → ACK — তিনটি Packet এবং এক RTT সময়।',
        why :'এই খরচটি ছোট কাজের জন্য বড় হয়ে দাঁড়ায়।\n\nমাত্র ২০ byte পাঠাতে চাইলে ৩টি Packet আগে খরচ করতে হচ্ছে। UDP এই ধাপটি সম্পূর্ণ এড়িয়ে যায়।\n\nতবে connection বেশিক্ষণ চললে এই এককালীন খরচ নগণ্য হয়ে যায় — এজন্যই Keep-Alive এত গুরুত্বপূর্ণ।',
        apply: function(st){ st.wire = { pkt:syn, from:'client', to:'server' };
                             st.banner = 'handshake — data-র আগে ৩ Packet'; }
      });
    } else {
      steps.push({
        t:at(), actor:'client', layer:'L4', kind:'info',
        title:'UDP: কোনো handshake নেই',
        what:'প্রথম Packet-ই আসল data নিয়ে যাচ্ছে। কোনো প্রস্তুতি নেই।',
        why :'শূন্য setup খরচ। এক RTT বেঁচে গেল।\n\nএর একটি দামও আছে — Server জানেই না কেউ কথা বলতে আসছে। কোনো state নেই, কোনো connection নেই। প্রতিটি datagram সম্পূর্ণ স্বাধীন।',
        apply: function(st){ st.banner = 'সরাসরি data'; }
      });
    }

    /* তিনটি টুকরো, দ্বিতীয়টি হারায় — দুই protocol-এ একই ঘটনা */
    for(var i = 0; i < 3; i++){
      (function(n){
        var lost = n === 2;
        var p = mk(n, 1 + (n - 1) * 20, '#' + n + (lost ? ' ✗' : ''));
        steps.push({
          t:at(), actor:'client', layer:'L4', kind: lost ? 'warn' : 'info',
          title:'টুকরো ' + n + ' পাঠানো হলো' + (lost ? ' — হারিয়ে গেল' : ''), packet:p,
          what:'টুকরো ' + n + ' গেল।' + (lost ? '\n\n**পথে হারিয়ে গেল** — Router-এর queue ভরা ছিল।' : ''),
          why : lost
            ? 'ঘটনাটি দুই protocol-এই **হুবহু একই**। Network জানেই না উপরে কে বসে আছে — সে TCP আর UDP-র মধ্যে পার্থক্য করে না।\n\nপার্থক্য শুরু হয় এর **পরে** — কে কী প্রতিক্রিয়া দেখায় তা নিয়ে।'
            : (isTcp
                ? 'TCP প্রতিটি byte-এর হিসাব রাখছে — sequence number দিয়ে। পরে দরকার হলে ঠিক কোনটি হারিয়েছে বলতে পারবে।'
                : 'UDP কোনো হিসাব রাখছে না। পাঠিয়েই ভুলে যাচ্ছে। Header-এ sequence number-এর জায়গাই নেই।'),
          apply: function(st){
            st.wire = { pkt:p, from:'client', to:'server' };
            if(!lost) st.got = st.got.concat([n]);
            st.banner = '#' + n + (lost ? ' হারাল' : ' পৌঁছাল');
          }
        });

        if(isTcp && !lost){
          /* #২ হারানোয় cumulative ACK ২১-এই আটকে থাকে — ৩ পেলেও এগোতে পারে না */
          var expect = 21;
          var a = ackOf(expect, n === 3);
          steps.push({
            t:at(), actor:'server', layer:'L4', kind: n === 3 ? 'warn' : 'ok',
            title:'ACK ' + expect + (n === 3 ? ' — আবার একই (duplicate)' : ''), packet:a,
            what: n === 3
              ? 'Server টুকরো ৩ পেল, কিন্তু আবারও পাঠাল `ack=21` — কারণ ২ নম্বরের ফাঁকটি এখনো খালি।'
              : 'Server `ack=21` পাঠাল — "টুকরো ১ পেয়েছি"।',
            why : n === 3
              ? 'এই duplicate ACK-ই TCP-র সংকেত ব্যবস্থা। UDP-তে এমন কোনো সংকেত নেই, কারণ ACK-ই নেই।'
              : 'TCP প্রতিটি পাওয়া data-র স্বীকৃতি দেয়। এই স্বীকৃতির ধারা থেকেই সে বুঝতে পারে কী পৌঁছেছে আর কী পৌঁছায়নি।',
            apply: function(st){ st.wire = { pkt:a, from:'server', to:'client' };
                                 st.banner = 'ACK ' + expect; }
          });
        }
      })(i + 1);
    }

    /* ── এখানেই আসল পার্থক্য ── */
    if(isTcp){
      var rp = mk(2, 21, '#2 (আবার)');
      steps.push({
        t:at(), actor:'client', layer:'L4', kind:'ok',
        title:'TCP: হারানো টুকরো আবার পাঠাল', packet:rp,
        what:'Duplicate ACK দেখে Client বুঝল টুকরো ২ হারিয়েছে, এবং সেটি আবার পাঠাল।',
        why :'এই পুনরায় পাঠানোই TCP-র মূল প্রতিশ্রুতি। কিন্তু খেয়াল করুন এর **দাম**:\n\n• অতিরিক্ত সময় লেগেছে (অন্তত এক RTT)\n• ততক্ষণ পর্যন্ত টুকরো ৩ Server-এর buffer-এ **আটকে ছিল**, application পায়নি\n\nদ্বিতীয় খরচটিই বেশি গুরুতর — একটি টুকরোর জন্য পরেরগুলোও থেমে থাকল।',
        apply: function(st){ st.wire = { pkt:rp, from:'client', to:'server' };
                             st.got = st.got.concat([2]);
                             st.banner = 'retransmit #2'; }
      });
      steps.push({
        t:at(), actor:'server', layer:'L7', kind:'ok',
        title:'Application পেল তিনটিই — ঠিক ক্রমে',
        what:'Application পেল: `টুকরো ১`, `টুকরো ২`, `টুকরো ৩` — সম্পূর্ণ এবং সঠিক ক্রমে।\n\nমোট Packet লেগেছে: handshake ৩ + data ৪ + ACK ৩ = **১০টি**।',
        why :'TCP তার প্রতিশ্রুতি রেখেছে। Application কিছুই টের পায়নি — না হারানো, না retransmit, না অপেক্ষা।\n\nএটি ঠিক তখনই সঠিক বাছাই যখন **অসম্পূর্ণ data অর্থহীন**। অর্ধেক HTML দিয়ে কিছুই হয় না, ৯৯% ঠিক file নষ্ট file।\n\nএখন `UDP` চালিয়ে দেখুন — একই ঘটনায় সে কী করে, আর কয়টি Packet লাগে।',
        apply: function(st){ st.wire = null; st.banner = 'সম্পূর্ণ · ১০ Packet'; }
      });
    } else {
      steps.push({
        t:at(), actor:'server', layer:'L7', kind:'warn',
        title:'UDP: Application পেল দুটি — মাঝেরটি নেই',
        what:'Application পেল: `টুকরো ১`, `টুকরো ৩`। টুকরো ২ চিরতরে হারিয়ে গেছে।\n\nমোট Packet লেগেছে: **৩টি**।',
        why :'TCP-তে লেগেছিল ১০টি Packet, এখানে ৩টি। কোনো অপেক্ষা হয়নি, টুকরো ৩ সঙ্গে সঙ্গেই পৌঁছেছে।\n\n**কোনটি ভালো?** প্রশ্নটাই ভুল। উত্তর নির্ভর করে data-টি কী তার উপর:\n\n• এটি যদি একটি HTML file-এর অংশ হয় → বিপর্যয়। অসম্পূর্ণ page অর্থহীন।\n\n• এটি যদি ২০ms audio হয় → ঠিক আছে। শ্রোতা একটু খচখচ শুনল, কথোপকথন চলতে থাকল।\n\n• এটি যদি একটি game-এ খেলোয়াড়ের অবস্থান হয় → **ভালোই হয়েছে**। পরের update তো এসেই গেছে, আর সেটিই নতুন। পুরনো অবস্থান আবার চেয়ে কী লাভ?\n\nএই তৃতীয় উদাহরণটিই সবচেয়ে স্পষ্ট করে দেখায়: কখনো কখনো **হারানো data আবার চাওয়াটাই ভুল সিদ্ধান্ত**।',
        apply: function(st){ st.wire = null; st.banner = 'অসম্পূর্ণ · ৩ Packet'; }
      });
      steps.push({
        t:at(), actor:'client', layer:'L4', kind:'info',
        title:'বাছাইয়ের প্রশ্নটি',
        what:'সঠিক protocol বাছতে একটিই প্রশ্ন যথেষ্ট:\n\n**"দেরিতে আসা এই data-টি কি তখনো কাজে লাগবে?"**',
        why :'**লাগবে** → TCP। File, HTML, API response, database query — এসবের ক্ষেত্রে দেরি বিরক্তিকর, কিন্তু অসম্পূর্ণতা মারাত্মক।\n\n**লাগবে না** → UDP। Live audio, video, game state, metric — এখানে পুরনো data নতুন data-র চেয়ে খারাপ, তাই অপেক্ষা করার কোনো মানে হয় না।\n\nআর তৃতীয় একটি পথও আছে — **QUIC**। সে UDP-র উপরে বসে নিজের reliability বানিয়েছে, কিন্তু প্রতিটি stream-কে আলাদা রেখেছে। ফলে এক stream-এ Packet হারালে অন্য stream আটকায় না। TCP-র সবচেয়ে বড় দুর্বলতাটির উত্তর এখানেই।',
        apply: function(st){ st.banner = 'প্রশ্ন: দেরিতে এলে কি কাজে লাগবে?'; }
      });
    }

    return steps;
  }
};

  { id:'c3', name:'অন্য Computer', ip:'192.168.1.22', mac:'BB:BB:BB:BB:BB:02', port:49152, x:12, y:82 }
];

function seg(c, dp, flags, label, kind){
  return P.make([
    P.ethernet(c.mac, SRV_MAC, 'ip'),
    P.ip(c.ip, SRV_IP, 64, 'tcp', 40),
    P.tcp(c.port, dp, 1, 1, flags, 64240)
  ], { label:label, kind:kind || 'data', from:c.id, to:'server' });
}

        why :'এখানে একটি সূক্ষ্ম কিন্তু গুরুত্বপূর্ণ কথা আছে।\n\n**Listening socket** একটি port-এ একটিই থাকতে পারে। কারণ যদি দুটি থাকত, তাহলে নতুন connection এলে OS কাকে দেবে সেই সিদ্ধান্ত নিতে পারত না — দুজনেরই দাবি সমান।\n\nকিন্তু **connected socket** একই port-এ হাজারটা থাকতে পারে! কারণ তাদের প্রত্যেকের চারটি ঘরই ভরা, তাই কে কোনটি সেই প্রশ্নে কোনো অস্পষ্টতা নেই।\n\nএজন্যই `Address already in use` মানে network-এর সমস্যা নয় — এর মানে **আরেকটি process ইতিমধ্যে ওই দরজায় দাঁড়িয়ে আছে**। `ss -tlnp` দিয়ে দেখা যায় কে।\n\n(TIME_WAIT-এ থাকা পুরনো socket-এর জন্যও একই error আসতে পারে — সেটি `SO_REUSEADDR` দিয়ে সমাধান হয়।)',

    var socks = [];
    for(var i = 0; i < CLIENTS.length; i++){

        steps.push({
          t:at(), actor:c.id, layer:'L4', kind:'info',
          title:c.name + ' connect করল — source port ' + c.port, packet:p,

          why : idx === 0

      apply: function(st){ st.wire = null; st.banner = 'সীমা ≈ 28,000 (client-এর দিকে)'; }

(function(NS){
"use strict";
var N = NS.net, P = NS.pkt;

var CLI_IP = '192.168.1.10', CLI_MAC = 'AA:AA:AA:AA:AA:AA';
var RESOLVER = { ip:'8.8.8.8', mac:'RR:RR:RR:RR:RR:RR' };

/* DNS message-এর ভেতরটা — Inspector-এ দেখানোর জন্য */
function dnsMsg(qname, qtype, answer, kind){
  var f = [ ['payload', 'QNAME=' + qname + ' QTYPE=' + qtype] ];
  if(answer) f.push(['payload', 'ANSWER: ' + answer]);
  return { name:'DNS Message', layer:'L7', size: answer ? 90 : 40, fields:f };
}
function udpHdr(sp, dp){
  return { name:'UDP Header', layer:'L4', size:8,
    fields:[ ['srcPort', String(sp)], ['dstPort', String(dp)],
             ['ipLen', '48 bytes'], ['fcs','checksum'] ] };
}
function q(src, srcMac, dst, dstMac, qname, answer, label, from, to, kind){
  return P.make([
    P.ethernet(srcMac, dstMac, 'ip'),
    P.ip(src, dst, 64, 'udp', 76),
    udpHdr(answer ? 53 : 49152, answer ? 49152 : 53),
    dnsMsg(qname, 'A', answer)
  ], { label:label, kind:kind || 'data', from:from, to:to });
}

                               st.banner = 'iterative → ' + c.name; }
        });

        var back = q(c.ip, c.mac, RESOLVER.ip, RESOLVER.mac, NAME,
                     'Referral → ' + c.refIp, 'Referral', c.id, 'res', 'ack');
        steps.push({
          t:at(), actor:c.id, layer:'L7', kind:'warn',
          title:c.name + ': "আমি জানি না, ওদের জিজ্ঞেস করো"', packet:back,
          what:'`' + c.name + '` উত্তর দিতে পারল না। কিন্তু সে জানে কে পারবে — সে **' + c.ref + '**-এর ঠিকানা দিল: `' + c.refIp + '`।\n\nএকে বলে **Referral**।',
          why : idx === 0
            ? 'Root server-এর কাছে `www.example.com`-এর কোনো তথ্যই নেই — এবং সেটিই স্বাভাবিক। তার কাজ শুধু প্রতিটি TLD (`.com`, `.org`, `.net`, প্রতিটি দেশের নিজস্ব) কার দায়িত্বে তা মনে রাখা।\n\nএই ভাগাভাগিটাই DNS-কে বিশাল হতে দিয়েছে। Root-এর তালিকা ছোট ও প্রায় অপরিবর্তনীয়, অথচ তার নিচে কোটি কোটি নাম বসতে পারে।'
            : '`.com` TLD server কোটি কোটি `.com` domain-এর হিসাব রাখে — কিন্তু তাদের ভেতরের কিছুই জানে না। সে শুধু জানে `example.com`-এর দায়িত্ব কোন server-এর।\n\nএর অর্থ, `example.com`-এর মালিক নিজের ভেতরের যত নাম খুশি তৈরি করতে পারেন (`www`, `mail`, `api`, `blog`) — TLD-কে কিছুই জানাতে হয় না।\n\nএই স্বাধীনতাটিই DNS-এর সবচেয়ে বড় সাফল্য।',
          apply: function(st){ st.wire = { pkt:back, from:c.id, to:'res' };
                               st.banner = 'referral → ' + c.refIp; }
        });
      })(chain[i], i);
    }

    /* ── Authoritative ── */
    var aq = q(RESOLVER.ip, RESOLVER.mac, '199.43.135.53', 'R0:00:00:00:00:03',
               NAME, null, 'Query → Authoritative', 'res', 'auth');
    steps.push({
      t:at(), actor:'res', layer:'L7', kind:'info',
      title:'শেষ ধাপ — Authoritative server', packet:aq,
      what:'Resolver এবার আসল দায়িত্বপ্রাপ্ত server-কে জিজ্ঞেস করল।',
      why :'"Authoritative" মানে **চূড়ান্ত কর্তৃপক্ষ**। এই server-এর উত্তরই সত্য — সে অন্য কারো কাছ থেকে জেনে বলছে না, তথ্যটি তার নিজের।\n\n`example.com`-এর মালিক এই server-এই তাঁর record গুলো রাখেন। তিনি IP বদলালে এখানেই বদলে যায়, আর ধীরে ধীরে পুরো পৃথিবী নতুন উত্তর পেতে শুরু করে।',
      apply: function(st){ st.wire = { pkt:aq, from:'res', to:'auth' };
                           st.banner = 'authoritative-কে প্রশ্ন'; }
    });

    /* ── NXDOMAIN ── */
    if(cfg.result === 'nx'){
      var nx = q('199.43.135.53', 'R0:00:00:00:00:03', RESOLVER.ip, RESOLVER.mac,
                 NAME, 'NXDOMAIN', 'NXDOMAIN', 'auth', 'res', 'ack');
      steps.push({
        t:at(), actor:'auth', layer:'L7', kind:'error',
        title:'NXDOMAIN — এই নামটি নেই', packet:nx,
        what:'Authoritative server স্পষ্ট উত্তর দিল: **NXDOMAIN** — এই নামটির কোনো অস্তিত্ব নেই।',
        why :'এটি কিন্তু একটি **সফল** DNS lookup — উত্তরটাই "নেই"।\n\nআর এই উত্তরটি নির্ভরযোগ্য, কারণ যে দিয়েছে সে-ই এই domain-এর চূড়ান্ত কর্তৃপক্ষ। সে যদি বলে নেই, তাহলে নেই।\n\nবাস্তবে NXDOMAIN দেখলে প্রথমেই সন্দেহ করা উচিত **বানান ভুল**, অথবা DNS record টি এখনো তৈরি করা হয়নি।\n\nNXDOMAIN-ও cache হয় (negative caching) — যাতে একই ভুল নাম বারবার জিজ্ঞেস করে পুরো যাত্রাটি বারবার করতে না হয়।',
        apply: function(st){ st.wire = { pkt:nx, from:'auth', to:'res' };
                             st.banner = 'NXDOMAIN'; }
      });
      steps.push({
        t:at(), actor:'client', layer:'L7', kind:'error',
        title:'Browser: "এই ঠিকানা খুঁজে পাওয়া যায়নি"',
        what:'Resolver NXDOMAIN-টি Browser-কে জানাল। Browser দেখাল `DNS_PROBE_FINISHED_NXDOMAIN` জাতীয় একটি বার্তা।',
        why :'গুরুত্বপূর্ণ কথা — **কোনো connection চেষ্টাই হয়নি**। কোনো TCP handshake হয়নি, কোনো Packet ওই দিকে যায়ইনি।\n\nDNS ব্যর্থ হলে সবকিছু সেখানেই থেমে যায়, কারণ IP ছাড়া পরের কোনো ধাপ শুরুই করা যায় না।\n\nতাই debug করার সময় ক্রমটি মনে রাখা জরুরি: **আগে DNS, তারপর TCP, তারপর HTTP**। `dig` দিয়ে DNS ঠিক আছে কিনা দেখে নিলে অনেক সময় বাঁচে।',
        apply: function(st){ st.wire = null; st.banner = 'ব্যর্থ — নাম নেই'; }
      });
      return steps;
    }

    /* ── SERVFAIL ── */
    if(cfg.result === 'fail'){
      steps.push({
        t:at(), actor:'res', layer:'L7', kind:'warn',
        title:'Authoritative server কোনো উত্তর দিচ্ছে না',
        what:'Resolver অপেক্ষা করল, আবার জিজ্ঞেস করল, অন্য একটি nameserver-এও চেষ্টা করল। কোথাও থেকে কোনো উত্তর নেই।',
        why :'এটি NXDOMAIN থেকে সম্পূর্ণ আলাদা পরিস্থিতি।\n\nNXDOMAIN = "আমি নিশ্চিতভাবে জানি এই নাম নেই" — একটি **উত্তর**।\n\nএখানে = "আমি জানি না, জানার উপায়ও পাচ্ছি না" — উত্তরের **অনুপস্থিতি**।\n\nকারণ হতে পারে server বন্ধ, network-এ পৌঁছাচ্ছে না, বা Firewall আটকে দিচ্ছে।',
        apply: function(st){ st.wire = null; st.banner = 'কোনো উত্তর নেই…'; }
      });
      steps.push({
        t:at(), actor:'client', layer:'L7', kind:'error',
        title:'SERVFAIL — উত্তর পাওয়া গেল না',
        what:'Resolver হাল ছেড়ে **SERVFAIL** ফেরত দিল।',
        why :'দুটি ব্যর্থতার পার্থক্য মনে রাখা debugging-এ খুব কাজে দেয়:\n\n**NXDOMAIN** → নামটি সত্যিই নেই। বানান দেখুন, record তৈরি হয়েছে কিনা দেখুন।\n\n**SERVFAIL** → নামটি হয়তো আছে, কিন্তু জানা গেল না। Nameserver-এর অবস্থা দেখুন, তার দিকে পথ আছে কিনা দেখুন, DNSSEC যাচাই ব্যর্থ হচ্ছে কিনা দেখুন।\n\nSERVFAIL সাধারণত **সাময়িক**, NXDOMAIN সাধারণত **স্থায়ী**।',
        apply: function(st){ st.wire = null; st.banner = 'SERVFAIL'; }
      });
      return steps;
    }

    /* ── সফল উত্তর ── */
    var ans = q('199.43.135.53', 'R0:00:00:00:00:03', RESOLVER.ip, RESOLVER.mac,
                NAME, NAME + ' A ' + IP + ' (TTL 300)', 'A ' + IP, 'auth', 'res', 'ack');
    steps.push({
      t:at(), actor:'auth', layer:'L7', kind:'ok',
      title:'উত্তর পাওয়া গেল — A record', packet:ans,
      what:'Authoritative server উত্তর দিল:\n\n`' + NAME + ' A ' + IP + '` — সাথে `TTL 300`।',
      why :'**A record** মানে "এই নামের জন্য একটি IPv4 Address"। (IPv6-এর জন্য AAAA।)\n\nসাথের **TTL 300** সংখ্যাটি খুব গুরুত্বপূর্ণ — এর মানে "এই উত্তরটি ৩০০ সেকেন্ড পর্যন্ত ধরে রাখতে পারো"।\n\nএই একটিমাত্র সংখ্যা DNS-এর ভার বহুগুণ কমিয়ে দেয়। এটি না থাকলে প্রতিটি প্রশ্নের জন্য পুরো Root→TLD→Authoritative যাত্রা করতে হতো।\n\nTTL কত রাখা হবে সেটি একটি সিদ্ধান্ত: বড় TTL মানে কম ভার কিন্তু পরিবর্তনে দেরি; ছোট TTL মানে দ্রুত পরিবর্তন কিন্তু বেশি প্রশ্ন।',
      apply: function(st){ st.wire = { pkt:ans, from:'auth', to:'res' };
                           st.banner = 'A ' + IP + ' · TTL 300'; }
    });

    var fin = q(RESOLVER.ip, RESOLVER.mac, CLI_IP, CLI_MAC, NAME,
                NAME + ' A ' + IP, 'A ' + IP, 'res', 'client', 'ack');
    steps.push({
      t:at(), actor:'res', layer:'L7', kind:'ok',
      title:'Resolver উত্তরটি cache করল, তারপর Browser-কে দিল', packet:fin,
      what:'Resolver উত্তরটি নিজের cache-এ ৩০০ সেকেন্ডের জন্য রেখে দিল, তারপর Browser-কে পাঠাল।\n\nBrowser-এর কাছে এটি ছিল **একটি প্রশ্ন, একটি উত্তর** — মাঝের চারটি যাত্রার কিছুই সে দেখেনি।',
      why :'পেছনে ফিরে গুনে দেখুন — Root, TLD, Authoritative মিলিয়ে **অন্তত তিনটি আলাদা RTT** খরচ হয়েছে।\n\nএজন্যই প্রথমবার কোনো site খুলতে DNS-এ কয়েকশো মিলিসেকেন্ড লাগতে পারে।\n\nকিন্তু এখন উত্তরটি cache-এ আছে। পরের বার — শুধু আপনার জন্য নয়, **এই resolver ব্যবহার করা সবার জন্য** — উত্তর আসবে প্রায় সঙ্গে সঙ্গে।\n\nএই cache-এর কার্যকারিতাই DNS-কে বাস্তবে ব্যবহারযোগ্য করে তুলেছে। DNS Cache lab-এ এর ভালো ও খারাপ দুই দিকই দেখা যাবে।',
      apply: function(st){
        st.wire = { pkt:fin, from:'res', to:'client' };
        var c = {}; c[NAME] = { ip:IP, ttl:300 };
        st.cache = c; st.answer = IP;
        for(var d = 0; d < st.devices.length; d++){
          if(st.devices[d].id === 'res') st.devices[d].note = 'cache: 1';
          if(st.devices[d].id === 'client') st.devices[d].note = IP;
        }
        st.banner = 'Browser পেল ' + IP;
      }
    });

    var http = P.make([
      P.ethernet(CLI_MAC, 'WW:WW:WW:WW:WW:WW', 'ip'),
      P.ip(CLI_IP, IP, 64, 'tcp', 40),
      P.tcp(49152, 80, 1000, 0, 'SYN', 64240)
    ], { label:'SYN → ' + IP, kind:'ack', from:'client', to:'web' });

    steps.push({
      t:at(), actor:'client', layer:'L4', kind:'ok',
      title:'এবার আসল কাজ শুরু — TCP handshake', packet:http,
      what:'IP হাতে আসার পর Browser এতক্ষণে **আসল** connection শুরু করল — `' + IP + '`-এ একটি SYN।',
      why :'এই ধাপটি মনে রাখার মতো, কারণ এটি একটি সাধারণ ভুল ধারণা ভাঙে।\n\nDNS আর HTTP **সম্পূর্ণ আলাদা দুটি কথোপকথন**, আলাদা protocol, আলাদা server, প্রায়ই আলাদা transport (DNS-এ UDP, HTTP-তে TCP)।\n\nDNS server আপনার page দেয় না। সে শুধু ঠিকানা দিয়েছে, তারপর তার কাজ শেষ।\n\nএই আলাদা হওয়ার কারণেই debug-এ ধাপে ধাপে এগোনো যায় — `dig` দিয়ে DNS পরীক্ষা করা, তারপর `curl` দিয়ে HTTP। এক ধাপ ঠিক থাকলে পরের ধাপে যাওয়া যায়।',
      apply: function(st){ st.wire = { pkt:http, from:'client', to:'web' };
                           st.banner = 'DNS শেষ · HTTP শুরু'; }
    });

    return steps;
  }
};

(function(NS){
"use strict";
var N = NS.net, P = NS.pkt;

var CLI_IP = '192.168.1.10', CLI_MAC = 'AA:AA:AA:AA:AA:AA';
var NAME = 'www.example.com', OLD_IP = '93.184.216.34', NEW_IP = '93.184.216.99';

function dnsPkt(src, dst, label, answer, from, to, kind){
  return P.make([
    P.ethernet(from === 'client' ? CLI_MAC : 'RR:RR:RR:RR:RR:RR',
               from === 'client' ? 'RR:RR:RR:RR:RR:RR' : CLI_MAC, 'ip'),
    P.ip(src, dst, 64, 'udp', 76),
    { name:'UDP Header', layer:'L4', size:8,
      fields:[ ['srcPort', from === 'client' ? '49152' : '53'],
               ['dstPort', from === 'client' ? '53' : '49152'],
               ['ipLen','48 bytes'], ['fcs','checksum'] ] },
    { name:'DNS Message', layer:'L7', size:40,
      fields: answer ? [['payload','ANSWER: ' + answer]]
                     : [['payload','QNAME=' + NAME + ' QTYPE=A']] }
  ], { label:label, kind:kind || 'data', from:from, to:to });
}

      r:'কিছুই "ছড়ায়" না। Authoritative server-এ পরিবর্তন হয় **সঙ্গে সঙ্গে**। দেরিটা হলো পুরনো উত্তরগুলোর **cache-এ মেয়াদ ফুরানোর অপেক্ষা**। শব্দটিই বিভ্রান্তিকর — এটি ছড়ানো নয়, ভুলে যাওয়া।' },
    { m:'DNS cache শুধু ISP-র resolver-এ থাকে।',
      r:'অন্তত চারটি স্তরে cache হয় — Browser-এর নিজের cache, OS-এর cache, Router-এর cache, তারপর Resolver-এর cache। প্রতিটির মেয়াদ আলাদা। এজন্যই সহকর্মী নতুন site দেখছেন অথচ আপনি পুরনোটাই দেখছেন।' },
    { m:'TTL কম রাখাই সবসময় ভালো।',
      r:'TTL কম মানে বেশি বেশি DNS query — বেশি ভার, প্রতিটি query-তে বাড়তি latency। স্বাভাবিক সময়ে বড় TTL (ঘণ্টা) ভালো। কিন্তু পরিকল্পিত পরিবর্তনের **আগে** TTL কমিয়ে রাখলে পরিবর্তনটি দ্রুত কার্যকর হয়।' }
  ],

  controls: [
    { key:'scene', type:'choice', label:'দৃশ্য', def:'hit',
      options:[ ['hit','Cache Hit — দ্বিতীয়বার জিজ্ঞেস'],
                ['change','IP বদলে গেল — কিন্তু cache পুরনো'],
                ['lowttl','ছোট TTL — migration-এর প্রস্তুতি'] ] }
  ],

  build: function(){
    return {
      devices: [
        N.pc('client', { name:'Browser', x:20, y:50, mac:CLI_MAC, ip:CLI_IP,
                         note:'cache খালি' }),
        N.server('res', { name:'Resolver', x:50, y:50, mac:'RR:RR:RR:RR:RR:RR',
                          ip:'8.8.8.8',
                          listening:[{ port:53, service:'DNS', open:true }],
                          note:'cache খালি' }),
        N.server('auth', { name:'Authoritative', x:82, y:50, mac:'R0:00:00:00:00:03',
                           ip:'199.43.135.53',
                           listening:[{ port:53, service:'DNS', open:true }],
                           note:'A ' + OLD_IP })
      ],
      links: [ N.link('client','res'), N.link('res','auth') ],
      hub:null, wire:null, banner:null,
      cache:null, ttl:0, authIp:OLD_IP, served:null
    };
  },

  script: function(s0, cfg){
    P.resetIds();
    var steps = [], t = 0;
    function at(){ return ++t; }
    var TTL = cfg.scene === 'lowttl' ? 60 : 3600;
    function note(st, id, txt){
      for(var i = 0; i < st.devices.length; i++)
        if(st.devices[i].id === id) st.devices[i].note = txt;
    }

    /* ── ১ম বার: cache miss ── */
    var q1 = dnsPkt(CLI_IP, '8.8.8.8', 'Query (1st)', null, 'client', 'res');
    steps.push({
      t:at(), actor:'client', layer:'L7', kind:'info',
      title:'প্রথমবার জিজ্ঞেস — Cache Miss', packet:q1,
      what:'Browser `' + NAME + '` চাইল। কোথাও cache-এ নেই — না Browser-এ, না OS-এ, না Resolver-এ।',
      why :'Cache Miss মানে পুরো যাত্রাটি করতে হবে: Root → TLD → Authoritative।\n\nএটিই সবচেয়ে ধীর পথ — অন্তত তিনটি RTT। বাস্তবে এতে ১০০-৩০০ মিলিসেকেন্ড লেগে যেতে পারে।\n\nআর এই সময়টুকু page load-এর **একেবারে শুরুতে**, তাই ব্যবহারকারী সরাসরি টের পান।',
      apply: function(st){ st.wire = { pkt:q1, from:'client', to:'res' };
                           st.banner = 'cache miss — পুরো যাত্রা লাগবে'; }
    });

    var a1 = dnsPkt('199.43.135.53', '8.8.8.8', 'A ' + OLD_IP + ' TTL ' + TTL,
                    NAME + ' A ' + OLD_IP + ' (TTL ' + TTL + ')', 'res', 'client', 'ack');
    steps.push({
      t:at(), actor:'auth', layer:'L7', kind:'ok',
      title:'উত্তর এলো — TTL ' + TTL + ' সেকেন্ড', packet:a1,
      what:'Authoritative server দিল `A ' + OLD_IP + '`, TTL `' + TTL + '` সেকেন্ড।\n\nResolver এটি cache করে রাখল, Browser-ও নিজের cache-এ রাখল।',
      why : cfg.scene === 'lowttl'
        ? 'এবার TTL মাত্র **' + TTL + ' সেকেন্ড** — ইচ্ছাকৃতভাবে ছোট রাখা হয়েছে।\n\nএর মানে প্রতি মিনিটে cache-এর মেয়াদ শেষ হবে এবং আবার জিজ্ঞেস করতে হবে। বেশি query, বেশি ভার।\n\nকিন্তু এর বিনিময়ে একটি বড় সুবিধা — IP বদলালে সেটি এক মিনিটের মধ্যেই সবার কাছে পৌঁছে যাবে।'
        : 'TTL মানে "এই উত্তরটি কতক্ষণ পর্যন্ত ব্যবহার করা যাবে"। এখানে `' + TTL + '` সেকেন্ড = ' + (TTL / 60) + ' মিনিট।\n\nএই সময়টুকুতে যেই এই নামটি চাইবে, তাকে **আর জিজ্ঞেস করতে হবে না** — cache থেকেই পাবে।\n\nএখানে একটি সুন্দর ব্যাপার আছে: একজনের প্রথম প্রশ্নের ফল হাজার হাজার মানুষের কাজে লাগে, কারণ তারা সবাই একই resolver ব্যবহার করছে।',
      apply: function(st){
        st.wire = { pkt:a1, from:'res', to:'client' };
        st.cache = OLD_IP; st.ttl = TTL; st.served = OLD_IP;
        note(st, 'res', 'cached ' + TTL + 's'); note(st, 'client', OLD_IP);
        st.banner = 'cached ' + OLD_IP + ' · TTL ' + TTL;
      }
    });

    /* ── Cache Hit ── */
    if(cfg.scene === 'hit'){
      var q2 = dnsPkt(CLI_IP, '8.8.8.8', 'Query (2nd)', null, 'client', 'res');
      steps.push({
        t:at(), actor:'client', layer:'L7', kind:'ok',
        title:'দ্বিতীয়বার — Browser-এর নিজের cache-এই পাওয়া গেল', packet:q2,
        what:'Browser আবার `' + NAME + '` চাইল। এবার **কোনো Packet পাঠাতেই হলো না** — উত্তর তার নিজের cache-এই ছিল।\n\nসময় লাগল প্রায় **শূন্য**।',
        why :'প্রথম স্তরের cache-ই সবচেয়ে দ্রুত, কারণ সেখানে network স্পর্শই করতে হয় না।\n\nCache-এর স্তরগুলো ক্রমানুসারে:\n\n`Browser cache` → `OS cache` → `Router cache` → `Resolver cache` → `Authoritative`\n\nপ্রতিটি স্তর তার আগেরটির চেয়ে ধীর, কিন্তু বেশি নির্ভরযোগ্য। প্রশ্ন যত নিচে নামে, উত্তর তত তাজা — আর তত দেরি।',
        apply: function(st){ st.wire = null; st.banner = 'cache hit · ~0 ms'; }
      });
      steps.push({
        t:at(), actor:'res', layer:'L7', kind:'ok',
        title:'অন্য ব্যবহারকারীরাও দ্রুত পাচ্ছেন',
        what:'একই resolver ব্যবহার করা অন্য হাজার হাজার মানুষও এখন সঙ্গে সঙ্গে উত্তর পাচ্ছেন — যদিও তাঁরা কেউ প্রথম প্রশ্নটি করেননি।',
        why :'এই ভাগাভাগিটাই DNS-কে টিকিয়ে রেখেছে।\n\nভাবুন cache না থাকলে কী হতো — পৃথিবীর প্রতিটি click-এর জন্য `.com` TLD server-এ একটি করে query যেত। কোনো server সেই ভার নিতে পারত না।\n\nCache-এর কারণে প্রকৃত query-র সংখ্যা কয়েক হাজার গুণ কমে যায়।\n\nকিন্তু এই দ্রুততার একটি দাম আছে — পরের দৃশ্যে সেটিই দেখা যাবে।',
        apply: function(st){ st.banner = 'একজনের প্রশ্ন · সবার লাভ'; }
      });
      return steps;
    }

    /* ── IP বদলে গেল ── */
    steps.push({
      t:at(), actor:'auth', layer:'L7', kind:'warn',
      title:'Server migrate হলো — IP বদলে গেল',
      what:'`example.com`-এর মালিক নতুন server-এ চলে গেলেন। Authoritative server-এ record বদলে দেওয়া হলো:\n\n`' + OLD_IP + '` → **`' + NEW_IP + '`**\n\nএই পরিবর্তনটি হয়েছে **সঙ্গে সঙ্গে**।',
      why :'এখানে "propagation" শব্দটির ভুল ধারণাটি ভাঙা দরকার।\n\nকিছুই কোথাও **ছড়িয়ে পড়ছে না**। Authoritative server-এ পরিবর্তনটি তাৎক্ষণিক, এবং সে-ই একমাত্র সত্যের উৎস।\n\nযে দেরিটা হবে, সেটি সম্পূর্ণ ভিন্ন জিনিস — পৃথিবীজুড়ে ছড়িয়ে থাকা cache গুলোতে **পুরনো উত্তরটি এখনো বসে আছে**, এবং তাদের মেয়াদ ফুরানোর অপেক্ষা করতে হবে।\n\nএটি ছড়ানোর দেরি নয়, **ভুলে যাওয়ার** দেরি।',
      apply: function(st){
        st.authIp = NEW_IP;
        note(st, 'auth', 'A ' + NEW_IP + ' (নতুন)');
        st.banner = 'authoritative-এ নতুন IP · সঙ্গে সঙ্গে';
      }
    });

    steps.push({
      t:at(), actor:'client', layer:'L7', kind:'error',
      title:'কিন্তু Browser এখনো পুরনো IP-তেই যাচ্ছে',
      what:'Browser আবার `' + NAME + '` চাইল। Cache-এ TTL এখনো বাকি, তাই সে **পুরনো** `' + OLD_IP + '`-ই দিল।\n\nAuthoritative server-কে জিজ্ঞেসই করা হলো না।',
      why :'এবং এটি একটি bug নয় — cache **ঠিক যা করার কথা তাই করছে**। TTL বলেছিল "' + TTL + ' সেকেন্ড ধরে রাখো", সে ধরে রেখেছে।\n\nএই কারণেই migration-এর সময় অদ্ভুত অবস্থা তৈরি হয় — কিছু ব্যবহারকারী নতুন server দেখছেন, কিছু পুরনোটা। কারও cache খালি ছিল, কারও ছিল না।\n\nএজন্যই migration-এর সময় **পুরনো server কিছুক্ষণ চালু রাখা** জরুরি। TTL সময় পার না হওয়া পর্যন্ত সেখানে traffic আসতেই থাকবে।',
      apply: function(st){
        st.served = OLD_IP;
        st.banner = 'পুরনো IP পরিবেশিত হচ্ছে · cache বৈধ';
      }
    });

    if(cfg.scene === 'lowttl'){
      steps.push({
        t:at(), actor:'res', layer:'L7', kind:'ok',
        title:'TTL মাত্র ' + TTL + 's — এক মিনিটেই মেয়াদ শেষ',
        what:'ছোট TTL হওয়ায় cache-এর মেয়াদ দ্রুত ফুরাল। Resolver আবার জিজ্ঞেস করল এবং **নতুন** IP পেল।',
        why :'এখানেই migration-এর আসল কৌশলটি:\n\n**পরিবর্তনের অন্তত এক TTL আগে** TTL কমিয়ে দিন (যেমন ৩৬০০ → ৬০)।\n\nকেন আগে? কারণ পুরনো TTL-টিও তো cache-এ বসে আছে। ৩৬০০ সেকেন্ডের TTL সহ cache করা উত্তর জানেই না যে আপনি TTL বদলেছেন — তাকে নিজের মেয়াদ শেষ করতেই হবে।\n\nতাই ক্রমটি হয়:\n\n১. TTL কমান (৩৬০০ → ৬০)\n২. অন্তত পুরনো TTL সময় অপেক্ষা করুন\n৩. এবার IP বদলান — এক মিনিটেই সবাই নতুনটা পাবে\n৪. স্থিতিশীল হলে TTL আবার বাড়িয়ে দিন\n\nএই ছোট্ট পরিকল্পনাটি migration-এর দিনটিকে অনেক শান্ত করে দেয়।',
        apply: function(st){
          st.cache = NEW_IP; st.served = NEW_IP;
          note(st, 'res', 'cached ' + NEW_IP); note(st, 'client', NEW_IP);
          st.banner = 'নতুন IP · এক মিনিটেই';
        }
      });
      return steps;
    }

    steps.push({
      t:at(), actor:'res', layer:'L7', kind:'warn',
      title:'অপেক্ষা — TTL ' + TTL + ' সেকেন্ড ফুরানোর',
      what:'Cache-এ TTL ' + TTL + ' সেকেন্ড (' + (TTL / 60) + ' মিনিট)। এই পুরো সময়টা কিছু ব্যবহারকারী পুরনো server-এই যেতে থাকবেন।',
      why :'"DNS propagation-এ ২৪-৪৮ ঘণ্টা লাগে" — এই কথাটি এখান থেকেই এসেছে, এবং এটি বহুলাংশে ভুল।\n\nআসল কথাটি হলো: **সবচেয়ে বড় TTL যতটা, ততটা সময়**। TTL এক ঘণ্টা হলে এক ঘণ্টা। ২৪ ঘণ্টা হলে ২৪ ঘণ্টা।\n\n(কিছু resolver নিয়ম না মেনে বেশিক্ষণ ধরে রাখে, তাই বাস্তবে কিছুটা বেশি সময় লাগতে পারে।)\n\nএর ব্যবহারিক ফল দুটি:\n\n• পুরনো server তখনই বন্ধ করুন যখন TTL সময় পার হয়েছে\n• পরিকল্পিত পরিবর্তনের আগে TTL কমিয়ে রাখুন — `ছোট TTL` দৃশ্যে দেখুন কীভাবে',
      apply: function(st){ st.banner = 'অপেক্ষা · ' + TTL + 's'; }
    });

    steps.push({
      t:at(), actor:'client', layer:'L7', kind:'ok',
      title:'মেয়াদ শেষ — এবার নতুন IP',
      what:'TTL ফুরাল। পরের প্রশ্নে cache-এ কিছু নেই, তাই আবার জিজ্ঞেস করা হলো — এবং এবার এলো নতুন `' + NEW_IP + '`।',
      why :'সব cache শেষ পর্যন্ত সত্যে ফিরে আসে। শুধু নিজের নিজের সময় নেয়।\n\nএই পুরো ব্যবস্থাটি একটি সচেতন আপস: **তাজা তথ্য বনাম গতি**।\n\nTTL সেই আপসের নিয়ন্ত্রক। বড় TTL = দ্রুত ও হালকা, কিন্তু পরিবর্তনে ধীর। ছোট TTL = পরিবর্তনে দ্রুত, কিন্তু বেশি ভার।\n\nএকই আপস আরও অনেক জায়গায় দেখা যাবে — HTTP cache-এ, CDN-এ, ARP cache-এও। প্রশ্নটি সবসময় একই: "পুরনো তথ্য কতক্ষণ সহ্য করা যায়?"',
      apply: function(st){
        st.cache = NEW_IP; st.served = NEW_IP;
        note(st, 'res', 'cached ' + NEW_IP); note(st, 'client', NEW_IP);
        st.banner = 'নতুন IP · migration সম্পূর্ণ';
      }
    });

    return steps;
  }
};

})(window.NetLab);

  build: function(){

  script: function(s0, cfg){
    P.resetIds();
    var steps = [], t = 0;
    function at(){ return ++t; }
    var CODE = cfg.status;

    var syn = P.make([
      P.ethernet(CLI_MAC, SRV_MAC, 'ip'),
      P.ip(CLI_IP, SRV_IP, 64, 'tcp', 40),
      P.tcp(49152, 80, 0, 0, 'SYN', 64240)
    ], { label:'SYN', kind:'ack', from:'client', to:'server' });

    steps.push({
      t:at(), actor:'client', layer:'L4', kind:'info',
      title:'আগে TCP connection — HTTP তার উপরে বসে', packet:syn,
      what:'HTTP-র কোনো কথা শুরু হওয়ার আগেই একটি TCP connection তৈরি করতে হয় — SYN, SYN-ACK, ACK।',
      why :'HTTP নিজে **কোনো delivery-র দায়িত্ব নেয় না**। সে ধরে নেয় নিচে একটি নির্ভরযোগ্য byte-stream আছে যেখানে সে লিখলেই অন্য পাশে ঠিক ক্রমে পৌঁছে যাবে।\n\nহারানো Packet, retransmit, ক্রম মেলানো — HTTP এসবের কিছুই জানে না। সবটা TCP সামলায়।\n\nএই দায়িত্ব ভাগাভাগিটাই layered নকশার সবচেয়ে বড় সুবিধা। HTTP তার নিজের কাজে মন দিতে পারে — অর্থাৎ, "কী চাই আর কী পেলাম" এই আলাপটুকু।',
      apply: function(st){ st.wire = { pkt:syn, from:'client', to:'server' };
                           st.conns = 1; st.banner = 'TCP connection তৈরি হচ্ছে'; }
    });

    var reqText = 'GET /index.html HTTP/1.1\nHost: example.com\nUser-Agent: Mozilla/5.0\n' +
                  'Accept: text/html\nConnection: ' + (cfg.keepalive ? 'keep-alive' : 'close');
    var req = httpPkt('client', reqText, 'GET /index.html');

    steps.push({
      t:at(), actor:'client', layer:'L7', kind:'info',
      title:'HTTP Request — শুধু কয়েক লাইন text', packet:req,
      what:'Browser যা পাঠাল তা আসলে এইটুকুই:\n\n`GET /index.html HTTP/1.1`\n`Host: example.com`\n`User-Agent: Mozilla/5.0`\n`Connection: ' + (cfg.keepalive ? 'keep-alive' : 'close') + '`',
      why :'প্রথম লাইনটিই মূল কথা — **method** (`GET` — আমি পড়তে চাই), **path** (`/index.html` — কোনটি), **version** (`HTTP/1.1`)।\n\nএরপর header গুলো, প্রতিটি `নাম: মান` আকারে।\n\n`Host` header-টি বিশেষভাবে গুরুত্বপূর্ণ। একই IP-তে শতাধিক website থাকতে পারে (virtual hosting) — server কীভাবে বুঝবে আপনি কোনটি চাইছেন? এই header দেখে। HTTP/1.1-এ এটি **বাধ্যতামূলক**, আর এই একটি header-ই আধুনিক shared hosting-কে সম্ভব করেছে।',
      apply: function(st){ st.wire = { pkt:req, from:'client', to:'server' };
                           st.reqs = 1; st.banner = 'GET /index.html'; }
    });

    var RESP = {
      '200': { line:'200 OK', body:'<html>…',
        title:'200 OK — এই নাও',
        what:'Server উত্তর দিল `HTTP/1.1 200 OK`, তারপর header গুলো, একটি খালি লাইন, তারপর আসল HTML।',
        why:'`2xx` মানে **সফল**। যা চেয়েছিলেন তা পেয়েছেন।\n\nউত্তরের গঠনটি request-এর মতোই: একটি status line, কিছু header, একটি খালি লাইন, তারপর body।\n\nওই **খালি লাইনটি** গুরুত্বপূর্ণ — সেটিই header-এর শেষ আর body-র শুরুর সীমানা। আর `Content-Length` header বলে দেয় body কত byte, যাতে receiver জানে কোথায় থামতে হবে।\n\nমনে রাখবেন TCP একটি সীমানাহীন byte-stream — তাই HTTP-কে নিজেই নিজের সীমানা এঁকে নিতে হয়।' },
      '404': { line:'404 Not Found', body:'<html>Not Found</html>',
        title:'404 Not Found — এমন কিছু নেই',
        what:'Server বলল `HTTP/1.1 404 Not Found`। সে request-টি বুঝেছে, কিন্তু ওই path-এ কিছু নেই।',
        why:'`4xx` মানে **client-এর দিকের সমস্যা**। Server ঠিকঠাক চলছে, কিন্তু আপনার চাওয়াটিতে ভুল আছে।\n\nকাছাকাছি code গুলো আলাদা কথা বলে:\n\n`400` — request-এর গঠনই ভুল\n`401` — আপনি কে তা জানা নেই (login করুন)\n`403` — আপনি কে জানি, কিন্তু অনুমতি নেই\n`404` — এমন কিছু নেই\n`429` — বড্ড বেশি চাইছেন, একটু থামুন\n\nলক্ষ্য করুন — 404 এলেও **connection সফল হয়েছে**। DNS কাজ করেছে, TCP handshake হয়েছে, HTTP আলাপ হয়েছে। শুধু চাওয়া জিনিসটি নেই। এটি network-এর সমস্যা নয়।' },
      '301': { line:'301 Moved Permanently', body:'',
        title:'301 Moved — অন্য ঠিকানায় যান',
        what:'Server বলল `301 Moved Permanently` এবং একটি `Location: https://example.com/new` header দিল।\n\nকোনো body নেই — শুধু নতুন ঠিকানা।',
        why:'`3xx` মানে **অন্য কোথাও দেখুন**। Browser নিজে থেকেই সেই নতুন ঠিকানায় গিয়ে আবার request পাঠাবে।\n\n`301` আর `302`-এর পার্থক্যটি ব্যবহারিকভাবে বড়:\n\n`301` **স্থায়ী** — browser এটি cache করে রাখে। পরের বার সে সরাসরি নতুন ঠিকানায় যাবে, পুরনোটিতে আর আসবেই না।\n\n`302` **সাময়িক** — প্রতিবার আগে পুরনো ঠিকানাতেই আসবে।\n\nএই পার্থক্যটি ভুল করলে ভোগান্তি হয়। ভুল করে ৩০১ দিলে ব্যবহারকারীর browser সেটি মনে রাখে, আর আপনি সহজে সেটি ফেরাতে পারেন না।\n\nHTTP থেকে HTTPS-এ পাঠানোর জন্য 301 খুব সাধারণ ব্যবহার।' },
      '500': { line:'500 Internal Server Error', body:'<html>Error</html>',
        title:'500 — server-এর নিজের সমস্যা',
        what:'Server বলল `500 Internal Server Error`। আপনার request-এ কোনো ভুল ছিল না — সমস্যাটি ওদের দিকে।',
        why:'`5xx` মানে **server-এর দোষ**। আপনি সঠিক জিনিস সঠিকভাবেই চেয়েছিলেন।\n\n`500` — কোডে কোথাও একটি অপ্রত্যাশিত ত্রুটি\n`502` — Proxy তার পেছনের server থেকে আজেবাজে উত্তর পেয়েছে\n`503` — Server সাময়িকভাবে অক্ষম (ভিড়, বা maintenance)\n`504` — Proxy অপেক্ষা করতে করতে হাল ছেড়েছে\n\nDebugging-এ এই শ্রেণিভাগটি **প্রথম প্রশ্নের উত্তর দিয়ে দেয়: দোষ কার দিকে?**\n\n`4xx` দেখলে আপনার request দেখুন। `5xx` দেখলে server-এর log দেখুন। `502`/`504` দেখলে সন্দেহ করুন — সমস্যা সম্ভবত proxy-র পেছনের service-এ।' }
    };
    var R = RESP[CODE];

    var respText = 'HTTP/1.1 ' + R.line + '\nContent-Type: text/html\n' +
                   'Content-Length: ' + (R.body.length || 0) + '\n' +
                   'Connection: ' + (cfg.keepalive ? 'keep-alive' : 'close') +
                   (R.body ? '\n\n' + R.body : '');
    var resp = httpPkt('server', respText, R.line,
                       CODE === '200' ? 'ack' : 'data');

    steps.push({
      t:at(), actor:'server', layer:'L7',
      kind: CODE === '200' ? 'ok' : CODE === '301' ? 'warn' : 'error',
      title:R.title, packet:resp,
      what:R.what, why:R.why,
      apply: function(st){ st.wire = { pkt:resp, from:'server', to:'client' };
                           st.status = CODE; st.banner = R.line; }
    });

    /* ── Stateless ── */
    steps.push({
      t:at(), actor:'client', layer:'L7', kind:'info',
      title:'দ্বিতীয় Request — Server কিছুই মনে রাখেনি',
      what:'একই connection-এ দ্বিতীয় request পাঠানো হলো। কিন্তু Server-এর কাছে এটি সম্পূর্ণ **নতুন একজন**।\n\nপ্রথম request-এর কোনো স্মৃতি তার নেই।',
      why :'এটাই **stateless** — HTTP-র একটি মৌলিক সিদ্ধান্ত। প্রতিটি request নিজের পায়ে দাঁড়ানো, স্বয়ংসম্পূর্ণ।\n\nতাহলে login কাজ করে কীভাবে?\n\nউত্তরটি সুন্দর — **স্মৃতিটি আপনার কাছে থাকে, server-এর কাছে নয়**। Server একবার আপনাকে একটি Cookie দেয়, আর আপনার browser সেটি প্রতিটি request-এ ফেরত পাঠায়। Server সেই Cookie দেখে আপনাকে চেনে।\n\nএই নকশার একটি বিশাল লাভ আছে: যেকোনো server যেকোনো request সামলাতে পারে, কারণ কোনো server-এ বিশেষ কিছু জমা নেই। এজন্যই একটি site-এর পেছনে ১০০টি server রাখা যায় — load balancer আপনাকে যে কোনোটিতে পাঠাতে পারে।\n\nStateless না হলে আধুনিক scaling কার্যত অসম্ভব হতো।',
      apply: function(st){ st.wire = null; st.reqs = 2; st.banner = 'stateless — নতুন request'; }
    });

    /* ── Keep-Alive ── */
    if(cfg.keepalive){
      steps.push({
        t:at(), actor:'client', layer:'L4', kind:'ok',
        title:'Keep-Alive — একই connection আবার ব্যবহার',
        what:'`Connection: keep-alive` থাকায় TCP connection-টি খোলাই আছে। দ্বিতীয় request-এ **কোনো নতুন handshake লাগেনি**।\n\nমোট connection: **১টি**, request: **২টি**।',
        why :'একটি সাধারণ web page-এ ৫০-১০০টি জিনিস থাকে — CSS, JS, ছবি, font।\n\nপ্রতিটির জন্য নতুন connection খুললে প্রতিবার তিনটি handshake Packet আর এক RTT খরচ হতো। HTTPS হলে TLS handshake-ও যোগ হতো — আরও দুই RTT।\n\nKeep-Alive এই পুরো খরচটি **একবারেই** সীমাবদ্ধ করে দেয়।\n\nএর একটি বাড়তি সুবিধাও আছে: TCP-র congestion window ধীরে ধীরে বড় হয় (slow start)। Connection পুনর্ব্যবহার করলে সেই বড় window-টাও ধরে রাখা যায়, তাই পরের transfer গুলো শুরু থেকেই দ্রুত।\n\nHTTP/1.1 থেকে Keep-Alive **default** — এটি এতটাই গুরুত্বপূর্ণ।',
        apply: function(st){ st.banner = '১ connection · ২ request'; }
      });
    } else {
      steps.push({
        t:at(), actor:'client', layer:'L4', kind:'warn',
        title:'Connection: close — আবার পুরো handshake',

        apply: function(st){ st.conns = 2; st.banner = '২ connection · ২ request'; }

  }

(function(NS){

var N = NS.net, P = NS.pkt;

var CLI_IP = '192.168.1.10', SRV_IP = '93.184.216.34';
var CLI_MAC = 'AA:AA:AA:AA:AA:AA', SRV_MAC = 'SS:SS:SS:SS:SS:SS';

function tlsPkt(from, name, text, label, kind){
  return P.make([
    P.ethernet(from === 'client' ? CLI_MAC : SRV_MAC,
               from === 'client' ? SRV_MAC : CLI_MAC, 'ip'),
    P.ip(from === 'client' ? CLI_IP : SRV_IP,
         from === 'client' ? SRV_IP : CLI_IP, 64, 'tcp', 40 + text.length),
    P.tcp(from === 'client' ? 49152 : 443, from === 'client' ? 443 : 49152,
          1, 1, 'PSH, ACK', 64240),
    { name:name, layer:'L7', size:text.length, fields:[ ['payload', text] ] }
  ], { label:label, kind:kind || 'data', from:from,
       to: from === 'client' ? 'server' : 'client' });
}

    steps.push({
      t:at(), actor:'client', layer:'L7', kind:'ok',

      what:'Browser তিনটি জিনিস মিলিয়ে দেখল:\n\n**১.** সইকারী CA-টি কি আমার বিশ্বাসের তালিকায় আছে? ✓\n**২.** Certificate-এর নাম কি `example.com`? ✓\n**৩.** মেয়াদ কি এখনো আছে? ✓',
      why :'তিনটিই একসাথে মিলতে হয়।\n\nএখানে বিশ্বাসের ভিত্তিটি কোথায় সেটি একবার ভেবে দেখার মতো — আপনার browser-এর (বা OS-এর) ভেতরে **আগে থেকেই** কয়েকশো CA-র public key বসানো আছে। এদের বলে root store।\n\nএই তালিকাটিই পুরো ব্যবস্থার ভিত্তি। আর এটিই তার সবচেয়ে দুর্বল জায়গাও — একটি CA যদি ভুল বা অসৎভাবে কাউকে certificate দিয়ে দেয়, browser সেটি বিশ্বাস করবে।\n\nএই ঝুঁকি কমাতে **Certificate Transparency** নামের একটি ব্যবস্থা এসেছে — সব ইস্যু করা certificate একটি প্রকাশ্য খাতায় লিখে রাখা হয়, যাতে কেউ চুপিচুপি আপনার domain-এর নামে certificate নিতে না পারে।',

    steps.push({

      what:'দুই পাশ নিজেদের key share বিনিময় করেছিল। এখন **প্রত্যেকে নিজের দিকে আলাদাভাবে** একই গোপন চাবি হিসাব করে বের করল।\n\nচাবিটি **কখনো network-এ যায়নি**।',
      why :'এটাই TLS-এর সবচেয়ে চমৎকার ধারণা, আর প্রথমে অসম্ভব মনে হয়।\n\nসরল একটি উপমা: ভাবুন দুজন মানুষ প্রকাশ্যে রঙ বিনিময় করছেন। প্রত্যেকের কাছে একটি গোপন রঙ আছে, আর একটি সাধারণ রঙ সবাই জানে। প্রত্যেকে নিজের গোপন রঙ সাধারণ রঙের সাথে মিশিয়ে ফলাফলটি পাঠায়।\n\nএবার প্রত্যেকে অন্যজনের পাঠানো মিশ্রণে **নিজের গোপন রঙ** আবার মেশায়। দুজনের হাতে একই চূড়ান্ত রঙ তৈরি হয়!\n\nকিন্তু যে আড়ি পেতে ছিল, সে শুধু মিশ্রণ দুটি দেখেছে। মিশ্রণ থেকে মূল রঙ আলাদা করা তার পক্ষে সম্ভব নয়।\n\n(আসলটি রঙ নয়, গণিত — Diffie-Hellman key exchange। কিন্তু ধারণাটি ঠিক এই।)\n\nএর একটি বড় ফল আছে: server-এর private key পরে ফাঁস হয়ে গেলেও **আজকের কথোপকথন পড়া যাবে না**, কারণ আজকের চাবিটি সেই key থেকে তৈরি হয়নি। একে বলে **Forward Secrecy**।',
      apply: function(st){ st.banner = 'গোপন চাবি তৈরি · পাঠানো হয়নি'; }

    var enc = tlsPkt('client', 'TLS Application Data',

      apply: function(st){

  { id:'pc3', name:'Tablet',  ip:'192.168.1.12', mac:'AA:AA:AA:AA:AA:03', sp:51000, np:60003, y:78 }

function pkt(sIp, sMac, dIp, dMac, sp, dp, label, from, to, kind){
  return P.make([
    P.ethernet(sMac, dMac, 'ip'),
    P.ip(sIp, dIp, 64, 'tcp', 60),
    P.tcp(sp, dp, 1, 1, 'PSH, ACK', 64240)
  ], { label:label, kind:kind || 'data', from:from, to:to });
}

        what:'Router তার NAT Table-এ খুঁজল: "port ৮০-এর জন্য ভেতরে কে?"\n\nকোনো entry নেই। তাই Packet-টি **ফেলে দিল**।',
        why :'এখানে সূক্ষ্ম কিন্তু গুরুত্বপূর্ণ কথাটি হলো — Router Packet-টি **আটকায়নি**, সে **জানেই না কোথায় পাঠাবে**।\n\nতার ভেতরে তিনটি device আছে। Packet-টি কার জন্য? কোনো তথ্য নেই।\n\nNAT Table-এর entry তৈরি হয় **ভেতর থেকে বাইরে** যাওয়ার সময়। ভেতরের কেউ কখনো এই বাইরের ঠিকানায় কথা বলেনি, তাই কোনো entry-ও নেই।\n\nএই আচরণের ফলে বাইরের অযাচিত connection ঢোকে না — যা নিরাপত্তার দিক থেকে সুবিধাজনক।\n\nকিন্তু এটিকে **Firewall বলা ভুল হবে**। Firewall নিয়ম দেখে সিদ্ধান্ত নেয় — "এটি অনুমোদিত নয়"। NAT বলে — "আমি জানি না কাকে দেব"। দুটি সম্পূর্ণ ভিন্ন জিনিস, যদিও ফলাফল কাছাকাছি।\n\nএই আচরণটিই peer-to-peer application-এর জন্য বড় বাধা — দুই পাশই NAT-এর পেছনে থাকলে কেউ কারো কাছে পৌঁছাতে পারে না। STUN, TURN, hole punching — এসব কৌশল এই সমস্যা সমাধানের চেষ্টা।',
        apply: function(st){ st.wire = null; st.banner = 'drop — table-এ entry নেই'; }
      });
      return steps;
    }

    /* ── Port Forwarding ── */
    if(cfg.dir === 'fwd'){
      steps.push({
        t:at(), actor:'nat', layer:'L4', kind:'info',
        title:'Port Forwarding — হাতে লেখা একটি স্থায়ী নিয়ম',
        what:'Router-এ একটি নিয়ম বসানো হয়েছে:\n\n`' + PUB + ':80` → `192.168.1.10:80`\n\nএটি স্বয়ংক্রিয়ভাবে তৈরি হয়নি — মানুষ হাতে লিখে দিয়েছে।',
        why :'এটিই সেই অনুপস্থিত তথ্যটি সরবরাহ করে।\n\nএতক্ষণ Router জানত না বাইরের Packet কাকে দেবে। এই নিয়মটি সেই প্রশ্নের একটি **স্থায়ী উত্তর** — "৮০ নম্বর port-এ যা আসবে, সব Laptop-কে দাও"।\n\nএজন্যই বাড়িতে game server বা NAS চালাতে গেলে port forwarding সেট করতে হয়। ভেতরের machine-টি প্রস্তুত থাকলেও Router-কে পথ দেখিয়ে দিতে হয়।\n\nএর একটি নিরাপত্তা দিকও আছে — এই একটি নিয়ম লিখে আপনি আপনার ভেতরের একটি machine-কে পুরো Internet-এর সামনে খুলে দিলেন। তাই সেই machine-টির নিজস্ব সুরক্ষা এখন অনেক বেশি গুরুত্বপূর্ণ।',
        apply: function(st){
          st.table = [{ pub:PUB + ':80', priv:'192.168.1.10:80', kind:'static' }];
          note(st, 'nat', 'forward :80 → .10');
          st.banner = 'port forward সেট করা আছে';
        }
      });
      var f1 = pkt(SRV_IP, SRV_MAC, PUB, RMAC_OUT, 40000, 80,
                   '→ ' + PUB + ':80', 'web', 'nat');
      steps.push({
        t:at(), actor:'web', layer:'L4', kind:'info',
        title:'বাইরে থেকে Packet এলো', packet:f1,
        what:'Internet থেকে `' + PUB + ':80`-এ একটি Packet এলো।',
        why :'আগের দৃশ্যে এটি ফেলে দেওয়া হয়েছিল। এবার Router-এর কাছে একটি নিয়ম আছে, তাই ফল ভিন্ন হবে।',
        apply: function(st){ st.wire = { pkt:f1, from:'web', to:'nat' };
                             st.banner = 'বাইরে থেকে :80'; }
      });
      var f2 = pkt(SRV_IP, RMAC_IN, '192.168.1.10', HOSTS[0].mac, 40000, 80,
                   '→ 192.168.1.10:80', 'nat', 'pc1');
      steps.push({
        t:at(), actor:'nat', layer:'L4', kind:'ok',
        title:'নিয়ম অনুযায়ী ভেতরে পাঠানো হলো', packet:f2,
        what:'Router destination IP বদলে দিল:\n\n`' + PUB + ':80` → `192.168.1.10:80`\n\nতারপর Packet-টি Laptop-কে দিল।',
        why :'লক্ষ্য করুন এবার **destination** বদলাচ্ছে — একে বলে DNAT (Destination NAT)।\n\nস্বাভাবিক NAT-এ বদলায় **source** — SNAT। ভেতর থেকে বাইরে গেলে source লুকাতে হয়; বাইরে থেকে ভেতরে এলে destination খুঁজে দিতে হয়।\n\nএকই ধারণা load balancer-এও কাজ করে — সে একটি public IP-তে আসা traffic-কে ভেতরের অনেকগুলো server-এর মধ্যে ভাগ করে দেয়। প্রতিবার destination বদলে।',
        apply: function(st){ st.wire = { pkt:f2, from:'nat', to:'pc1' };
                             st.banner = 'DNAT → 192.168.1.10'; }
      });
      return steps;
    }

    /* ── ভেতর থেকে বাইরে — মূল দৃশ্য ── */
    var table = [];
    for(var i = 0; i < HOSTS.length; i++){
      (function(h, idx){
        var p1 = pkt(h.ip, h.mac, SRV_IP, RMAC_IN, h.sp, 80,
                     h.ip + ':' + h.sp, h.id, 'nat');
        steps.push({
          t:at(), actor:h.id, layer:'L3', kind:'info',
          title:h.name + ' বাইরে যেতে চাইছে — source ' + h.ip + ':' + h.sp, packet:p1,
          what:'`' + h.name + '` (`' + h.ip + '`) web server-এ যেতে চাইছে। Source port `' + h.sp + '`।',
          why : idx === 0
            ? '`192.168.1.10` একটি **private IP**। এই ধরনের ঠিকানা (`10.x`, `172.16-31.x`, `192.168.x`) Internet-এ route হয় না — কোনো Router এদের এগিয়ে দেবে না।\n\nকারণটি সহজ: এই একই ঠিকানা কোটি কোটি বাড়িতে ব্যবহার হচ্ছে। উত্তর ফেরত পাঠাতে হলে কোন `192.168.1.10`-এ পাঠাবে?\n\nতাই বাইরে যেতে হলে ঠিকানা বদলাতেই হবে।'
            : idx === 2
              ? 'এই device-টির source port `' + h.sp + '` — আগের দুজনের চেয়ে আলাদা।\n\nকিন্তু এটি নিছক কাকতালীয়, আর সেটাই আসল কথা। আগের দুজন তো একই port বেছে ফেলেছিল।\n\nRouter আগে থেকে জানতে পারে না কে কোন port বাছবে। তাই তাকে **সবসময়** নিজের একটি অনন্য port বসিয়ে দিতে হয় — মিল হোক বা না হোক।'
              : '**গুরুত্বপূর্ণ:** এই device-টিও source port `' + h.sp + '` বেছেছে — Laptop-এর মতোই একই সংখ্যা!\n\nএতে কোনো ভুল নেই। তারা আলাদা computer, একে অপরের কথা জানে না, তাই একই port বাছতেই পারে।\n\nকিন্তু এখন সমস্যা — বাইরে গেলে দুজনেরই source হবে `' + PUB + '` আর port হবে `' + h.sp + '`। তখন উত্তর এলে Router কীভাবে বুঝবে কোনটি কার?\n\nএজন্যই NAT-কে **port-ও বদলাতে হয়**।',
          apply: function(st){ st.wire = { pkt:p1, from:h.id, to:'nat' };
                               st.banner = h.ip + ':' + h.sp + ' → বাইরে'; }
        });

        table.push({ priv: h.ip + ':' + h.sp, pub: PUB + ':' + h.np });
        var snap = table.slice();
        var p2 = pkt(PUB, RMAC_OUT, SRV_IP, SRV_MAC, h.np, 80,
                     PUB + ':' + h.np, 'nat', 'web');
        steps.push({
          t:at(), actor:'nat', layer:'L3', kind:'ok',
          title:'NAT: ' + h.ip + ':' + h.sp + ' → ' + PUB + ':' + h.np, packet:p2,
          what:'Router দুটি জিনিস বদলাল:\n\n• Source IP: `' + h.ip + '` → `' + PUB + '`\n• Source Port: `' + h.sp + '` → `' + h.np + '`\n\nআর এই জোড়াটি তার **NAT Table**-এ লিখে রাখল।',
          why : idx === HOSTS.length - 1
            ? 'পুরো table-টি এখন এমন:\n\n`192.168.1.10:49152` ↔ `' + PUB + ':60001`\n`192.168.1.11:49152` ↔ `' + PUB + ':60002`\n`192.168.1.12:51000` ↔ `' + PUB + ':60003`\n\n**এই table-টিই NAT-এর পুরো রহস্য।** বাইরের দুনিয়া শুধু একটি IP দেখে, কিন্তু প্রতিটি connection-এর একটি অনন্য port আছে।\n\nআর port ১৬ bit — অর্থাৎ ৬৫,৫৩৫টি সম্ভাব্য মান। তাই একটি public IP দিয়ে হাজার হাজার connection সামলানো যায়।\n\nএই কৌশলটিই IPv4-কে টিকিয়ে রেখেছে। ১৯৯০-এর দশকে ঠিকানা ফুরিয়ে যাওয়ার আশঙ্কা করা হয়েছিল, কিন্তু NAT সেই সংকট বহু বছর পিছিয়ে দিয়েছে।'
            : 'এই দুটি ঘর একসাথে লেখা থাকাই মূল কথা — `(private IP, private port)` ↔ `(public IP, public port)`।\n\nএই entry না থাকলে উত্তর ফিরে এলে Router সম্পূর্ণ অসহায় হয়ে যেত।',
          apply: function(st){
            st.wire = { pkt:p2, from:'nat', to:'web' };
            st.table = snap;
            note(st, 'nat', snap.length + ' entry');
            st.banner = 'NAT → ' + PUB + ':' + h.np;
          }
        });
      })(HOSTS[i], i);
    }

    /* ── উত্তর ফেরত ── */
    var h0 = HOSTS[1];
    var r1 = pkt(SRV_IP, SRV_MAC, PUB, RMAC_OUT, 80, h0.np,
                 '→ ' + PUB + ':' + h0.np, 'web', 'nat', 'ack');
    steps.push({
      t:at(), actor:'web', layer:'L3', kind:'info',
      title:'উত্তর এলো — কিন্তু ' + PUB + '-এ, কারো নামে নয়', packet:r1,
      what:'Web server উত্তর পাঠাল `' + PUB + ':' + h0.np + '`-এ।\n\nসে জানেই না ভেতরে তিনটি device আছে। তার কাছে পুরো বাড়িটি একটিমাত্র computer।',
      why :'বাইরের কেউ কখনো আপনার ভেতরের গঠন দেখতে পায় না। তিনটি device না ত্রিশটি — বাইরে থেকে বোঝার কোনো উপায় নেই।\n\nএটি একদিক থেকে গোপনীয়তার সুবিধা। তবে মনে রাখবেন, এটি নকশার একটি পার্শ্বফল — উদ্দেশ্য ছিল ঠিকানা বাঁচানো, গোপনীয়তা নয়।',
      apply: function(st){ st.wire = { pkt:r1, from:'web', to:'nat' };
                           st.banner = 'উত্তর → ' + PUB + ':' + h0.np; }
    });

    var r2 = pkt(SRV_IP, RMAC_IN, h0.ip, h0.mac, 80, h0.sp,
                 '→ ' + h0.ip + ':' + h0.sp, 'nat', h0.id, 'ack');
    steps.push({
      t:at(), actor:'nat', layer:'L3', kind:'ok',
      title:'Table দেখে সঠিক device-এ পাঠানো হলো', packet:r2,
      what:'Router destination port `' + h0.np + '` দেখে table-এ খুঁজল, পেল `' + h0.ip + ':' + h0.sp + '`।\n\nতারপর ঠিকানা ফিরিয়ে দিয়ে `' + h0.name + '`-কে Packet দিল।',
      why :'**Port-টিই এখানে ঠিকানার কাজ করছে।**\n\nএটি খুব ছোট একটি ধারণা, কিন্তু এর উপরেই পুরো ব্যবস্থাটি দাঁড়িয়ে। ৬৫,৫৩৫টি port মানে ৬৫,৫৩৫টি সম্ভাব্য "ভেতরের ঠিকানা"।\n\nএখান থেকেই NAT-এর সীমাবদ্ধতাগুলোও বোঝা যায়:\n\n• Table-এর entry-র একটি **মেয়াদ** আছে। বহুক্ষণ চুপ থাকলে entry মুছে যায়, connection ভেঙে যায়। এজন্যই অনেক application মাঝে মাঝে keep-alive Packet পাঠায়।\n\n• কোনো protocol যদি নিজের data-র ভেতরে IP Address লিখে রাখে (পুরনো FTP-র মতো), তাহলে NAT সেটি বদলাতে পারে না — ভেতরের ঠিকানাটি ভুল থেকে যায়।\n\n• দুই পাশই NAT-এর পেছনে থাকলে সরাসরি সংযোগ কঠিন হয়ে পড়ে।\n\nIPv6-তে এই সমস্যাগুলো নেই, কারণ ঠিকানা এত বেশি যে NAT-এর দরকারই পড়ে না।',
      apply: function(st){ st.wire = { pkt:r2, from:'nat', to:h0.id };
                           st.banner = '→ ' + h0.name; }
    });

    return steps;
  }
};

/* ═══════════════════════════════════════════════════════════════════
   LAB · Firewall — নিয়ম মিলিয়ে সিদ্ধান্ত
   ═══════════════════════════════════════════════════════════════════ */
(function(NS){
"use strict";
var N = NS.net, P = NS.pkt;

var OUT_IP = '203.0.113.99', OUT_MAC = 'CC:CC:CC:CC:CC:CC';
var FW_MAC = 'FF:FF:FF:FF:FF:01', SRV_MAC = 'SS:SS:SS:SS:SS:SS';
var SRV_IP = '10.0.0.20';

/* একটি সহজ, ক্রমানুসারে পড়া rule set — উপরের নিয়ম আগে জেতে */
var RULES = [
  { n:1, act:'ALLOW', port:443, proto:'tcp', from:'any',        note:'HTTPS সবার জন্য খোলা' },
  { n:2, act:'ALLOW', port:80,  proto:'tcp', from:'any',        note:'HTTP সবার জন্য খোলা' },
  { n:3, act:'ALLOW', port:22,  proto:'tcp', from:'10.0.0.0/8', note:'SSH শুধু ভেতরের network থেকে' },
  { n:4, act:'DENY',  port:'*', proto:'*',   from:'any',        note:'বাকি সব বন্ধ' }
];

function pkt(sIp, dIp, dp, label, from, to, kind){
  return P.make([
    P.ethernet(from === 'out' ? OUT_MAC : FW_MAC,
               from === 'out' ? FW_MAC  : SRV_MAC, 'ip'),
    P.ip(sIp, dIp, 64, 'tcp', 40),
    P.tcp(49152, dp, 1, 0, 'SYN', 64240)
  ], { label:label, kind:kind || 'data', from:from, to:to });
}

/* একটি Packet কোন নিয়মে আটকাবে — উপর থেকে নিচে, প্রথম মিলই চূড়ান্ত */
function match(port, srcIp){
  for(var i = 0; i < RULES.length; i++){
    var r = RULES[i];
    if(r.port !== '*' && r.port !== port) continue;
    if(r.from === '10.0.0.0/8' && srcIp.indexOf('10.') !== 0) continue;
    return r;
  }
  return RULES[RULES.length - 1];
}

  blurb: 'উপর থেকে নিচে নিয়ম পড়া হয়, প্রথম মিলটিই চূড়ান্ত। আর শেষ নিয়মটি প্রায় সবসময় "বাকি সব বন্ধ"।',

  learn: [

    'Default DENY কী এবং কেন এটিই নিরাপদ নকশা',
    'DROP আর REJECT-এর পার্থক্য — এবং কোনটি কখন',
    'Stateful Firewall কী — উত্তর ফিরে আসতে দেয় কীভাবে'
  ],

  mistakes: [
    { m:'নিয়মের ক্রম গুরুত্বপূর্ণ নয়, সব নিয়ম তো মিলিয়েই দেখা হয়।',
      r:'ক্রমই সবচেয়ে গুরুত্বপূর্ণ। **প্রথম যে নিয়মটি মেলে, সেটিই চূড়ান্ত** — নিচের নিয়ম আর পড়াই হয় না। একটি ভুল জায়গায় বসানো ALLOW নিচের সব DENY-কে অকেজো করে দিতে পারে।' },
    { m:'Port বন্ধ করা আর Packet ফেলে দেওয়া একই জিনিস।',
      r:'**REJECT** একটি উত্তর পাঠায় (RST বা ICMP), তাই প্রেরক সঙ্গে সঙ্গে জানতে পারে। **DROP** কিছুই বলে না, তাই প্রেরককে timeout পর্যন্ত অপেক্ষা করতে হয়। ভেতরের network-এ REJECT সুবিধাজনক (দ্রুত error), বাইরের দিকে DROP পছন্দ করা হয় (আক্রমণকারীকে কম তথ্য)।' },
    { m:'Firewall শুধু বাইরে থেকে ভেতরে আসা traffic দেখে।',
      r:'বাইরে যাওয়া traffic-ও দেখা যায় এবং প্রায়ই দেখা উচিত। ভেতরের কোনো machine যদি আক্রান্ত হয়, egress নিয়মই তাকে বাইরে data পাঠাতে বাধা দিতে পারে। বহু প্রতিষ্ঠান শুধু ingress নিয়ম লিখে egress ভুলে যায়।' }
  ],

  controls: [
    { key:'port', type:'choice', label:'কোন port-এ চেষ্টা', def:'443',
      options:[ ['443','443 (HTTPS) — অনুমোদিত'],
                ['22','22 (SSH) — শর্তসাপেক্ষ'],
                ['3306','3306 (MySQL) — অনুমোদিত নয়'] ] },
    { key:'inside', type:'toggle', label:'ভেতরের network থেকে আসছে', def:false,
      help:'SSH-এর নিয়মটি source দেখে — তাই এটি বদলালে ফল বদলায়।' },
    { key:'reject', type:'toggle', label:'DROP-এর বদলে REJECT', def:false,

  build: function(cfg){
    var inside = cfg && cfg.inside;
    return {
      devices: [
        N.pc('out', { name: inside ? 'ভেতরের PC' : 'বাইরের Client', x:14, y:50,
                      mac:OUT_MAC, ip: inside ? '10.0.0.55' : OUT_IP,
                      note: inside ? 'trusted' : 'untrusted' }),
        N.router('fw', { name:'Firewall', x:50, y:50,
          ifaces:[ { name:'wan', ip:'203.0.113.1', mac:FW_MAC, mask:'255.255.255.0' },
                   { name:'lan', ip:'10.0.0.1',    mac:FW_MAC, mask:'255.0.0.0' } ],
          routes:[ { dst:'10.0.0.0', prefix:8, via:'', iface:'lan' } ],
          note:RULES.length + ' rule' }),
        N.server('srv', { name:'Server', x:86, y:50, mac:SRV_MAC, ip:SRV_IP,
          listening:[ { port:443, service:'HTTPS', open:true },
                      { port:80,  service:'HTTP',  open:true },
                      { port:22,  service:'SSH',   open:true },
                      { port:3306, service:'MySQL', open:true } ] })
      ],
      links: [ N.link('out','fw'), N.link('fw','srv') ],
      hub:null, wire:null, banner:null,
      rules: RULES, hit: null, verdict: null
    };
  },

  script: function(s0, cfg){
    P.resetIds();
    var steps = [], t = 0;
    function at(){ return ++t; }
    var port = parseInt(cfg.port, 10);
    var srcIp = cfg.inside ? '10.0.0.55' : OUT_IP;
    var rule = match(port, srcIp);
    var allowed = rule.act === 'ALLOW';
    var svc = { 443:'HTTPS', 22:'SSH', 3306:'MySQL' }[port];

    var p1 = pkt(srcIp, SRV_IP, port, '→ :' + port, 'out', 'fw');
    steps.push({
      t:at(), actor:'out', layer:'L4', kind:'info',
      title:'Connection চেষ্টা — port ' + port + ' (' + svc + ')', packet:p1,
      what:'`' + srcIp + '` থেকে Server-এর port `' + port + '`-এ একটি SYN পাঠানো হলো।\n\nএটি Firewall-এ গিয়ে পৌঁছাল।',
      why :'Firewall এখন সিদ্ধান্ত নেবে। সে দেখবে মূলত চারটি জিনিস:\n\n• কোথা থেকে এসেছে (source IP)\n• কোথায় যাচ্ছে (destination IP)\n• কোন port\n• কোন protocol\n\nPacket-এর ভেতরের data সে দেখছে না — সেটি অন্য ধরনের firewall-এর কাজ। এই সিদ্ধান্তটি সম্পূর্ণভাবে **header দেখে**।',
      apply: function(st){ st.wire = { pkt:p1, from:'out', to:'fw' };
                           st.banner = srcIp + ' → :' + port; }
    });

    /* ── নিয়ম মেলানো, এক এক করে ── */
    for(var i = 0; i < RULES.length; i++){
      var r = RULES[i];
      var isHit = (r.n === rule.n);
      var skipped = !isHit && r.n < rule.n;
      if(!skipped && !isHit) break;      /* মিলে যাওয়ার পরের নিয়ম পড়াই হয় না */

      (function(r, isHit){
        var why;
        if(isHit && r.act === 'ALLOW' && r.from === '10.0.0.0/8'){
          why = 'এই নিয়মটি শুধু port দেখে না — **source-ও** দেখে।\n\n`' + srcIp + '` `10.0.0.0/8`-এর ভেতরে পড়ে, তাই মিলে গেল।\n\nএই ধরনের নিয়মই বেশি কাজের। SSH পৃথিবীর সবার জন্য খুলে দেওয়া বিপজ্জনক, কিন্তু নিজের network-এর জন্য খোলা রাখা দরকারও।\n\nএভাবে একটি service একই সাথে ব্যবহারযোগ্য ও সুরক্ষিত থাকে।';
        } else if(isHit && r.act === 'ALLOW'){
          why = 'নিয়মটি মিলে গেল, তাই সিদ্ধান্ত এখানেই শেষ। **নিচের নিয়মগুলো আর পড়া হবে না** — নিয়ম ৪-এ যে "বাকি সব বন্ধ" লেখা আছে, সেটি এই Packet-এর জন্য অপ্রাসঙ্গিক।\n\nএখানেই ক্রমের গুরুত্ব। যদি ভুল করে DENY নিয়মটি উপরে বসানো হতো, তাহলে HTTPS-ও বন্ধ হয়ে যেত — অথচ নিচে ALLOW লেখা থাকত।\n\nFirewall-এর নিয়ম ভুল হওয়ার এটিই সবচেয়ে সাধারণ কারণ: নিয়মগুলো ঠিক, কিন্তু ক্রম ভুল।';
        } else if(isHit && r.act === 'DENY'){
          why = 'উপরের কোনো নিয়মের সাথেই মিলল না, তাই শেষ নিয়মটিতে এসে পড়ল — **default DENY**।\n\nএই শেষ নিয়মটি প্রায় প্রতিটি firewall-এ থাকে, এবং এটিই সবচেয়ে গুরুত্বপূর্ণ নিয়ম।\n\nদুটি ভিন্ন দর্শন তুলনা করুন:\n\n**Default ALLOW** — "যা নিষিদ্ধ নয় তা অনুমোদিত"। প্রতিটি বিপদ আগে থেকে ভেবে নিষিদ্ধ করতে হবে। একটি ভুলে গেলেই ফাঁক।\n\n**Default DENY** — "যা অনুমোদিত নয় তা নিষিদ্ধ"। প্রতিটি প্রয়োজন লিখে দিতে হবে। ভুলে গেলে service কাজ করে না — কিন্তু ফাঁক তৈরি হয় না।\n\nদ্বিতীয়টিতে ভুলের ফল **বিরক্তিকর**, প্রথমটিতে ভুলের ফল **বিপজ্জনক**। এজন্যই default DENY-ই সঠিক নকশা।';
        } else {
          why = 'এই নিয়মটি port `' + (r.port === '*' ? 'যেকোনো' : r.port) + '`-এর জন্য, কিন্তু আমাদের Packet `' + port + '`-এ যাচ্ছে' +
                (r.from === '10.0.0.0/8' ? ', আর source-ও মিলছে না' : '') +
                '। তাই মিলল না।\n\nFirewall পরের নিয়মে চলে গেল। এভাবেই সে উপর থেকে নিচে এক এক করে পড়ে — প্রথম মিল না পাওয়া পর্যন্ত।';
        }

        steps.push({
          t:at(), actor:'fw', layer:'L4',
          kind: isHit ? (r.act === 'ALLOW' ? 'ok' : 'error') : 'info',
          title:'নিয়ম ' + r.n + ': ' + r.act + ' ' +
                (r.port === '*' ? 'সব port' : 'port ' + r.port) +
                (isHit ? ' — মিলে গেল ✓' : ' — মিলল না'),
          what:'`নিয়ম ' + r.n + '` — ' + r.note + '\n\n' +
               (isHit ? '**এটিই মিলে গেল। সিদ্ধান্ত: ' + r.act + '।**'
                      : 'মিলল না, পরের নিয়মে যাচ্ছি।'),
          why: why,
          apply: function(st){
            st.hit = isHit ? r.n : null;
            if(isHit) st.verdict = r.act;
            st.banner = 'নিয়ম ' + r.n + (isHit ? ' → ' + r.act : ' — মিলল না');
          }
        });
      })(r, isHit);

      if(isHit) break;
    }

    /* ── ফলাফল ── */
    if(allowed){
      var p2 = pkt(srcIp, SRV_IP, port, '→ Server', 'fw', 'srv');
      steps.push({
        t:at(), actor:'fw', layer:'L4', kind:'ok',
        title:'ALLOW — Packet Server-এ পৌঁছে গেল', packet:p2,
        what:'Firewall Packet-টি এগিয়ে দিল। Server এখন handshake সম্পূর্ণ করবে।',
        why :'একটি গুরুত্বপূর্ণ ব্যাপার এখানে ঘটছে যা চোখে পড়ে না।\n\nআধুনিক firewall **stateful** — সে এই connection-টি একটি table-এ লিখে রাখল।\n\nএতে কী লাভ? উত্তর যখন Server থেকে ফিরে আসবে, তখন সেটি হবে "ভেতর থেকে বাইরে" যাওয়া traffic। কোনো নিয়মে সেটির উল্লেখ নেই।\n\nStateless হলে উত্তর ফেরার জন্যও আলাদা নিয়ম লিখতে হতো — আর সেই নিয়মটি অনেক বেশি ঢিলেঢালা হয়ে যেত।\n\nStateful firewall বলে: "আমি এই connection-টি অনুমোদন করেছি, তাই এর উত্তরও অনুমোদিত।" একটি নিয়ম, দুই দিক।\n\nএটিই আজকের firewall-কে একই সাথে কড়া ও ব্যবহারযোগ্য রাখে।',
        apply: function(st){ st.wire = { pkt:p2, from:'fw', to:'srv' };
                             st.banner = 'ALLOW · পৌঁছে গেল'; }
      });
      return steps;
    }

    if(cfg.reject){
      var rst = P.make([
        P.ethernet(FW_MAC, OUT_MAC, 'ip'),
        P.ip('10.0.0.1', srcIp, 64, 'tcp', 40),
        P.tcp(port, 49152, 0, 1, 'RST, ACK', 0)
      ], { label:'RST', kind:'ack', from:'fw', to:'out' });
      steps.push({
        t:at(), actor:'fw', layer:'L4', kind:'error',
        title:'REJECT — উত্তর দিয়ে জানিয়ে দেওয়া হলো', packet:rst,
        what:'Firewall Packet-টি ফেলে দিল, **এবং** প্রেরককে একটি RST পাঠাল।\n\nপ্রেরক সঙ্গে সঙ্গে `Connection refused` পেল।',
        why :'REJECT আর DROP-এর মধ্যে বাছাইটি আসলে একটি আপস।\n\n**REJECT-এর সুবিধা:** প্রেরক সঙ্গে সঙ্গে জানতে পারে। কোনো দীর্ঘ অপেক্ষা নেই, debugging সহজ।\n\n**REJECT-এর অসুবিধা:** আক্রমণকারীও সঙ্গে সঙ্গে জানতে পারে — "এখানে কিছু একটা আছে, কিন্তু ঢুকতে দিচ্ছে না"। এই তথ্যটুকুও তার কাজে লাগে।\n\nতাই সাধারণ চর্চা:\n\n• **ভেতরের network-এ REJECT** — সহকর্মীর সময় নষ্ট করার মানে নেই\n• **Internet-মুখী দিকে DROP** — অপরিচিতকে কিছু না জানানোই ভালো\n\n`DROP-এর বদলে REJECT` বন্ধ করে পার্থক্যটি দেখুন।',
        apply: function(st){ st.wire = { pkt:rst, from:'fw', to:'out' };
                             st.banner = 'REJECT · RST পাঠানো হলো'; }
      });
      steps.push({
        t:at(), actor:'out', layer:'L4', kind:'error',
        title:'Connection refused — সঙ্গে সঙ্গে',
        what:'প্রেরক RST পেয়ে সাথে সাথেই হাল ছেড়ে দিল। কোনো অপেক্ষা করতে হয়নি।',
        why :'এই দ্রুততাই REJECT-এর মূল সুবিধা।\n\nকিন্তু মনে রাখবেন — এই `Connection refused` দেখতে ঠিক তেমনই লাগে যেমন **port বন্ধ থাকলে** লাগত।\n\nতাই এই error দেখলে দুটি সম্ভাবনা আছে: হয় service চালু নেই, নয়তো firewall আটকাচ্ছে। দুটির পার্থক্য বাইরে থেকে বোঝা যায় না।\n\nএটি ইচ্ছাকৃত — firewall নিজের অস্তিত্ব লুকিয়ে রাখছে।',
        apply: function(st){ st.wire = null; st.banner = 'Connection refused'; }
      });
    } else {
      steps.push({
        t:at(), actor:'fw', layer:'L4', kind:'error',
        title:'DROP — নীরবে ফেলে দেওয়া হলো',
        what:'Firewall Packet-টি ফেলে দিল এবং **কিছুই জানাল না**। কোনো উত্তর নেই।',
        why :'প্রেরকের কাছে এখন দুটি অবস্থা সম্পূর্ণ একরকম দেখাচ্ছে:\n\n• Packet-টি হারিয়ে গেছে\n• Packet-টি ইচ্ছাকৃতভাবে ফেলে দেওয়া হয়েছে\n\nদুটোই নীরবতা। তার কাছে আলাদা করার কোনো উপায় নেই।\n\nএটাই DROP-এর উদ্দেশ্য — কোনো তথ্য না দেওয়া। কেউ port scan করলে সে জানতেও পারবে না এই ঠিকানায় আদৌ কিছু আছে কিনা।',
        apply: function(st){ st.wire = null; st.banner = 'DROP · নীরবতা'; }
      });
      steps.push({
        t:at(), actor:'out', layer:'L4', kind:'error',
        title:'Connection timed out — দীর্ঘ অপেক্ষার পর',
        what:'প্রেরক বারবার SYN পাঠাল, প্রতিবার আরও বেশি অপেক্ষা করল। শেষ পর্যন্ত `Connection timed out`।',
        why :'এই একটি পার্থক্য debugging-এ প্রথম সূত্র হিসেবে কাজ করে:\n\n**`Connection refused` (সঙ্গে সঙ্গে)** → কেউ RST দিয়েছে। হয় port বন্ধ, নয় firewall REJECT করছে। Packet কিন্তু পৌঁছেছিল।\n\n**`Connection timed out` (দীর্ঘ অপেক্ষার পর)** → কেউ কিছুই বলেনি। সাধারণত firewall DROP করছে, অথবা Packet পথই খুঁজে পায়নি।\n\nতাই error-টি **কত সময় পরে এলো** সেটিও একটি তথ্য। তাৎক্ষণিক error আর দীর্ঘ অপেক্ষা — দুটি ভিন্ন গল্প বলে।\n\nএই একই পার্থক্য TCP Handshake lab-এও দেখেছেন — সেখানে RST বনাম নীরবতা।',
        apply: function(st){ st.banner = 'Connection timed out'; }
      });
    }

    return steps;
  }
};

})(window.NetLab);
