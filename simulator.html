(function(NS){
"use strict";
var N = NS.net, P = NS.pkt;

/* আলোর গতি fiber-এ প্রায় ২,০০,০০০ km/s — এটিই propagation delay-র ভিত্তি */
var C_FIBER = 200000;

function pkt(label, from, to, kind){
  return P.make([
    P.ethernet('AA:AA:AA:AA:AA:AA', 'SS:SS:SS:SS:SS:SS', 'ip'),
    P.ip('192.168.1.10', '93.184.216.34', 64, 'tcp', 1500),
    P.tcp(49152, 443, 1, 1, 'PSH, ACK', 64240)
  ], { label:label, kind:kind || 'data', from:from, to:to });
}

NS.labs.latency = {
  id: 'latency',
  title: 'Latency — দেরির চার উৎস',
  group: 'Phase 5 · Performance',
  chapter: 'ch36',
  blurb: 'Bandwidth বাড়ালেই সব দ্রুত হয় না। দেরির একটি অংশ পদার্থবিজ্ঞান — সেটি কেনা যায় না।',

  learn: [
    'Latency-র চারটি উপাদান — কোনটি কীসের উপর নির্ভর করে',
    'কোন অংশটি বেশি টাকা খরচ করলেও কমানো যায় না',
    'Bandwidth বাড়ালে কোনটি কমে, কোনটি কমে না',
    'RTT কেন বারবার গুণ হয়ে বড় দেরি তৈরি করে'
  ],

  mistakes: [
    { m:'Internet-এর গতি বাড়ালে সব website দ্রুত খুলবে।',
      r:'Bandwidth বাড়ালে **transmission delay** কমে — অর্থাৎ বড় file দ্রুত যায়। কিন্তু **propagation delay** (দূরত্ব ÷ আলোর গতি) একটুও কমে না। ছোট request-এ বেশিরভাগ সময়ই propagation, তাই সেখানে bandwidth বাড়িয়ে প্রায় কিছুই লাভ হয় না।' },
    { m:'Latency আর Bandwidth মোটামুটি একই জিনিস।',
      r:'দুটি সম্পূর্ণ আলাদা মাপ। **Latency** = একটি bit যেতে কত সময় লাগে। **Bandwidth** = প্রতি সেকেন্ডে কত bit পাঠানো যায়। একটি ট্রাক ভর্তি hard disk-এর bandwidth বিশাল, কিন্তু latency কয়েক ঘণ্টা।' },
    { m:'Ping কম মানে সব ঠিক আছে।',
      r:'Ping শুধু **এক জোড়া ছোট Packet**-এর যাওয়া-আসার সময় মাপে। কিন্তু একটি page load-এ কয়েক ডজন RTT লাগতে পারে — DNS, TCP handshake, TLS handshake, তারপর প্রতিটি resource। ৫০ms ping-ও ২০ বার গুণ হলে এক সেকেন্ড।' }
  ],

  controls: [
    { key:'dist', type:'choice', label:'Server কত দূরে', def:'far',
      options:[ ['near','একই শহর — ২০ km'],
                ['far','অন্য মহাদেশ — ১২,০০০ km'] ] },
    { key:'bw', type:'choice', label:'Bandwidth', def:'low',
      options:[ ['low','১০ Mbps'], ['high','১০০০ Mbps (১০০ গুণ বেশি)'] ] },
    { key:'busy', type:'toggle', label:'পথের Router গুলো ব্যস্ত', def:false,
      help:'Queuing delay-ই একমাত্র উপাদান যা মুহূর্তে মুহূর্তে বদলায়।' }
  ],

  build: function(){
    return {
      devices: [
        N.pc('client', { name:'Client', x:14, y:50, mac:'AA:AA:AA:AA:AA:AA',
                         ip:'192.168.1.10' }),
        N.router('r1', { name:'Router 1', x:38, y:50,
          ifaces:[{ name:'eth0', ip:'10.0.0.1', mac:'11:11:11:11:11:11',
                    mask:'255.255.255.0' }] }),
        N.router('r2', { name:'Router 2', x:62, y:50,
          ifaces:[{ name:'eth0', ip:'10.0.1.1', mac:'22:22:22:22:22:22',
                    mask:'255.255.255.0' }] }),
        N.server('srv', { name:'Server', x:86, y:50, mac:'SS:SS:SS:SS:SS:SS',
          ip:'93.184.216.34',
          listening:[{ port:443, service:'HTTPS', open:true }] })
      ],
      links: [ N.link('client','r1'), N.link('r1','r2'), N.link('r2','srv') ],
      hub:null, wire:null, banner:null,
      trans:0, prop:0, queue:0, proc:0, total:0
    };
  },

  script: function(s0, cfg){
    P.resetIds();
    var steps = [], t = 0;
    function at(){ return ++t; }

    var km    = cfg.dist === 'near' ? 20 : 12000;
    var mbps  = cfg.bw === 'high' ? 1000 : 10;
    var bits  = 1500 * 8;                       /* একটি সাধারণ Packet */
    /* চারটি উপাদান, মিলিসেকেন্ডে */
    var trans = Math.round((bits / (mbps * 1e6)) * 1000 * 100) / 100;
    var prop  = Math.round((km / C_FIBER) * 1000 * 100) / 100;
    var queue = cfg.busy ? 30 : 0.5;
    var proc  = 0.1 * 2;                        /* দুটি Router */
    var total = Math.round((trans + prop + queue + proc) * 100) / 100;

    var p = pkt('1500 B', 'client', 'r1');
    steps.push({
      t:at(), actor:'client', layer:'L1', kind:'info',
      title:'১. Transmission Delay — তার-এ তুলতে যত সময়', packet:p,
      what:'একটি ১৫০০ byte Packet-কে তারে "ঢেলে দিতে" সময় লাগে:\n\n`১৫০০ × ৮ bit ÷ ' + mbps + ' Mbps` = **' + trans + ' ms**',
      why :'এটি একটি সহজ ভাগ — কতগুলো bit, ভাগ প্রতি সেকেন্ডে কতগুলো bit পাঠানো যায়।\n\n**এই অংশটিই bandwidth-এর উপর নির্ভর করে।** Bandwidth ১০ গুণ বাড়ালে এই সময় ১০ ভাগের এক ভাগ হয়ে যায়।\n\nভাবুন একটি পাইপে জল ঢালার মতো — মোটা পাইপে একই পরিমাণ জল দ্রুত ঢালা যায়।\n\nবড় file-এ এই অংশটি প্রধান হয়ে ওঠে। কিন্তু ছোট request-এ এটি প্রায় নগণ্য — সেখানে অন্য উপাদানগুলোই আসল।',
      apply: function(st){ st.wire = { pkt:p, from:'client', to:'r1' };
                           st.trans = trans; st.banner = 'transmission ' + trans + ' ms'; }
    });

    var p2 = pkt('ভ্রমণে', 'r1', 'r2');
    steps.push({
      t:at(), actor:'r1', layer:'L1', kind: cfg.dist === 'far' ? 'warn' : 'ok',
      title:'২. Propagation Delay — পথ পাড়ি দিতে যত সময়', packet:p2,
      what:'Signal-কে ' + km.toLocaleString('en-US') + ' km পাড়ি দিতে হবে। Fiber-এ আলো চলে প্রায় ২,০০,০০০ km/s গতিতে:\n\n`' + km + ' ÷ 200000` = **' + prop + ' ms**',
      why : cfg.dist === 'far'
        ? '**এটিই সেই অংশ যা টাকা দিয়ে কেনা যায় না।**\n\nএটি পদার্থবিজ্ঞান। আলোর চেয়ে দ্রুত কিছু যেতে পারে না, আর fiber-এ আলো শূন্যস্থানের চেয়েও কিছুটা ধীরে চলে।\n\nBandwidth ১০০০ গুণ বাড়ালেও এই ' + prop + ' ms এক চুলও কমবে না।\n\nএখান থেকেই CDN-এর পুরো যুক্তিটি আসে। দেরি যদি দূরত্বের কারণে হয়, তাহলে **একমাত্র সমাধান দূরত্ব কমানো** — অর্থাৎ content-কে ব্যবহারকারীর কাছে নিয়ে যাওয়া।\n\nএটি একটি গভীর কথা: কিছু সমস্যা প্রকৌশল দিয়ে সমাধান হয় না, শুধু ভূগোল বদলে সমাধান হয়।'
        : 'কাছাকাছি হওয়ায় এই অংশটি নগণ্য — মাত্র ' + prop + ' ms।\n\nএখানে দেরির প্রধান কারণ অন্য উপাদানগুলো।\n\n`অন্য মহাদেশ` বেছে দেখুন — তখন এই একটি সংখ্যাই পুরো হিসাবকে গ্রাস করে ফেলে।',
      apply: function(st){ st.wire = { pkt:p2, from:'r1', to:'r2' };
                           st.prop = prop; st.banner = 'propagation ' + prop + ' ms'; }
    });

    var p3 = pkt(cfg.busy ? 'queue-এ অপেক্ষা' : 'দ্রুত পার', 'r2', 'srv');
    steps.push({
      t:at(), actor:'r2', layer:'L3', kind: cfg.busy ? 'error' : 'ok',
      title:'৩. Queuing Delay — Router-এ অপেক্ষা', packet:p3,
      what: cfg.busy
        ? 'Router-এর queue-তে আরও অনেক Packet অপেক্ষা করছে। আমাদের Packet-কে লাইনে দাঁড়াতে হলো:\n\n**' + queue + ' ms**'
        : 'Router-এ প্রায় কোনো ভিড় নেই। অপেক্ষা: **' + queue + ' ms**',
      why : cfg.busy
        ? '**এই উপাদানটিই একমাত্র অস্থির।**\n\nবাকি তিনটি মোটামুটি স্থির — দূরত্ব বদলায় না, bandwidth বদলায় না, Router-এর গতি বদলায় না।\n\nকিন্তু queue মুহূর্তে মুহূর্তে বদলায়, কারণ এটি নির্ভর করে **এই মুহূর্তে আর কারা পাঠাচ্ছে** তার উপর।\n\nএখান থেকেই **jitter** তৈরি হয় — একই পথে পাঠানো দুটি Packet ভিন্ন সময় নেয়। Voice ও video call-এ jitter latency-র চেয়েও বেশি ক্ষতিকর, কারণ শব্দ থেমে থেমে আসে।\n\nআর queue যখন পুরো ভরে যায়, তখন Router নতুন Packet **ফেলে দিতে** বাধ্য হয়। এটাই congestion-এর সময় packet loss-এর প্রধান উৎস।'
        : 'ভিড় না থাকায় Packet প্রায় সঙ্গে সঙ্গেই এগিয়ে গেল।\n\n`পথের Router গুলো ব্যস্ত` চালু করে দেখুন — একই পথ, একই দূরত্ব, একই bandwidth, কিন্তু সময় অনেক বেড়ে যাবে।\n\nএটাই ব্যাখ্যা করে কেন একই connection কখনো দ্রুত, কখনো ধীর মনে হয়।',
      apply: function(st){ st.wire = { pkt:p3, from:'r2', to:'srv' };
                           st.queue = queue; st.banner = 'queuing ' + queue + ' ms'; }
    });

    steps.push({
      t:at(), actor:'srv', layer:'L3', kind:'info',
      title:'৪. Processing Delay — সিদ্ধান্ত নিতে যত সময়',
      what:'প্রতিটি Router header পড়ে, routing table দেখে, TTL কমায়, checksum মেলায়। দুটি Router মিলিয়ে:\n\n**' + proc + ' ms**',
      why :'আধুনিক Router-এ এই কাজটি hardware-এ হয়, তাই সময় খুবই কম — সাধারণত মাইক্রোসেকেন্ডের ঘরে।\n\nএককালে এটি বড় ব্যাপার ছিল, যখন Router software দিয়ে Packet forward করত।\n\nআজকের দিনে এটি সাধারণত নগণ্য — যদি না Router-এ ভারী কাজ যোগ করা হয়, যেমন deep packet inspection বা encryption।',
      apply: function(st){ st.proc = proc; st.banner = 'processing ' + proc + ' ms'; }
    });

    var dominant = prop >= trans && prop >= queue ? 'propagation'
                 : queue >= trans ? 'queuing' : 'transmission';
    var pctProp = Math.round(prop / total * 100);

    steps.push({
      t:at(), actor:'srv', layer:'L3', kind:'ok',
      title:'মোট = ' + total + ' ms (এক দিকে)',
      what:'`transmission ' + trans + '` + `propagation ' + prop + '` + `queuing ' + queue +
           '` + `processing ' + proc + '` = **' + total + ' ms**\n\nRTT (যাওয়া-আসা) ≈ **' + (total * 2).toFixed(2) + ' ms**\n\nসবচেয়ে বড় অংশ: **' + dominant + '** — মোটের প্রায় ' +
           (dominant === 'propagation' ? pctProp : Math.round((dominant === 'queuing' ? queue : trans) / total * 100)) + '%।',
      why : dominant === 'propagation'
        ? 'Propagation-ই এখানে প্রধান, এবং সেটিই সবচেয়ে গুরুত্বপূর্ণ শিক্ষা।\n\nএই অবস্থায় bandwidth বাড়িয়ে প্রায় **কিছুই লাভ হবে না**। `Bandwidth` বদলে ১০০০ Mbps করে দেখুন — মোট সময় কতটুকু কমে।\n\nআর এখানেই RTT-র গুণিতক প্রভাব ভয়ংকর হয়ে ওঠে। একটি সাধারণ HTTPS page load-এ লাগে:\n\n`DNS` ১ RTT + `TCP handshake` ১ RTT + `TLS handshake` ১-২ RTT + `HTTP request` ১ RTT\n\n= অন্তত ৪ RTT, মানে প্রায় ' + (total * 8).toFixed(0) + ' ms — **একটি byte content আসার আগেই**।\n\nএজন্যই আধুনিক optimization-এর বেশিরভাগ চেষ্টা RTT **কমানো** নয়, RTT-র **সংখ্যা কমানো**: Keep-Alive, TLS session resumption, QUIC-এর 0-RTT, আর সর্বোপরি CDN।'
        : dominant === 'queuing'
          ? 'Queue-ই এখানে প্রধান — অর্থাৎ সমস্যাটি **ভিড়ের**, দূরত্ব বা bandwidth-এর নয়।\n\nএটি সবচেয়ে হতাশাজনক ধরনের দেরি, কারণ এটি অনিয়মিত। কখনো দ্রুত, কখনো ধীর, আর কারণটি আপনার নিয়ন্ত্রণের বাইরে।\n\nQueue-র সমস্যার সমাধান bandwidth বাড়ানো নয় — সমাধান হলো ভিড় কমানো, বা QoS দিয়ে গুরুত্বপূর্ণ traffic-কে অগ্রাধিকার দেওয়া।'
          : 'Transmission-ই এখানে প্রধান, অর্থাৎ Packet-টি বড় আর bandwidth কম।\n\n**এই একটিমাত্র ক্ষেত্রেই bandwidth বাড়িয়ে সত্যিকারের লাভ হয়।** বড় file transfer-এ ঠিক এই অবস্থাই তৈরি হয়।\n\nকিন্তু লক্ষ্য করুন — ছোট request-এ (API call, HTML page) এই অংশটি নগণ্য। সেখানে bandwidth বাড়ানো টাকার অপচয়।',
      apply: function(st){ st.wire = null; st.total = total;
                           st.banner = 'মোট ' + total + ' ms · RTT ' + (total * 2).toFixed(1) + ' ms'; }
    });

    return steps;
  }
};

NS.labs.queue = {

  learn: [

    { m:'Packet loss মানে network-এ কিছু নষ্ট হয়ে গেছে।',

  ],

  build: function(cfg){

        N.router('r1', { name:'Router', x:50, y:50,
          ifaces:[{ name:'eth0', ip:'10.0.0.1', mac:'11:11:11:11:11:11',

          ip:'93.184.216.34',
          listening:[{ port:443, service:'HTTPS', open:true }] })
      ],
      links: [ N.link('client','r1'), N.link('r1','srv') ],
      hub:null, wire:null, banner:null,
      q:0, cap:cap, dropped:0, sent:0, delivered:0, wait:0
    };
  },

  script: function(s0, cfg){
    P.resetIds();
    var steps = [], t = 0;
    function at(){ return ++t; }
    var cap = cfg.bigbuf ? QCAP * 3 : QCAP;
    /* Router প্রতি "ধাপে" একটি Packet ছাড়তে পারে; burst-এ দুটি আসে */
    var inRate = cfg.rate === 'burst' ? 2 : 1;
    var q = 0, dropped = 0, sent = 0, delivered = 0;

    function note(st, qq){
      for(var i = 0; i < st.devices.length; i++)
        if(st.devices[i].id === 'r1')
          st.devices[i].note = 'queue ' + qq + '/' + cap;
    }

    steps.push({
      t:at(), actor:'r1', layer:'L3', kind:'info',
      title:'Queue কেন দরকার',
      what:'Router-এর সামনের লাইনটি (queue) ধরে রাখতে পারে সর্বোচ্চ **' + cap + 'টি** Packet।\n\nএই Router প্রতি একক সময়ে **একটি** Packet এগিয়ে দিতে পারে।',
      why :'Queue না থাকলে কী হতো? Router যখন একটি Packet পাঠাতে ব্যস্ত, ঠিক তখন আরেকটি এলে সেটি **সঙ্গে সঙ্গে ফেলে দিতে** হতো।\n\nকিন্তু traffic কখনো সমান তালে আসে না — সে ঝাঁকে ঝাঁকে আসে। মুহূর্তের জন্য বেশি এলেও পরের মুহূর্তে কম আসতে পারে।\n\nQueue এই ওঠানামা সামলায়। এটি একটি **সাময়িক ভিড় শোষণের ব্যবস্থা**।\n\nকিন্তু এটি সাময়িক ভিড়ের জন্য — **স্থায়ী ভিড়ের জন্য নয়**। এই পার্থক্যটিই পরের ধাপগুলোতে স্পষ্ট হবে।',
      apply: function(st){ st.banner = 'queue ধারণক্ষমতা ' + cap; }
    });

    /* ── কয়েক দফা traffic ── */
    var rounds = 6;
    for(var r = 0; r < rounds; r++){
      (function(round){
        var arriving = inRate, thisDrop = 0, accepted = 0;
        for(var k = 0; k < arriving; k++){
          sent++;
          if(q < cap){ q++; accepted++; }
          else { dropped++; thisDrop++; }
        }
        /* Router একটি ছাড়ল */
        var served = 0;
        if(q > 0){ q--; served = 1; delivered++; }

        var qNow = q, dNow = dropped, wait = q;   /* queue দৈর্ঘ্যই অপেক্ষার মাপ */
        var p = pkt(round + 1, thisDrop ? 'drop ✗' : 'queue-এ',

        steps.push({
          t:at(), actor: thisDrop ? 'r1' : 'client', layer:'L3',
          kind: thisDrop ? 'error' : (qNow >= cap - 1 ? 'warn' : 'info'),

            : arriving + 'টি এলো, ১টি এগিয়ে গেল — queue ' + qNow + '/' + cap,
          packet:p,
          what: thisDrop
            ? 'Queue-তে আর জায়গা নেই (' + cap + '/' + cap + ')। নতুন আসা ' + thisDrop +
              'টি Packet **ফেলে দেওয়া হলো**।\n\nএখন পর্যন্ত মোট drop: ' + dNow + 'টি।'
            : 'এই দফায় ' + arriving + 'টি Packet এলো, Router ' + served +
              'টি এগিয়ে দিল। Queue-তে এখন **' + qNow + '/' + cap + '**।',
          why : thisDrop
            ? 'একে বলে **Tail Drop** — লাইনের শেষে যে এসেছে সে-ই বাদ পড়ল।\n\nএটি নিষ্ঠুর মনে হলেও Router-এর আর কোনো উপায় নেই। তার স্মৃতি সীমিত, লাইন ভরে গেছে।\n\nএখানে একটি গভীর কথা আছে: **এই drop-টাই আসলে একটি বার্তা**।\n\nRouter কোনো নালিশ পাঠায় না, কিছুই বলে না। কিন্তু sender যখন দেখে ACK আসছে না, সে বুঝে যায় network-এ ভিড়। তখন সে নিজে থেকেই গতি কমিয়ে দেয়।\n\nএভাবেই Internet নিজেকে সামলায় — কোনো কেন্দ্রীয় নিয়ন্ত্রক নেই, শুধু হারানো Packet-এর নীরব সংকেত।'
            : (qNow >= cap - 1
                ? 'Queue প্রায় ভরে এসেছে। এখানে দুটি জিনিস একসাথে ঘটছে:\n\n• পরের Packet drop হওয়ার ঝুঁকি বাড়ছে\n• **যারা লাইনে আছে তাদের অপেক্ষাও বাড়ছে**\n\nদ্বিতীয়টি প্রায়ই খেয়াল করা হয় না। লম্বা queue মানে প্রতিটি Packet-কে বেশিক্ষণ দাঁড়াতে হচ্ছে — অর্থাৎ latency বাড়ছে।'
                : (inRate > 1
                    ? 'আসছে ' + arriving + 'টি, যাচ্ছে ' + served + 'টি। পার্থক্যটি queue-তে জমছে।\n\nএটি একটি সরল কিন্তু নির্মম হিসাব: **আসার হার > যাওয়ার হার** হলে queue বাড়তেই থাকবে। কতক্ষণে ভরবে সেটা শুধু সময়ের ব্যাপার।'
                    : 'যতটা আসছে ততটাই যাচ্ছে, তাই queue জমছে না। এটিই সুস্থ অবস্থা।\n\n`Router যা পারে তার চেয়ে বেশি আসছে` বেছে দেখুন কী হয়।')),

        });
      })(r);
    }

    /* ── সারাংশ ── */
    var lossPct = Math.round(dropped / sent * 100);
    steps.push({
      t:at(), actor:'r1', layer:'L3', kind: dropped ? 'warn' : 'ok',
      title: dropped ? 'ফলাফল: ' + lossPct + '% packet loss, queue-তে ' + q + 'টি অপেক্ষায়'
                     : 'ফলাফল: কোনো loss নেই',
      what:'পাঠানো হয়েছে **' + sent + '**টি, পৌঁছেছে **' + delivered + '**টি, ফেলে দেওয়া হয়েছে **' + dropped + '**টি।\n\nQueue-তে এখনো **' + q + '**টি অপেক্ষা করছে।',
      why : cfg.bigbuf
        ? '**এখানেই Bufferbloat-এর ফাঁদটি স্পষ্ট হয়।**\n\nQueue তিন গুণ বড় করায় drop কমেছে — শুনতে ভালোই লাগে।\n\nকিন্তু দেখুন queue-তে কতগুলো Packet দাঁড়িয়ে আছে: **' + q + 'টি**। এদের প্রত্যেককে নিজের পালার জন্য অপেক্ষা করতে হচ্ছে।\n\nএর ফল দুটি, দুটিই খারাপ:\n\n**১. Latency বেড়ে যায়** — Packet হারায় না ঠিকই, কিন্তু পৌঁছাতে অনেক দেরি হয়। Video call কেঁপে যায়, game-এ ping লাফায়, ssh-এ typing পিছিয়ে যায়।\n\n**২. TCP অন্ধ হয়ে যায়** — এটিই বেশি ভয়ংকর। TCP loss দেখে বোঝে কখন থামতে হবে। Loss না পেলে সে ভাবে সব ঠিক আছে, আর **আরও বেশি পাঠাতে থাকে** — queue আরও ভরে।\n\nএজন্যই আধুনিক সমাধান বড় buffer নয়, বরং **স্মার্ট queue** (CoDel, FQ-CoDel) — যা ইচ্ছা করে আগেভাগে Packet ফেলে দেয়, যাতে TCP সময়মতো সংকেত পায়।\n\nএকটি চমকপ্রদ উপসংহার: **সময়মতো Packet ফেলে দেওয়াই ভালো ব্যবহার।**'
        : (dropped
            ? 'Loss-কে ব্যর্থতা ভাবার দরকার নেই — এটি network-এর **সংকেত ব্যবস্থা**।\n\nRouter বলছে: "আমার ধারণক্ষমতার বেশি পাঠানো হচ্ছে।" TCP এই সংকেত পেয়ে গতি কমাবে, আর ভারসাম্য ফিরে আসবে।\n\nএটি ছাড়া Internet কাজ করত না। কোনো কেন্দ্রীয় নিয়ন্ত্রক নেই যে সবাইকে বলে দেবে কত জোরে পাঠাতে হবে। প্রত্যেকে নিজে থেকে টের পায় এবং মানিয়ে নেয়।\n\nএবার `Queue তিন গুণ বড় করে দিন` চালু করে দেখুন — drop কমবে, কিন্তু বিনিময়ে কী হারাবেন।'
            : 'আসার হার আর যাওয়ার হার সমান, তাই queue জমেনি, কিছু হারায়নি।\n\nএটিই সুস্থ অবস্থা — এবং বেশিরভাগ সময় network এমনই থাকে।'),
      apply: function(st){ st.wire = null;
                           st.banner = dropped ? lossPct + '% loss · queue ' + q
                                               : 'কোনো loss নেই'; }
    });

    return steps;
  }
};

function pkt(sIp, dIp, label, from, to, kind){
  return P.make([
    P.ethernet('AA:AA:AA:AA:AA:AA', 'LL:LL:LL:LL:LL:LL', 'ip'),
    P.ip(sIp, dIp, 64, 'tcp', 200),
    P.tcp(49152, 443, 1, 1, 'PSH, ACK', 64240)
  ], { label:label, kind:kind || 'data', from:from, to:to });
}

        : '**এই ভাঙনটির উপসর্গটি সবচেয়ে স্পষ্ট এবং সবচেয়ে কাজের।**\n\n• `ping 93.184.216.34` কাজ করে ✓\n• `ping example.com` কাজ করে না ✗\n\nএই একটিমাত্র তুলনাই DNS-কে দোষী সাব্যস্ত করে দেয়। Network ঠিক আছে (IP-তে পৌঁছাচ্ছে), শুধু অনুবাদটি হচ্ছে না।\n\n**সরঞ্জাম:** ' + B.tool + '\n\nএই দুটি ping-এর তুলনা করাটা debugging-এর একটি চমৎকার অভ্যাস — এক ধাপেই একটি পুরো স্তর বাদ দেওয়া যায়।',
      apply: function(st){
        if(dnsOk){ st.wire = { pkt:dp, from:'gw', to:'dns' };
                   st.reached = st.reached.concat(['dns']); }
        else { st.wire = null; st.failedAt = 'L7-DNS'; }
        st.banner = dnsOk ? 'DNS ✓ → ' + WEB.ip : 'DNS ✗';
      }
    });
    if(stop === 'dns'){ return steps; }

    /* ── L4: TCP ── */
    var tcpOk = (b !== 'fw');
    var tp = mk(CLI.ip, WEB.ip, GW.mac, WEB.mac, 'SYN :443', 'gw', 'web', 'ack');
    steps.push({
      t:at(), actor:'gw', layer:'L4', kind: tcpOk ? 'ok' : 'error',
      title: tcpOk ? '✓ ধাপ ৪ — TCP: connection তৈরি হলো'
                   : '✗ ধাপ ৪ — Firewall SYN ফেলে দিচ্ছে',
      packet: tcpOk ? tp : null,
      what: tcpOk
        ? 'SYN → SYN-ACK → ACK। Connection ESTABLISHED।'
        : 'Firewall port ৪৪৩ বন্ধ করে দিয়েছে এবং SYN গুলো নীরবে ফেলে দিচ্ছে। কোনো উত্তর নেই।',
      why : tcpOk
        ? 'Transport স্তর তৈরি। এবার HTTP-র পালা।'
        : '**এই উপসর্গটি চিনতে সময়ের দিকে তাকাতে হয়।**\n\n• DNS কাজ করছে ✓ (নামের IP পাওয়া গেছে)\n• `ping` হয়তো কাজ করছে ✓ (ICMP আলাদা, Firewall শুধু TCP 443 আটকেছে)\n• কিন্তু `curl` **দীর্ঘ অপেক্ষার পর** timeout ✗\n\nএই "দীর্ঘ অপেক্ষা"-টাই সূত্র। DROP মানে নীরবতা, আর নীরবতা মানে অপেক্ষা।\n\nযদি সঙ্গে সঙ্গে `Connection refused` আসত, তাহলে বুঝতাম কেউ RST দিয়েছে — অর্থাৎ port বন্ধ বা service চালু নেই। তখন খোঁজার জায়গা সম্পূর্ণ আলাদা হতো।\n\n**সরঞ্জাম:** ' + B.tool + '\n\nএখানে একটি সাধারণ ফাঁদ আছে — ping কাজ করছে দেখে অনেকে ভাবেন network ঠিক আছে। কিন্তু ping শুধু Layer 3 পরীক্ষা করে, TCP port নয়।',
      apply: function(st){
        if(tcpOk){ st.wire = { pkt:tp, from:'gw', to:'web' };
                   st.reached = st.reached.concat(['tcp']); }
        else { st.wire = null; st.failedAt = 'L4'; }
        st.banner = tcpOk ? 'TCP ✓ ESTABLISHED' : 'TCP ✗ — timeout';
      }
    });
    if(stop === 'tcp'){ return steps; }

    /* ── L7: HTTP ── */
    var httpOk = (b !== 'server');
    var hp = P.make([
      P.ethernet(WEB.mac, GW.mac, 'ip'),
      P.ip(WEB.ip, CLI.ip, 64, 'tcp', 200),
      P.tcp(443, 49152, 1, 1, 'PSH, ACK', 65535),
      P.data(httpOk ? 'HTTP/1.1 200 OK' : 'HTTP/1.1 500 Internal Server Error')
    ], { label: httpOk ? '200 OK' : '500 Error', kind: httpOk ? 'ack' : 'data',
         from:'web', to:'client' });

    steps.push({
      t:at(), actor:'web', layer:'L7', kind: httpOk ? 'ok' : 'error',
      title: httpOk ? '✓ ধাপ ৫ — HTTP: 200 OK, যাত্রা সম্পূর্ণ'
                    : '✗ ধাপ ৫ — HTTP 500, application-এ ত্রুটি',
      packet:hp,
      what: httpOk
        ? 'Server `200 OK` দিল এবং page পাঠাল। পাঁচটি স্তরই কাজ করেছে।'
        : 'Server `500 Internal Server Error` দিল। Network সম্পূর্ণ ঠিক — সমস্যা application-এর ভেতরে।',
      why : httpOk
        ? 'পুরো যাত্রাটি একবার দেখে নিন:\n\n`ARP` → `Routing` → `DNS` → `TCP` → `HTTP`\n\nপ্রতিটি স্তর নিজের কাজটুকু করেছে, আর পরের স্তরকে তার ভিত্তি দিয়েছে।\n\nDebugging-এ এই ক্রমটিই আপনার মানচিত্র। যেখানে থামে, সেখান থেকেই খোঁজা শুরু।\n\nএবার একটি একটি করে ভেঙে দেখুন — প্রতিটি ভাঙন কোথায় থামে আর কেমন উপসর্গ দেখায়, সেই মিলটাই আসল শিক্ষা।'
        : '**এটি একটি গুরুত্বপূর্ণ ক্ষেত্র — কারণ এখানে network-এর কোনো দোষ নেই।**\n\nদেখুন কী কী কাজ করেছে:\n\n• ARP ✓ • Routing ✓ • DNS ✓ • TCP ✓\n\nএতগুলো স্তর নিখুঁতভাবে কাজ করেছে। Request পৌঁছেছে, Server বুঝেছে, উত্তরও দিয়েছে। শুধু উত্তরটি একটি error।\n\n**সরঞ্জাম:** ' + B.tool + '\n\n`5xx` দেখলে network debugging এখানেই বন্ধ করা উচিত। উত্তর আছে server-এর log-এ, tcpdump-এ নয়।\n\nএই পার্থক্যটি চেনা একটি বড় দক্ষতা — "network-এর সমস্যা" আর "network দিয়ে পৌঁছানো একটি সমস্যা" এক জিনিস নয়।',
      apply: function(st){
        st.wire = { pkt:hp, from:'web', to:'client' };
        st.reached = st.reached.concat(['http']);
        if(!httpOk) st.failedAt = 'L7-app';
        st.banner = httpOk ? '200 OK · সম্পূর্ণ' : '500 — application-এ ত্রুটি';
      }
    });

    return steps;
  }
};

})(window.NetLab);

        why :'এখানে একটি গুরুত্বপূর্ণ ব্যাপার — ARP জিজ্ঞেস করা হচ্ছে **Gateway-র** MAC, web server-এর নয়।\n\nWeb server অন্য network-এ, তার MAC এই local link-এ কোনো কাজেই আসবে না।\n\nএটাই সেই মূল নিয়ম: **IP গন্তব্য পর্যন্ত অপরিবর্তিত থাকে, MAC প্রতিটি hop-এ বদলায়।**\n\n*(বিস্তারিত: ARP এবং Hop-by-Hop lab)*',
        apply: function(st){ st.wire = { pkt:ap, from:'client', to:'gw' };

                             st.banner = 'ARP → Gateway-র MAC'; }

    rtt++;
    var syn = mk([ P.ethernet(CLI.mac, GW.mac, 'ip'),
                   P.ip(CLI.ip, WEB.ip, 64, 'tcp', 40),
                   P.tcp(49152, 443, 1000, 0, 'SYN', 64240) ],
                 'SYN :443', 'ack', 'client', 'gw');
    steps.push({
      t:at(), actor:'client', layer:'L4', kind:'info',
      title:'৩. TCP Handshake — ১ RTT', packet:syn,
      what:'SYN → SYN-ACK → ACK। Connection **ESTABLISHED**।\n\nএখনো কোনো application data যায়নি।',
      why :'তিনটি Packet, এক RTT — শুধু এটুকু নিশ্চিত করতে যে দুই পক্ষ পরস্পরকে শুনতে পাচ্ছে এবং sequence number-এ একমত।\n\nএই খরচটুকু অনিবার্য, কিন্তু **পুনর্ব্যবহারযোগ্য**। Keep-Alive দিয়ে একই connection বারবার ব্যবহার করলে পরের request গুলোতে এই খরচ আর লাগে না।\n\n*(বিস্তারিত: TCP Three-Way Handshake lab)*',
      apply: function(st){ st.wire = { pkt:syn, from:'client', to:'gw' };
                           st.phase = 'tcp'; st.rtt = rtt; add(st, 'TCP');
                           st.banner = 'TCP ESTABLISHED · ' + rtt + ' RTT'; }
    });

    /* ── ৪. NAT ── */
    var np = mk([ P.ethernet('GG:GG:GG:GG:GG:02', WEB.mac, 'ip'),
                  P.ip(GW.pub, WEB.ip, 63, 'tcp', 40),
                  P.tcp(60001, 443, 1000, 0, 'SYN', 64240) ],
                'NAT: → ' + GW.pub, 'data', 'gw', 'web');
    steps.push({
      t:at(), actor:'gw', layer:'L3', kind:'info',
      title:'৪. NAT — ঠিকানা বদলে গেল', packet:np,
      what:'Router source বদলে দিল:\n\n`192.168.1.10:49152` → `' + GW.pub + ':60001`\n\nআর TTL ৬৪ থেকে ৬৩ হলো।',
      why :'Private IP Internet-এ route হয় না, তাই বদলাতেই হবে।\n\nএখানে দুটি জিনিস একসাথে ঘটছে, আর দুটোই এই যাত্রার নিয়মিত অংশ:\n\n• **NAT** — source ঠিকানা বদল, যাতে উত্তর ফেরত আসতে পারে\n• **TTL কমানো** — প্রতিটি Router বাধ্যতামূলকভাবে এটি করে\n\nWeb server কখনোই জানবে না `192.168.1.10` বলে কেউ আছে।\n\n*(বিস্তারিত: NAT এবং TTL lab)*',
      apply: function(st){ st.wire = { pkt:np, from:'gw', to:'web' };
                           st.phase = 'nat'; add(st, 'NAT');
                           st.banner = 'NAT → ' + GW.pub + ':60001'; }
    });

    /* ── ৫. TLS ── */
    if(warm){
      steps.push({
        t:at(), actor:'client', layer:'L7', kind:'ok',
        title:'৫. TLS — Session Resumption, ০ RTT বাড়তি',
        what:'আগের connection-এর TLS session ticket ছিল। তাই পুরো handshake আবার করতে হলো না।\n\nবাড়তি খরচ প্রায় শূন্য।',
        why :'TLS 1.3-এর একটি বড় অর্জন এটি। আগে দেখা হয়েছে এমন server-এর সাথে সে **0-RTT** পর্যন্ত করতে পারে — অর্থাৎ handshake-এর সাথেই data পাঠিয়ে দেওয়া।\n\nএখান থেকেই বোঝা যায় আধুনিক optimization-এর মূল লক্ষ্য কী: RTT দ্রুত করা নয় (সেটি অসম্ভব), বরং **RTT-র সংখ্যা কমানো**।\n\n*(বিস্তারিত: TLS Handshake lab)*',
        apply: function(st){ st.phase = 'tls'; add(st, 'TLS (resume)');
                             st.banner = 'TLS resumed · 0 RTT'; }
      });
    } else {
      rtt++;
      var tp = mk([ P.ethernet(CLI.mac, GW.mac, 'ip'),
                    P.ip(CLI.ip, WEB.ip, 64, 'tcp', 300),
                    P.tcp(49152, 443, 1001, 5001, 'PSH, ACK', 64240),
                    { name:'TLS ClientHello', layer:'L7', size:250,
                      fields:[['payload','ClientHello · SNI=example.com · key share']] } ],
                  'ClientHello', 'data', 'client', 'web');
      steps.push({
        t:at(), actor:'client', layer:'L7', kind:'info',
        title:'৫. TLS Handshake — আরও ১ RTT', packet:tp,
        what:'ClientHello → ServerHello + Certificate → যাচাই → চাবি তৈরি।\n\nBrowser তিনটি জিনিস মিলিয়ে দেখল: সইকারী চেনা? নাম মেলে? মেয়াদ আছে?',
        why :'TLS 1.3-এ এটি **১ RTT** (TLS 1.2-এ ছিল ২)।\n\nএখানে গোপন চাবিটি কখনো network-এ যায় না — দুই পাশ আলাদাভাবে সেটি হিসাব করে বের করে।\n\nমনে রাখবেন TLS তিনটি জিনিস দেয়: গোপনীয়তা, অখণ্ডতা, আর পরিচয়। **Website-টি সৎ কিনা সে বিষয়ে সে কিছুই বলে না।**\n\n*(বিস্তারিত: TLS Handshake lab)*',
        apply: function(st){ st.wire = { pkt:tp, from:'client', to:'web' };
                             st.phase = 'tls'; st.rtt = rtt; add(st, 'TLS');
                             st.banner = 'TLS ✓ · ' + rtt + ' RTT'; }
      });
    }

    /* ── ৬. HTTP ── */
    rtt++;
    var hp = mk([ P.ethernet(CLI.mac, GW.mac, 'ip'),
                  P.ip(CLI.ip, WEB.ip, 64, 'tcp', 200),
                  P.tcp(49152, 443, 1300, 5300, 'PSH, ACK', 64240),
                  P.data('GET / HTTP/1.1  Host: example.com  (encrypted)') ],
                '🔒 GET /', 'data', 'client', 'web');
    steps.push({
      t:at(), actor:'client', layer:'L7', kind:'ok',
      title:'৬. HTTP Request — অবশেষে আসল প্রশ্ন', packet:hp,
      what:'এতগুলো ধাপের পর এই প্রথম আসল request গেল:\n\n`GET / HTTP/1.1`\n`Host: example.com`\n\nএবং এটি এখন **encrypted**।',
      why :'এতক্ষণে মোট **' + rtt + ' RTT** খরচ হয়ে গেছে — একটি byte HTML আসার আগেই।\n\nServer যদি ১০০ ms দূরে হয়, তার মানে ' + (rtt * 100) + ' ms শুধু প্রস্তুতিতে।\n\nএই হিসাবটিই আধুনিক web performance-এর কেন্দ্রীয় সমস্যা, আর সব সমাধানই এই এক লক্ষ্যে:\n\n• **CDN** → দূরত্ব কমিয়ে প্রতিটি RTT ছোট করা\n• **Keep-Alive** → TCP handshake বারবার না করা\n• **TLS resumption** → TLS handshake বারবার না করা\n• **QUIC** → TCP আর TLS handshake একসাথে মিশিয়ে ফেলা\n\n*(বিস্তারিত: HTTP এবং Latency lab)*',
      apply: function(st){ st.wire = { pkt:hp, from:'client', to:'web' };
                           st.phase = 'http'; st.rtt = rtt; add(st, 'HTTP');
                           st.banner = 'GET / · মোট ' + rtt + ' RTT'; }
    });

    var rp = mk([ P.ethernet(WEB.mac, GW.mac, 'ip'),
                  P.ip(WEB.ip, GW.pub, 64, 'tcp', 1500),
                  P.tcp(443, 60001, 5300, 1400, 'PSH, ACK', 65535),
                  P.data('HTTP/1.1 200 OK  <html>… (encrypted)') ],
                '🔒 200 OK', 'ack', 'web', 'client');
    steps.push({
      t:at(), actor:'web', layer:'L7', kind:'ok',
      title:'৭. Response — 200 OK, HTML এলো', packet:rp,
      what:'Server `200 OK` দিল এবং HTML পাঠাল।\n\nউত্তরটি NAT Router-এ গিয়ে আবার `192.168.1.10:49152`-এ রূপান্তরিত হয়ে Browser-এ পৌঁছাল।',
      why :'HTML এলো, কিন্তু **কাজ শেষ হয়নি**।\n\nBrowser এবার HTML পড়বে, আর তাতে পাবে CSS, JavaScript, ছবি, font-এর তালিকা। প্রতিটির জন্য আবার request যাবে।\n\nভাগ্য ভালো, বেশিরভাগ ক্ষেত্রে সেগুলো **একই connection** ব্যবহার করবে (Keep-Alive), তাই handshake আর লাগবে না। আর CDN থেকে এলে দূরত্বও কম।\n\nএকটি সাধারণ page-এ ৫০-১০০টি এমন request হয়।\n\n*(বিস্তারিত: TCP Reliability এবং CDN lab)*',
      apply: function(st){ st.wire = { pkt:rp, from:'web', to:'client' };
                           st.phase = 'done'; add(st, 'Response');
                           st.banner = '200 OK · HTML এলো'; }
    });

    var tags = warm
      ? ['DNS (cache)','TCP','NAT','TLS (resume)','HTTP','Response']
      : ['DNS','ARP','TCP','NAT','TLS','HTTP','Response'];

    steps.push({
      t:at(), actor:'client', layer:'L7', kind:'ok',
      title:'সম্পূর্ণ — মোট ' + rtt + ' RTT' + (warm ? ' (cache-এর কারণে কম)' : ''),
      what:'পুরো যাত্রা এক নজরে:\n\n`' + tags.join('` → `') + '`\n\nমোট **' + rtt + ' RTT**।',
      why : warm
        ? 'Cache থাকায় দুটি ধাপ প্রায় বিনামূল্যে হয়ে গেল — DNS আর TLS।\n\nএই তুলনাটিই দেখিয়ে দেয় কেন cache এত গুরুত্বপূর্ণ। কোনো কাজ দ্রুত হয়নি; কিছু কাজ **করতেই হয়নি**।\n\nএখন `সবকিছু আগে থেকে cache-এ আছে` বন্ধ করে দেখুন প্রথমবার কত বেশি কাজ লাগে।\n\nএবং একবার ভেবে দেখুন — এই পুরো ব্যবস্থাটি প্রতিদিন কোটি কোটি বার ঘটছে, প্রায় সবসময় নিখুঁতভাবে, আর কেউ টেরও পাচ্ছেন না।'
        : 'এই একটিমাত্র page load-এ যা যা জড়িত ছিল:\n\n**ছয়টি protocol** — DNS, ARP, IP, TCP, TLS, HTTP\n**চারটি যন্ত্র** — Browser, Router, DNS Resolver, Web Server\n**পাঁচটি স্তর** — L2 থেকে L7\n\nআর প্রতিটি স্তর তার নিচেরটির উপর সম্পূর্ণ নির্ভরশীল, অথচ **তার ভেতরের কিছুই জানে না**।\n\nএই অজ্ঞতাটাই আসলে সবচেয়ে বড় শক্তি। HTTP জানে না নিচে TCP আছে না QUIC। TCP জানে না নিচে fiber আছে না wifi। তাই প্রতিটি স্তর আলাদাভাবে বদলাতে পেরেছে — IPv6, TLS 1.3, HTTP/2, HTTP/3 — কখনো পুরো Internet একসাথে বদলাতে হয়নি।\n\nDebugging-এর সময় এই ক্রমটিই আপনার মানচিত্র। যেখানে থেমে যায়, সেখান থেকেই খোঁজা শুরু — নিচ থেকে উপরে।\n\n*(অনুশীলন: Break-It Mode lab-এ এক এক করে ভেঙে দেখুন)*',
      apply: function(st){ st.wire = null; st.rtt = rtt;
                           st.banner = 'সম্পূর্ণ · ' + rtt + ' RTT · ' + tags.length + ' ধাপ'; }
    });

    return steps;
  }
};

})(window.NetLab);

/* ─── ui/canvas.js ─── */
/* ═══════════════════════════════════════════════════════════════════
   UI · NETWORK CANVAS
   ───────────────────────────────────────────────────────────────────
   State থেকে SVG এঁকে দেয়। এই file কোনো simulation সিদ্ধান্ত নেয় না —
   শুধু যা state-এ আছে তা-ই দেখায়।
   ═══════════════════════════════════════════════════════════════════ */
(function(NS){
"use strict";

var ICON = { pc:'🖥', switch:'🔀', router:'🧭', server:'🗄' };

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* সব device (hub সহ) এক তালিকায় — অবস্থান খোঁজার জন্য */
function allNodes(st){
  var a = st.devices.slice();
  if(st.hub) a.push(st.hub);
  return a;
}
function findNode(st, id){
  var a = allNodes(st);
  for(var i = 0; i < a.length; i++) if(a[i].id === id) return a[i];
  return null;
}

function render(el, st, opts){
  opts = opts || {};
  var active = opts.active || null;     // এই মুহূর্তে যে device কাজ করছে
  var sel    = opts.selected || null;   // user যাকে click করেছে
  var nodes  = allNodes(st);
  var out    = [];

  out.push('<svg viewBox="0 0 100 100" preserveAspectRatio="none" class="nc-wires">');
  /* ── তার ── */
  for(var i = 0; i < st.links.length; i++){
    var L = st.links[i];
    var a = findNode(st, L.a), b = findNode(st, L.b);
    if(!a || !b) continue;
    out.push('<line x1="'+a.x+'" y1="'+a.y+'" x2="'+b.x+'" y2="'+b.y+'" class="nc-wire"/>');
  }
  out.push('</svg>');

  /* ── device ── */
  for(var j = 0; j < nodes.length; j++){
    var d = nodes[j];
    var cls = 'nc-node t-' + d.type;
    if(d.id === active) cls += ' active';
    if(d.id === sel)    cls += ' sel';
    var sub = d.ip ? d.ip
            : d.type === 'router' && d.ifaces && d.ifaces[0] ? d.ifaces[0].ip
            : d.type === 'switch' ? 'Layer 2' : '';
    out.push(
      '<button class="' + cls + '" style="left:' + d.x + '%;top:' + d.y + '%" ' +
        'data-dev="' + esc(d.id) + '" title="Inspect করতে click করুন">' +
        '<span class="ic">' + ICON[d.type] + '</span>' +
        '<span class="nm">' + esc(d.name) + '</span>' +
        (sub ? '<span class="ip">' + esc(sub) + '</span>' : '') +
        (d.note ? '<span class="badge">' + esc(d.note) + '</span>' : '') +
      '</button>'
    );
  }

  /* ── তারের উপরে চলমান packet ── */
  if(st.wire && st.wire.pkt){
    var w = st.wire;
    var from = findNode(st, w.from);
    var targets = [];
    if(w.to === 'flood' || w.to === 'both'){
      /* Broadcast/flood: Switch থেকে সবার দিকে — কিন্তু যে port দিয়ে Frame টি
         ঢুকেছে সেদিকে ফেরত যায় না। তাই মূল প্রেরককেও (w.origin) বাদ দিতে হয়। */
      for(var k = 0; k < nodes.length; k++){
        var n = nodes[k];
        if(n.id === w.from || n.id === w.origin) continue;
        if(n.type === 'switch') continue;
        targets.push(n);
      }
    } else {
      var tnode = findNode(st, w.to);
      if(tnode) targets.push(tnode);
    }
    if(from){
      for(var m = 0; m < targets.length; m++){
        var tg = targets[m];
        var mx = (from.x + tg.x) / 2, my = (from.y + tg.y) / 2;
        out.push(
          '<button class="nc-pkt k-' + esc(st.wire.pkt.kind) + '" ' +
            'style="left:' + mx + '%;top:' + my + '%" data-pkt="1" ' +
            'title="Packet Inspector-এ দেখুন">' +
            esc(st.wire.pkt.label || 'Packet') +
          '</button>'
        );
      }
    }
  }

  /* কিছু lab (Encapsulation) movement নয়, স্তর দেখায় — তখন canvas-এ
     মোড়কগুলো ছবির মতো করে দেখানো হয়। */
  if(st.stack && st.stack.length){
    out.push(stackHTML(st.stack));
  }

  el.innerHTML = out.join('');
}

/* Encapsulation-এর স্তর — বাইরের মোড়ক আগে, ভেতরের data শেষে */
var STACK_INFO = {
  L7: ['Application Data', 'payload'],
  L4: ['TCP / UDP Header',  'L4'],
  L3: ['IP Header',         'L3'],
  L2: ['Ethernet Header',   'L2'],
  L1: ['Bits',              'L1']
};
function stackHTML(stack){
  /* state-এ ক্রম L7→L1 (যোগ হওয়ার ক্রম); দেখাতে হবে বাইরের মোড়ক উপরে */
  var order = ['L1','L2','L3','L4','L7'];
  var o = ['<div class="nc-stack">'];
  for(var i = 0; i < order.length; i++){
    var k = order[i];
    if(stack.indexOf(k) === -1) continue;
    var info = STACK_INFO[k];
    var isNewest = stack[stack.length - 1] === k;
    o.push('<div class="ns-row l-' + k + (isNewest ? ' new' : '') + '">' +
             '<span class="ns-tag">' + k + '</span>' +
             '<span class="ns-nm">' + info[0] + '</span>' +
           '</div>');
  }
  o.push('</div>');
  return o.join('');
}

/* ───────── Calculator panel (Subnet Calculator-এর মতো lab-এর জন্য) ───────── */
function renderPanel(el, p){
  if(p.err){
    el.innerHTML = '<div class="cp-err">' + esc(p.err) + '</div>';
    return;
  }
  var o = ['<div class="cp">'];

  /* bit গুলো — কোনটা network আর কোনটা host, রঙ দিয়ে আলাদা */
  o.push('<div class="cp-bits"><span class="n">' + esc(p.bits.net) + '</span>' +
         '<span class="h">' + esc(p.bits.host) + '</span></div>');
  o.push('<div class="cp-legend">' +
           '<span><i class="sw-n"></i>' + p.cidr + ' bit network</span>' +
           '<span><i class="sw-h"></i>' + (32 - p.cidr) + ' bit host</span>' +
         '</div>');

  o.push('<div class="cp-rows">');
  for(var i = 0; i < p.rows.length; i++){
    var r = p.rows[i];
    o.push('<button class="cp-row" data-why="' + esc(r[2]) + '">' +
             '<span class="k">' + esc(r[0]) + '</span>' +
             '<span class="v">' + esc(r[1]) + '</span>' +
           '</button>' +
           '<div class="cp-why">' + esc(r[2]) + '</div>');

NS.ui = NS.ui || {};

/* ─── ui/inspector.js ─── */
/* ═══════════════════════════════════════════════════════════════════
   UI · INSPECTOR
   ───────────────────────────────────────────────────────────────────
   ডানপাশের panel — Packet-এর প্রতিটি field, অথবা Device-এর ভেতরের অবস্থা।
   ═══════════════════════════════════════════════════════════════════ */
(function(NS){
"use strict";
var esc = NS.ui.canvas.esc;
var P   = NS.pkt;

/* ───────── Packet Inspector ───────── */
function packetHTML(pkt){
  if(!pkt) return '<div class="ins-empty">কোনো Packet select করা নেই।<br><span>Canvas-এ চলন্ত Packet-এ বা Timeline-এর কোনো ধাপে click করুন।</span></div>';

  var o = ['<div class="ins-h">Packet #' + pkt.id +
           '<span class="sz">' + pkt.size + ' bytes</span></div>'];

  for(var i = 0; i < pkt.layers.length; i++){
    var L  = pkt.layers[i];
    var LI = P.LAYERS[L.layer] || { n:L.layer, c:'faint' };
    o.push('<div class="ins-layer c-' + LI.c + '">');
    o.push('<div class="ins-lh"><span class="tag">' + esc(L.layer) + '</span>' +
           '<span class="nm">' + esc(L.name) + '</span>' +
           '<span class="sz">' + (L.size || 0) + 'B</span></div>');
    o.push('<div class="ins-ld">' + esc(LI.d || '') + '</div>');

    for(var j = 0; j < L.fields.length; j++){
      var k = L.fields[j][0], v = L.fields[j][1];
      var help = P.FIELD_HELP[k] || '';
      o.push('<button class="ins-f" data-help="' + esc(help) + '">' +
               '<span class="k">' + esc(k) + '</span>' +
               '<span class="v">' + esc(v) + '</span>' +
             '</button>');
      if(help) o.push('<div class="ins-fh">' + esc(help) + '</div>');
    }
    o.push('</div>');
  }
  return o.join('');
}

/* ───────── Device Inspector ───────── */
function kv(k, v){
  return '<div class="dv-row"><span class="k">' + esc(k) + '</span>' +
         '<span class="v">' + esc(v) + '</span></div>';
}

function tableOrEmpty(rows, head, emptyMsg){
  if(!rows.length) return '<div class="dv-empty">' + esc(emptyMsg) + '</div>';
  var o = ['<table class="dv-t"><thead><tr>'];
  for(var i = 0; i < head.length; i++) o.push('<th>' + esc(head[i]) + '</th>');
  o.push('</tr></thead><tbody>');
  for(var r = 0; r < rows.length; r++){
    o.push('<tr>');
    for(var c = 0; c < rows[r].length; c++) o.push('<td>' + esc(rows[r][c]) + '</td>');
    o.push('</tr>');
  }
  o.push('</tbody></table>');
  return o.join('');
}

function deviceHTML(d){
  if(!d) return '<div class="ins-empty">কোনো Device select করা নেই।<br><span>Canvas-এ যেকোনো device-এ click করুন।</span></div>';

  var o = ['<div class="ins-h">' + esc(d.name) +
           '<span class="sz">' + esc(d.type) + '</span></div>'];

  if(d.type === 'pc' || d.type === 'server'){
    o.push('<div class="dv-sec">');
    o.push(kv('MAC Address', d.mac));
    o.push(kv('IP Address', d.ip));
    o.push(kv('Subnet Mask', d.mask));
    if(d.gw) o.push(kv('Default Gateway', d.gw));
    o.push('</div>');

    var arpRows = [];
    for(var ip in d.arp) if(d.arp.hasOwnProperty(ip)) arpRows.push([ip, d.arp[ip].mac]);
    o.push('<div class="dv-t-h">ARP Cache</div>');
    o.push(tableOrEmpty(arpRows, ['IP Address','MAC Address'],
      'খালি — এই device এখনো কারো MAC Address জানে না।'));

    if(d.listening && d.listening.length){
      var pr = [];
      for(var i = 0; i < d.listening.length; i++){
        var p = d.listening[i];
        pr.push([String(p.port), p.service, p.open ? 'খোলা' : 'বন্ধ']);
      }
      o.push('<div class="dv-t-h">Listening Ports</div>');
      o.push(tableOrEmpty(pr, ['Port','Service','অবস্থা'], ''));
    }
  }

  if(d.type === 'switch'){
    var mr = [];
    for(var mac in d.macTable) if(d.macTable.hasOwnProperty(mac))
      mr.push([mac, 'Port ' + d.macTable[mac].port]);
    o.push('<div class="dv-t-h">MAC Address Table</div>');
    o.push(tableOrEmpty(mr, ['MAC Address','Port'],
      'খালি — Switch এখনো কিছু শেখেনি। Frame এলে Source MAC দেখে শিখবে।'));
    o.push('<div class="dv-note">Switch একটি Layer 2 device — সে IP Address দেখে না, শুধু MAC Address দেখে সিদ্ধান্ত নেয়।</div>');
  }

  if(d.type === 'router'){
    o.push('<div class="dv-t-h">Interfaces</div>');
    var ir = [];
    for(var k = 0; k < (d.ifaces || []).length; k++){
      var f = d.ifaces[k];
      ir.push([f.name, f.ip, f.mac]);
    }
    o.push(tableOrEmpty(ir, ['Interface','IP','MAC'], ''));

    if(d.routes && d.routes.length){
      var rr = [];
      for(var q = 0; q < d.routes.length; q++){
        var rt = d.routes[q];
        rr.push([rt.dst + '/' + rt.prefix, rt.via || 'directly', rt.iface]);
      }
      o.push('<div class="dv-t-h">Routing Table</div>');
      o.push(tableOrEmpty(rr, ['Destination','Next Hop','Interface'], ''));
    }

    var ar = [];
    for(var aip in d.arp) if(d.arp.hasOwnProperty(aip)) ar.push([aip, d.arp[aip].mac]);
    o.push('<div class="dv-t-h">ARP Cache</div>');
    o.push(tableOrEmpty(ar, ['IP Address','MAC Address'], 'খালি।'));
  }

  return o.join('');
}

NS.ui.inspector = { packetHTML: packetHTML, deviceHTML: deviceHTML };

})(window.NetLab);

/* ─── ui/timeline.js ─── */
/* ═══════════════════════════════════════════════════════════════════
   UI · EVENT TIMELINE
   ───────────────────────────────────────────────────────────────────
   নিচের অংশ — প্রতিটি ঘটনা ক্রম অনুসারে। click করলে সেই ধাপে ফেরত যায়।
   ═══════════════════════════════════════════════════════════════════ */
(function(NS){
"use strict";
var esc = NS.ui.canvas.esc;

/* simulated clock — শুরু 10:01:00, প্রতিটি ধাপ ১ সেকেন্ড */
function clock(t){
  var s = t % 60, m = Math.floor(t / 60);
  return '10:' + String(1 + m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}

function render(el, eng){
  var o = [];
  if(!eng.steps.length){
    el.innerHTML = '<div class="tl-empty">এই lab-এ কোনো ধাপ নেই।</div>';
    return;
  }
  for(var i = 0; i < eng.steps.length; i++){
    var s = eng.steps[i];
    var cls = 'tl-item k-' + (s.kind || 'info');
    if(i === eng.i)  cls += ' now';
    if(i <  eng.i)   cls += ' past';
    if(i >  eng.i)   cls += ' future';
    o.push(
      '<button class="' + cls + '" data-step="' + i + '">' +
        '<span class="tl-t">' + clock(s.t) + '</span>' +
        '<span class="tl-actor">' + esc(s.actor) + '</span>' +
        '<span class="tl-title">' + esc(s.title) + '</span>' +
        '<span class="tl-layer">' + esc(s.layer || '') + '</span>' +
      '</button>'
    );
  }
  el.innerHTML = o.join('');

  var now = el.querySelector('.tl-item.now');
  if(now && now.scrollIntoView) now.scrollIntoView({ block:'nearest', inline:'nearest' });
}

NS.ui.timeline = { render: render, clock: clock };

})(window.NetLab);

/* ─── ui/app.js ─── */
/* ═══════════════════════════════════════════════════════════════════
   UI · APP SHELL
   ───────────────────────────────────────────────────────────────────
   Engine ↔ UI-র সংযোগস্থল। Engine state বদলালেই এখান থেকে সব panel
   নতুন করে আঁকা হয়।
   ═══════════════════════════════════════════════════════════════════ */
(function(NS){
"use strict";
var esc = NS.ui.canvas.esc;

var $ = function(id){ return document.getElementById(id); };

var App = {
  eng: null,
  lab: null,
  cfg: {},
  selDev: null,
  selPkt: null,
  timer: null,
  speed: 1200,
  insMode: 'packet'
};

/* ───────── THEME (book-এর সাথে একই key, তাই setting ভাগাভাগি হয়) ───────── */
function initTheme(){
  var root = document.documentElement, btn = $('themeBtn');
  function apply(t){
    root.setAttribute('data-theme', t);
    btn.textContent = t === 'dark' ? '☀️' : '🌙';
    try { localStorage.setItem('nf-theme', t); } catch(e){}
  }
  var saved = null;
  try { saved = localStorage.getItem('nf-theme'); } catch(e){}
  if(!saved) saved = window.matchMedia &&
    window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  apply(saved);
  btn.addEventListener('click', function(){
    apply(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });
}

/* ───────── LAB LIST ───────── */
function renderLabs(){
  var labs = NS.labList(), o = [], group = null;
  for(var i = 0; i < labs.length; i++){
    var L = labs[i];
    if(L.group !== group){ group = L.group; o.push('<div class="lab-group">' + esc(group) + '</div>'); }
    o.push('<button class="lab-item' + (App.lab && L.id === App.lab.id ? ' on' : '') +
           '" data-lab="' + esc(L.id) + '">' +
             '<span class="t">' + esc(L.title) + '</span>' +
             '<span class="d">' + esc(L.blurb) + '</span>' +
           '</button>');
  }
  $('labList').innerHTML = o.join('');
}

/* ───────── CONTROLS (প্রতিটি lab-এর নিজস্ব) ───────── */
function renderControls(){
  var c = App.lab.controls || [], o = [];
  for(var i = 0; i < c.length; i++){
    var ct = c[i], v = App.cfg[ct.key];
    if(ct.type === 'toggle'){
      o.push('<label class="ctl-row"><input type="checkbox" data-ctl="' + esc(ct.key) + '"' +
             (v ? ' checked' : '') + '><span class="cl">' + esc(ct.label) + '</span></label>');
    } else if(ct.type === 'text'){
      o.push('<div class="ctl-row col"><span class="cl">' + esc(ct.label) + '</span>' +
             '<input type="text" data-ctl="' + esc(ct.key) + '" value="' + esc(v) +
             '" spellcheck="false" autocomplete="off"></div>');
    } else if(ct.type === 'range'){
      o.push('<div class="ctl-row col"><span class="cl">' + esc(ct.label) +
               ' <b class="ctl-v">/' + esc(v) + '</b></span>' +
             '<input type="range" data-ctl="' + esc(ct.key) + '" value="' + esc(v) +
             '" min="' + ct.min + '" max="' + ct.max + '" step="1"></div>');
    } else if(ct.type === 'choice'){
      o.push('<div class="ctl-row col"><span class="cl">' + esc(ct.label) + '</span>' +
             '<select data-ctl="' + esc(ct.key) + '">');
      for(var j = 0; j < ct.options.length; j++){
        var op = ct.options[j];
        o.push('<option value="' + esc(op[0]) + '"' +
               (v === op[0] ? ' selected' : '') + '>' + esc(op[1]) + '</option>');
      }
      o.push('</select></div>');
    }
    if(ct.help) o.push('<div class="ctl-help">' + esc(ct.help) + '</div>');
  }
  $('labControls').innerHTML = o.join('') ||
    '<div class="ctl-help">এই lab-এ কোনো বাড়তি setting নেই।</div>';
}

/* explanation-এ `code` আর **bold** লেখা যায় — সেটুকু markdown এখানে রূপান্তর হয় */
function inline(s){
  return esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
}

/* ───────── LEARNING PANEL ───────── */
function renderLearn(){
  var L = App.lab, o = [];

  o.push('<div class="ln-h">এই Lab-এ কী শিখবেন</div><ul class="ln-list">');
  for(var i = 0; i < L.learn.length; i++) o.push('<li>' + inline(L.learn[i]) + '</li>');
  o.push('</ul>');

  if(L.mistakes && L.mistakes.length){
    o.push('<div class="ln-h">প্রচলিত ভুল ধারণা</div>');
    for(var j = 0; j < L.mistakes.length; j++){
      var m = L.mistakes[j];
      o.push('<div class="ln-myth">' +
               '<div class="mm"><span class="lbl">ভুল ধারণা</span>' + inline(m.m) + '</div>' +
               '<div class="mr"><span class="lbl">সঠিক ধারণা</span>' + inline(m.r) + '</div>' +
             '</div>');
    }
  }

  o.push('<a class="ln-book" href="index.html#' + esc(L.chapter) + '" target="_blank" ' +
         'rel="noopener">এই concept সম্পর্কে বিস্তারিত পড়ুন →<span>বই-এর ' +
         esc(L.chapter.toUpperCase()) + '</span></a>');

  $('learnPanel').innerHTML = o.join('');
}

/* ───────── "এখন কী হলো?" ───────── */
function mini(s){
  return inline(s).replace(/\n\n/g, '</p><p>');
}

function renderWhat(){
  var s = App.eng.current();
  if(!s){
    $('whatPanel').innerHTML =
      '<div class="wh-idle">▶ <b>চালু</b> চাপুন, অথবা <b>এক ধাপ</b> দিয়ে ধীরে ধীরে এগোন।<br>' +
      '<span>প্রতিটি ধাপের পর এখানে ব্যাখ্যা আসবে।</span></div>';
    return;
  }
  var LI = NS.pkt.LAYERS[s.layer] || { n:s.layer || '' };
  $('whatPanel').innerHTML =
    '<div class="wh-top"><span class="wh-k k-' + esc(s.kind || 'info') + '">' +
      esc(s.actor) + '</span><span class="wh-layer">' + esc(LI.n) + '</span></div>' +
    '<div class="wh-q">এখন কী হলো?</div><p>' + mini(s.what) + '</p>' +
    '<div class="wh-q">কেন?</div><p>' + mini(s.why) + '</p>';
}

/* ───────── সব panel নতুন করে আঁকা ───────── */
function paint(){
  var eng = App.eng, st = eng.state, cur = eng.current();

  $('canvasWrap').classList.toggle('calc', !!App.lab.panel);
  if(App.lab.panel){
    NS.ui.canvas.renderPanel($('canvas'), App.lab.panel(App.cfg));
  } else {
    NS.ui.canvas.render($('canvas'), st, {
      active: cur ? cur.actor : null,
      selected: App.selDev
    });
  }

  /* current step-এ packet থাকলে সেটিই inspector-এ দেখাও */
  if(cur && cur.packet) App.selPkt = cur.packet;

  NS.ui.timeline.render($('timeline'), eng);
  renderWhat();
  renderInspector();

  $('stepNow').textContent = (eng.i + 1) + ' / ' + eng.steps.length;
  $('banner').textContent  = st.banner || '';
  $('btnStep').disabled    = eng.done();
  $('btnBack').disabled    = eng.i < 0;
  $('btnPlay').textContent = App.timer ? '⏸ বিরতি' : '▶ চালু';
}

function renderInspector(){
  var dev = null;
  if(App.selDev){
    var all = App.eng.state.devices.slice();
    if(App.eng.state.hub) all.push(App.eng.state.hub);
    for(var i = 0; i < all.length; i++) if(all[i].id === App.selDev) dev = all[i];
  }
  $('insBody').innerHTML = App.insMode === 'packet'
    ? NS.ui.inspector.packetHTML(App.selPkt)
    : NS.ui.inspector.deviceHTML(dev);

  var tabs = document.querySelectorAll('#insTabs button');
  for(var t = 0; t < tabs.length; t++)
    tabs[t].classList.toggle('on', tabs[t].getAttribute('data-ins') === App.insMode);
}

/* ───────── PLAYBACK ───────── */
function stop(){
  if(App.timer){ clearInterval(App.timer); App.timer = null; }
}
function play(){
  if(App.timer) { stop(); paint(); return; }
  /* শেষ পর্যন্ত চলে গেলে ▶ চাপলে আবার শুরু থেকে */
  if(App.eng.done()) App.eng.seek(-1);
  App.timer = setInterval(function(){
    var moved = App.eng.step();
    if(!moved) stop();
    /* প্রতিটি ধাপেই আঁকতে হবে — নইলে state এগোয় কিন্তু পর্দায় কিছু বদলায় না */
    paint();
  }, App.speed);
  paint();
}

/* ───────── LAB LOAD ───────── */
function loadLab(id){
  stop();
  var lab = NS.labs[id];
  if(!lab) return;
  App.lab = lab;
  App.cfg = { seed: 1 };
  var c = lab.controls || [];
  for(var i = 0; i < c.length; i++) App.cfg[c[i].key] = c[i].def;

  App.selDev = null;
  App.selPkt = null;
  App.eng = new NS.Engine(lab, App.cfg).on(function(){ /* paint নিজে ডাকা হয় */ });

  $('labTitle').textContent = lab.title;
  $('labBlurb').textContent = lab.blurb;
  renderLabs();
  renderControls();
  renderLearn();
  paint();

  try { localStorage.setItem('nl-lab', id); } catch(e){}
  if(window.innerWidth <= 1080) $('sidebar').classList.remove('open');
}

/* config বদলালে simulation নতুন করে বানাতে হয় */
function rebuild(){
  stop();
  App.eng = new NS.Engine(App.lab, App.cfg);
  App.selPkt = null;
  paint();     /* controls নিজে আবার আঁকা হয় না — তাই typing-এর caret ঠিক থাকে */
}

/* ───────── EVENTS ───────── */
function bind(){
  $('labList').addEventListener('click', function(e){
    var b = e.target.closest('[data-lab]');
    if(b) loadLab(b.getAttribute('data-lab'));
  });

  function onCtl(e){
    var el = e.target.closest('[data-ctl]');
    if(!el) return;
    App.cfg[el.getAttribute('data-ctl')] =
      el.type === 'checkbox' ? el.checked : el.value;
    /* range-এর পাশের সংখ্যাটা সাথে সাথে বদলাক */
    var lbl = el.parentNode.querySelector('.ctl-v');
    if(lbl && el.type === 'range') lbl.textContent = '/' + el.value;
    rebuild();
  }
  $('labControls').addEventListener('change', onCtl);
  $('labControls').addEventListener('input', onCtl);

  $('btnPlay').addEventListener('click', play);
  $('btnStep').addEventListener('click', function(){ stop(); App.eng.step(); paint(); });
  $('btnBack').addEventListener('click', function(){ stop(); App.eng.back(); paint(); });
  $('btnReset').addEventListener('click', function(){ stop(); App.eng.reset(); App.selPkt = null; paint(); });

  $('speed').addEventListener('input', function(){
    App.speed = 2400 - parseInt(this.value, 10);
    $('speedLbl').textContent = (App.speed / 1000).toFixed(1) + 's';
    if(App.timer){ stop(); play(); }
  });

  $('timeline').addEventListener('click', function(e){
    var b = e.target.closest('[data-step]');
    if(!b) return;
    stop();
    App.eng.seek(parseInt(b.getAttribute('data-step'), 10));
    paint();
  });

  $('canvas').addEventListener('click', function(e){
    var d = e.target.closest('[data-dev]');
    if(d){
      App.selDev = d.getAttribute('data-dev');
      App.insMode = 'device';
      renderInspector();
      NS.ui.canvas.render($('canvas'), App.eng.state, {
        active: App.eng.current() ? App.eng.current().actor : null,
        selected: App.selDev
      });
      return;
    }
    if(e.target.closest('[data-pkt]')){
      var st = App.eng.state;
      if(st.wire && st.wire.pkt){ App.selPkt = st.wire.pkt; App.insMode = 'packet'; renderInspector(); }
    }
  });

  $('insTabs').addEventListener('click', function(e){
    var b = e.target.closest('[data-ins]');
    if(!b) return;
    App.insMode = b.getAttribute('data-ins');
    renderInspector();
  });

  /* field-এ click করলে তার ব্যাখ্যা খোলে/বন্ধ হয় */
  /* Calculator-এর সারিতে click করলে ব্যাখ্যা খোলে */
  $('canvas').addEventListener('click', function(e){
    var r = e.target.closest('.cp-row');
    if(!r) return;
    var why = r.nextElementSibling;
    if(why && why.classList.contains('cp-why')){
      why.classList.toggle('on');
      r.classList.toggle('open');
    }
  });

  $('insBody').addEventListener('click', function(e){
    var f = e.target.closest('.ins-f');
    if(!f) return;
    var help = f.nextElementSibling;
    if(help && help.classList.contains('ins-fh')){
      help.classList.toggle('on');
      f.classList.toggle('open');
    }
  });

  $('menuBtn').addEventListener('click', function(){ $('sidebar').classList.toggle('open'); });
  $('backdrop').addEventListener('click', function(){ $('sidebar').classList.remove('open'); });

  document.addEventListener('keydown', function(e){
    if(e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
    if(e.key === ' ' || e.key === 'k'){ e.preventDefault(); play(); }
    else if(e.key === 'ArrowRight'){ stop(); App.eng.step(); paint(); }
    else if(e.key === 'ArrowLeft'){ stop(); App.eng.back(); paint(); }
    else if(e.key === 'r'){ stop(); App.eng.reset(); paint(); }
  });
}

/* ───────── START ───────── */
function boot(){
  initTheme();
  bind();
  var want = null;
  if(location.hash) want = location.hash.slice(1);
  if(!want){ try { want = localStorage.getItem('nl-lab'); } catch(e){} }
  loadLab(NS.labs[want] ? want : NS.LAB_ORDER[0]);
}

if(document.readyState === 'loading')
  document.addEventListener('DOMContentLoaded', boot);
else boot();

})(window.NetLab);
</script>
</body>
