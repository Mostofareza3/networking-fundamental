<!DOCTYPE html>
<html lang="bn" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Network Core Lab — Interactive Networking Simulator</title>
<style>
/* ═══════════ TOKENS — বই-এর সাথে হুবহু একই, তাই দুটো একই product মনে হয় ═══════════ */
:root{
  --bg:#ffffff; --bg-alt:#f7f8fa; --bg-sunken:#eef0f4;
  --panel:#ffffff; --panel-2:#f4f6f9;
  --text:#1a1d23; --text-dim:#5b6472; --text-faint:#8a93a3;
  --border:#e0e4ea; --border-strong:#c8cfd9;
  --accent:#1f6feb; --accent-soft:#e7f0fe; --accent-text:#0b4fc4;
  --ok:#127a3d; --ok-soft:#e4f6ea;
  --warn:#9a5b00; --warn-soft:#fdf1dd;
  --danger:#b3261e; --danger-soft:#fdeceb;
  --purple:#6c3fc5; --purple-soft:#f0eafd;
  --teal:#0d6b70; --teal-soft:#e2f4f4;
  --code-bg:#f5f7fa; --code-border:#e2e6ec; --code-text:#1f2933;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 4px 14px rgba(16,24,40,.06);
  --shadow-lg:0 10px 40px rgba(16,24,40,.12);
  --mono:"SF Mono",ui-monospace,"JetBrains Mono","Fira Code",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Bengali","Hind Siliguri",Roboto,"Helvetica Neue",Arial,sans-serif;
  --sbw:300px; --insw:330px; --tlh:132px;
}
[data-theme="dark"]{
  --bg:#0d1117; --bg-alt:#131922; --bg-sunken:#0a0e14;
  --panel:#151b24; --panel-2:#1b222d;
  --text:#e6edf3; --text-dim:#9fb0c3; --text-faint:#6b7d92;
  --border:#232c39; --border-strong:#334052;
  --accent:#58a6ff; --accent-soft:#12233d; --accent-text:#79b8ff;
  --ok:#4ec97e; --ok-soft:#0f2a1c;
  --warn:#e3b341; --warn-soft:#2b2110;
  --danger:#ff7b72; --danger-soft:#2d1416;
  --purple:#b992ff; --purple-soft:#221a35;
  --teal:#4fd1c5; --teal-soft:#0c2a29;
  --code-bg:#0f151d; --code-border:#222c39; --code-text:#d7e2ee;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  --shadow-lg:0 14px 50px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);
  font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased;overflow:hidden;
}
code{font-family:var(--mono);font-size:.86em;background:var(--code-bg);border:1px solid var(--code-border);padding:1px 5px;border-radius:5px;color:var(--code-text)}
strong{font-weight:680;color:var(--text)}

/* ═══════════ TOPBAR ═══════════ */
#topbar{
  position:fixed;top:0;left:0;right:0;height:52px;z-index:150;
  background:var(--bg);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;padding:0 14px;
}
#topbar .brand{font-weight:700;font-size:14.5px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topbar .brand span{color:var(--text-faint);font-weight:500}
.tb-spacer{flex:1}
.iconbtn{
  background:var(--panel);border:1px solid var(--border);color:var(--text-dim);
  height:32px;padding:0 11px;border-radius:8px;cursor:pointer;text-decoration:none;
  display:inline-flex;align-items:center;gap:6px;font-size:13px;font-family:inherit;transition:.15s;
}
.iconbtn:hover{color:var(--text);border-color:var(--border-strong);background:var(--panel-2)}
#menuBtn{display:none}

/* ═══════════ LAYOUT ═══════════ */
#shell{position:fixed;top:52px;left:0;right:0;bottom:var(--tlh);display:flex}
#sidebar{
  width:var(--sbw);flex:0 0 var(--sbw);border-right:1px solid var(--border);
  background:var(--bg-alt);overflow-y:auto;padding:12px 10px 40px;
}
#main{flex:1;min-width:0;display:flex}
#stage{flex:1;min-width:0;overflow-y:auto;padding:18px 22px 40px}
#inspector{
  width:var(--insw);flex:0 0 var(--insw);border-left:1px solid var(--border);
  background:var(--bg-alt);overflow-y:auto;display:flex;flex-direction:column;
}

/* ═══════════ SIDEBAR — LAB LIST ═══════════ */
.lab-group{
  font-size:10px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;
  color:var(--text-faint);margin:16px 0 6px;padding:0 8px;
}
.lab-group:first-child{margin-top:2px}
.lab-item{
  display:block;width:100%;text-align:left;background:none;border:1px solid transparent;
  border-radius:9px;padding:8px 10px;cursor:pointer;font-family:inherit;margin-bottom:2px;transition:.13s;
}
.lab-item:hover{background:var(--panel-2)}
.lab-item .t{display:block;font-size:13.8px;font-weight:650;color:var(--text)}
.lab-item .d{display:block;font-size:11.8px;color:var(--text-faint);line-height:1.5;margin-top:2px}
.lab-item.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 32%,transparent)}
.lab-item.on .t{color:var(--accent-text)}
.lab-soon{
  padding:5px 10px;font-size:12.4px;color:var(--text-faint);opacity:.55;
  display:flex;align-items:center;gap:6px;
}
.lab-soon::before{content:"○";font-size:9px}
.side-sec{margin-top:22px;border-top:1px solid var(--border);padding-top:14px}
.side-sec.first{margin-top:0;border-top:0;padding-top:2px;border-bottom:1px solid var(--border);padding-bottom:10px;margin-bottom:4px}
.side-h{
  font-size:10px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;
  color:var(--text-faint);margin:0 0 9px;padding:0 8px;
}
/* Control */
.ctl-row{display:flex;align-items:flex-start;gap:8px;padding:5px 8px;cursor:pointer;font-size:13.2px;color:var(--text-dim)}
.ctl-row.col{flex-direction:column;gap:5px}
.ctl-row input[type=checkbox]{margin-top:5px;accent-color:var(--accent);cursor:pointer}
.ctl-row .cl{flex:1;line-height:1.45}
.ctl-row select{
  width:100%;font-family:inherit;font-size:13px;padding:6px 9px;border-radius:7px;
  border:1px solid var(--border-strong);background:var(--panel);color:var(--text);cursor:pointer;
}
.ctl-help{font-size:11.6px;color:var(--text-faint);line-height:1.55;padding:0 8px 9px;margin-top:-2px}

/* ═══════════ STAGE HEAD ═══════════ */
#stageHead{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px}
#stageHead>div:first-child{flex:1;min-width:220px}
#labTitle{font-size:1.32rem;margin:0;letter-spacing:-.015em;font-weight:750}
#labBlurb{margin:3px 0 0;color:var(--text-dim);font-size:13.6px;line-height:1.6}
#controls{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pbtn{
  background:var(--panel);border:1px solid var(--border);color:var(--text-dim);
  height:32px;padding:0 12px;border-radius:8px;cursor:pointer;font-family:inherit;
  font-size:12.8px;font-weight:600;transition:.14s;white-space:nowrap;
}
.pbtn:hover:not(:disabled){color:var(--text);border-color:var(--border-strong);background:var(--panel-2)}
.pbtn:disabled{opacity:.38;cursor:default}
.pbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.pbtn.primary:hover{filter:brightness(1.08)}
.sp-wrap{display:flex;align-items:center;gap:6px;margin-left:2px}
#speed{width:78px;accent-color:var(--accent);cursor:pointer}
#speedLbl,.step-n{font-family:var(--mono);font-size:11.5px;color:var(--text-faint);font-variant-numeric:tabular-nums}
.step-n{padding-left:6px;border-left:1px solid var(--border);margin-left:2px}

/* ═══════════ CANVAS ═══════════ */
#canvasWrap{
  position:relative;border:1px solid var(--border);border-radius:14px;
  background:var(--bg-alt);height:270px;overflow:hidden;
}
/* Calculator-এ topology নেই, তাই উচ্চতা content অনুযায়ী — কাটা পড়বে না */
#canvasWrap.calc{height:auto;min-height:270px}
#canvas{position:absolute;inset:0}
#canvasWrap.calc #canvas{position:static}
.nc-wires{position:absolute;inset:0;width:100%;height:100%}
.nc-wire{stroke:var(--border-strong);stroke-width:.35;vector-effect:non-scaling-stroke}
.nc-node{
  position:absolute;transform:translate(-50%,-50%);
  background:var(--panel);border:1px solid var(--border);border-radius:11px;
  padding:8px 12px;min-width:96px;cursor:pointer;font-family:inherit;
  display:flex;flex-direction:column;align-items:center;gap:1px;transition:.16s;box-shadow:var(--shadow);
}
.nc-node:hover{border-color:var(--border-strong)}
.nc-node .ic{font-size:17px;line-height:1.2}
.nc-node .nm{font-size:12.4px;font-weight:650;color:var(--text)}
.nc-node .ip{font-family:var(--mono);font-size:10.2px;color:var(--text-faint)}
.nc-node .badge{
  position:absolute;top:-7px;right:-7px;background:var(--danger);color:#fff;
  font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:9px;
}
.nc-node.t-router{border-color:color-mix(in srgb,var(--accent) 34%,transparent)}
.nc-node.t-switch{border-color:color-mix(in srgb,var(--teal) 34%,transparent)}
.nc-node.active{
  border-color:var(--accent);background:var(--accent-soft);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent);
}
.nc-node.sel{border-color:var(--purple);box-shadow:0 0 0 3px color-mix(in srgb,var(--purple) 20%,transparent)}
.nc-pkt{
  position:absolute;transform:translate(-50%,-50%);
  font-family:var(--mono);font-size:10.5px;font-weight:700;
  padding:4px 9px;border-radius:20px;cursor:pointer;border:1px solid;white-space:nowrap;
  animation:pktIn .3s ease;
}
@keyframes pktIn{from{opacity:0;transform:translate(-50%,-50%) scale(.7)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.nc-pkt.k-data{background:var(--accent);border-color:var(--accent);color:#fff}
.nc-pkt.k-arp {background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.nc-pkt.k-ack {background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
/* Subnet Calculator-এর ফলাফল */
.cp{padding:14px 16px}
.cp-err{padding:26px 18px;color:var(--danger);font-size:13.6px;text-align:center}
.cp-bits{
  font-family:var(--mono);font-size:12.5px;letter-spacing:.06em;word-break:break-all;
  padding:9px 12px;border-radius:9px;background:var(--panel);border:1px solid var(--border);
}
.cp-bits .n{color:var(--accent);font-weight:700}
.cp-bits .h{color:var(--text-faint)}
.cp-legend{display:flex;gap:16px;margin:7px 2px 12px;font-size:11.4px;color:var(--text-faint)}
.cp-legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.cp-legend .sw-n{background:var(--accent)}
.cp-legend .sw-h{background:var(--text-faint)}
.cp-rows{border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--panel)}
.cp-row{
  display:flex;width:100%;gap:10px;align-items:baseline;padding:8px 13px;background:none;
  border:0;border-bottom:1px solid var(--border);cursor:pointer;text-align:left;
  font-family:inherit;transition:.12s;
}
.cp-row:hover{background:var(--panel-2)}
.cp-row .k{flex:0 0 140px;min-width:0;font-size:12.4px;color:var(--text-dim)}
.cp-row .v{flex:1;min-width:0;font-family:var(--mono);font-size:13px;font-weight:700;color:var(--accent-text);word-break:break-all;text-align:right}
.cp-row.open{background:var(--accent-soft)}
.cp-why{
  display:none;padding:8px 13px 11px;font-size:12.2px;line-height:1.6;
  color:var(--text-dim);background:var(--bg-alt);border-bottom:1px solid var(--border);
}
.cp-why.on{display:block}
.cp-rows .cp-row:last-of-type{border-bottom:0}
/* Control-এর text/range */
.ctl-row input[type=text]{
  width:100%;font-family:var(--mono);font-size:13px;padding:6px 9px;border-radius:7px;
  border:1px solid var(--border-strong);background:var(--panel);color:var(--text);
}
.ctl-row input[type=text]:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.ctl-row input[type=range]{width:100%;accent-color:var(--accent);cursor:pointer}
.ctl-v{font-family:var(--mono);color:var(--accent);font-weight:700}

/* Encapsulation-এর স্তর */
.nc-stack{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  display:flex;flex-direction:column;gap:3px;width:min(300px,72%);
}
.ns-row{
  display:flex;align-items:center;gap:8px;padding:6px 11px;border-radius:8px;
  border:1px solid var(--border);background:var(--panel);
  font-family:var(--mono);font-size:11.5px;transition:.2s;
}
.ns-row .ns-tag{
  font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:4px;
  background:var(--bg-sunken);color:var(--text-dim);border:1px solid var(--border);
}
.ns-row .ns-nm{color:var(--text-dim);font-weight:600}
.ns-row.l-L2{border-color:color-mix(in srgb,var(--teal) 42%,transparent);background:var(--teal-soft)}
.ns-row.l-L3{border-color:color-mix(in srgb,var(--accent) 42%,transparent);background:var(--accent-soft)}
.ns-row.l-L4{border-color:color-mix(in srgb,var(--purple) 42%,transparent);background:var(--purple-soft)}
.ns-row.l-L7{border-color:color-mix(in srgb,var(--warn) 42%,transparent);background:var(--warn-soft)}
.ns-row.new{
  box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 26%,transparent);
  animation:nsIn .28s ease;
}
@keyframes nsIn{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}

/* Banner topology-র উপরে ভাসে; calculator-এ সেটি শেষ সারিটি ঢেকে দেয় */
#canvasWrap.calc #banner{display:none}
#banner{
  position:absolute;left:12px;bottom:11px;font-family:var(--mono);font-size:11.5px;
  color:var(--text-faint);background:color-mix(in srgb,var(--bg) 80%,transparent);
  padding:3px 9px;border-radius:6px;pointer-events:none;
}

/* ═══════════ "এখন কী হলো?" ═══════════ */
#whatPanel{
  margin-top:16px;border:1px solid var(--border);border-left:3px solid var(--accent);
  border-radius:12px;background:var(--panel);padding:14px 17px;
}
.wh-idle{color:var(--text-dim);font-size:13.6px;line-height:1.7}
.wh-idle span{color:var(--text-faint);font-size:12.6px}
.wh-top{display:flex;align-items:center;gap:9px;margin-bottom:9px;flex-wrap:wrap}
.wh-k{
  font-family:var(--mono);font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;
  background:var(--accent-soft);color:var(--accent-text);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);
}
.wh-k.k-ok   {background:var(--ok-soft);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.wh-k.k-warn {background:var(--warn-soft);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 38%,transparent)}
.wh-k.k-error{background:var(--danger-soft);color:var(--danger);border-color:color-mix(in srgb,var(--danger) 38%,transparent)}
.wh-layer{font-size:11.5px;color:var(--text-faint);letter-spacing:.03em}
.wh-q{
  font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  color:var(--text-faint);margin:12px 0 3px;
}
.wh-q:first-of-type{margin-top:0}
#whatPanel p{margin:0 0 .7em;font-size:14.4px;line-height:1.75;color:var(--text-dim)}
#whatPanel p:last-child{margin-bottom:0}
#whatPanel strong{color:var(--text)}

/* ═══════════ LEARNING PANEL ═══════════ */
#learnPanel{margin-top:16px}
.ln-h{
  font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  color:var(--text-faint);margin:18px 0 7px;
}
.ln-h:first-child{margin-top:0}
.ln-list{margin:0;padding-left:1.25em;color:var(--text-dim);font-size:14px}
.ln-list li{margin:.3em 0}
.ln-list li::marker{color:var(--accent)}
.ln-myth{border:1px solid var(--border);border-radius:11px;overflow:hidden;margin-bottom:9px}
.ln-myth .mm,.ln-myth .mr{padding:10px 14px;font-size:13.8px;line-height:1.65}
.ln-myth .mm{background:var(--danger-soft);border-bottom:1px dashed color-mix(in srgb,var(--danger) 40%,transparent);color:var(--text-dim)}
.ln-myth .mr{background:var(--ok-soft);color:var(--text-dim)}
.ln-myth .lbl{display:block;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.12em;margin-bottom:3px}
.ln-myth .mm .lbl{color:var(--danger)}
.ln-myth .mr .lbl{color:var(--ok)}
.ln-book{
  display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px;
  padding:12px 16px;border:1px solid var(--border);border-radius:11px;background:var(--panel);
  color:var(--accent);text-decoration:none;font-size:14px;font-weight:650;transition:.15s;
}
.ln-book:hover{border-color:var(--accent);background:var(--panel-2)}
.ln-book span{color:var(--text-faint);font-size:11.5px;font-weight:500;font-family:var(--mono)}

/* ═══════════ INSPECTOR ═══════════ */
#insTabs{display:flex;border-bottom:1px solid var(--border);background:var(--panel-2);position:sticky;top:0;z-index:2}
#insTabs button{
  flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:10px 0;
  font-family:inherit;font-size:13px;font-weight:650;color:var(--text-faint);cursor:pointer;transition:.13s;
}
#insTabs button:hover{color:var(--text)}
#insTabs button.on{color:var(--accent);border-bottom-color:var(--accent);background:var(--bg-alt)}
#insBody{padding:12px;flex:1}
.ins-empty{color:var(--text-faint);font-size:13.2px;text-align:center;padding:34px 16px;line-height:1.7}
.ins-empty span{font-size:12px;opacity:.8}
.ins-h{
  display:flex;justify-content:space-between;align-items:baseline;
  font-weight:700;font-size:13.5px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border);
}
.ins-h .sz{font-family:var(--mono);font-size:11px;color:var(--text-faint);font-weight:500}
.ins-layer{border:1px solid var(--border);border-radius:10px;margin-bottom:8px;overflow:hidden;background:var(--panel)}
.ins-lh{display:flex;align-items:center;gap:7px;padding:8px 11px;background:var(--panel-2);border-bottom:1px solid var(--border)}
.ins-lh .tag{font-family:var(--mono);font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:4px;background:var(--bg-sunken);color:var(--text-dim);border:1px solid var(--border)}
.ins-lh .nm{flex:1;font-size:12.6px;font-weight:650}
.ins-lh .sz{font-family:var(--mono);font-size:10.5px;color:var(--text-faint)}
.ins-ld{padding:6px 11px;font-size:11.6px;color:var(--text-faint);line-height:1.55;border-bottom:1px solid var(--border)}
.ins-layer.c-teal   .ins-lh{background:var(--teal-soft)}
.ins-layer.c-accent .ins-lh{background:var(--accent-soft)}
.ins-layer.c-purple .ins-lh{background:var(--purple-soft)}
.ins-layer.c-warn   .ins-lh{background:var(--warn-soft)}
.ins-f{
  display:flex;width:100%;gap:8px;align-items:baseline;padding:6px 11px;background:none;
  border:0;border-bottom:1px solid var(--border);cursor:pointer;font-family:var(--mono);
  font-size:11.8px;text-align:left;transition:.12s;
}
.ins-f:hover{background:var(--panel-2)}
.ins-f .k{color:var(--text-faint);flex:0 0 74px}
.ins-f .v{color:var(--text);font-weight:600;word-break:break-all;flex:1}
.ins-f.open{background:var(--accent-soft)}
.ins-f.open .v{color:var(--accent-text)}
.ins-fh{display:none;padding:8px 11px 10px;font-size:12.2px;color:var(--text-dim);background:var(--bg-alt);border-bottom:1px solid var(--border);line-height:1.6}
.ins-fh.on{display:block}
.ins-layer .ins-f:last-of-type{border-bottom:0}
/* Device inspector */
.dv-sec{border:1px solid var(--border);border-radius:10px;background:var(--panel);padding:4px 0;margin-bottom:12px}
.dv-row{display:flex;gap:8px;padding:5px 12px;font-family:var(--mono);font-size:11.8px}
.dv-row .k{color:var(--text-faint);flex:0 0 108px}

<script>
/* ─── core/engine.js ─── */
/* ═══════════════════════════════════════════════════════════════════
   SIMULATION ENGINE
   ───────────────────────────────────────────────────────────────────
   এই file-এ কোনো DOM নেই, কোনো UI নেই। শুধু simulation-এর logic।

   একটি Lab একটি script() function দেয় যা step-এর array return করে।
   Engine সেই step গুলো একটার পর একটা চালায় এবং প্রতিটি step-এ
   একটি নতুন immutable state তৈরি করে।

   Deterministic: একই lab + একই config = সবসময় একই step sequence.
   কোনো Math.random() নেই — এলোমেলো লাগলে seeded RNG ব্যবহার হয়।
   ═══════════════════════════════════════════════════════════════════ */
(function(NS){
"use strict";

/* ───────── Seeded RNG — determinism রক্ষার জন্য ───────── */
/* Math.random() ব্যবহার করলে একই input-এ ভিন্ন result আসত, তাই
   mulberry32 — ছোট, দ্রুত, এবং seed দিলে সবসময় একই sequence। */
function rng(seed){
  var s = seed >>> 0;
  return function(){
    s = (s + 0x6D2B79F5) >>> 0;
    var t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ───────── deep clone — structuredClone সব browser-এ নেই ───────── */
function clone(v){
  if(v === null || typeof v !== 'object') return v;
  if(Array.isArray(v)){
    var a = new Array(v.length);
    for(var i = 0; i < v.length; i++) a[i] = clone(v[i]);
    return a;
  }
  var o = {};
  for(var k in v) if(Object.prototype.hasOwnProperty.call(v, k)) o[k] = clone(v[k]);
  return o;
}

/* ═══════════════ Engine ═══════════════ */
/*  lab = {
        id, title, blurb,
        chapter,                  ← book-এর কোন chapter-এ এই concept
        learn:[…], mistakes:[…],  ← Learning System-এর অংশ
        controls:[…],             ← user যা যা বদলাতে পারে
        build(cfg) → state        ← শুরুর state
        script(state, cfg, rand) → [step…]
    }

    step = {
        t,                        ← simulated clock (ms)
        actor,                    ← কোন device কাজ করছে
        title,                    ← timeline-এ এক লাইন (Bangla)
        layer,                    ← 'L1'|'L2'|'L3'|'L4'|'L7'
        what, why,                ← "এখন কী হলো?" / "কেন?"  (Bangla)
        kind,                     ← 'ok'|'warn'|'error'|'info'
        packet,                   ← inspect করার মতো packet (optional)
        apply(state)              ← state mutate করে (engine clone দেয়)
    }                                                                  */
function Engine(lab, cfg){
  this.lab     = lab;
  this.cfg     = cfg || {};
  this.rand    = rng(this.cfg.seed == null ? 1 : this.cfg.seed);
  this.subs    = [];
  this.reset();
}

Engine.prototype.reset = function(){
  this.rand    = rng(this.cfg.seed == null ? 1 : this.cfg.seed);
  this.initial = this.lab.build(this.cfg);
  this.steps   = this.lab.script(clone(this.initial), this.cfg, this.rand) || [];
  this.i       = -1;                     // -1 = কিছুই চলেনি
  this.state   = clone(this.initial);
  this.history = [clone(this.initial)];  // history[n] = n ধাপের পরের state
  this.playing = false;
  this.emit();
};

/* এক ধাপ এগোনো */
Engine.prototype.step = function(){
  if(this.i >= this.steps.length - 1) return false;
  this.i++;
  var st = clone(this.state);
  var s  = this.steps[this.i];
  if(s.apply) s.apply(st);
  this.state = st;
  this.history[this.i + 1] = clone(st);
  this.emit();
  return true;
};

/* এক ধাপ পিছনে — history থেকে, তাই কোনো "undo" logic লাগে না */
Engine.prototype.back = function(){
  if(this.i < 0) return false;
  this.i--;
  this.state = clone(this.history[this.i + 1]);
  this.emit();
  return true;
};

/* নির্দিষ্ট step-এ লাফ */
Engine.prototype.seek = function(n){
  n = Math.max(-1, Math.min(n, this.steps.length - 1));
  if(n === this.i) return;
  if(n < this.i){
    this.i = n;
    this.state = clone(this.history[n + 1]);
  } else {
    while(this.i < n) this.step();
  }
  this.emit();
};

Engine.prototype.done    = function(){ return this.i >= this.steps.length - 1; };
Engine.prototype.current = function(){ return this.i < 0 ? null : this.steps[this.i]; };

/* ───────── subscription — UI এখানে হুক করে ───────── */
Engine.prototype.on   = function(fn){ this.subs.push(fn); return this; };
Engine.prototype.emit = function(){
  for(var i = 0; i < this.subs.length; i++) this.subs[i](this);
};

NS.Engine = Engine;
NS.rng    = rng;
NS.clone  = clone;

})(window.NetLab = window.NetLab || {});

/* ─── core/packet.js ─── */
/* ═══════════════════════════════════════════════════════════════════
   PACKET MODEL
   ───────────────────────────────────────────────────────────────────
   Packet/Frame-এর গঠন এবং প্রতিটি field-এর Bangla ব্যাখ্যা এক জায়গায়।

   Inspector এখান থেকেই field-এর explanation নেয়, তাই একই field-এর
   ব্যাখ্যা প্রতিটি lab-এ হুবহু একই থাকে।
   ═══════════════════════════════════════════════════════════════════ */
(function(NS){
"use strict";

/* প্রতিটি field-এর পাশে যে ছোট Bangla ব্যাখ্যা দেখানো হয় */
var FIELD_HELP = {
  /* Layer 2 — Ethernet */
  'dstMAC'   : 'এই local link-এ Frame-টি কোন NIC গ্রহণ করবে। প্রতিটি hop-এ এটি বদলায়।',
  'srcMAC'   : 'যে NIC থেকে Frame-টি বের হলো। এটিও প্রতিটি hop-এ বদলায়।',
  'ethertype': 'Payload-এ কোন protocol আছে তা বলে — 0x0800 মানে IPv4, 0x0806 মানে ARP।',
  'fcs'      : 'Frame Check Sequence — transmission-এ Frame নষ্ট হয়েছে কিনা receiver এটি দিয়ে যাচাই করে।',

  /* Layer 3 — IP */
  'srcIP'    : 'Packet-টি মূলত কোন host থেকে এসেছে। সাধারণত পুরো journey-তে একই থাকে।',
  'dstIP'    : 'Packet-টি শেষ পর্যন্ত কোথায় যাবে। Routing decision এই field দেখেই নেওয়া হয়।',
  'ttl'      : 'Time To Live — প্রতিটি Router এটি ১ কমায়। 0 হলে Packet drop হয়, যাতে loop-এ অসীমকাল ঘুরতে না পারে।',
  'proto'    : 'IP-এর উপরে কোন protocol আছে — 6 মানে TCP, 17 মানে UDP, 1 মানে ICMP।',
  'ipLen'    : 'Header সহ পুরো IP Packet-এর দৈর্ঘ্য (byte)।',

  /* Layer 4 — TCP/UDP */
  'srcPort'  : 'পাঠানো host-এর কোন application এই data পাঠাচ্ছে। সাধারণত OS একটি ephemeral port দেয়।',
  'dstPort'  : 'গন্তব্য host-এর কোন service-এর জন্য data — যেমন 80 মানে HTTP, 443 মানে HTTPS।',
  'seq'      : 'Sequence Number — এই segment-এর প্রথম byte পুরো stream-এর কত নম্বর byte।',
  'ack'      : 'ACK Number — receiver এর আগ পর্যন্ত সব byte পেয়েছে, এখন এটি আশা করছে।',
  'flags'    : 'TCP-র control bit — SYN connection শুরু করে, ACK স্বীকৃতি দেয়, FIN শেষ করে।',
  'window'   : 'Receive Window — receiver আর কত byte নিতে পারবে। Flow control এটি দিয়েই হয়।',

  /* ARP */
  'op'       : 'ARP operation — 1 মানে Request (কে আছে?), 2 মানে Reply (আমি আছি)।',
  'spa'      : 'Sender Protocol Address — যে জিজ্ঞেস করছে তার IP Address।',
  'sha'      : 'Sender Hardware Address — যে জিজ্ঞেস করছে তার MAC Address।',
  'tpa'      : 'Target Protocol Address — যার MAC Address খোঁজা হচ্ছে সেই IP।',
  'tha'      : 'Target Hardware Address — উত্তর আসার আগে এটি অজানা (00:00:00:00:00:00)।',

  /* Payload */
  'payload'  : 'Application-এর আসল data। নিচের প্রতিটি layer এই data-কেই বহন করছে।'
};

/* Layer-এর নাম ও রঙের mapping — সব UI একই vocabulary ব্যবহার করে */
var LAYERS = {
  L1: { n:'Layer 1 · Physical',    c:'faint',  d:'Bit আকারে cable/radio-তে signal।' },
  L2: { n:'Layer 2 · Data Link',   c:'teal',   d:'একই local network-এ MAC Address দিয়ে Frame delivery।' },
  L3: { n:'Layer 3 · Network',     c:'accent', d:'ভিন্ন network-এর মধ্যে IP Address দিয়ে routing।' },
  L4: { n:'Layer 4 · Transport',   c:'purple', d:'Port দিয়ে application চেনা, TCP হলে reliability।' },
  L7: { n:'Layer 7 · Application', c:'warn',   d:'HTTP, DNS-এর মতো protocol — আসল data।' }
};

/* ───────── Packet তৈরির helper ─────────
   প্রতিটি layer একটি {name, layer, fields} object.
   সবচেয়ে বাইরের layer array-র প্রথমে (Encapsulation-এর ক্রম অনুযায়ী)। */
function ethernet(src, dst, type){
  return {
    name  : 'Ethernet Header',
    layer : 'L2',
    size  : 14,
    fields: [
      ['dstMAC', dst],
      ['srcMAC', src],
      ['ethertype', type === 'arp' ? '0x0806 (ARP)' : '0x0800 (IPv4)']
    ]
  };
}

function arp(op, sha, spa, tha, tpa){
  return {
    name  : 'ARP ' + (op === 1 ? 'Request' : 'Reply'),
    layer : 'L2',
    size  : 28,
    fields: [
      ['op',  op === 1 ? '1 (Request)' : '2 (Reply)'],
      ['sha', sha],
      ['spa', spa],
      ['tha', tha],
      ['tpa', tpa]
    ]
  };
}

function ip(src, dst, ttl, proto, len){
  return {
    name  : 'IP Header',
    layer : 'L3',
    size  : 20,
    fields: [
      ['srcIP', src],
      ['dstIP', dst],
      ['ttl',   String(ttl)],
      ['proto', proto === 'tcp' ? '6 (TCP)' : proto === 'udp' ? '17 (UDP)' : '1 (ICMP)'],
      ['ipLen', String(len || 0) + ' bytes']
    ]
  };
}

function tcp(sp, dp, seq, ack, flags, win){
  return {
    name  : 'TCP Header',
    layer : 'L4',
    size  : 20,
    fields: [
      ['srcPort', String(sp)],
      ['dstPort', String(dp)],
      ['seq',     String(seq)],
      ['ack',     String(ack)],
      ['flags',   flags],
      ['window',  String(win) + ' bytes']
    ]
  };
}

function data(text){
  return {
    name  : 'Application Payload',
    layer : 'L7',
    size  : text.length,
    fields: [ ['payload', text] ]
  };
}

/* একটি packet = কয়েকটি layer + কিছু metadata */
var pktId = 0;
function make(layers, meta){
  var m = meta || {};
  var total = 0;
  for(var i = 0; i < layers.length; i++) total += layers[i].size || 0;
  return {
    id     : ++pktId,
    layers : layers,
    size   : total,
    label  : m.label  || '',      // canvas-এ packet-এর গায়ে যা লেখা থাকবে
    kind   : m.kind   || 'data',  // 'arp' | 'data' | 'ack' — রঙ ঠিক করে
    from   : m.from   || '',
    to     : m.to     || ''
  };
}
function resetIds(){ pktId = 0; }

/* একটি packet-এর ভেতর থেকে নির্দিষ্ট field খোঁজা */
function field(pkt, key){
  for(var i = 0; i < pkt.layers.length; i++){
    var f = pkt.layers[i].fields;
    for(var j = 0; j < f.length; j++) if(f[j][0] === key) return f[j][1];
  }
  return null;
}

/* ───────── IP helpers — Subnet lab এবং IP lab দুটোই ব্যবহার করে ───────── */
function ip2int(s){
  var p = String(s).split('.');
  if(p.length !== 4) return null;
  var n = 0;
  for(var i = 0; i < 4; i++){
    var v = parseInt(p[i], 10);
    if(isNaN(v) || v < 0 || v > 255 || p[i] === '') return null;
    n = (n * 256) + v;
  }
  return n;
}
function int2ip(n){
  return [ Math.floor(n / 16777216) % 256, Math.floor(n / 65536) % 256,
           Math.floor(n / 256) % 256, n % 256 ].join('.');
}
function maskInt(cidr){
  return cidr === 0 ? 0 : (Math.pow(2, 32) - Math.pow(2, 32 - cidr));
}
function maskToCidr(m){
  var n = ip2int(m); if(n === null) return null;
  var c = 0, seen0 = false;
  for(var b = 31; b >= 0; b--){
    var bit = Math.floor(n / Math.pow(2, b)) % 2;
    if(bit === 1){ if(seen0) return null; c++; } else seen0 = true;
  }
  return c;
}
/* দুটি IP একই subnet-এ আছে কিনা — IP lab-এর মূল প্রশ্ন */
function sameSubnet(a, b, mask){
  var m = ip2int(mask), x = ip2int(a), y = ip2int(b);
  if(m === null || x === null || y === null) return false;
  return netAddr(x, m) === netAddr(y, m);
}
function netAddr(ipn, maskn){
  /* JS-এর bitwise 32-bit signed, তাই ভাগ-গুণ দিয়ে করা হচ্ছে */
  var out = 0;
  for(var b = 31; b >= 0; b--){
    var p = Math.pow(2, b);
    var ib = Math.floor(ipn / p) % 2, mb = Math.floor(maskn / p) % 2;
    if(ib && mb) out += p;
  }
  return out;
}

/* ───────── Subnet হিসাব — Subnet Calculator ও IP lab দুটোই ব্যবহার করে ─────────
   JS-এর bitwise operator 32-bit signed, তাই 255.255.255.255-এর মতো মান
   ঋণাত্মক হয়ে যায়। সেজন্য সব হিসাব ভাগ-গুণ দিয়ে করা হচ্ছে। */
function subnet(ipStr, cidr){
  var n = ip2int(ipStr);
  if(n === null) return { err:'IP Address টি সঠিক নয়। উদাহরণ: 192.168.1.10' };
  if(cidr === null || isNaN(cidr) || cidr < 0 || cidr > 32)
    return { err:'CIDR ০ থেকে ৩২-এর মধ্যে হতে হবে।' };

  var m     = maskInt(cidr);
  var net   = netAddr(n, m);
  var size  = Math.pow(2, 32 - cidr);
  var bcast = net + size - 1;

  /* /31 আর /32 বিশেষ — এদের স্বাভাবিক host range নেই */
  var usable, first, last;
  if(cidr >= 31){
    usable = cidr === 32 ? 1 : 2;   /* /31 point-to-point link (RFC 3021) */
    first  = net;
    last   = bcast;
  } else {
    usable = size - 2;              /* network ও broadcast বাদ */
    first  = net + 1;
    last   = bcast - 1;
  }

  return {
    ip:        ipStr,
    cidr:      cidr,
    mask:      int2ip(m),
    network:   int2ip(net),
    broadcast: int2ip(bcast),
    first:     int2ip(first),
    last:      int2ip(last),
    total:     size,
    usable:    usable,
    special:   cidr >= 31
  };
}

/* একটি IP-কে 8-bit করে binary-তে দেখানো — কোন bit network, কোনটি host */
function bits(ipStr){
  var n = ip2int(ipStr);
  if(n === null) return '';
  var out = [];
  for(var o = 3; o >= 0; o--){
    var byte = Math.floor(n / Math.pow(256, o)) % 256, s = '';
    for(var b = 7; b >= 0; b--) s += (Math.floor(byte / Math.pow(2, b)) % 2);
    out.push(s);
  }
  return out.join('.');
}

/* Longest Prefix Match — সব মিল বের করে, সবচেয়ে দীর্ঘ prefix জেতে */
function lpm(dstStr, routes){
  var d = ip2int(dstStr), matches = [];
  for(var i = 0; i < routes.length; i++){
    var r = routes[i];
    var rn = ip2int(r.dst);
    if(rn === null) continue;
    var m = maskInt(r.prefix);
    if(netAddr(d, m) === netAddr(rn, m)) matches.push(r);
  }
  matches.sort(function(a, b){ return b.prefix - a.prefix; });
  return { matches: matches, best: matches.length ? matches[0] : null };
}

    steps.push({
      t:at(), actor:'client', layer:'L7', kind:'info',
      title:'Application data তৈরি হলো',
      packet: P.make([body], { label:'Data', kind:'data' }),
      what:'Browser একটি HTTP request বানাল — `GET /users HTTP/1.1`। এই মুহূর্তে এটি নিছক কিছু byte, কোনো header নেই।',
      why :'Application layer জানে **কী** পাঠাতে হবে, কিন্তু সেটি কীভাবে গন্তব্যে পৌঁছাবে তা নিয়ে সে ভাবে না। সেই দায়িত্ব নিচের layer গুলোর।',
      apply: function(st){ st.stack = ['L7']; st.banner = 'Payload তৈরি'; }
    });

    steps.push({
      t:at(), actor:'client', layer:'L4', kind:'ok',
      title: (isTcp ? 'TCP' : 'UDP') + ' Header যোগ হলো',
      packet: P.make([l4, body], { label: isTcp ? 'TCP Segment' : 'UDP Datagram', kind:'data' }),
      what:'data-র সামনে ' + (isTcp ? 'TCP' : 'UDP') + ' Header বসল। এখন এর নাম **' +
           (isTcp ? 'Segment' : 'Datagram') + '**।',
      why : isTcp
        ? 'Port দিয়ে বোঝা যাবে কোন application-এর data। আর Sequence Number ও ACK Number-এর জন্যই TCP হারানো data আবার পাঠাতে এবং ঠিক ক্রমে সাজাতে পারে।\n\nHeader-এর আকার ২০ byte — এই বাড়তি খরচেই reliability কেনা হচ্ছে।'
        : 'UDP-র header মাত্র ৮ byte — শুধু Port আর length। কোনো Sequence Number নেই, কোনো ACK নেই।\n\nতাই UDP হালকা ও দ্রুত, কিন্তু data হারিয়ে গেলে UDP নিজে কিছুই করবে না।',

      why :'IP-র কাজ হলো ভিন্ন ভিন্ন network পেরিয়ে গন্তব্যে পৌঁছানো। পথের প্রতিটি Router এই Destination IP দেখেই সিদ্ধান্ত নেবে Packet-টি কোন দিকে পাঠাতে হবে।\n\nলক্ষণীয় — IP-র কাছে পুরো TCP Segment-টি নিছক payload। ভেতরে Port কত, Sequence কত — IP এসব দেখেই না।',
      apply: function(st){ st.stack = ['L7','L4','L3']; st.banner = 'IP Header যোগ'; }
    });

    steps.push({
      t:at(), actor:'client', layer:'L2', kind:'ok',
      title:'Ethernet Header যোগ হলো',
      packet: P.make([l2, l3, l4, body], { label:'Ethernet Frame', kind:'data' }),

      why :'IP গন্তব্য ঠিক করে, কিন্তু এই মুহূর্তে Frame-টিকে শুধু পাশের device পর্যন্ত পৌঁছাতে হবে। সেই "পাশের device" চেনার কাজটাই MAC Address-এর।\n\nএজন্যই destination MAC হলো Router-এর, অথচ destination IP হলো দূরের Server-এর। প্রতিটি hop-এ Frame-এর MAC বদলাবে, কিন্তু ভেতরের IP একই থাকবে।',
      apply: function(st){ st.stack = ['L7','L4','L3','L2']; st.banner = 'Ethernet Frame প্রস্তুত'; }
    });

    steps.push({
      t:at(), actor:'client', layer:'L1', kind:'info',
      title:'Bit হিসেবে তারে চলে গেল',
      packet: P.make([l2, l3, l4, body], { label:'Bits', kind:'data' }),
      what:'পুরো Frame-টি এখন 0 আর 1-এর একটি ধারা হিসেবে cable-এ electrical signal আকারে যাচ্ছে।',
      why :'এখানেই নামার পথ শেষ। মজার ব্যাপার — তারের ভেতরে "Header" বলে আলাদা কিছু নেই, সবটাই একটানা bit। কোন bit কোন header তা receiver জানে কারণ প্রতিটি protocol-এর header-এর গঠন আগে থেকেই নির্ধারিত।',
      apply: function(st){
        st.stack = ['L7','L4','L3','L2','L1'];
        st.wire = { pkt: P.make([l2,l3,l4,body], {label:'Frame', kind:'data'}), from:'client', to:'srv' };
        st.banner = 'তারে পাঠানো হলো';
      }
    });

    steps.push({
      t:at(), actor:'srv', layer:'L2', kind:'ok',
      title:'Server উল্টো ক্রমে খুলতে শুরু করল',
      packet: P.make([l3, l4, body], { label:'Decapsulation', kind:'data' }),
      what:'Server Frame-টি পেয়ে Ethernet Header খুলে ফেলল, তারপর IP Header, তারপর ' +
           (isTcp ? 'TCP' : 'UDP') + ' Header — একে একে।',
      why :'এটাই **Decapsulation** — Encapsulation-এর ঠিক উল্টো। প্রতিটি layer নিজের header খুলে ভেতরের অংশটুকু উপরের layer-এ পাঠিয়ে দেয়।\n\nশেষে Application যা পায়, তা হুবহু সেই `GET /users HTTP/1.1` — মাঝখানে কী কী মোড়ক লেগেছিল সে তার কিছুই জানে না। এই না-জানাটাই layered design-এর সৌন্দর্য।',
      apply: function(st){ st.stack = ['L7']; st.wire = null; st.banner = 'Decapsulation সম্পন্ন'; }
    });

    return steps;
  }
};

})(window.NetLab);

  controls: [
    { key:'learned', type:'toggle', label:'MAC Table-এ আগে থেকেই সব entry আছে', def:false,
      help:'চালু করলে Switch আর flood করবে না — সরাসরি ঠিক port-এ পাঠাবে।' },
    { key:'reply', type:'toggle', label:'PC-B উত্তর পাঠাবে', def:true,
      help:'উত্তর এলে Switch PC-B-কেও শিখে ফেলে। তখন পরের Frame আর flood হয় না।' }
  ],

  build: function(cfg){
    var pcA = N.pc('pcA', { name:'PC-A', x:12, y:24, mac:A, ip:'192.168.1.10' });
    var pcB = N.pc('pcB', { name:'PC-B', x:12, y:76, mac:B, ip:'192.168.1.20' });
    var pcC = N.pc('pcC', { name:'PC-C', x:88, y:50, mac:C, ip:'192.168.1.30' });

    var s = N.sw('sw1', { name:'Switch', x:50, y:50 });
    s.portsOf = { pcA:1, pcB:2, pcC:3 };
    if(cfg.learned){
      s.macTable[A] = { port:1, age:0 };
      s.macTable[B] = { port:2, age:0 };
      s.macTable[C] = { port:3, age:0 };
    }

    return {
      devices: [pcA, pcB, pcC],
      links: [ N.link('pcA','sw1'), N.link('pcB','sw1'), N.link('pcC','sw1') ],
      hub: s,
      wire: null,
      banner: null
    };
  },

  script: function(s0, cfg){
    P.resetIds();
    var steps = [], t = 0;
    function at(){ return ++t; }

    var f1 = P.make([
      P.ethernet(A, B, 'ip'),
      P.ip('192.168.1.10', '192.168.1.20', 64, 'tcp', 60),
      P.tcp(51000, 80, 1, 0, 'SYN', 64240)
    ], { label:'Frame A→B', kind:'data', from:'pcA', to:'pcB' });

    steps.push({
      t:at(), actor:'pcA', layer:'L2', kind:'info',
      title:'PC-A একটি Frame পাঠাল', packet:f1,
      what:'PC-A একটি Ethernet Frame পাঠাচ্ছে — Source MAC `' + A + '`, Destination MAC `' + B + '`।',
      why :'PC-A ইতিমধ্যে PC-B-এর MAC Address জানে (ARP আগেই হয়ে গেছে)। এখন Frame-টি Switch-এ পৌঁছাবে এবং Switch সিদ্ধান্ত নেবে সেটি কোথায় পাঠাতে হবে।',
      apply: function(st){ st.wire = { pkt:f1, from:'pcA', to:'sw1' }; st.banner = 'Frame Switch-এ ঢুকছে'; }
    });

    /* ── ধাপ ১: Source থেকে শেখা ── */
    steps.push({
      t:at(), actor:'sw1', layer:'L2', kind:cfg.learned ? 'info' : 'ok',
      title: cfg.learned ? 'Source MAC আগেই জানা ছিল' : 'Source MAC শিখল',
      packet:f1,
      what: cfg.learned
        ? 'Switch Source MAC `' + A + '` দেখল — এটি ইতিমধ্যে Table-এ Port 1-এ আছে, তাই শুধু entry-টির সময় নতুন করে লেখা হলো।'
        : 'Switch Frame-টির **Source MAC** `' + A + '` দেখল এবং মনে রাখল যে এই MAC Address **Port 1**-এ আছে।',
      why :'এটাই Switch-এর শেখার একমাত্র উপায়। Frame যে port দিয়ে ঢুকেছে, তার Source MAC নিশ্চয়ই সেই port-এর ওপাশে আছে।\n\nলক্ষ্য করুন — শেখা হচ্ছে **Source** MAC থেকে, কিন্তু পাঠানোর সিদ্ধান্ত হবে **Destination** MAC দেখে। এই দুটি সম্পূর্ণ আলাদা কাজ।',
      apply: function(st){ st.hub.macTable[A] = { port:1, age:0 }; st.banner = 'শিখল: ' + A + ' → Port 1'; }
    });

    /* ── ধাপ ২: Destination খোঁজা ── */
    if(cfg.learned){
      steps.push({
        t:at(), actor:'sw1', layer:'L2', kind:'ok',
        title:'Table-এ পাওয়া গেল — নির্দিষ্ট port-এ forward', packet:f1,
        what:'Switch Destination MAC `' + B + '` তার Table-এ খুঁজল এবং পেয়ে গেল — Port 2।',
        why :'জানা থাকলে Switch শুধু সেই একটি port-এ Frame পাঠায়। PC-C এই Frame-টি কখনো দেখবেই না।\n\nএখানেই Switch আর পুরোনো Hub-এর পার্থক্য — Hub সবসময় সবাইকে পাঠাত, Switch শুধু যাকে দরকার তাকেই পাঠায়।',
        apply: function(st){ st.wire = { pkt:f1, from:'sw1', to:'pcB' }; st.banner = 'Port 2-এ forward'; }
      });
    } else {
      steps.push({
        t:at(), actor:'sw1', layer:'L2', kind:'warn',
        title:'Destination অজানা — flood করল', packet:f1,
        what:'Switch Destination MAC `' + B + '` তার Table-এ খুঁজল, কিন্তু পেল না। তাই সে Frame-টি **Port 1 বাদে সব port-এ** পাঠিয়ে দিল।',
        why :'PC-B এখনো একটিও Frame পাঠায়নি, তাই Switch তার অস্তিত্বই জানে না। এই অবস্থায় Frame ফেলে দিলে যোগাযোগ কখনোই শুরু হতো না।\n\nতাই Switch নিরাপদ পথ নেয় — সবাইকে পাঠাও, ঠিক device-টি নিজেই নিয়ে নেবে। একে বলে **Unknown Unicast Flooding**।',
        apply: function(st){ st.wire = { pkt:f1, from:'sw1', to:'flood', origin:'pcA' }; st.banner = 'অজানা destination — flood'; }
      });

      steps.push({
        t:at(), actor:'pcC', layer:'L2', kind:'warn',
        title:'PC-C Frame টি ফেলে দিল', packet:f1,
        what:'PC-C Frame-টি পেল, Destination MAC `' + B + '` দেখল, নিজের MAC `' + C + '`-এর সাথে মেলাল — মিলল না। তাই সে Frame-টি ফেলে দিল।',
        why :'প্রতিটি NIC নিজের MAC Address-এর সাথে destination মিলিয়ে দেখে। না মিললে Frame-টি উপরের layer-এ পাঠানোই হয় না।\n\nএজন্যই flood হলেও ভুল device-এ data "পৌঁছে যায়" না — কিন্তু bandwidth খরচ ঠিকই হয়।',
        apply: function(st){ st.banner = 'PC-C: আমার MAC নয়, drop'; }
      });
    }

    steps.push({
      t:at(), actor:'pcB', layer:'L2', kind:'ok',
      title:'PC-B Frame টি গ্রহণ করল', packet:f1,
      what:'PC-B দেখল Destination MAC তারই। তাই সে Frame-টি গ্রহণ করে ভেতরের IP Packet উপরের layer-এ পাঠিয়ে দিল।',
      why :'MAC Address মিলে গেছে, তাই এই Frame-টি তার জন্যই। এখন Layer 2-এর কাজ শেষ, Layer 3 শুরু।',
      apply: function(st){ st.wire = null; st.banner = 'PC-B গ্রহণ করল'; }
    });

    if(!cfg.reply) return steps;

    /* ── ধাপ ৩: উত্তর এলে Switch দ্বিতীয় device-কেও শেখে ── */
    var f2 = P.make([
      P.ethernet(B, A, 'ip'),
      P.ip('192.168.1.20', '192.168.1.10', 64, 'tcp', 60),
      P.tcp(80, 51000, 1, 2, 'SYN-ACK', 64240)
    ], { label:'Frame B→A', kind:'ack', from:'pcB', to:'pcA' });

    steps.push({
      t:at(), actor:'pcB', layer:'L2', kind:'info',
      title:'PC-B উত্তর পাঠাল', packet:f2,
      what:'PC-B এবার নিজে একটি Frame পাঠাচ্ছে — Source MAC `' + B + '`, Destination MAC `' + A + '`।',
      why :'এই Frame-টিই Switch-কে PC-B সম্পর্কে শেখাবে। এখানেই বোঝা যায় Switch শেখে কেবল তখনই যখন কোনো device **নিজে কথা বলে**।',
      apply: function(st){ st.wire = { pkt:f2, from:'pcB', to:'sw1' }; st.banner = 'উত্তর আসছে'; }
    });

    steps.push({
      t:at(), actor:'sw1', layer:'L2', kind:'ok',
      title:'PC-B কেও শিখে ফেলল', packet:f2,
      what:'Switch Source MAC `' + B + '` দেখে Table-এ লিখল — **Port 2**। এখন Table-এ দুটি entry।',
      why :'এখন Switch দুই দিকই জানে। এরপর A→B বা B→A যেকোনো Frame সরাসরি ঠিক port-এ যাবে, আর কখনো flood হবে না।\n\nএভাবেই একটি Switch কয়েক সেকেন্ডের মধ্যেই পুরো network-টা "শিখে" ফেলে।',
      apply: function(st){ st.hub.macTable[B] = { port:2, age:0 }; st.banner = 'শিখল: ' + B + ' → Port 2'; }
    });

    steps.push({
      t:at(), actor:'sw1', layer:'L2', kind:'ok',
      title:'এবার সরাসরি Port 1-এ পাঠাল', packet:f2,
      what:'Destination MAC `' + A + '` Table-এ আছে (Port 1), তাই Frame-টি শুধু সেখানেই গেল। PC-C কিছুই দেখল না।',
      why :'প্রথম Frame-টি flood হয়েছিল, কিন্তু এটি হলো না — কারণ ইতিমধ্যে শেখা হয়ে গেছে। এটাই Switch-এর মূল সুবিধা: যত বেশি traffic, তত ভালো সে জানে, তত কম অপ্রয়োজনীয় Frame।',
      apply: function(st){ st.wire = { pkt:f2, from:'sw1', to:'pcA' }; st.banner = 'Port 1-এ forward'; }
    });

    return steps;
  }
};

})(window.NetLab);

/* ═══════════════════════════════════════════════════════════════════
   LAB · ARP — IP জানি, কিন্তু MAC জানি না
   ═══════════════════════════════════════════════════════════════════ */
(function(NS){
"use strict";
var N = NS.net, P = NS.pkt;

var CLIENT_MAC = 'AA:AA:AA:AA:AA:AA';
var ROUTER_MAC = 'RR:RR:RR:RR:RR:RR';
var OTHER_MAC  = 'CC:CC:CC:CC:CC:CC';
var BROADCAST  = 'FF:FF:FF:FF:FF:FF';

NS.labs.arp = {
  id: 'arp',
  title: 'ARP Lab',
  group: 'Phase 1 · Layer 2',
  chapter: 'ch8',
  blurb: 'IP Address জানা থাকলেও Frame পাঠাতে MAC Address লাগে। ARP সেই ফাঁকটা পূরণ করে।',

  learn: [
    'ARP ঠিক কোন সমস্যাটা সমাধান করে',
    'ARP Request কেন broadcast, কিন্তু ARP Reply কেন unicast',
    'ARP Cache কী কাজে লাগে এবং cache থাকলে কী বদলায়',
    'যার IP জিজ্ঞেস করা হয়নি সেই device কেন Frame-টা ফেলে দেয়'
  ],

  mistakes: [
    { m:'ARP Internet-এর যেকোনো IP-র MAC Address বের করতে পারে।',
      r:'ARP শুধু নিজের local network-এ কাজ করে। বাইরের কোনো IP-তে যেতে হলে Client নিজের Default Gateway-এর MAC Address খোঁজে, destination-এর নয়।' },
    { m:'ARP Request সরাসরি Router-এর কাছে যায়।',
      r:'ARP Request broadcast — local network-এর প্রতিটি device Frame-টি পায়। কিন্তু শুধু যার IP মিলেছে সে-ই Reply দেয়, বাকিরা চুপচাপ Frame-টি ফেলে দেয়।' }
  ],

  controls: [
    { key:'cached', type:'toggle', label:'ARP Cache-এ আগে থেকেই entry আছে', def:false,
      help:'চালু করলে Client-কে আর জিজ্ঞেস করতে হবে না — সরাসরি Frame পাঠাবে।' },
    { key:'gone', type:'toggle', label:'Router টি বন্ধ (কেউ উত্তর দেবে না)', def:false,
      help:'কেউ ARP Reply না দিলে কী হয় দেখুন — Break-It Mode।' }
  ],

  /* ───────── শুরুর অবস্থা ───────── */
  build: function(cfg){
    var client = N.pc('client', {
      name:'Client', x:14, y:50, mac:CLIENT_MAC,
      ip:'192.168.1.10', gw:'192.168.1.1'
    });
    if(cfg.cached) client.arp['192.168.1.1'] = { mac:ROUTER_MAC, age:0 };

    var other = N.pc('other', {
      name:'PC-B', x:50, y:14, mac:OTHER_MAC, ip:'192.168.1.20', gw:'192.168.1.1'
    });
    var rtr = N.router('router', {
      name:'Router', x:86, y:50,
      ifaces:[{ name:'eth0', ip:'192.168.1.1', mac:ROUTER_MAC, mask:'255.255.255.0' }]
    });
    if(cfg.gone) rtr.note = 'বন্ধ';

    return {
      devices: [client, other, rtr],
      links: [
        N.link('client','sw1'), N.link('other','sw1'), N.link('sw1','router')
      ],
      hub: N.sw('sw1', { name:'Switch', x:50, y:50 }),
      wire: null,       // এই মুহূর্তে তারে যে packet আছে
      banner: null
    };
  },

  /* ───────── ধাপে ধাপে কী ঘটবে ───────── */
  script: function(s0, cfg){
    P.resetIds();
    var steps = [];
    var t = 0;
    function at(){ t += 1; return t; }

    /* Frame পাঠানোর জন্য যে MAC দরকার সেটি Client-এর জানা আছে কি? */
    if(cfg.cached){
      steps.push({
        t:at(), actor:'client', layer:'L3', kind:'info',
        title:'Packet তৈরি করল',
        what:'Client `192.168.1.1`-এ একটি Packet পাঠাতে চায়। সে প্রথমেই নিজের ARP Cache দেখল।',
        why :'প্রতিবার জিজ্ঞেস করা অপচয়। তাই Client আগে নিজের ARP Cache-এ খোঁজে — উত্তর পেলে ARP Request পাঠানোরই দরকার নেই।',
        apply: function(st){ st.banner = 'ARP Cache দেখা হচ্ছে…'; }
      });
      steps.push({
        t:at(), actor:'client', layer:'L2', kind:'ok',
        title:'Cache HIT — MAC Address জানা আছে',
        what:'ARP Cache-এ `192.168.1.1 → ' + ROUTER_MAC + '` entry-টি পাওয়া গেল।',
        why :'আগে একবার ARP হয়েছিল বলে উত্তরটি জমা ছিল। তাই এবার কোনো ARP Request লাগল না — এটাই ARP Cache-এর মূল লাভ।',
        apply: function(st){ st.banner = 'Cache HIT'; }
      });
      steps.push(sendData(at()));
      return steps;
    }

    /* ── Cache খালি: পুরো ARP প্রক্রিয়া ── */
    steps.push({
      t:at(), actor:'client', layer:'L3', kind:'info',
      title:'Packet তৈরি করল',
      what:'Client `192.168.1.1`-এ Packet পাঠাতে চায়। কিন্তু Ethernet Frame বানাতে গিয়ে সে আটকে গেল।',
      why :'Frame-এর destination MAC Address-এর ঘরটি ফাঁকা। IP Address জানা আছে, কিন্তু এই local network-এ Frame পৌঁছাতে হলে MAC Address লাগে।',
      apply: function(st){ st.banner = 'destination MAC অজানা'; }
    });

    steps.push({
      t:at(), actor:'client', layer:'L2', kind:'warn',
      title:'ARP Cache খালি',
      what:'Client নিজের ARP Cache দেখল — `192.168.1.1`-এর কোনো entry নেই।',
      why :'এর আগে এই IP-র সাথে কথা হয়নি, তাই cache-এ কিছু জমা নেই। এখন জিজ্ঞেস করা ছাড়া উপায় নেই।',
      apply: function(st){ st.banner = 'Cache MISS'; }
    });

    var req = P.make([
      P.ethernet(CLIENT_MAC, BROADCAST, 'arp'),
      P.arp(1, CLIENT_MAC, '192.168.1.10', '00:00:00:00:00:00', '192.168.1.1')
    ], { label:'ARP Request', kind:'arp', from:'client', to:'সবাই' });

    steps.push({
      t:at(), actor:'client', layer:'L2', kind:'info',
      title:'ARP Request broadcast করল', packet:req,
      what:'Client একটি ARP Request পাঠাল: **"`192.168.1.1` কার? তোমার MAC Address কী?"** Frame-টির destination MAC হলো `' + BROADCAST + '` — অর্থাৎ broadcast।',
      why :'কার MAC Address লাগবে সেটাই তো জানা নেই, তাই কাকে জিজ্ঞেস করবে তাও জানা নেই। তাই প্রশ্নটি সবাইকে শোনানো হচ্ছে। `FF:FF:FF:FF:FF:FF` মানে "এই network-এর সবাই"।',
      apply: function(st){ st.wire = { pkt:req, from:'client', to:'sw1' }; st.banner = 'ARP Request পথে'; }
    });

    steps.push({
      t:at(), actor:'sw1', layer:'L2', kind:'info',
      title:'Switch সব port-এ flood করল', packet:req,
      what:'Switch broadcast Frame-টি পেয়ে সেটি সব port-এ পাঠিয়ে দিল (যে port দিয়ে এসেছে সেটি বাদে)।',
      why :'Destination MAC broadcast হলে Switch কোনো lookup করে না — broadcast-এর সংজ্ঞাই হলো সবার কাছে পৌঁছানো।',
      apply: function(st){
        st.wire = { pkt:req, from:'sw1', to:'both', origin:'client' };
        st.hub.macTable[CLIENT_MAC] = { port:1, age:0 };
        st.banner = 'সব port-এ flood';
      }
    });

    steps.push({
      t:at(), actor:'other', layer:'L2', kind:'warn',
      title:'PC-B Frame টি ফেলে দিল', packet:req,
      what:'PC-B ARP Request-টি পেল, ভেতরের Target IP `192.168.1.1` দেখল, নিজের IP `192.168.1.20`-এর সাথে মেলাল — মিলল না। তাই সে চুপচাপ Frame-টি ফেলে দিল।',
      why :'Broadcast মানে সবাই Frame-টি **পায়**, কিন্তু সবাই **উত্তর দেয় না**। শুধু যার IP মিলেছে সে-ই Reply দেবে।',
      apply: function(st){ st.banner = 'PC-B: আমার IP নয়, drop'; }
    });

    /* ── Break-It: কেউ উত্তর না দিলে ── */
    if(cfg.gone){
      steps.push({
        t:at(), actor:'router', layer:'L2', kind:'error',
        title:'Router বন্ধ — কোনো Reply নেই',
        what:'Router-টি বন্ধ, তাই ARP Request-এর কোনো উত্তর এল না।',
        why :'ARP-তে কোনো "উত্তর পাইনি" বলে error message আসে না। শুধু নীরবতা — Client অপেক্ষা করতে থাকে।',
        apply: function(st){ st.wire = null; st.banner = 'কোনো Reply নেই'; }
      });
      steps.push({
        t:at() + 2, actor:'client', layer:'L3', kind:'error',
        title:'Timeout — Packet পাঠানো গেল না',
        what:'কয়েকবার চেষ্টা করেও কোনো ARP Reply না পাওয়ায় Client হাল ছেড়ে দিল। মূল Packet-টি আর কখনোই পাঠানো হলো না।',
        why :'destination MAC Address ছাড়া Ethernet Frame তৈরিই করা যায় না। তাই Layer 2-তে আটকে গেলে উপরের Layer 3 বা 4 কিছুই করতে পারে না।\n\nএকেই বলে **ARP Failure** — application-এ এটি সাধারণত "Host unreachable" হিসেবে দেখা যায়।',
        apply: function(st){ st.banner = 'ARP Failure'; }
      });
      return steps;
    }

    var rep = P.make([
      P.ethernet(ROUTER_MAC, CLIENT_MAC, 'arp'),
      P.arp(2, ROUTER_MAC, '192.168.1.1', CLIENT_MAC, '192.168.1.10')
    ], { label:'ARP Reply', kind:'arp', from:'router', to:'client' });

    steps.push({
      t:at(), actor:'router', layer:'L2', kind:'ok',
      title:'Router ARP Reply দিল', packet:rep,
      what:'Router দেখল Target IP `192.168.1.1` তারই। তাই সে উত্তর পাঠাল: **"`192.168.1.1` আমি, আমার MAC হলো `' + ROUTER_MAC + '`"**।',
      why :'লক্ষ্য করুন — Reply-টি broadcast নয়, **unicast**। কে জিজ্ঞেস করেছিল তা Request-এর ভেতরেই ছিল (Sender MAC), তাই উত্তরটি শুধু তাকেই পাঠানো হচ্ছে। অন্যদের বিরক্ত করার দরকার নেই।',
      apply: function(st){ st.wire = { pkt:rep, from:'router', to:'client' }; st.banner = 'ARP Reply আসছে'; }
    });

    steps.push({
      t:at(), actor:'client', layer:'L2', kind:'ok',
      title:'ARP Cache-এ জমা করল', packet:rep,
      what:'Client উত্তরটি পেয়ে নিজের ARP Cache-এ লিখে রাখল: `192.168.1.1 → ' + ROUTER_MAC + '`।',
      why :'এখন থেকে কিছুক্ষণ (সাধারণত কয়েক মিনিট) এই IP-তে পাঠাতে হলে আর জিজ্ঞেস করতে হবে না। এতে network-এ অপ্রয়োজনীয় broadcast কমে।',
      apply: function(st){
        st.devices[0].arp['192.168.1.1'] = { mac:ROUTER_MAC, age:0 };
        st.wire = null;
        st.banner = 'ARP Cache updated';
      }
    });

    steps.push(sendData(at()));
    return steps;

    /* আসল data Frame — cache আর non-cache দুই পথেই শেষ ধাপ একই */
    function sendData(tt){
      var d = P.make([
        P.ethernet(CLIENT_MAC, ROUTER_MAC, 'ip'),
        P.ip('192.168.1.10', '8.8.8.8', 64, 'tcp', 60),
        P.tcp(54321, 443, 1000, 0, 'SYN', 64240)
      ], { label:'Data Frame', kind:'data', from:'client', to:'router' });

      return {
        t:tt, actor:'client', layer:'L2', kind:'ok',
        title:'এবার আসল Frame পাঠাল', packet:d,
        what:'destination MAC জানা হয়ে গেছে, তাই Client এবার সম্পূর্ণ Ethernet Frame তৈরি করে পাঠাল।',
        why :'এখানে একটি গুরুত্বপূর্ণ ব্যাপার আছে — Frame-এর destination MAC হলো **Router-এর**, কিন্তু Packet-এর destination IP হলো **`8.8.8.8`**।\n\nকারণ MAC Address শুধু এই local link পর্যন্ত কাজ করে, আর IP Address পুরো journey-র গন্তব্য বলে। Router এই Frame খুলে ভেতরের Packet-টি পরের hop-এ নতুন Frame-এ ভরে পাঠাবে।',
        apply: function(st){ st.wire = { pkt:d, from:'client', to:'router' }; st.banner = 'Data Frame পাঠানো হলো'; }
      };
    }
  }
};

})(window.NetLab);

/* ═══════════════════════════════════════════════════════════════════
   LAB · IP Addressing — "Destination কি আমার নিজের network-এ?"
   ═══════════════════════════════════════════════════════════════════ */
(function(NS){
"use strict";
var N = NS.net, P = NS.pkt;

var MY_MAC = 'AA:AA:AA:AA:AA:AA';
var GW_MAC = 'RR:RR:RR:RR:RR:RR';
var PEER_MAC = 'BB:BB:BB:BB:BB:BB';

NS.labs.ip = {
  id: 'ip',
  title: 'IP Addressing Lab',
  group: 'Phase 2 · Layer 3',
  chapter: 'ch11',
  blurb: 'Packet পাঠানোর আগে প্রতিটি machine একটাই প্রশ্ন করে — গন্তব্য কি আমার নিজের network-এ? উত্তরের উপরেই সব নির্ভর করে।',

  learn: [
    'Subnet Mask কীভাবে "আমার network"-এর সীমারেখা আঁকে',
    'একই network হলে সরাসরি, না হলে Default Gateway — কেন',
    'দুই ক্ষেত্রেই destination IP এক, কিন্তু destination MAC আলাদা',
    'Subnet Mask ভুল হলে ঠিক কোথায় গিয়ে যোগাযোগ ভাঙে'
  ],

  mistakes: [
    { m:'Default Gateway-এর কাজ হলো Packet-এর গন্তব্য ঠিক করে দেওয়া।',
      r:'গন্তব্য আগে থেকেই destination IP-তে লেখা আছে। Gateway শুধু সেই Packet-টিকে পরের ধাপে এগিয়ে দেয় — "আমি চিনি না, কিন্তু যে চেনে তার কাছে দিচ্ছি"। এটি delegation, গন্তব্য নির্ধারণ নয়।' },
    { m:'একই network-এ আছে কিনা বোঝা যায় IP-র প্রথম তিনটি অংশ মিলিয়ে।',
      r:'সেটি শুধু `/24`-এর ক্ষেত্রে কাকতালীয়ভাবে ঠিক। আসল হিসাব হয় Subnet Mask দিয়ে — `/25`-এ `192.168.1.10` আর `192.168.1.130` ভিন্ন network-এ, যদিও প্রথম তিন অংশ একই।' }
  ],

  controls: [
    { key:'dst', type:'choice', label:'কোথায় Packet পাঠাবেন', def:'local',
      options:[ ['local','192.168.1.130 — /24 তে একই network'],
                ['remote','8.8.8.8 — বাইরের network'] ],
      help:'দুটোতেই দেখুন destination MAC কীভাবে বদলায়, অথচ destination IP বদলায় না।' },
    { key:'mask', type:'choice', label:'Subnet Mask', def:'24',
      options:[ ['24','255.255.255.0  (/24)'],
                ['25','255.255.255.128  (/25) — সীমা বদলে যাবে'],
                ['16','255.255.0.0  (/16) — অনেক বড় network'] ],
      help:'/25 করলে 192.168.1.130 আর একই network-এ থাকে না — Break-It Mode।' },
    { key:'nogw', type:'toggle', label:'Default Gateway সেট করা নেই', def:false,
      help:'Gateway ছাড়া বাইরের কোথাও যাওয়া যায় না।' }
  ],

  build: function(cfg){
    var cidr = parseInt(cfg.mask, 10);
    var me = N.pc('me', {
      name:'আমার PC', x:14, y:50, mac:MY_MAC,
      ip:'192.168.1.10', mask: N.subnet('192.168.1.10', cidr).mask,
      gw: cfg.nogw ? '' : '192.168.1.1'
    });
    var peer = N.pc('peer', {
      name:'PC-B', x:50, y:18, mac:PEER_MAC,
      ip:'192.168.1.130', mask: N.subnet('192.168.1.130', cidr).mask, gw:'192.168.1.1'
    });
    var gw = N.router('gw', {
      name:'Gateway', x:50, y:80,
      ifaces:[{ name:'eth0', ip:'192.168.1.1', mac:GW_MAC, mask: N.subnet('192.168.1.1', cidr).mask }]
    });
    var out = N.server('net', {
      name:'8.8.8.8', x:88, y:80, mac:'88:88:88:88:88:88', ip:'8.8.8.8',
      listening:[{ port:53, service:'DNS', open:true }]
    });
    if(cfg.nogw) me.note = 'no GW';

    return {
      devices: [me, peer, gw, out],
      links: [ N.link('me','peer'), N.link('me','gw'), N.link('gw','net') ],
      hub: null, wire: null, banner: null
    };
  },

  script: function(s0, cfg){
    P.resetIds();
    var steps = [], t = 0;
    function at(){ return ++t; }

    var cidr  = parseInt(cfg.mask, 10);
    var myIp  = '192.168.1.10';
    var mask  = N.subnet(myIp, cidr).mask;
    var sub   = N.subnet(myIp, cidr);
    var dstIp = cfg.dst === 'local' ? '192.168.1.130' : '8.8.8.8';
    var same  = N.sameSubnet(myIp, dstIp, mask);

    steps.push({
      t:at(), actor:'me', layer:'L3', kind:'info',
      title:'Packet পাঠানোর সিদ্ধান্ত শুরু',
      what:'Application `' + dstIp + '`-এ data পাঠাতে চাইল। কিন্তু Packet তারে দেওয়ার আগে kernel-কে একটা সিদ্ধান্ত নিতে হবে।',
      why :'প্রশ্নটি একটাই — **গন্তব্য কি আমার নিজের network-এ?**\n\nউত্তর "হ্যাঁ" হলে সরাসরি পাঠানো যাবে। "না" হলে Packet-টি Default Gateway-এর হাতে তুলে দিতে হবে। এই একটি সিদ্ধান্তের উপরেই পরের সব ধাপ নির্ভর করছে।',
      apply: function(st){ st.banner = 'সিদ্ধান্ত: গন্তব্য কি local?'; }
    });

    steps.push({
      t:at(), actor:'me', layer:'L3', kind:'info',
      title:'Subnet Mask দিয়ে হিসাব',
      what:'নিজের IP `' + myIp + '` আর Mask `' + mask + '` (/' + cidr + ') মিলিয়ে বের হলো — আমার network হলো **`' + sub.network + '/' + cidr + '`**, আর তার সীমা `' + sub.first + '` থেকে `' + sub.last + '` পর্যন্ত।',
      why :'Mask-এর যত ঘর `1`, ততগুলো bit "network" অংশ। বাকিটা host অংশ।\n\n`' + myIp + '` = `' + N.bits(myIp) + '`\n`' + mask + '` = `' + N.bits(mask) + '`\n\nএই দুটো মিলিয়েই "আমার network" বলতে ঠিক কোন কোন address বোঝায় তা ঠিক হয়।',
      apply: function(st){ st.banner = 'আমার network: ' + sub.network + '/' + cidr; }
    });

    steps.push({
      t:at(), actor:'me', layer:'L3', kind: same ? 'ok' : 'warn',
      title: same ? 'গন্তব্য একই network-এ' : 'গন্তব্য ভিন্ন network-এ',
      what: same
        ? '`' + dstIp + '` হিসাব করে দেখা গেল সেটিও `' + sub.network + '/' + cidr + '`-এর ভেতরেই পড়ে।'
        : '`' + dstIp + '` হিসাব করে দেখা গেল সেটি `' + sub.network + '/' + cidr + '`-এর বাইরে।',
      why : same
        ? 'তাই মাঝখানে কোনো Router লাগবে না। Packet-টি সরাসরি ওই device-এর কাছে পাঠানো যাবে।\n\nএখন শুধু দরকার তার MAC Address — সেটি ARP দিয়ে জানা যাবে।'
        : (cidr === 25 && cfg.dst === 'local'
            ? 'লক্ষ্য করুন — `192.168.1.10` আর `192.168.1.130`-এর প্রথম তিন অংশ **হুবহু একই**, তবু এরা ভিন্ন network-এ!\n\nকারণ /25 mask `192.168.1.0`–`192.168.1.127` আর `192.168.1.128`–`192.168.1.255` — এই দুই ভাগে ভেঙে দিয়েছে। `.10` প্রথম ভাগে, `.130` দ্বিতীয় ভাগে।\n\nএজন্যই "প্রথম তিন অংশ মিললেই একই network" ধারণাটি ভুল।'
            : 'তাই Packet-টি নিজে থেকে পাঠানো যাবে না। এটিকে এমন কারো হাতে দিতে হবে যে বাইরের পথ চেনে — অর্থাৎ **Default Gateway**।'),
      apply: function(st){ st.banner = same ? 'একই network — সরাসরি' : 'ভিন্ন network — Gateway লাগবে'; }
    });

    /* ── Break-It: বাইরে যেতে হবে কিন্তু Gateway নেই ── */
    if(!same && cfg.nogw){
      steps.push({
        t:at(), actor:'me', layer:'L3', kind:'error',
        title:'Default Gateway নেই — Packet পাঠানো গেল না',
        what:'Packet-টি বাইরের network-এ যেতে হবে, কিন্তু কোনো Default Gateway সেট করা নেই। তাই এটি কোথাও পাঠানোই হলো না।',
        why :'Machine-টি পৃথিবীর সব network-এর পথ জানে না — জানার দরকারও নেই। তার শুধু একটা ঠিকানা জানা দরকার: "যা আমি চিনি না, তা কার কাছে দেব।"\n\nসেই ঠিকানাটাই নেই। তাই local network-এর ভেতরে সব ঠিক থাকলেও বাইরের কিছুতেই পৌঁছানো যাবে না। Linux-এ এটি `Network is unreachable` হিসেবে দেখা যায়।',
        apply: function(st){ st.banner = 'Network is unreachable'; }
      });
      return steps;
    }

    /* ── কার MAC লাগবে সেটিই আসল পার্থক্য ── */
    var nextHopIp  = same ? dstIp : '192.168.1.1';
    var nextHopMac = same ? PEER_MAC : GW_MAC;
    var nextHopName = same ? 'PC-B' : 'Gateway';

    steps.push({
      t:at(), actor:'me', layer:'L2', kind:'info',
      title:'কার MAC Address লাগবে?',
      what:'ARP করা হবে **`' + nextHopIp + '`**-এর জন্য — অর্থাৎ ' + nextHopName + '-এর MAC Address জানতে।',
      why : same
        ? 'গন্তব্য নিজেই পাশে আছে, তাই তারই MAC Address দরকার।'
        : 'এখানে একটা সূক্ষ্ম কিন্তু গুরুত্বপূর্ণ ব্যাপার — ARP করা হচ্ছে **Gateway-এর IP** `192.168.1.1`-এর জন্য, `' + dstIp + '`-এর জন্য নয়।\n\nকারণ `' + dstIp + '` এই local network-এ নেই, তাকে ARP করে পাওয়া যাবে না। ARP শুধু নিজের network-এর ভেতরেই কাজ করে।',
      apply: function(st){ st.banner = 'ARP: ' + nextHopIp + ' কার?'; }
    });

    var pkt = P.make([
      P.ethernet(MY_MAC, nextHopMac, 'ip'),
      P.ip(myIp, dstIp, 64, 'tcp', 60),
      P.tcp(54321, same ? 80 : 53, 1000, 0, 'SYN', 64240)
    ], { label:'Frame', kind:'data', from:'me', to: same ? 'peer' : 'gw' });

    steps.push({
      t:at(), actor:'me', layer:'L2', kind:'ok',
      title:'Frame তৈরি হলো', packet:pkt,
      what:'Destination IP `' + dstIp + '`, কিন্তু destination MAC `' + nextHopMac + '` — অর্থাৎ ' + nextHopName + '-এর।',
      why : same
        ? 'এখানে IP আর MAC দুটোই একই device-এর, কারণ গন্তব্য পাশেই।'

      apply: function(st){ st.wire = { pkt:pkt, from:'gw', to:'net' }; st.banner = 'TTL 64 → 63, নতুন MAC'; }

    steps.push({
      t:at(), actor:'net', layer:'L3', kind:'ok',
      title:'গন্তব্যে পৌঁছাল', packet:pkt,
      what:'`8.8.8.8` Packet-টি পেল। পথে MAC Address কয়েকবার বদলেছে, কিন্তু IP Header-এর গন্তব্য শুরু থেকে শেষ পর্যন্ত একই ছিল।',

      apply: function(st){ st.wire = null; st.banner = 'পৌঁছে গেল'; }
    });

    return steps;
  }

      t:at(), actor:'client', layer:'L3', kind:'info',

      what:'গন্তব্য `' + DST + '` নিজের network-এ নেই, তাই Client Packet-টি নিজের Default Gateway — Router A-কে দিয়ে দিল।',
      why :'Client পুরো পথ জানে না, জানার দরকারও নেই। তার শুধু একটাই কাজ — "যা আমি চিনি না, তা Gateway-কে দাও।"',
      apply: function(st){ st.wire = { pkt:f1, from:'client', to:'ra' }; st.banner = 'Client → Router A'; }
    });

    var f2 = frame('A2:A2:A2:A2:A2:A2', 'B1:B1:B1:B1:B1:B1', 63, 'Frame → Router B', 'ra', 'rb');
    steps.push({
      t:at(), actor:'ra', layer:'L3', kind:'ok',
      title:'Router A: পরের ধাপ Router B', packet:f2,
      what:'Router A তার table-এ `' + DST + '` খুঁজে পেল — `192.168.2.0/24 via 10.0.0.2 dev eth1`। তাই Packet-টি Router B-এর দিকে পাঠাল।',
      why :'লক্ষ্য করুন Router A **পুরো পথ জানে না** — সে শুধু জানে "192.168.2.0/24-এর জন্য 10.0.0.2-কে দাও"। এরপর কী হবে তা Router B-এর ব্যাপার।\n\nসে নতুন Ethernet Header বানাল (নতুন source ও destination MAC) আর TTL ৬৪ থেকে ৬৩ করল। কিন্তু ভেতরের source/destination IP অপরিবর্তিত।',
      apply: function(st){ st.wire = { pkt:f2, from:'ra', to:'rb' }; st.banner = 'TTL 63 · নতুন MAC'; }
    });

    if(cfg.broken){
      steps.push({
        t:at(), actor:'rb', layer:'L3', kind:'error',
        title:'Router B গন্তব্য চেনে না — Packet drop',
        what:'Router B তার table-এ `' + DST + '` খুঁজল, কিন্তু কোনো route পেল না। তাই Packet-টি ফেলে দিল।',
        why :'মজার ব্যাপার — Router B-এর `eth1` interface-টি সরাসরি `192.168.2.0/24`-এ যুক্ত, অর্থাৎ **Server ঠিক তার পাশেই**। তবু route না থাকায় সে Packet পাঠাল না।\n\nRouter অনুমান করে না, সে শুধু table পড়ে। Table-এ না থাকলে গন্তব্য পাশে থাকলেও Packet drop হয়।\n\nএখানে Client-এর কোনো দোষ নেই, Router A-রও নয় — সমস্যা শুধু পথের মাঝের একটি table-এ। এজন্যই network debug করার সময় প্রতিটি hop আলাদা করে দেখতে হয়।',
        apply: function(st){ st.wire = null; st.banner = 'Router B: no route'; }
      });
      return steps;
    }

    var f3 = frame('B2:B2:B2:B2:B2:B2', 'SS:SS:SS:SS:SS:SS', 62, 'Frame → Server', 'rb', 'srv');
    steps.push({
      t:at(), actor:'rb', layer:'L3', kind:'ok',
      title:'Router B: গন্তব্য সরাসরি যুক্ত', packet:f3,
      what:'Router B তার table-এ পেল `192.168.2.0/24 dev eth1` — কোনো next hop নেই, অর্থাৎ এই network তার সাথে **সরাসরি যুক্ত**।',
      why :'"Directly connected" মানে আর কোনো Router লাগবে না। Router B এখন ARP করে Server-এর MAC Address বের করে সরাসরি Frame পাঠাবে।\n\nTTL আরেকবার কমে ৬২ হলো।',
      apply: function(st){ st.wire = { pkt:f3, from:'rb', to:'srv' }; st.banner = 'directly connected · TTL 62'; }
    });

    steps.push({
      t:at(), actor:'srv', layer:'L3', kind:'ok',
      title:'Server পেয়ে গেল', packet:f3,
      what:'Packet গন্তব্যে পৌঁছাল। পথে দুটি Router পার হয়েছে, TTL ৬৪ থেকে ৬২ হয়েছে, MAC Address তিনবার বদলেছে।',
      why :'কিন্তু source IP `' + SRC + '` আর destination IP `' + DST + '` — এই দুটি শুরু থেকে শেষ পর্যন্ত এক রইল।\n\nএবং সবচেয়ে গুরুত্বপূর্ণ: **কেউই পুরো পথটা জানত না**। Client জানত শুধু Router A-কে। Router A জানত শুধু Router B-কে। Router B জানত Server তার পাশে। তিনটি স্থানীয় সিদ্ধান্ত মিলে একটি সম্পূর্ণ যাত্রা তৈরি হলো।',
      apply: function(st){ st.wire = null; st.banner = 'পৌঁছাল · 2 hop'; }
    });

    return steps;
  }
};

})(window.NetLab);

/* ═══════════════════════════════════════════════════════════════════
   LAB · Longest Prefix Match — একাধিক route মিললে কে জেতে
   ═══════════════════════════════════════════════════════════════════ */
(function(NS){
"use strict";
var N = NS.net, P = NS.pkt;

/* বই-এর ch12-এর টেবিলটিই এখানে ব্যবহার করা হয়েছে */
var ROUTES = [
  { dst:'10.0.5.0', prefix:24, via:'Router A', iface:'eth1' },
  { dst:'10.0.0.0', prefix:16, via:'Router B', iface:'eth2' },
  { dst:'10.0.0.0', prefix:8,  via:'Router C', iface:'eth3' },
  { dst:'0.0.0.0',  prefix:0,  via:'Router D', iface:'eth0' }
];

NS.labs.lpm = {
  id: 'lpm',
  title: 'Longest Prefix Match',
  group: 'Phase 2 · Layer 3',
  chapter: 'ch12',
  blurb: 'একটি destination একসাথে অনেকগুলো route-এর সাথে মিলতে পারে। Router কোনটা বেছে নেবে, আর কেন?',

  learn: [
    'একটি destination কীভাবে একসাথে চারটি route-এর সাথে মিলতে পারে',
    'সবচেয়ে দীর্ঘ prefix কেন জেতে',
    'Default route `0.0.0.0/0` কেন সবার সাথেই মেলে, তবু সবার শেষে আসে',
    'কোনো route না মিললে কী হয়'
  ],

  mistakes: [
    { m:'Routing Table-এ যে route উপরে আছে সেটাই আগে প্রয়োগ হয়।',
      r:'ক্রম দিয়ে কিছু হয় না। Router সব মিল বের করে, তারপর যেটির prefix সবচেয়ে দীর্ঘ সেটিই বেছে নেয়। Table-এ কোন লাইন আগে লেখা তা অপ্রাসঙ্গিক।' },
    { m:'Default route থাকা মানে বাকি route গুলো অপ্রয়োজনীয়।',
      r:'Default route (`0.0.0.0/0`) সবার সাথে মেলে, কিন্তু তার prefix সবচেয়ে ছোট — তাই সে সবার শেষে। নির্দিষ্ট route থাকলে সেটিই জেতে; default শুধু "আর কিছু না মিললে" কাজে আসে।' }
  ],

  controls: [
    { key:'dst', type:'choice', label:'Destination IP', def:'10.0.5.20',
      options:[ ['10.0.5.20','10.0.5.20 — চারটিই মিলবে'],
                ['10.0.9.7','10.0.9.7 — /24 মিলবে না'],
                ['10.7.7.7','10.7.7.7 — শুধু /8 আর default'],
                ['203.0.113.5','203.0.113.5 — শুধু default'] ],
      help:'প্রতিটিতে দেখুন কয়টি route মেলে আর শেষে কে জেতে।' },
    { key:'nodefault', type:'toggle', label:'Default route মুছে দিন', def:false,
      help:'Default route না থাকলে অচেনা গন্তব্যের Packet-এর কী হয়?' }
  ],

  build: function(cfg){
    var routes = ROUTES.slice();
    if(cfg.nodefault) routes = routes.filter(function(r){ return r.prefix !== 0; });

    var rt = N.router('r1', { name:'Router', x:50, y:50, routes:routes,
      ifaces:[{ name:'eth0', ip:'10.0.0.1', mac:'RR:RR:RR:RR:RR:RR', mask:'255.0.0.0' }] });

    return {
      devices: [
        N.pc('client', { name:'Client', x:12, y:50, mac:'AA:AA:AA:AA:AA:AA', ip:'10.0.1.9' }),
        rt,
        N.server('a', { name:'Router A', x:88, y:16, mac:'A1:A1:A1:A1:A1:A1', ip:'10.0.5.1' }),
        N.server('b', { name:'Router B', x:88, y:38, mac:'B1:B1:B1:B1:B1:B1', ip:'10.0.9.1' }),
        N.server('c', { name:'Router C', x:88, y:62, mac:'C1:C1:C1:C1:C1:C1', ip:'10.7.0.1' }),
        N.server('d', { name:'Router D', x:88, y:84, mac:'D1:D1:D1:D1:D1:D1', ip:'203.0.113.1' })
      ],
      links: [ N.link('client','r1'), N.link('r1','a'), N.link('r1','b'),
               N.link('r1','c'), N.link('r1','d') ],
      hub: null, wire: null, banner: null
    };
  },

  script: function(s0, cfg){
    P.resetIds();
    var steps = [], t = 0;
    function at(){ return ++t; }

    var dst = cfg.dst;
    var routes = ROUTES.slice();
    if(cfg.nodefault) routes = routes.filter(function(r){ return r.prefix !== 0; });

    var res = N.lpm(dst, routes);
    var pkt = P.make([
      P.ethernet('AA:AA:AA:AA:AA:AA', 'RR:RR:RR:RR:RR:RR', 'ip'),
      P.ip('10.0.1.9', dst, 64, 'tcp', 60),
      P.tcp(51000, 443, 1, 0, 'SYN', 64240)
    ], { label:'Packet → ' + dst, kind:'data', from:'client', to:'r1' });

    steps.push({
      t:at(), actor:'client', layer:'L3', kind:'info',
      title:'Packet Router-এ পৌঁছাল', packet:pkt,
      what:'একটি Packet এসেছে যার destination IP `' + dst + '`। Router-কে এখন ঠিক করতে হবে এটি কোন দিকে পাঠাবে।',
      why :'Router-এর কাছে ' + routes.length + 'টি route আছে। সে একটা একটা করে দেখবে — এই destination কি এই route-এর সাথে মেলে?',
      apply: function(st){ st.wire = { pkt:pkt, from:'client', to:'r1' }; st.banner = 'গন্তব্য ' + dst; }
    });

    /* প্রতিটি route আলাদা ধাপে যাচাই — শেখার জন্য এটাই আসল অংশ */
    for(var i = 0; i < routes.length; i++){
      (function(r){
        var hit = res.matches.indexOf(r) !== -1;
        steps.push({
          t:at(), actor:'r1', layer:'L3', kind: hit ? 'ok' : 'warn',
          title:(hit ? '✓ মিলছে — ' : '✗ মিলছে না — ') + r.dst + '/' + r.prefix,
          what:'`' + r.dst + '/' + r.prefix + '` (via ' + r.via + ') যাচাই করা হলো: ' +
               (hit ? '**মিলছে**।' : '**মিলছে না**।'),
          why : r.prefix === 0
            ? 'Default route-এর prefix `0` — অর্থাৎ ০টি bit মিলতে হবে, যা সবসময়ই সত্য। তাই এটি **সব destination-এর সাথেই মেলে**।\n\nকিন্তু ঠিক এই কারণেই সে সবচেয়ে দুর্বল প্রার্থী — সে আসলে কিছুই "জানে" না।'
            : 'প্রথম ' + r.prefix + 'টি bit মেলাতে হবে।\n\n`' + dst + '` = `' + N.bits(dst) + '`\n`' + r.dst + '` = `' + N.bits(r.dst) + '`\n\n' +
              (hit ? 'প্রথম ' + r.prefix + 'টি bit মিলে গেছে, তাই এই route-টি প্রার্থী তালিকায় থাকল।'
                   : 'প্রথম ' + r.prefix + 'টি bit-এর মধ্যেই পার্থক্য আছে, তাই এই route বাদ।'),
          apply: function(st){ st.banner = r.dst + '/' + r.prefix + (hit ? ' ✓' : ' ✗'); }
        });
      })(routes[i]);
    }

    /* ── কোনো route না মিললে ── */
    if(!res.best){
      steps.push({
        t:at(), actor:'r1', layer:'L3', kind:'error',
        title:'কোনো route মিলল না — Packet drop',
        what:'`' + dst + '`-এর জন্য একটিও route নেই, আর default route-ও মুছে দেওয়া হয়েছে। তাই Router Packet-টি ফেলে দিল।',
        why :'Router শুধু তা-ই করতে পারে যা তার table-এ লেখা আছে। কোথায় পাঠাতে হবে না জানলে সে অনুমান করে না — Packet ফেলে দেয়।\n\nএরপর সে সাধারণত প্রেরককে একটি ICMP **Destination Unreachable — Network** বার্তা পাঠায়, যাতে প্রেরক বুঝতে পারে কী হয়েছে।',
        apply: function(st){ st.wire = null; st.banner = 'No route to host'; }
      });
      return steps;
    }

    var best = res.best;
    var target = { 'Router A':'a', 'Router B':'b', 'Router C':'c', 'Router D':'d' }[best.via];

    steps.push({
      t:at(), actor:'r1', layer:'L3', kind:'ok',
      title:'সবচেয়ে দীর্ঘ prefix জিতল — /' + best.prefix,
      what: res.matches.length > 1
        ? '**' + res.matches.length + 'টি route** মিলেছিল, কিন্তু `' + best.dst + '/' + best.prefix + '` সবচেয়ে নির্দিষ্ট। তাই Packet যাবে **' + best.via + '**-এর দিকে।'
        : 'মাত্র একটি route মিলেছে — `' + best.dst + '/' + best.prefix + '`। তাই Packet যাবে **' + best.via + '**-এর দিকে।',
      why : res.matches.length > 1
        ? 'যে route যত বেশি bit মিলিয়েছে, সে গন্তব্য সম্পর্কে তত বেশি "জানে"। `/' + best.prefix + '` মানে ' + best.prefix + 'টি bit মিলেছে — এটাই সবচেয়ে কঠিন শর্ত, তাই এর সিদ্ধান্তই সবচেয়ে নির্ভরযোগ্য।\n\nলক্ষ্য করুন — Table-এ কোন route আগে লেখা ছিল তাতে কিছুই যায় আসেনি। শুধু prefix-এর দৈর্ঘ্যই সব ঠিক করেছে।'
        : 'অন্য কোনো route এই destination-এর সাথে মেলেনি, তাই প্রতিযোগিতাই হলো না।',
      apply: function(st){ st.wire = { pkt:pkt, from:'r1', to:target }; st.banner = best.via + ' জিতল (/' + best.prefix + ')'; }
    });

    return steps;
  }
};

})(window.NetLab);
