      r:'Traceroute কোনো নতুন জিনিস আবিষ্কার করেনি — সে শুধু TTL-এর স্বাভাবিক নিয়মটাকে কাজে লাগায়। TTL=1 দিয়ে পাঠালে প্রথম Router নালিশ করে, TTL=2 দিয়ে পাঠালে দ্বিতীয় — এভাবেই পুরো পথ বেরিয়ে আসে।' }
  ],

  controls: [
    { key:'mode', type:'choice', label:'কী চালাবেন', def:'normal',
      options:[ ['normal','সাধারণ Packet — TTL 64'],
                ['low','TTL 2 দিয়ে পাঠান — মাঝপথে মরবে'],
                ['trace','Traceroute — পুরো পথ আবিষ্কার'] ],
      help:'Traceroute দেখলে বোঝা যাবে TTL কীভাবে একটি tool-এ পরিণত হয়।' }
  ],

  build: function(){
    var devs = [ N.pc('client', { name:'Client', x:8, y:50, mac:'AA:AA:AA:AA:AA:AA',
                                  ip:'192.168.1.10', gw:'192.168.1.1' }) ];
    for(var i = 0; i < HOPS.length; i++){
      var h = HOPS[i];
      devs.push(N.router(h.id, { name:h.name, x:26 + i * 22, y:50,
        ifaces:[{ name:'eth0', ip:h.ip, mac:h.mac, mask:'255.255.255.0' }] }));
    }
    devs.push(N.server('srv', { name:'Server', x:92, y:50, mac:'SS:SS:SS:SS:SS:SS',
                                ip:'93.184.216.34' }));
    return {
      devices: devs,
      links: [ N.link('client','r1'), N.link('r1','r2'),
               N.link('r2','r3'), N.link('r3','srv') ],
      hub: null, wire: null, banner: null, hops: []
    };
  },

  script: function(s0, cfg){
    P.resetIds();
    var steps = [], t = 0;
    function at(){ return ++t; }
    var SRC = '192.168.1.10', DST = '93.184.216.34';

    function pkt(ttl, label, from, to){
      return P.make([
        P.ethernet('AA:AA:AA:AA:AA:AA', '11:11:11:11:11:11', 'ip'),
        P.ip(SRC, DST, ttl, 'icmp', 60)
      ], { label:label, kind:'data', from:from, to:to });
    }
    function icmp(fromIp, label, from){
      return P.make([
        P.ethernet('11:11:11:11:11:11', 'AA:AA:AA:AA:AA:AA', 'ip'),
        P.ip(fromIp, SRC, 64, 'icmp', 56)
      ], { label:label, kind:'ack', from:from, to:'client' });
    }

    /* ── Traceroute: একই কৌশল বারবার, প্রতিবার TTL এক বাড়িয়ে ── */
    if(cfg.mode === 'trace'){
      steps.push({
        t:at(), actor:'client', layer:'L3', kind:'info',
        title:'Traceroute শুরু',
        what:'Client পুরো পথটা জানতে চায় — কোন কোন Router পার হয়ে Packet গন্তব্যে যায়।',
        why :'কিন্তু Packet-এর ভেতরে তো পথ লেখা থাকে না, আর কোনো Router-ও নিজে থেকে পরিচয় দেয় না।\n\nTraceroute একটি চতুর কৌশল ব্যবহার করে — ইচ্ছা করে TTL কম দিয়ে Packet পাঠায়, যাতে Router বাধ্য হয়ে নালিশ করে। সেই নালিশ থেকেই Router-এর পরিচয় পাওয়া যায়।',
        apply: function(st){ st.banner = 'Traceroute শুরু'; st.hops = []; }
      });

      for(var i = 0; i < HOPS.length; i++){
        (function(n, h){
          var p = pkt(n, 'TTL=' + n, 'client', h.id);
          steps.push({
            t:at(), actor:'client', layer:'L3', kind:'info',
            title:'TTL=' + n + ' দিয়ে পাঠানো হলো', packet:p,
            what:'এবার Packet পাঠানো হলো TTL=**' + n + '** দিয়ে।',
            why : n === 1
              ? 'TTL=1 মানে প্রথম Router-ই একে ০ করে ফেলবে, তাই সে-ই নালিশ করবে। এভাবে প্রথম hop-এর পরিচয় জানা যাবে।'
              : 'TTL=' + n + ' মানে Packet-টি ' + n + ' নম্বর Router পর্যন্ত পৌঁছে তারপর মরবে। তাই এবার ' + n + ' নম্বর hop নিজের পরিচয় দেবে।',
            apply: function(st){ st.wire = { pkt:p, from:'client', to:h.id }; st.banner = 'TTL=' + n; }
          });

          var rep = icmp(h.ip, 'Time Exceeded', h.id);
          steps.push({
            t:at(), actor:h.id, layer:'L3', kind:'warn',
            title:'Hop ' + n + ' নিজের পরিচয় দিল', packet:rep,
            what:'`' + h.name + '` TTL ০ পেয়ে Packet ফেলে দিল এবং Client-কে একটি **ICMP Time Exceeded** বার্তা পাঠাল। সেই বার্তার source IP `' + h.ip + '` — এটিই hop ' + n + '-এর পরিচয়।',
            why :'Router যখন TTL শূন্য করে Packet ফেলে, তখন সে চুপ করে থাকে না — প্রেরককে জানায়। আর সেই বার্তাটি পাঠাতে গিয়ে সে নিজের IP Address ব্যবহার করে।\n\nএটাই traceroute-এর পুরো রহস্য — Router নিজের অজান্তেই নিজের পরিচয় দিয়ে দেয়।',
            apply: function(st){
              st.wire = { pkt:rep, from:h.id, to:'client' };
              st.hops = st.hops.concat([{ n:n, ip:h.ip, name:h.name }]);
              st.banner = 'hop ' + n + ' = ' + h.ip;
            }
          });
        })(i + 1, HOPS[i]);
      }

      var last = pkt(64, 'TTL=64', 'client', 'srv');
      steps.push({
        t:at(), actor:'srv', layer:'L3', kind:'ok',
        title:'গন্তব্যে পৌঁছে গেল — Traceroute শেষ', packet:last,
        what:'যথেষ্ট TTL দিয়ে পাঠানোয় Packet এবার Server পর্যন্ত পৌঁছাল। Server নিজে উত্তর দিল, তাই বোঝা গেল পথের শেষ এসেছে।',
        why :'পুরো পথটি এখন জানা:\n\n`1. 192.168.1.1`\n`2. 10.0.0.1`\n`3. 172.16.0.1`\n`4. 93.184.216.34` (গন্তব্য)\n\nএকটি সাধারণ কাউন্টারকে বারবার ব্যবহার করে পুরো পথ আবিষ্কার হয়ে গেল। TTL-এর নকশা যখন করা হয়েছিল, তখন কেউ এই ব্যবহারের কথা ভাবেনি।',
        apply: function(st){ st.wire = null; st.banner = 'Traceroute সম্পন্ন — 3 hop'; }
      });
      return steps;
    }

    /* ── সাধারণ Packet, অথবা TTL কম দিয়ে ── */
    var startTtl = cfg.mode === 'low' ? 2 : 64;
    var p0 = pkt(startTtl, 'TTL=' + startTtl, 'client', 'r1');

    steps.push({
      t:at(), actor:'client', layer:'L3', kind:'info',
      title:'Packet পাঠানো হলো — TTL ' + startTtl, packet:p0,
      what:'Packet-টি TTL=**' + startTtl + '** নিয়ে যাত্রা শুরু করল।',
      why : cfg.mode === 'low'
        ? 'TTL মাত্র ২ — অর্থাৎ এই Packet সর্বোচ্চ ২টি Router পার হতে পারবে। কিন্তু গন্তব্যে পৌঁছাতে ৩টি Router লাগে। দেখা যাক কী হয়।'
        : 'সাধারণত OS ৬৪ (কখনো ১২৮ বা ২৫৫) দিয়ে শুরু করে। Internet-এ বেশিরভাগ গন্তব্য ৩০ hop-এর মধ্যেই, তাই ৬৪ যথেষ্ট বেশি।',
      apply: function(st){ st.wire = { pkt:p0, from:'client', to:'r1' }; st.banner = 'TTL ' + startTtl; }
    });

    var ttl = startTtl;
    for(var k = 0; k < HOPS.length; k++){
      var h = HOPS[k];
      ttl--;
      var dead = ttl === 0;
      var nextId = k < HOPS.length - 1 ? HOPS[k + 1].id : 'srv';

      (function(h, ttlNow, dead, nextId, idx){
        if(dead){
          var rep = icmp(h.ip, 'Time Exceeded', h.id);
          steps.push({
            t:at(), actor:h.id, layer:'L3', kind:'error',
            title:'TTL শূন্য — Packet drop', packet:rep,
            what:'`' + h.name + '` TTL ১ কমিয়ে **০** পেল। তাই সে Packet-টি আর এগিয়ে দিল না, ফেলে দিল।',
            why :'এটাই TTL-এর মূল উদ্দেশ্য। যদি কোনো কারণে routing table ভুল হয়ে Packet একই কয়েকটি Router-এর মধ্যে ঘুরতে থাকত, TTL ছাড়া সেটি **চিরকাল ঘুরত** এবং ধীরে ধীরে পুরো network-এর bandwidth খেয়ে ফেলত।\n\nTTL নিশ্চিত করে প্রতিটি Packet-এর একটি নির্দিষ্ট আয়ু আছে। তারপর সে মরবেই।\n\nRouter প্রেরককে একটি **ICMP Time Exceeded** পাঠাল — এটিই traceroute-এর ভিত্তি।',
            apply: function(st){ st.wire = { pkt:rep, from:h.id, to:'client' }; st.banner = 'TTL 0 — drop'; }
          });
        } else {
          var fp = pkt(ttlNow, 'TTL=' + ttlNow, h.id, nextId);
          steps.push({
            t:at(), actor:h.id, layer:'L3', kind:'ok',
            title:h.name + ': TTL ' + (ttlNow + 1) + ' → ' + ttlNow, packet:fp,
            what:'`' + h.name + '` Packet-টি পেয়ে TTL ১ কমিয়ে **' + ttlNow + '** করল, তারপর পরের দিকে পাঠিয়ে দিল।',
            why :'প্রতিটি Router এই কাজটি বাধ্যতামূলকভাবে করে — এটি IP-র নিয়ম। TTL কমানো ছাড়া কোনো Router Packet forward করতে পারে না।\n\nএখনো ' + ttlNow + ' বাকি, তাই Packet বেঁচে আছে।',
            apply: function(st){ st.wire = { pkt:fp, from:h.id, to:nextId }; st.banner = 'TTL ' + ttlNow; }
          });
        }
      })(h, ttl, dead, nextId, k);

      if(dead){
        steps.push({
          t:at(), actor:'client', layer:'L3', kind:'warn',
          title:'Client নালিশটি পেল',
          what:'Client একটি ICMP Time Exceeded বার্তা পেল `' + h.ip + '` থেকে। সে বুঝল Packet গন্তব্যে পৌঁছায়নি।',
          why :'এখানে একটা গুরুত্বপূর্ণ কথা — Client জানতে পারল **কোথায়** Packet মরেছে, কারণ নালিশকারী Router নিজের IP দিয়ে বার্তা পাঠিয়েছে।\n\nএই তথ্যটুকুই traceroute-কে সম্ভব করে তোলে। Control mode-এ `Traceroute` বেছে দেখুন কীভাবে।',
          apply: function(st){ st.wire = null; st.banner = 'Time Exceeded from ' + h.ip; }
        });
        return steps;
      }
    }

    steps.push({
      t:at(), actor:'srv', layer:'L3', kind:'ok',
      title:'গন্তব্যে পৌঁছাল — TTL ' + ttl + ' বাকি',
      what:'৩টি Router পার হয়ে Packet Server-এ পৌঁছাল। TTL ' + startTtl + ' থেকে কমে ' + ttl + ' হয়েছে।',
      why :'TTL-এর এই কমে যাওয়া থেকেই একটা কাজের তথ্য পাওয়া যায় — `ping`-এর উত্তরে TTL দেখে অনুমান করা যায় গন্তব্য কত hop দূরে।\n\nযেমন উত্তরে TTL=৫৬ দেখলে বোঝা যায় শুরু হয়েছিল ৬৪ দিয়ে, তাই প্রায় ৮টি hop পার হয়েছে।',
      apply: function(st){ st.wire = null; st.banner = 'পৌঁছাল · TTL ' + ttl; }
    });

    return steps;
  }
};

})(window.NetLab);

/* ═══════════════════════════════════════════════════════════════════
   LAB · Router Hop — IP একই থাকে, MAC প্রতি hop-এ বদলায়

(function(NS){
"use strict";
var N = NS.net, P = NS.pkt;

var SRC = '192.168.1.10', DST = '8.8.8.8';

NS.labs.hop = {

  learn: [
    'কেন destination IP পুরো পথে একই থাকে',
    'কেন destination MAC প্রতিটি link-এ বদলে যায়',
    'একটি Router আসলে ঠিক কী কী বদলায় আর কী কী রেখে দেয়',
    'Layer 2 আর Layer 3-এর "পরিধি" কেন আলাদা'
  ],

  mistakes: [
    { m:'Packet-এর সাথে প্রেরকের MAC Address পুরো পথে যায়, তাই Server জানে কার NIC থেকে এসেছে।',
      r:'Server কখনোই আপনার MAC Address দেখে না। প্রথম Router-েই আপনার MAC মুছে গিয়ে তার নিজের MAC বসে যায়। Server শুধু শেষ Router-এর MAC দেখে — আর IP Header থেকে আপনার IP।' },
    { m:'MAC Address আর IP Address আসলে একই কাজ করে, শুধু লেখার ধরন আলাদা।',
      r:'দুটোর পরিধি সম্পূর্ণ আলাদা। MAC-এর পরিধি একটি local link — এক hop। IP-এর পরিধি পুরো যাত্রা — শুরু থেকে শেষ। এজন্যই MAC বারবার বদলায় আর IP বদলায় না।' }
  ],

  controls: [
    { key:'show', type:'choice', label:'কী হাইলাইট করব', def:'both',
      options:[ ['both','দুটোই — MAC ও IP'],
                ['mac','শুধু MAC — কীভাবে বদলায়'],
                ['ip','শুধু IP — কীভাবে অপরিবর্তিত থাকে'] ],
      help:'আলাদা করে দেখলে পার্থক্যটা আরও পরিষ্কার হয়।' }
  ],

  build: function(){
    return {
      devices: [
        N.pc('client', { name:'Client', x:9, y:50, mac:'AA:AA:AA:AA:AA:AA',
                         ip:SRC, gw:'192.168.1.1' }),
        N.router('r1', { name:'Router 1', x:36, y:50,
          ifaces:[{ name:'eth0', ip:'192.168.1.1', mac:'R1:LA:N0:00:00:01', mask:'255.255.255.0' },
                  { name:'eth1', ip:'10.0.0.1',    mac:'R1:WA:N0:00:00:02', mask:'255.255.255.0' }] }),
        N.router('r2', { name:'Router 2', x:64, y:50,
          ifaces:[{ name:'eth0', ip:'10.0.0.2',    mac:'R2:LA:N0:00:00:01', mask:'255.255.255.0' },
                  { name:'eth1', ip:'203.0.113.1', mac:'R2:WA:N0:00:00:02', mask:'255.255.255.0' }] }),
        N.server('srv', { name:'8.8.8.8', x:91, y:50, mac:'SS:SS:SS:SS:SS:SS', ip:DST,
                          listening:[{ port:53, service:'DNS', open:true }] })
      ],
      links: [ N.link('client','r1'), N.link('r1','r2'), N.link('r2','srv') ],
      hub: null, wire: null, banner: null
    };
  },

  script: function(s0, cfg){
    P.resetIds();
    var steps = [], t = 0;
    function at(){ return ++t; }
    var show = cfg.show || 'both';

    /* তিনটি link, প্রতিটিতে আলাদা MAC জোড়া — কিন্তু IP এক */
    var LINKS = [
      { from:'client', to:'r1',  sm:'AA:AA:AA:AA:AA:AA', dm:'R1:LA:N0:00:00:01',
        ttl:64, name:'Link 1 · Client → Router 1', net:'192.168.1.0/24' },
      { from:'r1', to:'r2',  sm:'R1:WA:N0:00:00:02', dm:'R2:LA:N0:00:00:01',
        ttl:63, name:'Link 2 · Router 1 → Router 2', net:'10.0.0.0/24' },
      { from:'r2', to:'srv', sm:'R2:WA:N0:00:00:02', dm:'SS:SS:SS:SS:SS:SS',
        ttl:62, name:'Link 3 · Router 2 → Server', net:'203.0.113.0/24' }
    ];

    function frame(L){
      return P.make([
        P.ethernet(L.sm, L.dm, 'ip'),
        P.ip(SRC, DST, L.ttl, 'udp', 60)
      ], { label:'Frame', kind:'data', from:L.from, to:L.to });
    }

    for(var i = 0; i < LINKS.length; i++){
      (function(L, n){
        var isFirst = n === 0;
        var what, why;

        if(show === 'ip'){
          what = 'এই link-এ Packet-টির IP Header: `' + SRC + '` → `' + DST + '`।' +
                 (isFirst ? '' : ' আগের link-এ ঠিক এটাই ছিল।');
          why  = isFirst
            ? 'IP Header-এর কাজ পুরো যাত্রার গন্তব্য মনে রাখা। এটি এখন থেকে শেষ পর্যন্ত এক থাকবে — শুধু TTL কমবে।'
            : 'লক্ষ্য করুন — source আর destination IP এক চুলও বদলায়নি। শুধু TTL ' + (L.ttl + 1) + ' থেকে ' + L.ttl + ' হয়েছে।\n\nএজন্যই গন্তব্যের Server জানতে পারে Packet-টি মূলত কার কাছ থেকে এসেছে।';
        } else if(show === 'mac'){
          what = 'এই link-এ Frame-এর MAC জোড়া: `' + L.sm + '` → `' + L.dm + '`।';
          why  = isFirst
            ? 'এটি প্রথম link-এর MAC জোড়া। পরের link-এ এই দুটোই সম্পূর্ণ বদলে যাবে।'
            : 'আগের link-এর MAC দুটো **সম্পূর্ণ মুছে গেছে**। Router পুরোনো Ethernet Header ফেলে দিয়ে একদম নতুন একটি বানিয়েছে।\n\nকারণ MAC Address শুধু একটি local link-এর ভেতরে অর্থবহ। নতুন link মানে নতুন ঠিকানা।';
        } else {
          what = '**' + L.name + '** (`' + L.net + '`)\n\n' +
                 'MAC: `' + L.sm + '` → `' + L.dm + '`\n' +
                 'IP: `' + SRC + '` → `' + DST + '`  (TTL ' + L.ttl + ')';
          why  = isFirst
            ? 'শুরুতে দুটোই "স্বাভাবিক" মনে হচ্ছে। কিন্তু পরের ধাপে খেয়াল করুন কোনটা বদলায় আর কোনটা বদলায় না।'
            : 'এই link-এ **MAC জোড়া সম্পূর্ণ নতুন**, অথচ **IP জোড়া হুবহু আগের মতোই**।\n\n' +
              'কারণ দুটোর দায়িত্ব আলাদা:\n\n' +
              '`MAC` — "এই তারের ওপাশে কে?" — পরিধি এক hop\n' +
              '`IP` — "শেষ পর্যন্ত কোথায় যাবে?" — পরিধি পুরো যাত্রা';
        }

        steps.push({
          t:at(), actor: isFirst ? 'client' : L.from, layer:'L2', kind: isFirst ? 'info' : 'ok',
          title: L.name, packet: frame(L),
          what: what, why: why,
          apply: function(st){
            st.wire = { pkt: frame(L), from:L.from, to:L.to };
            st.banner = show === 'ip' ? 'IP অপরিবর্তিত · TTL ' + L.ttl
                      : show === 'mac' ? 'নতুন MAC জোড়া'
                      : 'hop ' + (n + 1) + ' · TTL ' + L.ttl;
          }
        });
      })(LINKS[i], i);
    }

    steps.push({
      t:at(), actor:'srv', layer:'L3', kind:'ok',
      title:'গন্তব্যে — সব মিলিয়ে কী বদলাল',
      what:'Packet পৌঁছে গেল। পুরো যাত্রায়:\n\n' +
           '`MAC জোড়া` — ৩ বার সম্পূর্ণ বদলেছে\n' +
           '`Source IP` — একবারও বদলায়নি\n' +
           '`Destination IP` — একবারও বদলায়নি\n' +
           '`TTL` — ৬৪ থেকে ৬২ হয়েছে',
      why :'Server এখন IP Header দেখে জানতে পারছে Packet-টি `' + SRC + '` থেকে এসেছে।\n\nকিন্তু সে Client-এর MAC Address `AA:AA:AA:AA:AA:AA` কখনোই দেখেনি — সেটি প্রথম Router-েই মুছে গিয়েছিল। Server শুধু শেষ Router-এর MAC দেখেছে।\n\n**এটাই মূল কথা:** MAC এক ধাপের ঠিকানা, IP পুরো যাত্রার ঠিকানা। দুটো আলাদা স্তরে কাজ করে বলেই একই IP নিয়ে পৃথিবীর যেকোনো প্রান্তে যাওয়া যায়, অথচ প্রতিটি local network নিজের মতো করে delivery সামলাতে পারে।',
      apply: function(st){ st.wire = null; st.banner = 'MAC বদলাল ৩ বার · IP বদলাল ০ বার'; }
    });

    return steps;
  }
};

/* ─── ui/canvas.js ─── */
/* ═══════════════════════════════════════════════════════════════════
   UI · NETWORK CANVAS
   ───────────────────────────────────────────────────────────────────
   State থেকে SVG এঁকে দেয়। এই file কোনো simulation সিদ্ধান্ত নেয় না —
   শুধু যা state-এ আছে তা-ই দেখায়।
   ═══════════════════════════════════════════════════════════════════ */
(function(NS){
"use strict";

var ICON = { pc:'🖥', switch:'🔀', router:'🧭', server:'🗄' };

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* সব device (hub সহ) এক তালিকায় — অবস্থান খোঁজার জন্য */
function allNodes(st){
  var a = st.devices.slice();
  if(st.hub) a.push(st.hub);
  return a;
}
function findNode(st, id){
  var a = allNodes(st);
  for(var i = 0; i < a.length; i++) if(a[i].id === id) return a[i];
  return null;
}

function render(el, st, opts){
  opts = opts || {};
  var active = opts.active || null;     // এই মুহূর্তে যে device কাজ করছে
  var sel    = opts.selected || null;   // user যাকে click করেছে
  var nodes  = allNodes(st);
  var out    = [];

  out.push('<svg viewBox="0 0 100 100" preserveAspectRatio="none" class="nc-wires">');
  /* ── তার ── */
  for(var i = 0; i < st.links.length; i++){
    var L = st.links[i];
    var a = findNode(st, L.a), b = findNode(st, L.b);
    if(!a || !b) continue;
    out.push('<line x1="'+a.x+'" y1="'+a.y+'" x2="'+b.x+'" y2="'+b.y+'" class="nc-wire"/>');
  }
  out.push('</svg>');

  /* ── device ── */
  for(var j = 0; j < nodes.length; j++){
    var d = nodes[j];
    var cls = 'nc-node t-' + d.type;
    if(d.id === active) cls += ' active';
    if(d.id === sel)    cls += ' sel';
    var sub = d.ip ? d.ip
            : d.type === 'router' && d.ifaces && d.ifaces[0] ? d.ifaces[0].ip
            : d.type === 'switch' ? 'Layer 2' : '';
    out.push(
      '<button class="' + cls + '" style="left:' + d.x + '%;top:' + d.y + '%" ' +
        'data-dev="' + esc(d.id) + '" title="Inspect করতে click করুন">' +
        '<span class="ic">' + ICON[d.type] + '</span>' +
        '<span class="nm">' + esc(d.name) + '</span>' +
        (sub ? '<span class="ip">' + esc(sub) + '</span>' : '') +
        (d.note ? '<span class="badge">' + esc(d.note) + '</span>' : '') +
      '</button>'
    );
  }

  /* ── তারের উপরে চলমান packet ── */
  if(st.wire && st.wire.pkt){
    var w = st.wire;
    var from = findNode(st, w.from);
    var targets = [];
    if(w.to === 'flood' || w.to === 'both'){
      /* Broadcast/flood: Switch থেকে সবার দিকে — কিন্তু যে port দিয়ে Frame টি
         ঢুকেছে সেদিকে ফেরত যায় না। তাই মূল প্রেরককেও (w.origin) বাদ দিতে হয়। */
      for(var k = 0; k < nodes.length; k++){
        var n = nodes[k];
        if(n.id === w.from || n.id === w.origin) continue;
        if(n.type === 'switch') continue;
        targets.push(n);
      }
    } else {
      var tnode = findNode(st, w.to);
      if(tnode) targets.push(tnode);
    }
    if(from){
      for(var m = 0; m < targets.length; m++){
        var tg = targets[m];
        var mx = (from.x + tg.x) / 2, my = (from.y + tg.y) / 2;
        out.push(
          '<button class="nc-pkt k-' + esc(st.wire.pkt.kind) + '" ' +
            'style="left:' + mx + '%;top:' + my + '%" data-pkt="1" ' +
            'title="Packet Inspector-এ দেখুন">' +
            esc(st.wire.pkt.label || 'Packet') +
          '</button>'
        );
      }
    }
  }

  /* কিছু lab (Encapsulation) movement নয়, স্তর দেখায় — তখন canvas-এ
     মোড়কগুলো ছবির মতো করে দেখানো হয়। */
  if(st.stack && st.stack.length){
    out.push(stackHTML(st.stack));
  }

  el.innerHTML = out.join('');
}

/* Encapsulation-এর স্তর — বাইরের মোড়ক আগে, ভেতরের data শেষে */
var STACK_INFO = {
  L7: ['Application Data', 'payload'],
  L4: ['TCP / UDP Header',  'L4'],
  L3: ['IP Header',         'L3'],
  L2: ['Ethernet Header',   'L2'],
  L1: ['Bits',              'L1']
};
function stackHTML(stack){
  /* state-এ ক্রম L7→L1 (যোগ হওয়ার ক্রম); দেখাতে হবে বাইরের মোড়ক উপরে */
  var order = ['L1','L2','L3','L4','L7'];
  var o = ['<div class="nc-stack">'];
  for(var i = 0; i < order.length; i++){
    var k = order[i];
    if(stack.indexOf(k) === -1) continue;
    var info = STACK_INFO[k];
    var isNewest = stack[stack.length - 1] === k;
    o.push('<div class="ns-row l-' + k + (isNewest ? ' new' : '') + '">' +
             '<span class="ns-tag">' + k + '</span>' +
             '<span class="ns-nm">' + info[0] + '</span>' +
           '</div>');
  }
  o.push('</div>');
  return o.join('');
}

/* ───────── Calculator panel (Subnet Calculator-এর মতো lab-এর জন্য) ───────── */
function renderPanel(el, p){
  if(p.err){
    el.innerHTML = '<div class="cp-err">' + esc(p.err) + '</div>';
    return;
  }
  var o = ['<div class="cp">'];

  /* bit গুলো — কোনটা network আর কোনটা host, রঙ দিয়ে আলাদা */
  o.push('<div class="cp-bits"><span class="n">' + esc(p.bits.net) + '</span>' +
         '<span class="h">' + esc(p.bits.host) + '</span></div>');
  o.push('<div class="cp-legend">' +
           '<span><i class="sw-n"></i>' + p.cidr + ' bit network</span>' +
           '<span><i class="sw-h"></i>' + (32 - p.cidr) + ' bit host</span>' +
         '</div>');

  o.push('<div class="cp-rows">');
  for(var i = 0; i < p.rows.length; i++){
    var r = p.rows[i];
    o.push('<button class="cp-row" data-why="' + esc(r[2]) + '">' +
             '<span class="k">' + esc(r[0]) + '</span>' +
             '<span class="v">' + esc(r[1]) + '</span>' +
           '</button>' +
           '<div class="cp-why">' + esc(r[2]) + '</div>');
  }
  o.push('</div></div>');
  el.innerHTML = o.join('');
}

NS.ui = NS.ui || {};
NS.ui.canvas = { render: render, renderPanel: renderPanel, esc: esc };

})(window.NetLab);

/* ─── ui/inspector.js ─── */
/* ═══════════════════════════════════════════════════════════════════
   UI · INSPECTOR
   ───────────────────────────────────────────────────────────────────
   ডানপাশের panel — Packet-এর প্রতিটি field, অথবা Device-এর ভেতরের অবস্থা।
   ═══════════════════════════════════════════════════════════════════ */
(function(NS){
"use strict";
var esc = NS.ui.canvas.esc;
var P   = NS.pkt;

/* ───────── Packet Inspector ───────── */
function packetHTML(pkt){
  if(!pkt) return '<div class="ins-empty">কোনো Packet select করা নেই।<br><span>Canvas-এ চলন্ত Packet-এ বা Timeline-এর কোনো ধাপে click করুন।</span></div>';

  var o = ['<div class="ins-h">Packet #' + pkt.id +
           '<span class="sz">' + pkt.size + ' bytes</span></div>'];

  for(var i = 0; i < pkt.layers.length; i++){
    var L  = pkt.layers[i];
    var LI = P.LAYERS[L.layer] || { n:L.layer, c:'faint' };
    o.push('<div class="ins-layer c-' + LI.c + '">');
    o.push('<div class="ins-lh"><span class="tag">' + esc(L.layer) + '</span>' +
           '<span class="nm">' + esc(L.name) + '</span>' +
           '<span class="sz">' + (L.size || 0) + 'B</span></div>');
    o.push('<div class="ins-ld">' + esc(LI.d || '') + '</div>');

    for(var j = 0; j < L.fields.length; j++){
      var k = L.fields[j][0], v = L.fields[j][1];
      var help = P.FIELD_HELP[k] || '';
      o.push('<button class="ins-f" data-help="' + esc(help) + '">' +
               '<span class="k">' + esc(k) + '</span>' +
               '<span class="v">' + esc(v) + '</span>' +
             '</button>');
      if(help) o.push('<div class="ins-fh">' + esc(help) + '</div>');
    }
    o.push('</div>');
  }
  return o.join('');
}

/* ───────── Device Inspector ───────── */
function kv(k, v){
  return '<div class="dv-row"><span class="k">' + esc(k) + '</span>' +
         '<span class="v">' + esc(v) + '</span></div>';
}

function tableOrEmpty(rows, head, emptyMsg){
  if(!rows.length) return '<div class="dv-empty">' + esc(emptyMsg) + '</div>';
  var o = ['<table class="dv-t"><thead><tr>'];
  for(var i = 0; i < head.length; i++) o.push('<th>' + esc(head[i]) + '</th>');
  o.push('</tr></thead><tbody>');
  for(var r = 0; r < rows.length; r++){
    o.push('<tr>');
    for(var c = 0; c < rows[r].length; c++) o.push('<td>' + esc(rows[r][c]) + '</td>');
    o.push('</tr>');
  }
  o.push('</tbody></table>');
  return o.join('');
}

function deviceHTML(d){
  if(!d) return '<div class="ins-empty">কোনো Device select করা নেই।<br><span>Canvas-এ যেকোনো device-এ click করুন।</span></div>';

  var o = ['<div class="ins-h">' + esc(d.name) +
           '<span class="sz">' + esc(d.type) + '</span></div>'];

  if(d.type === 'pc' || d.type === 'server'){
    o.push('<div class="dv-sec">');
    o.push(kv('MAC Address', d.mac));
    o.push(kv('IP Address', d.ip));
    o.push(kv('Subnet Mask', d.mask));
    if(d.gw) o.push(kv('Default Gateway', d.gw));
    o.push('</div>');

    var arpRows = [];
    for(var ip in d.arp) if(d.arp.hasOwnProperty(ip)) arpRows.push([ip, d.arp[ip].mac]);
    o.push('<div class="dv-t-h">ARP Cache</div>');
    o.push(tableOrEmpty(arpRows, ['IP Address','MAC Address'],
      'খালি — এই device এখনো কারো MAC Address জানে না।'));

    if(d.listening && d.listening.length){
      var pr = [];
      for(var i = 0; i < d.listening.length; i++){
        var p = d.listening[i];
        pr.push([String(p.port), p.service, p.open ? 'খোলা' : 'বন্ধ']);
      }
      o.push('<div class="dv-t-h">Listening Ports</div>');
      o.push(tableOrEmpty(pr, ['Port','Service','অবস্থা'], ''));
    }
  }

  if(d.type === 'switch'){
    var mr = [];
    for(var mac in d.macTable) if(d.macTable.hasOwnProperty(mac))
      mr.push([mac, 'Port ' + d.macTable[mac].port]);
    o.push('<div class="dv-t-h">MAC Address Table</div>');
    o.push(tableOrEmpty(mr, ['MAC Address','Port'],
      'খালি — Switch এখনো কিছু শেখেনি। Frame এলে Source MAC দেখে শিখবে।'));
    o.push('<div class="dv-note">Switch একটি Layer 2 device — সে IP Address দেখে না, শুধু MAC Address দেখে সিদ্ধান্ত নেয়।</div>');
  }

  if(d.type === 'router'){
    o.push('<div class="dv-t-h">Interfaces</div>');
    var ir = [];
    for(var k = 0; k < (d.ifaces || []).length; k++){
      var f = d.ifaces[k];
      ir.push([f.name, f.ip, f.mac]);
    }
    o.push(tableOrEmpty(ir, ['Interface','IP','MAC'], ''));

    if(d.routes && d.routes.length){
      var rr = [];
      for(var q = 0; q < d.routes.length; q++){
        var rt = d.routes[q];
        rr.push([rt.dst + '/' + rt.prefix, rt.via || 'directly', rt.iface]);
      }
      o.push('<div class="dv-t-h">Routing Table</div>');
      o.push(tableOrEmpty(rr, ['Destination','Next Hop','Interface'], ''));
    }

    var ar = [];
    for(var aip in d.arp) if(d.arp.hasOwnProperty(aip)) ar.push([aip, d.arp[aip].mac]);
    o.push('<div class="dv-t-h">ARP Cache</div>');
    o.push(tableOrEmpty(ar, ['IP Address','MAC Address'], 'খালি।'));
  }

  return o.join('');
}

NS.ui.inspector = { packetHTML: packetHTML, deviceHTML: deviceHTML };

})(window.NetLab);

/* ─── ui/timeline.js ─── */
/* ═══════════════════════════════════════════════════════════════════
   UI · EVENT TIMELINE
   ───────────────────────────────────────────────────────────────────
   নিচের অংশ — প্রতিটি ঘটনা ক্রম অনুসারে। click করলে সেই ধাপে ফেরত যায়।
   ═══════════════════════════════════════════════════════════════════ */
(function(NS){
"use strict";
var esc = NS.ui.canvas.esc;

/* simulated clock — শুরু 10:01:00, প্রতিটি ধাপ ১ সেকেন্ড */
function clock(t){
  var s = t % 60, m = Math.floor(t / 60);
  return '10:' + String(1 + m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}

function render(el, eng){
  var o = [];
  if(!eng.steps.length){
    el.innerHTML = '<div class="tl-empty">এই lab-এ কোনো ধাপ নেই।</div>';
    return;
  }
  for(var i = 0; i < eng.steps.length; i++){
    var s = eng.steps[i];
    var cls = 'tl-item k-' + (s.kind || 'info');
    if(i === eng.i)  cls += ' now';
    if(i <  eng.i)   cls += ' past';
    if(i >  eng.i)   cls += ' future';
    o.push(
      '<button class="' + cls + '" data-step="' + i + '">' +
        '<span class="tl-t">' + clock(s.t) + '</span>' +
        '<span class="tl-actor">' + esc(s.actor) + '</span>' +
        '<span class="tl-title">' + esc(s.title) + '</span>' +
        '<span class="tl-layer">' + esc(s.layer || '') + '</span>' +
      '</button>'
    );
  }
  el.innerHTML = o.join('');

  var now = el.querySelector('.tl-item.now');
  if(now && now.scrollIntoView) now.scrollIntoView({ block:'nearest', inline:'nearest' });
}

NS.ui.timeline = { render: render, clock: clock };

})(window.NetLab);

/* ─── ui/app.js ─── */
/* ═══════════════════════════════════════════════════════════════════
   UI · APP SHELL
   ───────────────────────────────────────────────────────────────────
   Engine ↔ UI-র সংযোগস্থল। Engine state বদলালেই এখান থেকে সব panel
   নতুন করে আঁকা হয়।
   ═══════════════════════════════════════════════════════════════════ */
(function(NS){
"use strict";
var esc = NS.ui.canvas.esc;

var $ = function(id){ return document.getElementById(id); };

var App = {
  eng: null,
  lab: null,
  cfg: {},
  selDev: null,
  selPkt: null,
  timer: null,
  speed: 1200,
  insMode: 'packet'
};

/* ───────── THEME (book-এর সাথে একই key, তাই setting ভাগাভাগি হয়) ───────── */
function initTheme(){
  var root = document.documentElement, btn = $('themeBtn');
  function apply(t){
    root.setAttribute('data-theme', t);
    btn.textContent = t === 'dark' ? '☀️' : '🌙';
    try { localStorage.setItem('nf-theme', t); } catch(e){}
  }
  var saved = null;
  try { saved = localStorage.getItem('nf-theme'); } catch(e){}
  if(!saved) saved = window.matchMedia &&
    window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  apply(saved);
  btn.addEventListener('click', function(){
    apply(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });
}

/* ───────── LAB LIST ───────── */
function renderLabs(){
  var labs = NS.labList(), o = [], group = null;
  for(var i = 0; i < labs.length; i++){
    var L = labs[i];
    if(L.group !== group){ group = L.group; o.push('<div class="lab-group">' + esc(group) + '</div>'); }
    o.push('<button class="lab-item' + (App.lab && L.id === App.lab.id ? ' on' : '') +
           '" data-lab="' + esc(L.id) + '">' +
             '<span class="t">' + esc(L.title) + '</span>' +
             '<span class="d">' + esc(L.blurb) + '</span>' +
           '</button>');
  }
  /* এখনো যেসব lab বাকি — roadmap হিসেবে দেখানো হচ্ছে */
  o.push('<div class="lab-group">পরের ধাপে আসছে</div>');
  var soon = ['TCP Handshake','TCP Reliability','UDP','Sockets & Ports',
              'DNS','HTTP','TLS','NAT','Firewall','Full URL Journey'];
  for(var s = 0; s < soon.length; s++)
    o.push('<div class="lab-soon">' + esc(soon[s]) + '</div>');

  $('labList').innerHTML = o.join('');
}

/* ───────── CONTROLS (প্রতিটি lab-এর নিজস্ব) ───────── */
function renderControls(){
  var c = App.lab.controls || [], o = [];
  for(var i = 0; i < c.length; i++){
    var ct = c[i], v = App.cfg[ct.key];
    if(ct.type === 'toggle'){
      o.push('<label class="ctl-row"><input type="checkbox" data-ctl="' + esc(ct.key) + '"' +
             (v ? ' checked' : '') + '><span class="cl">' + esc(ct.label) + '</span></label>');
    } else if(ct.type === 'text'){
      o.push('<div class="ctl-row col"><span class="cl">' + esc(ct.label) + '</span>' +
             '<input type="text" data-ctl="' + esc(ct.key) + '" value="' + esc(v) +
             '" spellcheck="false" autocomplete="off"></div>');
    } else if(ct.type === 'range'){
      o.push('<div class="ctl-row col"><span class="cl">' + esc(ct.label) +
               ' <b class="ctl-v">/' + esc(v) + '</b></span>' +
             '<input type="range" data-ctl="' + esc(ct.key) + '" value="' + esc(v) +
             '" min="' + ct.min + '" max="' + ct.max + '" step="1"></div>');
    } else if(ct.type === 'choice'){
      o.push('<div class="ctl-row col"><span class="cl">' + esc(ct.label) + '</span>' +
             '<select data-ctl="' + esc(ct.key) + '">');
      for(var j = 0; j < ct.options.length; j++){
        var op = ct.options[j];
        o.push('<option value="' + esc(op[0]) + '"' +
               (v === op[0] ? ' selected' : '') + '>' + esc(op[1]) + '</option>');
      }
      o.push('</select></div>');
    }
    if(ct.help) o.push('<div class="ctl-help">' + esc(ct.help) + '</div>');
  }
  $('labControls').innerHTML = o.join('') ||
    '<div class="ctl-help">এই lab-এ কোনো বাড়তি setting নেই।</div>';
}

/* explanation-এ `code` আর **bold** লেখা যায় — সেটুকু markdown এখানে রূপান্তর হয় */
function inline(s){
  return esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
}

/* ───────── LEARNING PANEL ───────── */
function renderLearn(){
  var L = App.lab, o = [];

  o.push('<div class="ln-h">এই Lab-এ কী শিখবেন</div><ul class="ln-list">');
  for(var i = 0; i < L.learn.length; i++) o.push('<li>' + inline(L.learn[i]) + '</li>');
  o.push('</ul>');

  if(L.mistakes && L.mistakes.length){
    o.push('<div class="ln-h">প্রচলিত ভুল ধারণা</div>');
    for(var j = 0; j < L.mistakes.length; j++){
      var m = L.mistakes[j];
      o.push('<div class="ln-myth">' +
               '<div class="mm"><span class="lbl">ভুল ধারণা</span>' + inline(m.m) + '</div>' +
               '<div class="mr"><span class="lbl">সঠিক ধারণা</span>' + inline(m.r) + '</div>' +
             '</div>');
    }
  }

  o.push('<a class="ln-book" href="index.html#' + esc(L.chapter) + '" target="_blank" ' +
         'rel="noopener">এই concept সম্পর্কে বিস্তারিত পড়ুন →<span>বই-এর ' +
         esc(L.chapter.toUpperCase()) + '</span></a>');

  $('learnPanel').innerHTML = o.join('');
}

/* ───────── "এখন কী হলো?" ───────── */
function mini(s){
  return inline(s).replace(/\n\n/g, '</p><p>');
}

function renderWhat(){
  var s = App.eng.current();
  if(!s){
    $('whatPanel').innerHTML =
      '<div class="wh-idle">▶ <b>চালু</b> চাপুন, অথবা <b>এক ধাপ</b> দিয়ে ধীরে ধীরে এগোন।<br>' +
      '<span>প্রতিটি ধাপের পর এখানে ব্যাখ্যা আসবে।</span></div>';
    return;
  }
  var LI = NS.pkt.LAYERS[s.layer] || { n:s.layer || '' };
  $('whatPanel').innerHTML =
    '<div class="wh-top"><span class="wh-k k-' + esc(s.kind || 'info') + '">' +
      esc(s.actor) + '</span><span class="wh-layer">' + esc(LI.n) + '</span></div>' +
    '<div class="wh-q">এখন কী হলো?</div><p>' + mini(s.what) + '</p>' +
    '<div class="wh-q">কেন?</div><p>' + mini(s.why) + '</p>';
}

/* ───────── সব panel নতুন করে আঁকা ───────── */
function paint(){
  var eng = App.eng, st = eng.state, cur = eng.current();

  $('canvasWrap').classList.toggle('calc', !!App.lab.panel);
  if(App.lab.panel){
    NS.ui.canvas.renderPanel($('canvas'), App.lab.panel(App.cfg));
  } else {
    NS.ui.canvas.render($('canvas'), st, {
      active: cur ? cur.actor : null,
      selected: App.selDev
    });
  }

  /* current step-এ packet থাকলে সেটিই inspector-এ দেখাও */
  if(cur && cur.packet) App.selPkt = cur.packet;

  NS.ui.timeline.render($('timeline'), eng);
  renderWhat();
  renderInspector();

  $('stepNow').textContent = (eng.i + 1) + ' / ' + eng.steps.length;
  $('banner').textContent  = st.banner || '';
  $('btnStep').disabled    = eng.done();
  $('btnBack').disabled    = eng.i < 0;
  $('btnPlay').textContent = App.timer ? '⏸ বিরতি' : '▶ চালু';
}

function renderInspector(){
  var dev = null;
  if(App.selDev){
    var all = App.eng.state.devices.slice();
    if(App.eng.state.hub) all.push(App.eng.state.hub);
    for(var i = 0; i < all.length; i++) if(all[i].id === App.selDev) dev = all[i];
  }
  $('insBody').innerHTML = App.insMode === 'packet'
    ? NS.ui.inspector.packetHTML(App.selPkt)
    : NS.ui.inspector.deviceHTML(dev);

  var tabs = document.querySelectorAll('#insTabs button');
  for(var t = 0; t < tabs.length; t++)
    tabs[t].classList.toggle('on', tabs[t].getAttribute('data-ins') === App.insMode);
}

/* ───────── PLAYBACK ───────── */
function stop(){
  if(App.timer){ clearInterval(App.timer); App.timer = null; }
}
function play(){
  if(App.timer) { stop(); paint(); return; }
  /* শেষ পর্যন্ত চলে গেলে ▶ চাপলে আবার শুরু থেকে */
  if(App.eng.done()) App.eng.seek(-1);
  App.timer = setInterval(function(){
    var moved = App.eng.step();
    if(!moved) stop();
    /* প্রতিটি ধাপেই আঁকতে হবে — নইলে state এগোয় কিন্তু পর্দায় কিছু বদলায় না */
    paint();
  }, App.speed);
  paint();
}

/* ───────── LAB LOAD ───────── */
function loadLab(id){
  stop();
  var lab = NS.labs[id];
  if(!lab) return;
  App.lab = lab;
  App.cfg = { seed: 1 };
  var c = lab.controls || [];
  for(var i = 0; i < c.length; i++) App.cfg[c[i].key] = c[i].def;

  App.selDev = null;
  App.selPkt = null;
  App.eng = new NS.Engine(lab, App.cfg).on(function(){ /* paint নিজে ডাকা হয় */ });

  $('labTitle').textContent = lab.title;
  $('labBlurb').textContent = lab.blurb;
  renderLabs();
  renderControls();
  renderLearn();
  paint();

  try { localStorage.setItem('nl-lab', id); } catch(e){}
  if(window.innerWidth <= 1080) $('sidebar').classList.remove('open');
}

/* config বদলালে simulation নতুন করে বানাতে হয় */
function rebuild(){
  stop();
  App.eng = new NS.Engine(App.lab, App.cfg);
  App.selPkt = null;
  paint();     /* controls নিজে আবার আঁকা হয় না — তাই typing-এর caret ঠিক থাকে */
}

/* ───────── EVENTS ───────── */
function bind(){
  $('labList').addEventListener('click', function(e){
    var b = e.target.closest('[data-lab]');
    if(b) loadLab(b.getAttribute('data-lab'));
  });

  function onCtl(e){
    var el = e.target.closest('[data-ctl]');
    if(!el) return;
    App.cfg[el.getAttribute('data-ctl')] =
      el.type === 'checkbox' ? el.checked : el.value;
    /* range-এর পাশের সংখ্যাটা সাথে সাথে বদলাক */
    var lbl = el.parentNode.querySelector('.ctl-v');
    if(lbl && el.type === 'range') lbl.textContent = '/' + el.value;
    rebuild();
  }
  $('labControls').addEventListener('change', onCtl);
  $('labControls').addEventListener('input', onCtl);

  $('btnPlay').addEventListener('click', play);
  $('btnStep').addEventListener('click', function(){ stop(); App.eng.step(); paint(); });
  $('btnBack').addEventListener('click', function(){ stop(); App.eng.back(); paint(); });
  $('btnReset').addEventListener('click', function(){ stop(); App.eng.reset(); App.selPkt = null; paint(); });

  $('speed').addEventListener('input', function(){
    App.speed = 2400 - parseInt(this.value, 10);
    $('speedLbl').textContent = (App.speed / 1000).toFixed(1) + 's';
    if(App.timer){ stop(); play(); }
  });

  $('timeline').addEventListener('click', function(e){
    var b = e.target.closest('[data-step]');
    if(!b) return;
    stop();
    App.eng.seek(parseInt(b.getAttribute('data-step'), 10));
    paint();
  });

  $('canvas').addEventListener('click', function(e){
    var d = e.target.closest('[data-dev]');
    if(d){
      App.selDev = d.getAttribute('data-dev');
      App.insMode = 'device';
      renderInspector();
      NS.ui.canvas.render($('canvas'), App.eng.state, {
        active: App.eng.current() ? App.eng.current().actor : null,
        selected: App.selDev
      });
      return;
    }
    if(e.target.closest('[data-pkt]')){
      var st = App.eng.state;
      if(st.wire && st.wire.pkt){ App.selPkt = st.wire.pkt; App.insMode = 'packet'; renderInspector(); }
    }
  });

  $('insTabs').addEventListener('click', function(e){
    var b = e.target.closest('[data-ins]');
    if(!b) return;
    App.insMode = b.getAttribute('data-ins');
    renderInspector();
  });

  /* field-এ click করলে তার ব্যাখ্যা খোলে/বন্ধ হয় */
  /* Calculator-এর সারিতে click করলে ব্যাখ্যা খোলে */
  $('canvas').addEventListener('click', function(e){
    var r = e.target.closest('.cp-row');
    if(!r) return;
    var why = r.nextElementSibling;
    if(why && why.classList.contains('cp-why')){
      why.classList.toggle('on');
      r.classList.toggle('open');
    }
  });

  $('insBody').addEventListener('click', function(e){
    var f = e.target.closest('.ins-f');
    if(!f) return;
    var help = f.nextElementSibling;
    if(help && help.classList.contains('ins-fh')){
      help.classList.toggle('on');
      f.classList.toggle('open');
    }
  });

  $('menuBtn').addEventListener('click', function(){ $('sidebar').classList.toggle('open'); });
  $('backdrop').addEventListener('click', function(){ $('sidebar').classList.remove('open'); });

  document.addEventListener('keydown', function(e){
    if(e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
    if(e.key === ' ' || e.key === 'k'){ e.preventDefault(); play(); }
    else if(e.key === 'ArrowRight'){ stop(); App.eng.step(); paint(); }
    else if(e.key === 'ArrowLeft'){ stop(); App.eng.back(); paint(); }
    else if(e.key === 'r'){ stop(); App.eng.reset(); paint(); }
  });
}

/* ───────── START ───────── */
function boot(){
  initTheme();
  bind();
  var want = null;
  if(location.hash) want = location.hash.slice(1);
  if(!want){ try { want = localStorage.getItem('nl-lab'); } catch(e){} }
  loadLab(NS.labs[want] ? want : NS.LAB_ORDER[0]);
}

if(document.readyState === 'loading')
  document.addEventListener('DOMContentLoaded', boot);
else boot();

})(window.NetLab);
</script>
</body>
</html>
