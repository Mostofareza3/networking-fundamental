  <h1>HTTP — Application-দের ভাষা</h1>
  <p>TCP byte পৌঁছে দেয়, কিন্তু সেই byte-গুলোর মানে কী? HTTP হলো সেই চুক্তি যা দুটি program-কে একই ভাষায় কথা বলতে দেয় — এবং এটি এত সরল যে আপনি হাতে টাইপ করেও একটি HTTP request পাঠাতে পারেন।</p>
