  <h1>TLS &amp; HTTPS — নিরাপত্তার স্তর</h1>
  <p>এখন পর্যন্ত আমরা ধরে নিয়েছি network বিশ্বস্ত। এটি সত্য নয়। এই অংশে দেখব — কী কী ঝুঁকি আছে, cryptography-র কোন ধারণাগুলো সেগুলোর সমাধান দেয়, এবং TLS handshake-এ ঠিক কী ঘটে।</p>
