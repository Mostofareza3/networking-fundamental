  <h1>Network Performance</h1>
  <p>Latency, bandwidth, throughput, jitter, packet loss — এই পাঁচটি শব্দ প্রায়ই একে অপরের বদলে ব্যবহৃত হয়। এরা সম্পূর্ণ ভিন্ন জিনিস, এবং কোনটি আপনার সমস্যা তা না জানলে ভুল জায়গায় optimization হয়।</p>
