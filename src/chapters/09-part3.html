  <h1>MAC &amp; Ethernet — Local Delivery</h1>
  <p>একটি local network-এর ভেতরে data কীভাবে সঠিক machine-এ পৌঁছায়। MAC address, Ethernet frame, switch-এর শেখার প্রক্রিয়া, এবং ARP — যে protocol IP আর MAC-এর মাঝখানের সেতু।</p>
